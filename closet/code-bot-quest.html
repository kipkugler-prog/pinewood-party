<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Bot Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE game for a parent and a 9-year-old who loves tech
   IDEA a real circuit board: solder-mask green, gold traces, resistors as walls, microchips to collect, a charging pad to dock
   PICTURE the board itself, large, with the little rover robot on it; code blocks snap in underneath
   COLOUR PCB green ground, cream silkscreen ink, gold traces; blocks in yellow, sky, pink and orange
   TYPE Lilita One (chunky toy lettering) + Nunito
   LAYOUT phone: title bar, scores, board, program, block palette, run; laptop: board left, code right */
:root{color-scheme:dark;--bg:#0d2c1b;--panel:#13402a;--edge:#2b6c45;--ink:#f6f2e4;--soft:#b8cdb9;--gold:#e3b04b;--pcb:#1d6b3f;--pad:#27834d;--F:#ffcf3f;--L:#5cc8ff;--R:#ff7ab6;--LP:#ff9f3a;--bad:#ff5a5f;--good:#7cf05a}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip;background:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/28px 28px,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--F);outline-offset:2px}
h1,h2,h3{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;margin:0;letter-spacing:.01em}
.app{max-width:1060px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left)) 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-size:clamp(28px,6vw,40px);line-height:1.05;color:var(--F);text-shadow:0 3px 0 #7a5a00}
.tbtns{display:flex;gap:8px}
.pill{min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--edge);background:var(--panel);font-weight:800;font-size:15px}
.pill[aria-pressed=false]{opacity:.7}
.scores{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.sc{display:flex;align-items:center;gap:8px;min-height:38px;padding:3px 14px 3px 4px;border-radius:999px;background:var(--panel);border:2px solid var(--edge);font-weight:800}
.sc.on{background:var(--ink);color:#12301f;border-color:var(--ink)}
.sc .mb{width:30px;height:30px}
.sc .st{font-family:'Lilita One',sans-serif;font-size:18px;color:var(--F)}
.sc.on .st{color:#a06e00}
.play{display:grid;gap:14px}
@media(min-width:760px){.play{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}.boardcol{position:sticky;top:12px}}
.mission{display:grid;gap:2px;margin-bottom:10px}
.stg{font-weight:800;color:var(--gold);font-size:15px}
.mission h2{font-size:clamp(26px,5vw,34px);line-height:1.05}
.mission p{margin:2px 0 0;color:var(--soft);font-weight:700}
.pcb{position:relative;margin:0 auto;border-radius:18px;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(227,176,75,.12) 22px 24px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(227,176,75,.08) 30px 32px),var(--pcb);box-shadow:inset 0 0 0 3px var(--gold),0 9px 0 #08200f}
.hole{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px var(--gold)}
.grid{position:absolute;display:grid}
.cell{position:relative;border-radius:9px;background:var(--pad);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.cell.floor::after,.cell.swa::after,.cell.swb::after{content:'';position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.55}
.cell.wall,.cell.water,.cell.gatea,.cell.gateb{background:transparent;box-shadow:none}
.cell svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cell.water svg{border-radius:9px}
.chip{position:absolute;inset:6%;transition:transform .3s,opacity .3s;animation:bob 1.6s ease-in-out infinite}
.chip.got{transform:scale(.2) translateY(-40%);opacity:0}
@keyframes bob{50%{transform:translateY(-6%)}}
.cell .knob{transition:opacity .2s}
.cell.on{box-shadow:0 0 0 3px var(--sw)}
.cell.on .knob{opacity:.45}
.cell .bars{transition:transform .35s,opacity .35s}
.cell.open .bars{transform:translateY(-70%);opacity:.12}
.cell.flash{animation:flash .5s 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--bad)}}
.bot{position:absolute;left:0;top:0;z-index:2;pointer-events:none}
.bot svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.bot .spin{width:100%;height:100%}
.bot.shake{animation:shake .4s}
@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}
.bot.sink .spin{transform-origin:center;opacity:.35;scale:.7;transition:opacity .4s,scale .4s}
.codecol{display:grid;gap:10px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.phead b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:22px}
.phead span{color:var(--soft);font-weight:800;white-space:nowrap}
.prog{min-height:76px;padding:10px;border-radius:16px;background:#0a2416;border:2px dashed var(--edge);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.empty{color:var(--soft);font-weight:700;align-self:center;padding:6px}
.blk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 12px 6px 9px;border:0;border-radius:12px;font-weight:900;font-size:15px;color:#1a1300;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .15s}
.blk svg,.pb svg{width:22px;height:22px;flex:none}
.bF{background:var(--F)}.bL{background:var(--L)}.bR{background:var(--R)}
.blk.on{transform:scale(1.12);box-shadow:0 0 0 4px var(--ink)}
.blk.bug,.loop.bug>.lh{box-shadow:0 0 0 4px var(--bad);animation:flash .5s 2}
.loop{display:flex;flex-direction:column;border-radius:14px;background:var(--LP);padding:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.loop.open{box-shadow:0 0 0 3px var(--ink)}
.loop.on{box-shadow:0 0 0 4px var(--ink)}
.lh{display:flex;align-items:center;gap:4px;padding:2px 2px 4px;color:#2a1300;font-weight:900}
.lh .lsel{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;font-weight:900;padding:6px 4px;min-height:40px}
.lh .lsel svg,.lh>svg{width:20px;height:20px}
.cn{width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.18);font-weight:900;font-size:20px;line-height:1}
.ct{min-width:34px;text-align:center;font-family:'Lilita One',sans-serif;font-size:20px;font-weight:400;white-space:nowrap}
.x{width:34px;height:34px;border-radius:50%;border:0;background:transparent;font-weight:900;font-size:16px;margin-left:auto}
.lb{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:6px;border-radius:10px;background:#0a2416;align-items:center}
.here{color:var(--soft);font-size:13px;font-weight:800;padding:0 4px}
.pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.pb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:0;border-radius:14px;font-weight:900;font-size:16px;color:#1a1300;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.pb:active{transform:translateY(2px)}
.pb.loopb{background:var(--LP)}.pb.close{background:var(--ink)}
.pb:disabled{opacity:.45;cursor:default}
.ctrl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.run{min-height:58px;border:0;border-radius:16px;background:var(--good);color:#0b2a10;font-family:'Lilita One',sans-serif;font-size:26px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;gap:10px}
.run.stop{background:var(--bad);color:#fff}
.run svg{width:24px;height:24px}
.gbtn{min-height:58px;border-radius:16px;border:2px solid var(--edge);background:var(--panel);font-weight:900}
.gbtn:disabled,.run:disabled{opacity:.45;cursor:default}
.link{justify-self:center;border:0;background:transparent;color:var(--soft);font-weight:800;text-decoration:underline;min-height:40px}
.ov,.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(4,16,9,.72)}
.ov[hidden],.sheet[hidden]{display:none}
.modal{width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px 20px 18px;border-radius:22px;background:var(--ink);color:#163021;text-align:center;box-shadow:0 10px 0 #0a2416;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h2{font-size:clamp(30px,8vw,40px);line-height:1.05;color:#163021}
.oart{width:84px;height:84px;margin:0 auto 6px}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0 6px}
.stars svg{width:46px;height:46px}
.stars svg.on{animation:pop .4s both}
.modal p{margin:8px 0;font-weight:700}
.res{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px;text-align:left}
.res li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#e8e2cc;font-weight:800}
.res li .mb{width:30px;height:30px;flex:none}
.res li .rs{margin-left:auto;white-space:nowrap;color:#9a6a00}
.fact{margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:#163021;color:var(--ink);text-align:left;font-weight:700}
.fact b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:19px;color:var(--F)}
.obtns{display:grid;gap:8px;margin-top:14px}
.obtns .run{width:100%;font-size:24px}
.ghost{min-height:48px;border-radius:14px;border:2px solid #c9c1a5;background:transparent;font-weight:900;color:#163021}
.demo{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.demo .loop{display:inline-flex}
.sheetin{width:min(620px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 18px 22px;border-radius:22px;background:var(--panel);border:2px solid var(--edge)}
.shhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.shhead h2{font-size:30px;color:var(--F)}
.sheetin h3{font-size:21px;margin:16px 0 8px}
.pr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pr .cbtn{width:48px;height:48px;border-radius:12px;border:2px solid var(--edge);background:#0a2416;padding:4px;flex:none}
.pr input{flex:1;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--edge);background:#0a2416;color:var(--ink);font:800 16px Nunito,sans-serif}
.pr .del{width:44px;height:44px;border-radius:12px;border:0;background:transparent;font-weight:900;font-size:18px;flex:none}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--edge);background:#0a2416;font-weight:900}
.seg button[aria-pressed=true]{background:var(--F);color:#1a1300;border-color:var(--F)}
.note{margin:8px 0 0;color:var(--soft);font-weight:700;font-size:15px}
.stage{margin:0 0 10px;padding:12px;border-radius:16px;background:#0a2416;border-left:6px solid var(--sc)}
.stage .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stage .sh b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:20px;color:var(--sc)}
.stage .sh span{color:var(--soft);font-weight:800;font-size:14px;white-space:nowrap}
.stage p{margin:2px 0 8px;color:var(--soft);font-size:14px;font-weight:700}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lv{min-height:56px;border-radius:12px;border:2px solid var(--edge);background:var(--panel);font-weight:900;display:grid;place-items:center;padding:2px;line-height:1.1}
.lv small{font-size:13px;color:var(--F);letter-spacing:1px}
.lv.cur{border-color:var(--F)}
.lv:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;top:14px;z-index:30;translate:-50% 0;padding:10px 18px;border-radius:999px;background:var(--ink);color:#163021;font-weight:900;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.conf i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;animation:fall 1.4s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){.chip,.modal,.stars svg.on,.cell.flash,.bot.shake,.blk.bug{animation:none}.bot{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="room.js"></script>
<script src="memory.js"></script>

<div class="app">

    <div class="tbtns"><button class="pill" id="sndBtn" aria-pressed="true">Sound on</button><button class="pill" id="mmBtn">🃏 Memory Match</button><button class="pill" id="menuBtn">Levels &amp; players</button></div>

<div class="sheet" id="sheet" hidden>

<script>
{
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]],DCH={'^':0,'>':1,'v':2,'<':3};
const STAGES=[
 {name:'Boot Up',blurb:'Forward and turns: put steps in the right order.',color:'#ffcf3f'},
 {name:'Power Chips',blurb:'Grab every chip, dodge the water.',color:'#3fd6ff'},
 {name:'Loop Lab',blurb:'Repeat blocks do the boring parts for you.',color:'#ff9f3a'},
 {name:'Switch Station',blurb:'Roll over a switch to open its gate.',color:'#b98cff'},
 {name:'Boss Board',blurb:'Loops inside loops, switches and chips.',color:'#ff6b8b'}
];
const LEVELS=[
 {s:0,name:'Hello, robot',par:3,map:['......','.>..G.','......'],tip:'Add Forward blocks until your robot reaches the charger, then press Run.',fact:'The word "robot" comes from a 1920 Czech play called R.U.R. It comes from "robota," which means hard, forced work.'},
 {s:0,name:'Long road',par:5,map:['........','.>....G.','........'],tip:'Count the squares to the charger. One Forward moves one square.',fact:'Nobody drives a Mars rover with a joystick. Radio signals take several minutes to get there, so engineers send a list of commands, just like your program.'},
 {s:0,name:'Corner turn',par:5,map:['#####','#>..#','###.#','###G#','#####'],tip:'Turns happen in place. Turn right means the robot\'s own right, so imagine sitting in the driver\'s seat.',fact:'Ada Lovelace wrote what many call the first computer program in 1843, for a machine that was never even finished.'},
 {s:0,name:'Left turn',par:5,map:['#####','#G..#','###.#','###^#','#####'],tip:'Your robot starts facing up this time. Which way is its left?',fact:'The very first computer mouse, built in the 1960s, had a wooden shell.'},
 {s:0,name:'S-bend',par:9,map:['######','#>.###','##.###','##...#','####G#','######'],tip:'Right, then left, then right again. Trace it with your finger first.',fact:'ENIAC, one of the first electronic computers, was finished in 1945. It weighed about 30 tons and filled a whole room.'},
 {s:1,name:'Power chip',par:10,map:['######','#>.c.#','####.#','#G...#','######'],tip:'Grab every power chip before you dock at the charger.',fact:'Computers think in binary: just 1s and 0s. Each 1 or 0 is a bit, and 8 bits make one byte.'},
 {s:1,name:'Splash zone',par:11,map:['#######','#>.~.G#','#.#.#.#','#.....#','#######'],tip:'Robots and water don\'t mix! Find the dry path around.',fact:'In 1947, engineers found a real moth stuck inside the Harvard Mark II computer. They taped it in their logbook as the "first actual case of bug being found."'},
 {s:1,name:'U-turn',par:11,map:['########','#~~~~~~#','#c.>..G#','#~~~~~~#','########'],tip:'The chip is behind you. Two turns make a U-turn.',fact:'Computers often count from 0, so the first thing in a list is usually item number 0.'},
 {s:1,name:'Chip trail',par:9,map:['#######','#v#####','#.#####','#c...c#','#~~~~G#','#######'],tip:'Facing down, a left turn points your robot to the right side of the screen. Tricky!',fact:'The first text message was sent in 1992. It said "Merry Christmas."'},
 {s:1,name:'Island hop',par:13,map:['########','#>.c~.G#','#.#.~c.#','#......#','########'],tip:'Cross the water on the bottom bridge, then come back up for the second chip.',fact:'Most internet data between continents travels as flashes of light through glass cables on the ocean floor.'},
 {s:2,name:'Loop the loop',par:2,loopIntro:true,map:['........','>......G','........'],tip:'New block: Repeat! Tap Repeat, put one Forward inside it, then tap + until it says 7.',fact:'Loops are everywhere. Many video games redraw the whole screen about 60 times every second, inside one big loop.'},
 {s:2,name:'Hallway',par:8,map:['##########','#>.......#','########.#','#G.......#','##########'],tip:'Use a Repeat for each long hallway.',fact:'Traffic lights run on loops too: green, yellow, red, and repeat.'},
 {s:2,name:'Staircase',par:5,map:['######','#>.###','##..##','###..#','####G#','######'],tip:'See a pattern that repeats? Put the whole pattern inside one Repeat.',fact:'Scratch, a coding language made for kids at MIT, uses snap-together blocks a lot like these.'},
 {s:2,name:'Chip circuit',par:5,map:['######','#>..c#','#~##.#','#~##.#','#G..c#','######'],tip:'Collect both chips. Your robot drives the same shape three times.',fact:'The International Space Station loops around Earth about 16 times every day.'},

function parse(L){const rows=L.map,h=rows.length,w=Math.max(...rows.map(r=>r.length)),cells=[],chips=[],sw=[],gates=[];let start=null,goal=null;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x]||'#';let t='floor';
  if(ch==='#')t='wall';else if(ch==='~')t='water';else if(ch==='c')chips.push(x+','+y);else if(ch==='G'){t='goal';goal=[x,y]}
  else if(ch==='a'||ch==='b'){t='sw'+ch;sw.push([x,y,ch])}else if(ch==='A'||ch==='B'){t='gate'+ch.toLowerCase();gates.push([x,y,ch.toLowerCase()])}
  else if(ch in DCH)start={x,y,d:DCH[ch]};cells.push(t)}
 return{w,h,cells,start,chips,goal,sw,gates,at:(x,y)=>x<0||y<0||x>=w||y>=h?'out':cells[y*w+x]}}
function flatten(nodes,pre,out,loops){for(let i=0;i<nodes.length;i++){const n=nodes[i],p=pre===''?''+i:pre+'.'+i;
 if(n.t==='loop'){for(let k=0;k<n.n;k++){flatten(n.body,p,out,loops.concat([[p,k+1,n.n]]));if(out.length>500)return}}else out.push({op:n.t,path:p,loops})}}

function simulate(P,prog){const steps=[];flatten(prog,'',steps,[]);

 for(let i=0;i<steps.length&&i<500;i++){const s=steps[i],f={step:s};
  if(s.op==='L'){d=(d+3)%4;rot-=90;f.ev='turn'}else if(s.op==='R'){d=(d+1)%4;rot+=90;f.ev='turn'}
  else{const nx=x+DIRS[d][0],ny=y+DIRS[d][1],t=P.at(nx,ny);
   const shut=t.startsWith('gate')&&!open.includes(t.slice(4));
   if(t==='wall'||t==='out'||shut){Object.assign(f,{x,y,rot,got:got.slice(),open:open.slice(),bump:[nx,ny],ev:t==='out'?'edge':shut?'gate':'wall'});frames.push(f);result=f.ev;break}
   x=nx;y=ny;f.ev='move';const k=x+','+y;
   if(P.chips.includes(k)&&!got.includes(k)){got.push(k);f.ev='chip'}
   if(t.startsWith('sw')&&!open.includes(t.slice(2))){open.push(t.slice(2));f.ev='switch';f.sw=t.slice(2)}
   if(t==='water'){Object.assign(f,{x,y,rot,got:got.slice(),open:open.slice(),ev:'water'});frames.push(f);result='water';break}
   if(t==='goal'&&got.length===P.chips.length){Object.assign(f,{x,y,rot,got:got.slice(),open:open.slice(),ev:'goal'});frames.push(f);result='win';break}}
  Object.assign(f,{x,y,rot,got:got.slice(),open:open.slice()});frames.push(f)}
 if(result==='short'&&P.goal&&x===P.goal[0]&&y===P.goal[1])result='chips';
 return{frames,result}}

    await wait(spd()*.4);
  }
  const stopped=stopReq;running=false;mark(null);document.querySelectorAll('#prog .on').forEach(e=>e.classList.remove('on'));
  if(stopped){renderProg();resetBot();return}
  const last=sim.frames[sim.frames.length-1];
  if(sim.result==='win'){renderProg();SFX.win();confetti();await wait(300);win(count(prog));return}
  if(['wall','edge','gate','water'].includes(sim.result)&&last)bugPath=last.step.path;
  renderProg();fails++;fail(sim.result);
}
$('runBtn').addEventListener('click',run);

/* ---------- overlays ---------- */
let ovP=null,ovA=null;
function showOv(o){
  $('ovArt').innerHTML=o.art||'';$('ovArt').hidden=!o.art;$('ovT').textContent=o.title;
  $('ovS').innerHTML=o.stars>=0?[1,2,3].map(i=>starSVG(i<=o.stars)).join(''):'';$('ovS').hidden=!(o.stars>=0);
  [...$('ovS').children].forEach((s,i)=>s.style.animationDelay=(i*.15)+'s');
  $('ovB').innerHTML=o.body||'';$('ovF').hidden=!o.fact;$('ovF').innerHTML=o.fact?`<b>Tech byte</b>${esc(o.fact)}`:'';
  $('ovP').innerHTML=esc(o.primary[0]);ovP=o.primary[1];$('ovA').hidden=!o.alt;if(o.alt){$('ovA').textContent=o.alt[0];ovA=o.alt[1]}
  $('ov').hidden=false;setTimeout(()=>$('ovP').focus(),50)}
const hideOv=()=>{$('ov').hidden=true};
$('ovP').addEventListener('click',()=>{hideOv();ovP&&ovP()});
$('ovA').addEventListener('click',()=>{hideOv();ovA&&ovA()});
const FAILS={wall:['Bonk!','Your robot bumped into a part on the board.'],edge:['Whoa!','Your robot almost drove off the edge of the board.'],
 gate:['Gate closed!','Roll over the matching switch first to open it.'],water:['Splash!','Robots and water don\'t mix.'],
 chips:['So close!','Grab every power chip before you dock at the charger.'],short:['Out of blocks','Your robot stopped before it reached the charger. Add more blocks.']};
function fail(r){const[t,m]=FAILS[r]||FAILS.short;
  const bug=bugPath?'<p>The red block is where things went wrong. Change it, then run again.</p>':'';
  const hint=fails>=2?`<p><b>Hint:</b> ${esc(LEVELS[S.lvl].tip)}</p>`:'';
  showOv({art:botSVG(col(isTeam()?0:S.turn)),title:t,body:`<p>${esc(m)}</p>${bug}${hint}`,primary:['Debug it',()=>{resetBot()}]})}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=document.createElement('div');box.className='conf';box.setAttribute('aria-hidden','true');
  const cs=['#ffcf3f','#5cc8ff','#ff7ab6','#ff9f3a','#7cf05a','#f6f2e4'];
  for(let i=0;i<36;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cs[i%cs.length];e.style.setProperty('--dx',((Math.random()-.5)*160|0)+'px');e.style.setProperty('--r',((Math.random()-.5)*900|0)+'deg');e.style.animationDelay=(Math.random()*.25).toFixed(2)+'s';box.appendChild(e)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),1900)}
const parLine=(b,par)=>b<=par?`You used ${b} block${b===1?'':'s'}. That's par!`:`You used ${b} blocks. Par is ${par}. Can you do it in fewer?`;
function win(b){
  const lv=LEVELS[S.lvl],st=starsFor(b,lv.par);S.best[S.lvl]=Math.max(S.best[S.lvl]||0,st);fails=0;
  if(isTeam()){S.team+=st;save();renderScores();levelDone([{i:0,st,b}]);return}
  S.res[S.turn]={st,b};S.scores[S.turn]=(S.scores[S.turn]||0)+st;save();renderScores();
  if(S.turn<S.players.length-1){const me=S.players[S.turn],nx=S.players[S.turn+1];
    showOv({art:botSVG(col(S.turn)),title:`Nice coding, ${me.name}!`,stars:st,body:`<p>${parLine(b,lv.par)}</p><p>Now it's ${esc(nx.name)}'s turn on the same board.</p>`,primary:[`${nx.name}'s turn`,nextTurn]});return}
  levelDone(S.res.map((r,i)=>({i,st:r?r.st:0,b:r?r.b:null})));
}
function levelDone(rows){
  const i=S.lvl,lv=LEVELS[i],lastInStage=i===LEVELS.length-1||LEVELS[i+1].s!==lv.s,lastAll=i===LEVELS.length-1;
  S.unlocked=Math.max(S.unlocked,Math.min(i+1,LEVELS.length-1));save();
  let body='';
  if(isTeam()){const r=rows[0];body=r.b==null?'<p>Skipped for now. You can come back from the Levels menu.</p>':`<p>${parLine(r.b,lv.par)}</p>`}
  else{const done=rows.filter(r=>r.b!=null);let wl='';
    if(done.length){const top=Math.max(...done.map(r=>r.st)),cand=done.filter(r=>r.st===top),minb=Math.min(...cand.map(r=>r.b)),w=cand.filter(r=>r.b===minb);
      wl=w.length===1&&done.length>1?`<p><b>${esc(S.players[w[0].i].name)} wins this level</b>${cand.length>1?' with the fewest blocks':''}!</p>`:done.length>1?'<p><b>It\'s a tie!</b> Great coding, everyone.</p>':''}
    body=`<ul class="res">${rows.map(r=>`<li>${botSVG(col(r.i)).replace('<svg','<svg class="mb"')}<span>${esc(S.players[r.i].name)}</span><span class="rs">${r.b==null?'skipped':'★'.repeat(r.st)+` ${r.b} blocks`}</span></li>`).join('')}</ul>${wl}`}
  const stars=isTeam()&&rows[0].b!=null?rows[0].st:-1;
  if(lastInStage){const st=STAGES[lv.s],got=LEVELS.map((l,j)=>l.s===lv.s?(S.best[j]||0):0).reduce((a,b)=>a+b,0);
    SFX.fanfare();confetti();
    showOv({art:trophy(st.color),title:lastAll?'You beat Code Bot Quest!':`Stage ${lv.s+1} complete!`,stars,body:body+`<p>${esc(st.name)}: ${got} of 15 stars collected.</p>${lastAll?'<p>You used sequences, loops, nested loops and switches, the same big ideas real programmers use every day.</p>':`<p>Next up: <b>${esc(STAGES[lv.s+1].name)}</b>. ${esc(STAGES[lv.s+1].blurb)}</p>`}`,
      fact:lv.fact,primary:lastAll?['Pick a level to replay',()=>openSheet()]:[`Start Stage ${lv.s+2}`,()=>goLevel(i+1)],alt:lastAll?null:['Replay this level',()=>goLevel(i)]});return}
  showOv({art:botSVG(col(isTeam()?0:rows[rows.length-1].i)),title:'Level complete!',stars,body,fact:lv.fact,primary:['Next level',()=>goLevel(i+1)],alt:['Replay this level',()=>goLevel(i)]});
}
const trophy=c=>`<svg viewBox="0 0 120 112" aria-hidden="true"><path d="M30 26H15c0 18 8 28 19 30M90 26h15c0 18-8 28-19 30" fill="none" stroke="#c99a00" stroke-width="7" stroke-linecap="round"/><path d="M28 14h64v26c0 21-14 37-32 37S28 61 28 40z" fill="#ffcf3f"/><path d="M60 14h32v26c0 21-14 37-32 37z" fill="#f2b900"/><circle cx="60" cy="40" r="11" fill="${c}"/><rect x="52" y="76" width="16" height="14" fill="#c99a00"/><rect x="34" y="90" width="52" height="14" rx="5" fill="#a87f00"/></svg>`;
function nextTurn(){S.turn++;prog=[];cursor=[];bugPath='';fails=0;save();renderAll();toast(`${curP().name}, build your program!`)}
function goLevel(i){S.lvl=Math.max(0,Math.min(i,LEVELS.length-1));S.turn=0;S.res=[];prog=[];cursor=[];bugPath='';fails=0;save();renderAll();intro()}
function intro(){const lv=LEVELS[S.lvl];
  if(lv.loopIntro&&!S.intro.loop){S.intro.loop=1;save();showOv({title:'New block: Repeat',body:`<p>A Repeat runs the blocks inside it again and again. Programmers call this a <b>loop</b>.</p><div class="demo"><div class="loop"><div class="lh">${IC.loop}Repeat <b class="ct">3×</b></div><div class="lb"><span class="blk bF">${IC.F}Forward</span></div></div></div><p>That does the same thing as Forward, Forward, Forward, but uses only 2 blocks.</p><p>Tap Repeat, add blocks inside it, then tap <b>Done with Repeat</b>.</p>`,primary:['Let\'s loop!',()=>{}]})}
  else if(lv.switchIntro&&!S.intro.sw){S.intro.sw=1;save();showOv({title:'Switches and gates',body:`<div class="demo"><svg width="64" height="64" viewBox="0 0 100 100">${swSVG(SWC.a).replace(/<\/?svg[^>]*>/g,'')}</svg><svg width="64" height="64" viewBox="0 0 100 100">${gateSVG(SWC.a).replace(/<\/?svg[^>]*>/g,'')}</svg></div><p>A gate blocks the way until your robot rolls over the switch with the <b>same color</b>. Then it opens and stays open.</p><p>Real computer chips are full of tiny switches too.</p>`,primary:['Got it!',()=>{}]})}
}

/* ---------- main render ---------- */
function renderScores(){
  if(isTeam()){$('scores').innerHTML=`<div class="sc on">${botSVG(col(0)).replace('<svg','<svg class="mb"')}<span>Team ${esc(S.players.map(p=>p.name).join(' & '))}</span><span class="st">★ ${S.team}</span></div>`;return}
  $('scores').innerHTML=S.players.map((p,i)=>`<div class="sc${i===S.turn?' on':''}">${botSVG(col(i)).replace('<svg','<svg class="mb"')}<span>${esc(p.name)}</span><span class="st">★ ${S.scores[i]||0}</span></div>`).join('')}
function renderAll(){
  const lv=LEVELS[S.lvl],n=LEVELS.filter((l,j)=>l.s===lv.s&&j<=S.lvl).length;
  $('stg').textContent=`Stage ${lv.s+1}: ${STAGES[lv.s].name}, level ${n} of 5`;$('stg').style.color=STAGES[lv.s].color;
  $('lvlTitle').textContent=lv.name;$('tip').textContent=lv.tip;
  $('turnLbl').textContent=isTeam()?'Your program':`${curP().name}'s program`;$('turnLbl').style.color=col(isTeam()?0:S.turn);
  $('skipBtn').textContent=isTeam()?'Skip this level':`Skip ${curP().name}'s turn`;
  renderScores();renderBoard();renderProg();
}
$('skipBtn').addEventListener('click',()=>{if(running)return;showOv({title:'Skip this one?',body:'<p>You won\'t get stars for this level, but you can come back to it later.</p>',primary:['Keep trying',()=>{}],alt:['Skip it',skip]})});
function skip(){fails=0;if(isTeam()){levelDone([{i:0,st:0,b:null}]);return}
  S.res[S.turn]={st:0,b:null};save();if(S.turn<S.players.length-1){nextTurn();return}levelDone(S.res.map((r,i)=>({i,st:r?r.st:0,b:r?r.b:null})))}

/* ---------- setup sheet ---------- */
function renderSheet(){
  $('plist').innerHTML=S.players.map((p,i)=>`<div class="pr"><button class="cbtn" data-c="${i}" aria-label="Change ${esc(p.name)}'s robot color">${botSVG(col(i))}</button><input id="pn${i}" data-i="${i}" value="${esc(p.name)}" maxlength="14" aria-label="Player ${i+1} name" autocomplete="off"><button class="del" data-d="${i}" aria-label="Remove player ${i+1}"${S.players.length<2?' hidden':''}>✕</button></div>`).join('');
  $('addP').hidden=S.players.length>=MAXP;
  $('mChal').setAttribute('aria-pressed',S.mode==='challenge');$('mTeam').setAttribute('aria-pressed',S.mode==='team');
  $('modeNote').textContent=S.mode==='team'?'Build one program together and share the stars.':'Everyone solves the same board on their own. Fewest blocks wins the level.';
  $('spdN').setAttribute('aria-pressed',!S.fast);$('spdF').setAttribute('aria-pressed',S.fast);
  $('stageList').innerHTML=STAGES.map((st,si)=>{const ids=LEVELS.map((l,j)=>l.s===si?j:-1).filter(j=>j>=0),got=ids.reduce((a,j)=>a+(S.best[j]||0),0);
    return`<div class="stage" style="--sc:${st.color}"><div class="sh"><b>Stage ${si+1}: ${esc(st.name)}</b><span>★ ${got} of 15</span></div><p>${esc(st.blurb)}</p><div class="lvls">${ids.map((j,k)=>`<button class="lv${j===S.lvl?' cur':''}" data-l="${j}"${j>S.unlocked?' disabled':''} aria-label="Level ${si+1}-${k+1}: ${esc(LEVELS[j].name)}">${si+1}-${k+1}<small>${'★'.repeat(S.best[j]||0)||(j>S.unlocked?'locked':'')}</small></button>`).join('')}</div></div>`}).join('');
}
let sheetSnap='';
function openSheet(){sheetSnap=JSON.stringify([S.players.length,S.mode]);renderSheet();$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true;S.players.forEach(p=>{p.name=(p.name||'').trim()||'Coder'});
  S.scores=S.players.map((_,i)=>S.scores[i]||0);
  if(sheetSnap!==JSON.stringify([S.players.length,S.mode])){S.turn=0;S.res=[];prog=[];cursor=[]}

/* ---------- boot ---------- */
function start(data){
  let saved=null;try{saved=data&&data.S?data.S:JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(saved&&Array.isArray(saved.players)&&saved.players.length)Object.assign(S,saved);
  S.lvl=Math.max(0,Math.min(S.lvl|0,LEVELS.length-1));S.intro=S.intro||{};S.best=S.best||[];S.scores=S.players.map((_,i)=>(S.scores||[])[i]||0);
  if(data&&Array.isArray(data.prog)){prog=data.prog;cursor=data.cursor||[]}
  else if(!saved){prog=[{t:'F'},{t:'F'}]}
  sndUI();renderAll();
  if(!saved&&!(data&&data.prog))setTimeout(()=>toast('Two blocks are already in. Add one more and press Run!'),600);
}
window.claude?.hot?.snapshot?.(()=>({S,prog,cursor}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
