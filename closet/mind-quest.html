ith a deliberate pause."],"q":[["What is narrative transportation?","Being absorbed in a story with attention, imagination and feelings all pointed at it."],["What did Franklin's commission conclude about Mesmer's magnetism?","There was no magnetic fluid; the effects came from imagination."],["What did James Braid identify as the real cause of hypnotism?","Concentration: a mind held on a single idea."],["What are the three exits?","The runway (background first), the fog (abstract words) and the flat line (a voice that gives everything equal weight)."],["Why does opening with a question help?","Curiosity makes people hold on to the answer and everything around it."],["How should a pause before a key word look?","Chosen and deliberate, not lost: breathe, look at the listeners, then say it."]],"pr":"This week: rebuild one talk or update.","it":"When I catch myself starting with 'So, some background,' I'll stop and say what's at stake first."}]},{"id":"people-t05","ch":"people","num":5,"t":"Attraction and Letting Go","ls":[{"id":"people-t05-l1","n":1,"t":"Attraction: wanting versus approving","dg":[["people-T05-liking-wanting.webp","Two columns comparing liking and wanting: what each is, what drives it, and what it produces","Liking and wanting are two systems"]],"ep":[["V4npQ93EEv0","Psychology of Seduction: Be So Desirable People Crave You","15:23"],["uw61C_qbgNg","Psychology of Charisma: How To Actually Make People Like You","15:21"]],"st":[["Pick one pursuit","that's just for you, and give it time each week."],["Catch small auditions:","each day, notice one place you agreed or laughed when you didn't mean it."],["Say one honest preference or disagreement,","kindly, in a conversation this week."],["Ask forward-looking questions","in your next three conversations."],["After each,","note what you learned about the other person, not how you came across."]],"pf":"This month: more of you, less performance.","pit":"When I notice I'm thinking about how I'm coming across, I'll ask the other person a question about what they just said.","big":"Being approved of and being wanted are two separate systems, and most \"be more desirable\" advice trains the wrong one.","ex":"Alex, 32, has a great job, dresses well, and keeps hearing \"you're such a catch\" after dates that don't lead anywhere.","tk":["People's **stated preferences** don't predict who they're drawn to.","**Liking** (evaluation) and **wanting** (motivation) are separate systems.","Desire is a forecast of **expansion**: who you become with someone.","There's **no universal scale**; selective interest beats manufactured scarcity.","Be **present and curious**, not auditioning."],"q":[["What happened when stated partner preferences were compared with actual attraction?","They failed to predict who people were drawn to."],["What's the difference between liking and wanting?","Liking is an evaluation of someone; wanting is a motivation toward them."],["What is the self-expansion model?","People are driven to grow, and one of the most efficient ways is through another person."],["What worked better than being hard to get for everyone?","Being selectively hard to get: choosy in general but clearly interested in this person."],["What do all of Greene's anti-seducers have in common?","They're so occupied with their own effect that they never arrive in the other person's world."]],"pr":"This month: more of you, less performance.","it":"When I notice I'm thinking about how I'm coming across, I'll ask the other person a question about what they just said."},{"id":"people-t05-l2","n":2,"t":"When the reaching goes quiet","dg":[["people-T05-extinction.webp","Two stacked layers labeled the wanting and the stop layer, with three arrows for spontaneous recovery, renewal and reinstatement","Two layers, three ways back"]],"ep":[["Cmdr-wclRSw","Psychology of People Who Stopped Chasing Love","14:00"],["N95Tb2sDWVs","Psychology of People Who Go Quiet When They’re Hurt","10:27"]],"st":[["Check the five signs","and write which fit you."],["Test your standards:","list the last three people you stopped seeing and the reason. Specific, or convenient?"],["Say it once:","tell one trusted person that you'd like love in your life."],["Change one context:","a new group, class or place where you're not \"the one who gave up.\""],["When someone is warm,","let it land before looking for a flaw."]],"pf":"This month: notice, name, and change the conditions.","pit":"When I notice relief that plans were canceled, I'll wait ten minutes and name what comes after it.","big":"People who \"stopped chasing love\" usually didn't stop wanting it; the reaching went quiet while the wanting stayed intact.","ex":"Grace, 38, tells friends she's \"happy where she is\" and \"not really looking.\"","tk":["**Extinction isn't unlearning:** the reaching goes quiet, but the wanting stays intact.","Romantic love works like a **drive**, not a passing feeling.","The shutdown was an **accurate adjustment**, not a flaw.","Watch for **\"standards\"** that eliminate everyone right when wanting would show.","Reaching returns through **time, new contexts and warm contact**."],"q":[["What did Bouton find about extinction?","It isn't unlearning; the original learning stays, with a newer \"stop\" layer built on top."],["Why does Fisher call romantic love a drive?","It activates motivation and craving circuits, like hunger, more than emotional centers."],["What are deactivating strategies?","Ways the nervous system mutes the need for closeness when reaching keeps failing."],["How can you tell real standards from a shutdown?","Real standards rule out specific people for specific reasons; a shutdown finds a flaw in everyone right when continuing would mean wanting something out loud."],["What are the three ways extinguished behavior returns?","Spontaneous recovery (time), renewal (new context) and reinstatement (an unexpected warm contact)."]],"pr":"This month: notice, name, and change the conditions.","it":"When I notice relief that plans were canceled, I'll wait ten minutes and name what comes after it."}]},{"id":"people-t06","ch":"people","num":6,"t":"Dark Traits and Deception","ls":[{"id":"people-t06-l1","n":1,"t":"The dark triad: a system, not a wound","dg":[["people-T06-dark-core.webp","Three trait cards around a shared core, with three protection cards beneath","The dark core and three protections"]],"ep":[["1pHIy6uQFic","10 Signs of the Dark Triad (The Most Ruthless Personality Type)","16:11"],["UhxZFzeo0bA","10 Signs of a Dark Empath (The Most Dangerous Personality Type)","13:47"]],"st":[["Think of one relationship","that leaves you uneasy."],["Write down three things they did","(not said) recently."],["Look for repeats","across your list and any older ones you remember."],["Practice warm and boring:","in your next conversation with them, answer kindly and briefly, sharing nothing personal."],["Notice sign 1","in others: how do they treat people who can do nothing for them?"]],"pf":"This week: watch patterns, not promises.","pit":"When this person apologizes, I'll write down the behavior and check later whether it repeats.","big":"The dark triad isn't a malfunction; it's a system working as designed.","ex":"Owen's business partner, Rick, was the most charming person he'd ever met, at first.","tk":["The **dark triad** is narcissism, Machiavellianism and psychopathy: traits on a spectrum, **not a diagnosis**.","Its core is **self-benefit plus beliefs that justify harm**.","Charm with an **expiration date** and **remorse replaced by a story** are early tells.","**Judge the pattern, not the apology**; keep a record.","Be **warm and boring**, and leave **without negotiating**."],"q":[["What are the three traits of the dark triad?","Narcissism, Machiavellianism and (subclinical) psychopathy."],["What is the dark factor?","Maximizing your own benefit while accepting harm to others, plus beliefs that justify it."],["Why judge the pattern instead of the apology?","Words are their most polished tool; what repeats shows the truth."],["What does \"stop feeding the machine\" mean?","Stay warm but brief, and share nothing personal that could be stored and used later."],["Why leave without a negotiation?","Every explanation gives a manipulative person a handle; reduce contact and hold your decision."]],"pr":"This week: watch patterns, not promises.","it":"When this person apologizes, I'll write down the behavior and check later whether it repeats."},{"id":"people-t06-l2","n":2,"t":"Liars: check the story, not the face","dg":[["people-T06-check-the-story.webp","Four steps: default to truth, invite more story, hold what you know, check the big bills","Check the story, not the face"]],"ep":[["MzdfUxjTeQo","Psychology of Liars (And How To Spot One Instantly)","15:48"],["YteFqslM4HE","Psychology of Social Intelligence: How to Read Anyone Instantly","15:19"]],"st":[["Notice your truth default:","it's usually right; leave it on for small things."],["For one story that matters,","ask for more detail and note what could be verified."],["Practice holding what you know:","ask an open question first, then compare."],["Check one story you tell yourself:","write the version a fair outsider would tell."],["Notice after a lie of your own","(even a small one) whether you trust others a little less."]],"pf":"This week: practice checking stories humanely.","pit":"When something important depends on someone's account, I'll ask them to walk me through it before I share what I know.","big":"Lies are rarely caught in the body; they're caught when the story runs into the world.","ex":"Grace manages a small team. A supplier, Mark, says a delayed shipment \"left the warehouse Tuesday.\"","tk":["**A small number of people tell most of the lies;** most people are honest most of the time.","Liars feel nervous but **rarely show it** where we look.","Convincing lies are **mostly true** with one false detail.","Lies get caught through **evidence and other people**, not faces.","**Invite more story, hold what you know, and check only the big bills.**"],"q":[["In the survey of 1,000 adults, how were lies distributed?","Six in ten told no lies, and about half of all lies came from 5% of people."],["Why is \"they looked away\" a poor clue?","Liars often feel nervous but don't reliably show nervous behavior."],["What is truth-default theory?","We believe what people say unless something makes us question it, which is usually the right bet."],["What happens to the drifting liar?","Small self-serving lies grow as the brain's emotional reaction to lying fades."],["How do most real lies get discovered?","Through other people, evidence, mismatches with what's known, and confessions, often later."],["What is the strategic use of evidence?","Letting someone tell their full story before revealing what you already know."]],"pr":"This week: practice checking stories humanely.","it":"When something important depends on someone's account, I'll ask them to walk me through it before I share what I know."}]},{"id":"people-t07","ch":"people","num":7,"t":"Pulling Away from People","ls":[{"id":"people-t07-l1","n":1,"t":"Keeping your distance: five reasons","dg":[["people-T07-five-reasons.webp","Five cards, each naming a reason for keeping distance and what it needs instead","Five reasons for distance, and what each needs"]],"ep":[["a8eTeGWp4_A","Psychology of People Who Distance Themselves from Others","7:08"],["POqCOvbJFbE","Why Some People Are Meant to Walk Alone (Psychology Explains)","11:42"]],"st":[["Each time you pull back,","write which of the five reasons fits."],["Match the response","to the reason: rest for overstimulation, evidence for attachment anxiety, acknowledgment for grief."],["Check one relationship:","is this person someone who hurt you, or someone who resembles them?"],["Stay ten minutes longer","than you want to with one safe person."]],"pf":"This week: name the reason each time.","pit":"When I feel the urge to cancel on someone safe, I'll name the reason first, then decide.","big":"People who keep others at a distance usually aren't incapable of closeness; their nervous system learned that closeness had a cost.","ex":"Ana, a nurse, cancels plans with her friend Mei three times in a month and lets her texts sit.","tk":["Keeping distance is often an **adaptation** to past costs of closeness.","Five reasons: **attachment anxiety, overstimulation, identity, control, grief**.","The pattern can keep running **with safe people**.","Awareness of the pattern often **grows with age**.","**Name the reason**, check the person, and stay a little longer with safe people."],"q":[["What does the video say distance usually is?","An adaptation: the nervous system learned that closeness carried a cost."],["Name the five reasons for keeping distance.","Attachment anxiety, overstimulation, identity, control and grief."],["In attachment anxiety, what is the fear really about?","Needing people, and losing them, rather than people themselves."],["What's the problem with the pattern later in life?","It keeps running even with people who are safe."],["What does the quiet room image mean?","Distance is a familiar refuge built for an earlier life; the question is whether you want to spend time in other rooms too."]],"pr":"This week: name the reason each time.","it":"When I feel the urge to cancel on someone safe, I'll name the reason first, then decide."},{"id":"people-t07-l2","n":2,"t":"The quiet cutoff: filter, not wall","dg":[["people-T07-access-levels.webp","A ladder of access levels from inner circle to occasional contact to small talk to cutoff, with a note to say one line before moving someone down","Downgrade before you delete"]],"ep":[["tt9rOTWO5Ao","Why High IQ People Suddenly Cut Everyone Off","16:07"],["9OGL4-7SpLs","The 6 Dangerous People Psychology Says You Must Avoid","15:24"]],"st":[["List your current \"ledgers\":","relationships you've been quietly weighing."],["For one,","write the single sentence that names the pattern, and decide whether to say it."],["For another,","choose a lower access level instead of a full cutoff."],["Name your protected few","(one to three people) and reach out to one this week."]],"pf":"This week: turn one reflex into a choice.","pit":"When I feel ready to cut someone off, I'll first say one honest sentence about the pattern.","big":"When someone \"suddenly\" cuts people off, the cutoff usually isn't sudden at all; it's the end of a long, private process.","ex":"Daniel has gone quiet on most of his college friends. One of them, Sam, finally asks what happened.","tk":["Relationships usually end through a **private process** before any public sign.","A cutoff is a **threshold** crossed after long, silent overload.","In one large study, the most intelligent people were **less satisfied** the more they socialized.","A **filter** is selective; a **wall** keeps everyone out.","**Say one line before cutting, downgrade before deleting, and protect the few.**"],"q":[["What is Duck's intrapsychic phase?","The private, internal stage where one person weighs a relationship before anything shows outwardly."],["Why does a cutoff look sudden to others?","They only see the final verdict, not the months of silent weighing before it."],["What did Li and Kanazawa find?","More socializing went with higher satisfaction for most people, but lower satisfaction for the most intelligent."],["What's the difference between a filter and a wall?","A filter keeps the wrong people out and lets the right ones in; a wall keeps everyone out."],["Name the three principles.","Read one line of the ledger out loud, downgrade before you delete, and protect the ones who passed."]],"pr":"This week: turn one reflex into a choice.","it":"When I feel ready to cut someone off, I'll first say one honest sentence about the pattern."},{"id":"people-t07-l3","n":3,"t":"After cutting everyone off: the way back","dg":[["people-T07-four-withdrawals.webp","Four cards for the boundary, the empty tank, the freeze and the fog, each with what it needs","Four kinds of withdrawal, and what each needs"]],"ep":[["-GnJNv36wzQ","If You  Cut Everyone Off, Please Watch This","9:23"],["9NYglmqzslQ","People Who Stay Silent Instead of Arguing (Psychology Explains)","8:01"]],"st":[["Name your kind:","boundary, empty tank, freeze or fog? Different relationships may have different answers."],["If it's the fog,","contact a doctor or counselor this week. If you have any thoughts of not wanting to be alive, call or text 988 in the US, or your local crisis line, now."],["Open a crack:","send one low-stakes message to one reasonably safe person."],["Write both feelings:","one line of relief and one line of loss."],["Keep one door unlocked:","decide who that person is."]],"pf":"This week: one small, safe step.","pit":"When the urge to stay closed off feels heavy rather than peaceful, I'll send one small message to my one safe person.","big":"Cutting everyone off is usually the last move of someone who cared too long, not too little.","ex":"After a painful year, Jordan stopped answering almost everyone. Months later, the quiet feels heavy rather than peaceful.","tk":["Cutting everyone off is often the last move of someone who **cared too long**.","There are **four kinds** of withdrawal, and each needs something different.","**The fog** (withdrawal with heaviness) deserves the most attention and support.","Grieving relationships you ended is real: **disenfranchised grief**.","**Open a crack, let both feelings be true, and leave one door unlocked.**"],"q":[["What does the house-in-winter image describe?","A depleted person closing off \"rooms\" of connection to keep a small core going."],["Name the four kinds of withdrawal.","The boundary, the empty tank, the freeze and the fog."],["Why does the fog deserve the most attention?","Withdrawal there is a symptom of something heavier, and isolation and heaviness feed each other."],["What is disenfranchised grief?","Real grief that others don't recognize, like mourning a relationship you chose to end."],["What are the three steps back?","Open a crack, let both feelings be true, and leave one door unlocked."]],"pr":"This week: one small, safe step.","it":"When the urge to stay closed off feels heavy rather than peaceful, I'll send one small message to my one safe person."}]},{"id":"people-t08","ch":"people","num":8,"t":"How Situations Shape Us","ls":[{"id":"people-t08-l1","n":1,"t":"The Lucifer effect: how situations change people","dg":[["people-T08-four-switches.webp","Four rows pairing each switch with the move that flips it","Four switches and how to flip them"]],"ep":[["Mi5ktMrHvN0","Why Good People Turn Evil (The Lucifer Effect)","11:38"],["G7MFsZL5hCA","Psychology of Machiavellianism: Stop Trying to Be a Good Person","16:15"]],"st":[["Pick one group","you're part of: work, an online community, a team, a family chat."],["Check each switch:","where is there anonymity, blame-passing, labeling, or small steps getting normal?"],["Write your face test:","\"Would I do this if everyone I love could see me?\""],["Find one face","behind a label you've been using, and learn one thing about that person."],["Name your first-step line:","the small thing you won't do, decided in advance."]],"pf":"This week: read one situation you're in.","pit":"If someone says 'don't worry, it's on me,' I'll ask myself whether I'd still do it if it were on me.","big":"What separates a good person from someone who does something terrible is usually the situation, not their character.","ex":"Dana's team is under pressure to hit a quarterly target, and her manager suggests \"rounding up\" a few deals that haven't closed yet.","tk":["**Situations** can override character; it's the barrel, not just the apple.","Four switches: **anonymity, passing off the blame, dehumanization, the slow step**.","Feeling **sure you'd never** do it is the biggest blind spot.","Willpower isn't enough; **read the situation** and flip each switch.","**Heroes** are ordinary people who saw the situation clearly and acted early."],"q":[["What did the Stanford Prison Experiment do?","Randomly assigned college students to be guards or prisoners in a mock prison; it was stopped after six days as guards became abusive."],["What does \"the barrel, not the apple\" mean?","Bad behavior often comes from a bad situation more than from bad people."],["Name the four switches.","Anonymity, passing off the blame, turning people into things, and the slow step."],["Why is the slow step so dangerous?","Each small step makes the next feel normal, so there's never one obvious moment where you cross the line."],["What is the certainty trap?","Believing you could never do it makes you stop watching for the pull."],["How do you flip the slow step?","Guard the first step: say no at the first small lie or bent rule, while it's still easy."]],"pr":"This week: read one situation you're in.","it":"If someone says 'don't worry, it's on me,' I'll ask myself whether I'd still do it if it were on me."},{"id":"people-t08-l2","n":2,"t":"Quiet online: the cost of being seen","dg":[["people-T08-old-rule.webp","A flow from childhood lesson to adult signs to loss aversion and the spotlight effect to a free choice","From old rule to free choice"]],"ep":[["c6OhkYwrQE0","People Who Don't Post on Social Media Often Had This Childhood","11:31"],["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"]],"st":[["Write the rule","your silence follows, in one sentence (\"If I share, ___ will happen\")."],["Trace it back:","which house taught it?"],["Test it against now:","is the danger still there?"],["Choose on purpose:","keep your quiet, or share one small thing with a few trusted people."],["Notice your private channels","and keep them warm: one real message to someone close."]],"pf":"This week: find the rule, then choose.","pit":"When my thumb hovers over 'post' or 'send,' I'll ask whether I'm choosing silence or obeying an old rule.","big":"A quiet social-media account often traces back to a childhood lesson that being seen costs something.","ex":"Leo, 34, has had his social account for 12 years and posted five times.","tk":["Every child starts out **wanting to be seen**.","**Childhood emotional neglect** is a wound made of absences.","**Loss aversion** makes silence feel safer; the **spotlight effect** shows how little others are watching.","Quiet in public often comes with **openness in private**.","Caution that outlived its danger is a **habit you can keep or retire**; the choice is yours."],"q":[["What is childhood emotional neglect?","A wound made of absences: emotional needs that weren't met, even when nothing obviously bad happened."],["Why does a post carry emotional weight?","It's an expression sent out hoping to be met; if early expressions went unmet, sending things out can feel pointless or unsafe."],["What does loss aversion do here?","It makes the possible sting of a bad reaction feel bigger than the possible gain, so silence wins."],["What did the spotlight effect study find?","People guessed about half a room noticed their embarrassing T-shirt; only about a quarter did."],["What does the lesson recommend: post more or not?","Neither; the goal is for your quiet to be a choice, not an old rule."]],"pr":"This week: find the rule, then choose.","it":"When my thumb hovers over 'post' or 'send,' I'll ask whether I'm choosing silence or obeying an old rule."},{"id":"people-t08-l3","n":3,"t":"After too much: resilience and its costs","dg":[["people-T08-four-strengths.webp","Four cards for the strengths and their costs, with three ways to carry them beneath","Four strengths, their costs, and how to carry them"]],"ep":[["U05_nFL5xbA","Psychology of People Who Have Endured Too Much Trauma","13:57"],["TRd1kuUGazE","Psychology of Resilience: Build a Mind So Strong It Scares People","18:56"]],"st":[["Name your strengths:","which of the four fit you? Write one place each has helped someone."],["Name one cost","you'd like to ease, such as never being asked how you are."],["Tell one trusted person","one true thing about how you're doing."],["Try \"beside it\" once,","with a mild memory, only if it feels safe; stop if it becomes overwhelming. Don't work through traumatic memories alone; that's work to do with a trained therapist."],["Take one step toward support:","look up a trauma-informed therapist or talk to your doctor."]],"pf":"This week: gentle, safety-first steps.","pit":"When someone asks how I'm doing, I'll give one honest sentence instead of 'I'm fine.'","big":"People who have lived through a great deal often become the steadiest person in the room, and that steadiness was built, not given.","ex":"Rosa, 41, is the one her family calls in every crisis. After her father's long illness and her brother's addiction, she's \"fine,\" but she sleeps badly and can't remember the last time someone asked how she was.","tk":["**Resilience** is the most common response to severe adversity.","A mind that adapted to threat can find **calm times harsh**.","How **central** a trauma becomes to your story predicts how much it keeps hurting.","Four strengths, **steadiness, range, a pull toward others' pain, depth**, each with a cost.","Look at memories **from beside them**, let thinking **build** something, and **let someone carry you** too. Trauma-focused therapy can help."],"q":[["What did Bonanno find is the most common response to severe adversity?","Resilience: about two-thirds of people stay functional and recover."],["What does the dark-room image explain?","A mind that adapted to threat keeps its alarm on, so ordinary calm can feel harsh."],["What did Berntsen and Rubin find predicts ongoing distress?","How central the traumatic event becomes to a person's identity."],["What is post-traumatic growth?","Positive changes some people report after struggling with adversity, like a sharper sense of what matters and more honest relationships."],["What does \"beside it, not inside it\" mean?","Looking at a memory from a little distance, like a chapter in front of you, instead of reliving it."],["Who can help, and what should you do if you have thoughts of not wanting to live?","A doctor or therapist, including trauma-focused therapy; for those thoughts, contact a crisis line now (US: call or text 988) or emergency services."]],"pr":"This week: gentle, safety-first steps.","it":"When someone asks how I'm doing, I'll give one honest sentence instead of 'I'm fine.'"}]},{"id":"people-t09","ch":"people","num":9,"t":"Family Roles","ls":[{"id":"people-t09-l1","n":1,"t":"The disappointing child: living a life that's yours","dg":[["people-T09-two-rulers.webp","Two columns comparing living by someone else's ruler with living by your own","Their ruler or yours?"]],"ep":[["w1oPFUS1uMo","Psychology of the Disappointing Child","10:22"],["7cEPncxxa_c","The Psychology of the Black Sheep Child","15:27"]],"st":[["Make two lists:","goals you hold because you want them, and goals you hold because someone else wanted them."],["Write your definition","of a good life in three sentences."],["Take one step","on a goal from your own list."],["Notice the ghost child","when old guilt appears, and name it."],["Share one real interest","with family without defending it."]],"pf":"This week: write your own ruler.","pit":"When I feel the old 'you should have' guilt, I'll reread my three sentences.","big":"The child who couldn't get excited about the life planned for them often wasn't failing; they couldn't fake wanting something that wasn't theirs.","ex":"Marco's parents wanted him to be an engineer. He studied it for two years, felt flat the whole time, and switched to teaching music.","tk":["Goals that aren't yours **drain motivation**; self-chosen goals bring more well-being.","The \"ideal child\" was a **projection**, and the gap creates shame (**self-discrepancy**).","Conditional approval can tie worth to achievement (**contingent self-worth**).","Refusing to perform can build an **internal compass** and real self-knowledge.","Measure your life by **your own ruler**."],"q":[["What are self-concordant goals?","Goals that reflect your own interests and values rather than others' expectations."],["What is a self-discrepancy?","The gap between who you are and who you think you ought to be."],["What is contingent self-worth?","Self-worth that rises and falls with achievement or approval."],["What is an internal locus of control?","Making choices from your own compass rather than outside approval."],["What do studies find about self-chosen goals?","People who pursue goals they chose report higher well-being than those who reach goals chosen for them."]],"pr":"This week: write your own ruler.","it":"When I feel the old 'you should have' guilt, I'll reread my three sentences."},{"id":"people-t09-l2","n":2,"t":"The only child: an inner world and a single spotlight","dg":[["people-T09-only-child.webp","Two columns listing the gifts and the costs of growing up as an only child","Gifts and costs of being the only one"]],"ep":[["u-gSGlIXeW4","The Psychology of The Only Child","9:52"],["M_3qn3m8J6E","Psychology of the Self-Sufficient Introvert","7:11"]],"st":[["List what you're carrying alone","right now."],["Pick one small thing","someone else could help with, and ask."],["Notice the guilt","that comes with asking, and let it pass."],["Schedule rest","that you don't have to earn."],["Use your inner rehearsal","to prepare for one conversation, then stop rehearsing."]],"pf":"This week: let someone help.","pit":"When someone offers help, I'll say 'yes, thank you' to one specific thing instead of 'I'm fine.'","big":"Only children aren't more selfish or spoiled; they often grow up with a rich inner world, strong self-sufficiency, and the whole family's hopes resting on them.","ex":"Priya is an only child, a hospital pharmacist, and the person who handles everything herself.","tk":["Research finds only children **aren't more selfish or spoiled**.","An only child's **inner world** often becomes a way of thinking and deciding.","**Self-sufficiency** can turn into a wall against help.","Being **the only one** can mean carrying all of a family's hopes, with no backup.","The gifts: **observation, deep focus and a real interior life**."],"q":[["What has Toni Falbo's research found about only children?","They aren't more selfish or difficult, and score slightly higher on achievement and motivation."],["What is a paracosm?","A detailed imaginary world created in childhood."],["How does self-sufficiency become a cost?","It can turn into not asking for help and feeling guilty for needing anything."],["What does \"the single spotlight\" mean?","All of a family's hopes and expectations land on one child."],["Where does an only child's observation skill often come from?","Years of watching and listening at the edge of adult conversations."]],"pr":"This week: let someone help.","it":"When someone offers help, I'll say 'yes, thank you' to one specific thing instead of 'I'm fine.'"},{"id":"people-t09-l3","n":3,"t":"Cutting off family: the film nobody saw","dg":[["people-T09-last-frame.webp","A timeline of years of trying before the final cut-off, with the grief that follows","The last frame of a long film"]],"ep":[["w5rrurW8r0Y","Psychology of People Who Cut Off Their Family","8:20"],["9OGL4-7SpLs","The 6 Dangerous People Psychology Says You Must Avoid","15:24"]],"st":[["Write the film, not the frame:","a short timeline of what came before any distance in a family relationship."],["Answer the oldest voice:","write one sentence you'd say to your younger self."],["Mark grief days","(holidays, birthdays) and plan one kind thing for each."],["Find support:","a therapist, a support group, or one trusted friend."],["Notice who chose you","and invest in those relationships."]],"pf":"This month: understand your story at your own pace.","pit":"When a holiday brings a wave of grief, I'll name it as ambiguous loss and call a friend.","big":"When someone cuts off their family, others usually see only the last frame of a story that ran for decades.","ex":"Ana stopped speaking to her mother three years ago, after decades of criticism and a final blow-up at her wedding.","tk":["A cut-off is usually **the last frame** of a long story others didn't see.","Children turn blame **inward** because they need their caregivers to feel safe.","Estrangement brings **ambiguous loss**: grief for people still alive.","**Naming** the grief helps it stop ambushing you.","Decisions about contact are personal; a **therapist** can help, and **safety comes first**."],"q":[["Why do others often misjudge someone who cuts off family?","They see only the final moment, not the years of trying before it."],["Why do children blame themselves when parents don't love them well?","A child can't afford to see their caregivers as unsafe, so the blame turns inward."],["What is ambiguous loss?","Grief for someone who is physically present but relationally gone."],["What are people often grieving after estrangement?","The version of their family that should have existed."],["What should come first if a family relationship involves abuse?","Your safety."]],"pr":"This month: understand your story at your own pace.","it":"When a holiday brings a wave of grief, I'll name it as ambiguous loss and call a friend."},{"id":"people-t09-l4","n":4,"t":"The smart kid: when the label becomes a cage","dg":[["people-T09-smart-kid.webp","A four-step loop from being praised as smart to skills never getting built, with the exit described beneath","From cage to growth"]],"ep":[["pQ-cAH2D6VI","You Were The Smart Kid... So What Happened?","7:19"],["O-Wu5Whk8eI","Psychology of Self-Sabotage (And How to Hack Your Brain to Stop It)","14:51"]],"st":[["Notice the equation","when something is hard: \"effort means I'm not smart.\" Rewrite it."],["Find one missing skill","behind a recent struggle (planning, focus, persistence) and practice it."],["Start one beginner activity","and attend at least three times before judging it."],["Track effort weekly:","one thing you improved, not how fast you were."],["Take one hard task","at work without building an excuse first."]],"pf":"This month: practice struggling.","pit":"When I catch myself putting off something hard, I'll do the first 15 minutes today.","big":"Being labeled \"the smart kid\" can quietly teach you that effort means you're not smart, and that belief can stall you as an adult.","ex":"Daniel, 29, was the gifted kid who never studied. Now he's a junior analyst watching less \"brilliant\" coworkers get promoted.","tk":["Praise for being smart can teach a **fixed mindset**: effort feels like inadequacy.","**Self-handicapping** protects the label but stalls growth.","Effortless early success can leave **executive functions** undeveloped.","A **skill gap** isn't an identity flaw.","Rebuild by measuring **effort and improvement** and being **bad at something on purpose**."],"q":[["What's the difference between a fixed and a growth mindset?","A fixed mindset sees ability as innate; a growth mindset sees it as built through effort."],["What did praise for intelligence lead children to do?","Choose easier tasks and give up sooner than children praised for effort."],["What is self-handicapping?","Creating an obstacle in advance so failure can be blamed on it rather than on your ability."],["What are executive functions?","Mental skills like planning, focus, managing emotions and persisting through difficulty."],["Why be bad at something deliberately?","It teaches your brain that struggle isn't a verdict on your worth."]],"pr":"This month: practice struggling.","it":"When I catch myself putting off something hard, I'll do the first 15 minutes today."}]},{"id":"people-t10","ch":"people","num":10,"t":"Saying No, Saying Sorry","ls":[{"id":"people-t10-l1","n":1,"t":"Saying no: the yes that isn't kindness","dg":[["people-T10-yes-loop.webp","A cycle from request to alarm to yes to relief and back, with the two exits described beneath","The yes loop"]],"ep":[["H-rNHBo_uVk","The Psychology of People Who Can't Say No (It’s Not Kindness)","7:50"],["nG5YzT-ohTM","How to Deal with People Who Disrespect You (Without Confrontation)","15:27"]],"st":[["Notice your yeses:","each day, mark any yes you didn't mean."],["Use the delay","on every non-urgent request this week."],["Say three small no's","with a period, starting with the lowest-stakes requests."],["After each no,","write what you feared and what actually happened."],["Notice the relief","after a yes you didn't mean, and name it: \"That's the trap.\""]],"pf":"This week: three small no's.","pit":"When someone asks me for a favor, I'll say 'Let me check and get back to you' before I answer.","big":"Chronic yes-saying often isn't kindness; it's your nervous system treating a request like a social threat.","ex":"Ruth, an office manager, is asked for the third time this month to cover a colleague's Friday shift.","tk":["Your brain can treat a request like a **social threat**, and \"yes\" ends the alarm.","**Fawning** grows where approval felt conditional.","The **relief** after yes reinforces the habit.","People **overestimate** how badly a no will land.","Say no **with a period**, use **the delay**, and **practice on small requests**."],"q":[["What is fawning?","A threat response where you prioritize others' comfort to neutralize a perceived threat to your belonging."],["Why does the habit of saying yes keep getting stronger?","Each yes brings relief, which reinforces the idea that your discomfort is the price of approval."],["What do people get wrong when they imagine saying no?","They overestimate how negatively the other person will react."],["What does \"say no with a period\" mean?","Decline clearly without adding \"but\" and a long justification."],["What is the delay tool?","Saying \"Let me check and get back to you\" so you can decide calmly instead of in the alarm."]],"pr":"This week: three small no's.","it":"When someone asks me for a favor, I'll say 'Let me check and get back to you' before I answer."},{"id":"people-t10-l2","n":2,"t":"Saying sorry: the apology audit","dg":[["people-T10-sorry-buckets.webp","Three cards for the unnecessary apology types with replacements, and a fourth for the real apology formula","Where your sorries go"]],"ep":[["777BcXg0Goo","Psychology of People Who Can't Stop Apologizing (and How to Fix It)","7:19"],["ut6zfew6cnI","Psychology Of People Who Hate Themselves (But Kind To Others)","10:23"]],"st":[["Log every sorry","for seven days: the words, the feeling, and whether anyone was harmed."],["Sort them","into preemptive, reflex, hedge, sympathy, or real."],["Pick replacements","for your most common bucket and use them."],["Swap \"sorry for the wait\" for \"thanks for waiting\"","at least once."],["If you cause real harm,","use the four-step apology and stop talking."]],"pf":"This week: run the audit.","pit":"When I'm about to start a message with 'sorry,' I'll ask whether I caused harm; if not, I'll start with the request.","big":"Constant apologizing is a \"sorry tax\": you pay it out of your credibility and self-respect and get nothing back.","ex":"Leo, a junior analyst, starts most messages with \"Sorry to bother you.\"","tk":["A **real apology** repairs harm; the **sorry tax** buys insurance against possible annoyance.","Over-apologizing **devalues your apologies** and asks others to manage your anxiety.","**Sympathy apologies** are different from apologizing for taking up space.","Audit your sorries: **preemptive, reflex, hedge**.","A real apology: **name it, own the impact, fix it, stop talking**."],"q":[["What's the difference between a real apology and the sorry tax?","A real apology repairs harm you caused; the sorry tax apologizes for things that aren't wrong, as insurance."],["What are the three buckets of unnecessary apologies?","Preemptive, reflex and hedge."],["What did Person B say when arriving late, and why does it work?","\"Thanks for waiting. Let's get started.\" It acknowledges the moment without making it about their anxiety."],["What is the discomfort window?","A period of about three weeks when not apologizing feels rude, even though it isn't."],["What are the steps of a real apology?","Name what you did, acknowledge the impact, say what you'll do differently, and stop talking."]],"pr":"This week: run the audit.","it":"When I'm about to start a message with 'sorry,' I'll ask whether I caused harm; if not, I'll start with the request."},{"id":"people-t10-l3","n":3,"t":"Feeling unwanted, or just unknown","dg":[["people-T10-armor-machine.webp","Five protective habits feeding into a loop that produces rejection, with three principles shown as the way out","Armor that becomes a machine"]],"ep":[["RhbKdRXvIto","Psychology of People Who Feel Unwanted","15:18"],["zK4AWsYckzw","Psychology of People Who Are Friendly But Lonely","5:16"]],"st":[["Catch the feeling","once a day and rephrase it: \"I'm having the feeling that I'm unwanted.\" Then check what actually happened."],["Send one honest bid","to someone you've been waiting to hear from."],["Give one true answer","to \"How are you?\" with someone safe."],["Ask one person for a small favor.",""],["Notice which sign you use most","and write it down."]],"pf":"This week: one bid, one true answer.","pit":"When I catch myself waiting to see who reaches out, I'll send one message instead.","big":"Feeling unwanted isn't proof that you are, and being liked isn't the same as being known.","ex":"Dana is the friend everyone calls, and she hasn't been invited to anything in a month.","tk":["Self-esteem works like a **gauge of belonging**, and rejection activates **pain systems**.","**Rejection sensitivity** is learned, often where being wanted felt conditional.","The five protective habits **produce the rejection** they guard against.","**Being liked isn't being known**; closeness needs both people to share.","Treat the feeling as a **signal**, make **honest bids**, and let someone meet the **unperformed** you."],"q":[["What does sociometer theory say self-esteem measures?","How accepted you are by the people around you right now."],["What did Eisenberger's study find?","Being left out of a ball-tossing game activated a brain region also involved in physical pain."],["Why is a silent test built to fail?","Friends don't know there's a test, so their normal busyness reads as rejection."],["What's the difference between being liked and being known?","Liked means people enjoy your company; known means someone has seen the real you, including bad days, and stayed."],["What is an honest bid?","A direct, small reach toward someone, like inviting them to coffee, instead of waiting to see if they reach out."]],"pr":"This week: one bid, one true answer.","it":"When I catch myself waiting to see who reaches out, I'll send one message instead."}]},{"id":"people-t11","ch":"people","num":11,"t":"Difficult People","ls":[{"id":"people-t11-l1","n":1,"t":"Jealousy up close: when your win shrinks","dg":[["people-T11-moving-ruler.webp","Four cards for shrinking the win, rewriting the story, going quiet and talking in other rooms, each with a response","When you grow, the ruler moves"]],"ep":[["nFkL9E6AhsI","What Jealous People Do When They Can’t Compete With You","8:56"],["9OGL4-7SpLs","The 6 Dangerous People Psychology Says You Must Avoid","15:24"]],"st":[["List your celebrators:","two or three people who are reliably glad when good things happen to you."],["Share your next win with them first.",""],["Notice one shrinking move","(a \"must be nice,\" a luck story) and name it to yourself instead of arguing."],["Write down the facts","if you catch yourself auditing a past conversation."],["Keep one good thing","with the jealous person: an activity or topic where the relationship still works."]],"pf":"This month: protect your wins.","pit":"When someone answers my good news with 'must be nice,' I'll say 'thanks, it was a lot of work' once, and change the subject.","big":"When someone close can't be happy for you, it's usually not cruelty; it's someone trying to feel okay next to you.","ex":"Grace finally passed her professional licensing exam after three tries. She tells her older sister, Lauren, first.","tk":["We measure ourselves against the people **closest** to us (**social comparison**).","Jealousy shows up as **shrinking** your win, **rewriting** the story, **going quiet** and **talking in other rooms**.","Luck is a **safe story**; you can't argue someone out of it.","When someone pulls away, **stop auditing yourself** for a crime that didn't happen.","You can never fix this by **being smaller**; bring your wins to people who celebrate."],"q":[["What does social comparison theory say?","We judge how we're doing by comparing ourselves with the people closest to us, not against a fixed standard."],["Why do jealous people shrink your win?","A smaller win means a smaller gap between you, which lets them feel okay."],["Why is \"you got lucky\" such a common story?","Luck asks nothing of them; effort would mean they could have done it too."],["What's the trap when someone close goes quiet after your success?","You start auditing yourself for something you didn't do, and soften yourself in advance."],["What does the video say you can never do to fix this?","Make yourself smaller."]],"pr":"This month: protect your wins.","it":"When someone answers my good news with 'must be nice,' I'll say 'thanks, it was a lot of work' once, and change the subject."},{"id":"people-t11-l2","n":2,"t":"Seven moves for toxic people","dg":[["people-T11-seven-moves.webp","Seven cards grouped under the moment, the meaning and the relationship","Seven moves, one idea: change what you feed them"]],"ep":[["6VkB6rEJ_Zo","7 Ways Smart People Deal With Toxic People","14:11"],["5FTyEGYntYw","How To Never Get Angry Or Bothered By Anyone","16:49"]],"st":[["Name your draining people","and which ones you can't avoid."],["Pick two moves","that fit them (for example, pause plus control the dose)."],["Write your boundary line","and the action that follows it."],["After each contact,","ask \"whose feeling is this?\" and reset with your body."],["If anything crosses into threats or abuse,","start writing down dates and details and talk to someone you trust."]],"pf":"This month: pick two moves.","pit":"If someone makes a jab at me in a meeting, then I'll pause for three seconds and answer only the facts.","big":"Toxic people win because your reaction is the prize; the skill is to stop handing it over without becoming cold.","ex":"Marco's coworker Dana makes a jab in nearly every team meeting, and his mother calls weekly with guilt trips.","tk":["Toxic people feed on **your reaction**; moods spread by **emotional contagion**.","Rudeness **hijacks your thinking**, and the amygdala's alarm takes your calm brain offline.","**Pause**, go **gray rock** with people you can't avoid, and **translate** the attack.","Boundaries are **actions**, not speeches; **control the dose**.","Gray rock is **not** a way to live with abuse: get distance, support and outside help."],"q":[["What is emotional contagion?","Catching another person's emotion through automatic mimicry of their face, voice and posture."],["What is the gray rock method, and when shouldn't you rely on it?","Becoming flat and uninteresting so a drama-seeker loses their reward; it's not a way to live inside an abusive relationship."],["Why does pausing work?","The stress surge fades within seconds if you don't feed it, giving control back to your thinking brain."],["What's the difference between a boundary and a request?","A request asks someone else to change; a boundary is what you will do."],["What is situation selection?","Managing emotions by choosing which situations, and how much of them, you walk into."]],"pr":"This month: pick two moves.","it":"If someone makes a jab at me in a meeting, then I'll pause for three seconds and answer only the facts."},{"id":"people-t11-l3","n":3,"t":"Emotional immaturity: the empty driver's seat","dg":[["people-T11-driver-seat.webp","A card for the healthy adult in the driver's seat above four cards for the child modes in the back seat","Who's driving?"]],"ep":[["jJ7zm9O7Ugk","Psychology of People Who Never Mature","14:41"],["e_1_kdjudqw","The Depressing Psychology of the Man Child","13:05"]],"st":[["Pick your trigger:","the small thing that most often sets off a big reaction."],["Choose your gap tool:","a walk, cold water, a slow breath, a 10-minute timer."],["Use it ten times","this month and tally each rep."],["Name the mode","out loud or on paper each time."],["Write your reparenting line:","the steady sentence you needed to hear."]],"pf":"This month: ten reps of the gap.","pit":"When I feel the heat rise over something small, I'll say 'this is the angry part of me' and wait ten minutes before answering.","big":"Some adults look fully grown but are run by a much younger part of themselves whenever life asks for patience or a mistake to be owned.","ex":"Ryan, 38, a project manager, sends his team a furious message when a client moves a deadline.","tk":["Having the brain **hardware** for self-control isn't the same as having the **skill**.","In schema therapy, the **healthy adult** should run the household of **child modes**.","**Emotion-dismissing** or over-rescuing parenting skips the practice the skill needs.","Four signs: **huge reactions, self-centered conversations, feelings as facts, blame that never lands**.","Build it by **widening the gap**, **naming the mode** and **limited reparenting**."],"q":[["Why isn't brain maturity in the mid-twenties enough for self-control?","It provides the hardware, but self-regulation is a skill built through practice."],["What is the healthy adult mode in schema therapy?","The part that calms the vulnerable child, sets limits on the angry and impulsive parts, and does adult work."],["What's the difference between an emotion coach and an emotion dismisser?","Coaches get curious about a child's feelings and help work through them; dismissers shut them down."],["What is affective realism?","Treating a feeling as proof of what's true instead of as one piece of information."],["What are the three ways to build the missing skill?","Widen the gap between feeling and reaction, name the mode, and give yourself the steady words you didn't get (limited reparenting)."]],"pr":"This month: ten reps of the gap.","it":"When I feel the heat rise over something small, I'll say 'this is the angry part of me' and wait ten minutes before answering."},{"id":"people-t11-l4","n":4,"t":"The friend zone: warmth that feels like a choice","dg":[["people-T11-old-new-rules.webp","Two columns comparing old rules like earn your place with new rules like be known earlier","Old rules and new rules"]],"ep":[["a-3QOVdAdV0","Psychology of People Who Always End Up in The Friend Zone","6:06"],["V4npQ93EEv0","Psychology of Seduction: Be So Desirable People Crave You","15:23"]],"st":[["Share one honest thing","about yourself earlier in a conversation than you usually would."],["Leave one gap:","don't offer help someone hasn't asked for, once this week."],["Ask for one small thing","you want."],["Notice the pull:","when you feel drawn to someone, ask whether it's interest or uncertainty."],["Write down what happened","after each risk."]],"pf":"This month: three small risks.","pit":"When I notice I'm about to do a favor no one asked for, I'll pause and ask myself what I actually want instead.","big":"People who keep ending up \"just a friend\" usually aren't too nice; many learned early that love has to be earned, so they make themselves essential.","ex":"Theo, 29, is the friend everyone calls to help them move, and he's been quietly interested in his friend Nina for a year.","tk":["The friend zone is **not** about being too nice.","Many people in the pattern learned that **love is earned**, so they became **essential**.","Romantic interest needs **room to move toward you**: warmth that feels like a choice.","**Uncertainty** can feel like chemistry when it matches an old map.","Change the rules by being **known earlier** and **asking earlier**."],"q":[["Why does the video reject \"too nice\" as the explanation?","The pattern comes from learning that love has to be earned, not from kindness itself."],["What strategy do people in this pattern often learn?","Becoming essential: warm, helpful and anticipating needs so they can't be left."],["Why can giving everything immediately work against romance?","It leaves nothing to discover and no room for the other person to move toward you."],["Why might someone be drawn to people who are a little unavailable?","Their nervous system learned to recognize uncertainty as love, so it feels like intensity."],["How do the old rules change?","Through small, repeated experiences of being known and asking earlier than feels safe."]],"pr":"This month: three small risks.","it":"When I notice I'm about to do a favor no one asked for, I'll pause and ask myself what I actually want instead."}]},{"id":"life-t01","ch":"life","num":1,"t":"Your Own Path","ls":[{"id":"life-t01-l1","n":1,"t":"Solitude by choice","dg":[["life-T01-solitude-isolation.webp","Two columns comparing chosen solitude with unwanted isolation","Solitude that feeds and isolation that drains"]],"ep":[["POqCOvbJFbE","Why Some People Are Meant to Walk Alone (Psychology Explains)","11:42"],["CwhUi9A8LeE","Psychology of Rest: Recover So Well It Makes You Dangerous","14:55"]],"st":[["Schedule one block","of chosen solitude (at least an hour)."],["Rate it afterward:","did it feed you or drain you?"],["Name your close few:","two or three people you want to stay strongly connected to."],["Reach out to one","of them this week."],["Watch for warning signs:","avoiding everyone, feeling heavy, losing interest."]],"pf":"This week: design solitude that feeds you.","pit":"If I notice I've gone two weeks without a real conversation with a friend, I'll call one that day.","big":"For some people, time alone isn't a wound; it's how they're built.","ex":"Ruth, a nurse, spends most Saturdays alone hiking and reading, and her sister keeps telling her she should \"get out more.\"","tk":["**Unsociability isn't shyness**: it's a fear-free preference for time alone.","Brief solitude **calms** the body and mind.","**Why** you seek solitude matters more than how much.","Comfort alone grows from **secure connection**.","**Solitude feeds; loneliness drains.** Know which one you're in."],"q":[["What's the difference between shyness and unsociability?","Shyness is wanting connection but fearing it; unsociability is preferring solitude without fear."],["What is aloneliness?","The distress of not getting enough time alone."],["What is the deactivation effect?","Time alone settles high-energy feelings and raises calm."],["What did Winnicott say the capacity to be alone grows from?","Being alone in the presence of someone, feeling securely connected."],["What's the test for healthy solitude?","Whether your time alone feeds you or drains you."]],"pr":"This week: design solitude that feeds you.","it":"If I notice I've gone two weeks without a real conversation with a friend, I'll call one that day."},{"id":"life-t01-l2","n":2,"t":"Complexity: why no label fits","dg":[["life-T01-rarity-math.webp","Four steps showing 1 in 7, 1 in 44, 1 in 296 and 1 in 1,975","How rarity multiplies"]],"ep":[["bqtrEOy8bVE","8 Signs You Have an Extremely Rare Personality","14:30"],["YteFqslM4HE","Psychology of Social Intelligence: How to Read Anyone Instantly","15:19"]],"st":[["List three pairs of opposites","that are both true of you."],["Write an if-then","for each pair: when is each side strongest?"],["Plan around one pattern:","like quiet time after social time."],["Notice one label","you or others use for you, and what it misses."],["Share one if-then","with someone close, so they know you better."]],"pf":"This week: map your combinations.","pit":"When I've had a big social day, I'll schedule a quiet evening without feeling guilty about it.","big":"A rare personality usually isn't one exotic trait but a rare combination of ordinary ones, especially opposites held at full strength.","ex":"At work, Ahmed is known as the outgoing presenter; at home, his family knows him as someone who disappears into books for hours.","tk":["Creative people often combine **opposite traits**, which Csikszentmihalyi called complexity.","Combinations of ordinary traits are rare, but **almost everyone** has a rare combination.","**Everyone varies across situations**; that's normal, not a contradiction.","Specific confidence and **global self-esteem** are different things.","Describe yourself by **if-then patterns**, not single labels."],"q":[["What did Csikszentmihalyi find in exceptional creators?","They combined opposite traits, like playfulness and discipline, which he called complexity."],["Why are combinations rare, and what's the catch?","Being high on several traits at once multiplies rarity, but that means almost everyone is rare on some combination."],["What did Asch's studies show about independence?","About a quarter of people never went along with the group's wrong answer."],["Why do single labels miss people?","Labels are built from single traits, while people are combinations who vary across situations."],["What's a better way to describe yourself than a type?","By if-then patterns: how you tend to act in particular kinds of situations."]],"pr":"This week: map your combinations.","it":"When I've had a big social day, I'll schedule a quiet evening without feeling guilty about it."},{"id":"life-t01-l3","n":3,"t":"Time, memory and spending life wisely","dg":[["life-T01-two-clocks.webp","Two columns comparing how situations feel while living them and when looking back","Two clocks"],["life-T01-cold-water.webp","Bar chart: about 31% chose to repeat the short trial, about 69% the long trial","The cold-water choice"]],"ep":[["Cj8g1RrJ_to","Psychology of Life (And How To Spend It Wisely)","16:05"],["CwhUi9A8LeE","Psychology of Rest: Recover So Well It Makes You Dangerous","14:55"]],"st":[["Plan one first","this week: a new place, activity or conversation."],["Count visits:","list five people who matter most and estimate how many more times you'll see each at your current pace."],["Book one visit","now."],["Plan a peak and an ending","for that visit."],["Catch one absent hour:","at one meal, put the phone away and be fully there."]],"pf":"This week: add one first and count your visits.","pit":"On Sunday evenings, I'll pick one first for the coming week and put it on my calendar.","big":"Your life isn't speeding up; your memory is keeping less of it.","ex":"Greg realizes the last three years feel like one long blur of work.","tk":["**Remembered time** depends on how many distinct moments your memory keeps.","**Routine shrinks** the time you remember.","Minds wander nearly **half** the time, and wandering moments are less happy.","When time feels limited, people **prioritize close relationships**; you can choose that now.","Memory leans on **peaks and endings**."],"q":[["What's the difference between the experiencing self and the remembering self?","The experiencing self lives each moment; the remembering self looks back, tells the story and makes most future choices."],["What is the holiday paradox?","A new trip flies by but feels huge looking back; an ordinary week drags but vanishes from memory."],["What are the three traps?","The repeat, the absent hour and the open horizon."],["What is the peak-end rule?","Memory judges an experience mostly by its most intense moment and its ending."],["What does Carstensen's research show about time horizons?","When time feels limited, people focus on the relationships that matter most."]],"pr":"This week: add one first and count your visits.","it":"On Sunday evenings, I'll pick one first for the coming week and put it on my calendar."}]},{"id":"life-t02","ch":"life","num":2,"t":"Who You Really Are","ls":[{"id":"life-t02-l1","n":1,"t":"Identity: the self you stand on","dg":[["life-T02-swap-test.webp","A list of traits sorted into those that survive the swap (taste, job, city, style) and the core that doesn't (honesty, kindness, loyalty, fairness)","The swap test"]],"ep":[["Bu0CwZ4WV-s","Psychology of Identity: How to Find Your True Self","16:09"],["bqtrEOy8bVE","8 Signs You Have an Extremely Rare Personality","14:30"]],"st":[["Run the swap test","on paper with at least ten items."],["Circle your core:","the two or three things that don't survive the swap."],["Pick one room","where you usually let those values slide, and hold them there once."],["Test one \"that's not me\"","by doing it on purpose, once."],["Write what happened,","as a fair observer would."]],"pf":"This week: find your core and test one label.","pit":"When I hear myself say 'that's just who I am,' I'll ask whether it's a value or just an impulse.","big":"Your true self isn't hidden underneath everything; it shows in what you stand for and what you do when it costs you.","ex":"Nora, 29, has taken every personality test and still feels like she doesn't know who she is.","tk":["People see **moral character** as the core of who someone is.","The feeling of \"the real me\" tracks your **values**, not just your habits.","The true self isn't in your **impulses**, your **room versions** or your **labels**.","You learn who you are by **watching what you do**.","**Swap test, fixed values, act first.**"],"q":[["What did Strohminger and Nichols find people see as most essential to identity?","Moral traits like honesty, kindness, loyalty and fairness, more than memory or personality."],["What made families feel a loved one with dementia was \"gone\"?","Changes in moral character, not memory loss."],["What's wrong with the idea that the unfiltered you is the real you?","For themselves, people see self-control in line with their values as more authentic than impulse."],["What is the Barnum effect?","People rate vague, general descriptions as highly accurate about themselves."],["What is the swap test?","Imagining changing one thing at a time and asking whether you'd still be you; what fails the test is your core."],["What does \"fix the values, let the volume move\" mean?","Your style can change between rooms, but a few core values hold in every one."]],"pr":"This week: find your core and test one label.","it":"When I hear myself say 'that's just who I am,' I'll ask whether it's a value or just an impulse."},{"id":"life-t02-l2","n":2,"t":"The shadow: what you buried","dg":[["life-T02-buried-traits.webp","Four rows pairing each buried trait with how it leaks and the job it can do","Four buried traits, and the job each can do"]],"ep":[["pzfSOWSHcVE","Psychology of The Shadow: Your Dark Side Is The Key To Your Success","13:37"],["G7MFsZL5hCA","Psychology of Machiavellianism: Stop Trying to Be a Good Person","16:15"]],"st":[["Make your irritation list:","three people who annoy you out of all proportion, and the trait each shows openly."],["Pick the buried trait","that shows up most."],["Do one small rep:","\"That doesn't work for me,\" with no explanation, or name your price and stop talking."],["Write a job description","for that trait: what it's for and where it stops."],["Notice the leaks:","sarcasm, \"forgetting,\" coldness. Each is a trait asking for a job."]],"pf":"This week: one map, one rep, one job description.","pit":"When someone asks for a favor that costs my protected time, I'll say, 'That doesn't work for me,' and stop.","big":"Your \"shadow\" isn't the evil part of you; it's everything that didn't fit the self-image you built.","ex":"Felix is \"the easygoing one\" at work and at home. He's also exhausted and quietly resentful.","tk":["The **shadow** is whatever didn't fit the self-image you built.","It's built by **reward**: applauded traits get trained; unallowed ones leak sideways.","Four commonly buried traits: **displeasure, coming first, envy, disappointing others**.","**Overcontrol** and **suppression** backfire.","Read **irritation** as a map, aim for the **middle**, give each trait a **job**."],"q":[["What is Jung's shadow?","Everything about you that didn't fit the self-image you built, not just the \"evil\" parts."],["How does the shadow get built, according to the video?","By reward: the traits that got applause got trained, and the ones that got silence were shelved."],["What does envy tell you?","It points at something you want but haven't allowed yourself to say out loud."],["What did Ames and Flynn find about assertiveness?","Too much damages relationships, but too little makes people just as ineffective."],["How do you use irritation as a map?","Notice people who irritate you out of all proportion; they often show openly what you've forbidden yourself."],["What does it mean to give a trait a job description?","Naming what the trait is for and where it stops, so it works for you instead of leaking out."]],"pr":"This week: one map, one rep, one job description.","it":"When someone asks for a favor that costs my protected time, I'll say, 'That doesn't work for me,' and stop."},{"id":"life-t02-l3","n":3,"t":"The black sheep: the assigned problem","dg":[["life-T02-family-mobile.webp","A crib mobile with several straight pieces and one bent piece labeled the identified patient, with the hidden strain shown above","The bent piece"]],"ep":[["7cEPncxxa_c","The Psychology of the Black Sheep Child","15:27"],["qIJ2943Bzko","10 Signs You Have Survivor's Intelligence (The Rarest Kind of Smart)","15:45"]],"st":[["Check the five signs","and write an example of each that fits you."],["Write your own record","of one key event, including what came before your reaction."],["Plan one calmer response","for the next time you're provoked, like stepping outside."],["Share one win","with someone who will celebrate it."],["Name the guilt:","before your next family visit, write what you think you owe. Is it real?"],["Consider support:","look up a therapist who works with family systems."]],"pf":"This month: understand the role, then set it down a little.","pit":"When I feel the old role closing in at a family event, I'll step outside for five minutes before I respond.","big":"The \"black sheep\" of a family is usually not the problem but the assigned problem: the person a strained family bends so everyone else can stay straight.","ex":"Isaac, 34, is \"the difficult one\" in his family.","tk":["Groups judge their **own** rule-breakers more harshly than outsiders (the **black sheep effect**).","The **identified patient** expresses a family's hidden problems rather than causing them.","Blaming one person keeps the system **stable** and lowers everyone else's anxiety.","Five signs: **blamed for reactions, rewritten memories, archived mistakes, guilt, being a guest**.","The black sheep is often the one who **breaks the cycle**; family-systems therapy can help."],"q":[["What is the black sheep effect?","Groups judge their own members who break the rules more harshly than outsiders who do the same."],["What is an identified patient?","The family member blamed as the source of problems, who usually expresses the family's hidden strain rather than causing it."],["What does the crib mobile image explain?","A strained family keeps its balance by bending one piece, so everyone else can hang straight."],["Which children tend to get the black sheep role?","The most different, sensitive or honest child, or one who reminds a parent of something painful."],["What did Virginia Satir notice about the \"problem\" family member?","They were often the most honest person in the system."],["What is Girard's scapegoat mechanism?","A group discharges tension it can't resolve by uniting against one member."]],"pr":"This month: understand the role, then set it down a little.","it":"When I feel the old role closing in at a family event, I'll step outside for five minutes before I respond."}]},{"id":"life-t03","ch":"life","num":3,"t":"Meaning and Pleasure","ls":[{"id":"life-t03-l1","n":1,"t":"Meaning: build it, don't hunt it","dg":[["life-T03-three-meanings.webp","Three columns for coherence, purpose and significance, each with its question, what it feels like when missing, and a step that helps","Three parts of meaning"]],"ep":[["-SHqEZVQau0","Psychology of Meaning: How To Find Your Life's True Purpose","18:02"],["Cj8g1RrJ_to","Psychology of Life (And How To Spend It Wisely)","16:05"]],"st":[["Rate each part","(coherence, purpose, significance) from 1 to 5. Which is lowest?"],["Make your last two years legible:","write the sequence on one page and circle what repeats."],["Craft one thing","at work or home: one task, relationship or way of seeing it."],["Help one specific person","this week with no expectation of thanks."],["Commit to one interest","for three months, and expect the early stretch to feel clumsy."]],"pf":"This month: diagnose, then build.","pit":"When I catch myself searching for 'my purpose' online, I'll spend that time on the interest I committed to instead.","big":"Meaning isn't a hidden object you find by searching harder; it's built, and it tends to arrive while you're absorbed in something beyond yourself.","ex":"Nora, 31, has spent three years reading about finding her purpose, and feels further from it.","tk":["Searching hard for meaning often travels with **having less** of it.","Meaning **ensues**; aiming straight at it backfires, like trying to sleep.","Meaning has three parts: **coherence, purpose and significance**. Find which one is missing.","Interests are **developed**, not discovered.","**Craft** the work you have, **help** someone specific, and **read** your last two years."],"q":[["What are the two scales in Steger's meaning questionnaire?","Presence of meaning and search for meaning."],["What is hyper-intention?","Trying so hard for an outcome that the trying itself becomes the obstacle."],["What are the three parts of meaning?","Coherence (does life make sense?), purpose (where am I going?) and significance (does my existence matter?)."],["What happens to people who believe interests are fixed and found?","They're less open to new interests and drop them faster when things get hard."],["What is job crafting?","Reshaping your tasks, relationships and how you see your work, from the inside."],["What is dereflection?","Deliberately moving attention off yourself and onto something beyond you."]],"pr":"This month: diagnose, then build.","it":"When I catch myself searching for 'my purpose' online, I'll spend that time on the interest I committed to instead."},{"id":"life-t03-l2","n":2,"t":"Pleasure: get the supervisor out of the room","dg":[["life-T03-supervisor.webp","Three rows pairing the check-in, the big night and the party of one with grade it tomorrow, plan the day and bring someone in","Three traps and the way out of each"]],"ep":[["3d9slYogThI","Psychology of Hedonism: How the Pursuit of Pleasure Is Destroying You","15:41"],["IAWxQAu2Pfw","Psychology of Dopamine (And How To Quickly Escape A Dopamine Hole)","14:49"]],"st":[["Schedule three things","you enjoy this week, and don't set expectations for how they'll feel."],["During each,","when the grading question appears, return to one sensory detail."],["Review the next day:","what did you enjoy?"],["Invite one person","into something you usually do alone."],["For one upcoming event,","lower the announcement: call it \"a nice dinner,\" not \"the best night ever.\""]],"pf":"This week: keep the pleasures, fire the supervisor.","pit":"When I catch myself asking 'Is this as good as it should be?', I'll name one thing I can taste, hear or see.","big":"Chasing pleasure often drains it, not because you have too much pleasure but because part of you keeps grading every good moment.","ex":"Sam has been looking forward to a long weekend at the lake all year.","tk":["**Valuing happiness** too much can make you less happy, especially when life is going well.","**Checking your enjoyment** lowers it; the measurer and the measured are the same.","Three traps: **the check-in, the big night and the party of one**.","**Keep the wanting; drop the grading.**","**Plan the day, grade it tomorrow, and bring someone into it.**"],"q":[["What is the paradox of hedonism?","When the drive for your own pleasure runs your life, it tends to defeat its own aim."],["What did Mauss find when people were told how important happiness is?","They felt less happy after a joyful film clip, because they were disappointed in their own reaction."],["What happened to people who planned the biggest New Year's Eve 1999 celebrations?","They were the most disappointed."],["What is prioritizing positivity?","Building your days around things that tend to make you feel good, then letting the feelings arrive on their own."],["What did the shared chocolate study show?","Tasting chocolate at the same time as a stranger made it taste better; sharing amplifies experiences."]],"pr":"This week: keep the pleasures, fire the supervisor.","it":"When I catch myself asking 'Is this as good as it should be?', I'll name one thing I can taste, hear or see."}]},{"id":"life-t04","ch":"life","num":4,"t":"Comfort, Solitude and Repeats","ls":[{"id":"life-t04-l1","n":1,"t":"JOMO: missing out on purpose","dg":[["life-T04-open-menu.webp","Two columns pairing the everyone, the maybe and the borrowed hour with closing the menu, using names, and pointing each no at a yes","Close the menu"]],"ep":[["s9HFeU37CK8","The Psychology of JOMO (Joy of Missing Out)","15:47"],["1dzUVXPj4yE","The Psychology of Not Giving A F*ck","15:44"]],"st":[["For each plan this week,","decide by a set time instead of saying \"maybe.\""],["Send a clear closing message","to the options you're not taking."],["Phone in your bag","for one evening out."],["When you think \"everyone,\"","write down the actual names."],["Write the yes","behind each no."]],"pf":"This week: close three menus.","pit":"When I get an invitation I'm unsure about, I'll answer yes or no by a set time instead of saying maybe.","big":"You will always miss out on almost everything; the only thing you can change is how it feels.","ex":"Leah gets three Friday invitations: a coworker's birthday at a bar, a friend's movie night, and dinner with her sister.","tk":["You'll always miss out on almost everything; **JOMO is how you hold your choice**.","FOMO shows up even during **enjoyable** activities, and often signals **unmet needs**.","Three illusions: **the everyone, the maybe, the borrowed hour**.","**Final choices** satisfy more than reversible ones.","**Close the menu, use names, and point every no at a yes.**"],"q":[["What did the week-long student study find about FOMO?","It wasn't tied to one personality type, and people felt it even during enjoyable activities."],["What needs tend to be unmet in people with high FOMO?","Feeling that you choose your own life, that you're good at something, and that you're close to people."],["Why do people think \"everyone\" is out?","They compare themselves to the most social people, so \"everyone\" is a collage of the most social moments."],["What happened to students who could change their photo choice later?","They liked the photo they kept less than students whose choice was final."],["What is choice closure?","A small act that signals a decision is done, like closing the menu, which raises satisfaction with the choice."],["What is \"FOMO in pajamas\"?","Skipping something out of fear and then scrolling photos of it all night."]],"pr":"This week: close three menus.","it":"When I get an invitation I'm unsure about, I'll answer yes or no by a set time instead of saying maybe."},{"id":"life-t04-l2","n":2,"t":"Loving solitude: a skill and a choice","dg":[["life-T04-solitude-skill.webp","Three steps from noticing the need, to practicing quiet, to choosing connection on purpose","Solitude as a skill"]],"ep":[["ccu7c-3yQOk","Psychology of People Who Love Being Alone","9:39"],["POqCOvbJFbE","Why Some People Are Meant to Walk Alone (Psychology Explains)","11:42"]],"st":[["Schedule two solitude blocks","of at least 30 minutes."],["Leave the phone out of one of them.","Notice the urge to fill the silence, and let it pass."],["Rate each block:","fed or drained?"],["Choose one person deliberately","this week and give them your full attention."],["Prepare a kind, simple line","for when someone worries about you being alone."]],"pf":"This week: build the skill on purpose.","pit":"When I feel the urge to fill a quiet moment with my phone, I'll wait two minutes first.","big":"Loving time alone isn't a flaw; it's a real need and a skill that often goes with deeper relationships.","ex":"Sam, a nurse, eats lunch alone in his car most days, reading.","tk":["Too little time alone causes real distress (**aloneliness**).","Quiet time gives the brain room for **emotional and personal work**.","**Autonomy**, not introversion, predicts wanting solitude.","The **capacity to be alone** is a skill you build.","People comfortable alone often **choose relationships more deliberately**."],"q":[["What is aloneliness?","Distress from not getting enough time alone."],["What does the brain's default mode network do during quiet reflection?","It processes emotions, consolidates memories, rehearses social situations, generates ideas and builds your sense of self."],["What predicts wanting solitude better than introversion?","Autonomy: the need to direct your own time and attention."],["What did Esther Buchholz say about solitude?","It's an active capacity, a skill built over time."],["Why do people give a pitying look to someone eating alone?","Old wiring from when being alone, away from the group, was genuinely dangerous."]],"pr":"This week: build the skill on purpose.","it":"When I feel the urge to fill a quiet moment with my phone, I'll wait two minutes first."},{"id":"life-t04-l3","n":3,"t":"Repeats: the comfort of the familiar","dg":[["life-T04-process-or-avoid.webp","Two columns comparing regulation (coming home, settled, processing) with rumination (circling, can't stop, avoiding)","Process or avoid?"]],"ep":[["bObUaZ_gk3c","The Psychology of People Who Listen to the Same Song on Repeat","6:21"],["k7BoCMcuR9s","Psychology of People Who Rewatch the Same Movies and Shows","7:17"]],"st":[["Name your comforts:","list your go-to songs and shows and the feeling each gives you."],["Before pressing play,","name the feeling you want in one word."],["After a repeat session,","notice: more settled, or more stuck?"],["Ask the check-in question","whenever you lose count of replays."],["Notice one new detail","in something you've seen or heard many times."]],"pf":"This week: use repeats on purpose.","pit":"When I've played the same song three times in a row, I'll ask whether I'm processing or avoiding.","big":"Replaying the same song or rewatching the same show isn't boring or lazy; it's often a way of regulating your emotions and knowing what you need.","ex":"After her divorce, Mira watches the same comedy series every night and plays one song on her commute, again and again.","tk":["Familiar media comforts the brain through **predictability**.","Repeats can be **anchors**, **rituals** and **nostalgia on your terms**.","Each return can reveal something **new**, because you've changed.","Rewatchers often **know exactly what they need**.","Ask: **process or avoid?** Use repeats as a tool, not a cage."],"q":[["Why can the 20th listen feel better than the first?","The brain rewards accurate predictions, releasing dopamine in anticipation of moments you know are coming."],["What is predictive comfort?","The relief of knowing what comes next, so the brain can stop bracing for surprises."],["What is a transitional object?","Something outside you that you've made emotionally safe, like a child's blanket."],["Wh
