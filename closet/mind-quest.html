mselves, and the split often began as a strategy for staying safe.","ex":"Maria, a teacher, is the person everyone calls in a crisis. When she forgets to submit grades on time, she calls herself \"useless\" for days.","tk":["Many people are **more compassionate to others** than to themselves.","The pattern often starts as a **strategy for staying safe**.","Praise can feel wrong when it doesn't **match your self-view**.","Self-compassion **reduces self-criticism** and increases motivation to improve.","Use the **friend test** and **distanced self-talk**."],"q":[["What's the double standard this lesson describes?","Offering kindness to others for mistakes you harshly criticize in yourself."],["What tension does Gabor Maté describe?","Between authenticity (being yourself) and attachment (staying connected)."],["Why can compliments feel wrong?","People trust feedback that matches their existing self-view, and praise doesn't match a harsh one."],["Does self-compassion make people complacent?","No; self-compassionate people studied longer for a retest and were more motivated to fix mistakes."],["What is the friend test?","Write what you'd say to a friend in your situation and read it as if addressed to you."]],"pr":"This week: practice the friend test daily.","it":"When I hear myself say 'I'm so stupid,' I'll ask, 'What would I tell a friend right now?'"}]},{"id":"steady-t04","ch":"steady","num":4,"t":"Toughness for Ordinary Days","ls":[{"id":"steady-t04-l1","n":1,"t":"A sturdy mind: evidence over belief","dg":[["steady-T04-three-jobs.webp","Three columns listing the ten habits under evidence, predictions and load","Ten habits, three jobs"]],"ep":[["zDWRvVHLnos","10 Habits That Will Give You a Bulletproof Mindset","13:53"],["TRd1kuUGazE","Psychology of Resilience: Build a Mind So Strong It Scares People","18:56"]],"st":[["Start a receipts list","with five hard things you've gotten through."],["Take one smallest real rep","on something you're avoiding."],["Shrink one promise","to a size you'll definitely keep, and keep it."],["Log three worries","as predictions, then check them at week's end."],["Practice fact before meaning","once a day."]],"pf":"This week: start your file.","pit":"When I feel confidence slipping, I'll read three lines from my receipts list.","big":"Confidence under pressure is a verdict built from evidence, not a belief you can install.","ex":"Tom has a big client presentation next week and is sure it will go badly.","tk":["Confidence is **built from evidence**, not installed by belief.","The strongest source of confidence is **having done it**.","Most worries don't come true; **logging and checking** them shows you.","Seeing stress as **enhancing** goes with healthier responses.","**Spread the load**: name facts before meanings, and keep several pillars."],"q":[["What are Bandura's four sources of self-efficacy?","Mastery experience, seeing similar people succeed, credible encouragement, and reading your body and mood."],["Which source is strongest?","Mastery experience: having actually done it."],["What did the worry-log study find?","About 91% of logged worries didn't come true."],["What are the three jobs of the ten habits?","Collect evidence, test predictions, spread the load."],["What's the difference between a fact and a meaning?","A fact is what happened (\"the client left\"); a meaning is the verdict you add (\"I'm not good at this\")."]],"pr":"This week: start your file.","it":"When I feel confidence slipping, I'll read three lines from my receipts list."},{"id":"steady-t04-l2","n":2,"t":"Small stressors: the preview, the spike and the echo","dg":[["steady-T04-three-moments.webp","A timeline with three stages and a fix under each","Where a two-minute problem becomes a two-day problem"]],"ep":[["mNjStFH_SDo","Become So Mentally Strong Problems Feel Like A Joke","13:24"],["wq8TrxPYN7A","Psychology of Composure: Be So Calm It Makes People Nervous","14:54"]],"st":[["Each morning,","notice your forecast for the day and label it a guess."],["On stressful days,","move for at least 20 minutes."],["Use the one-week question","on one possible argument a day."],["Plan one small good moment","each day."],["Each evening,","note one hassle and whether it echoed."]],"pf":"This week: track the three moments.","pit":"When I catch myself replaying a small hassle in the evening, I'll go for a short walk.","big":"Mental strength is mostly decided on ordinary days, by how much small hassles move your mood.","ex":"Lisa's Monday: she wakes up thinking \"this week is going to be awful.\"","tk":["**Daily hassles** predict well-being better than major life events.","What matters most is **reactivity**: how much your mood moves.","Small problems grow at three moments: the **preview**, the **spike** and the **echo**.","**Physical activity** softens stress-day mood drops.","**Letting minor conflicts pass** and protecting small good moments both help."],"q":[["What predicted psychological symptoms better: daily hassles or major life events?","Daily hassles."],["What is affective reactivity?","How much your mood moves in response to small daily stressors."],["What are the three moments where a small problem grows?","The preview (before), the spike (during) and the echo (after)."],["What did the morning-forecast study find?","Waking up expecting stress lowered working memory later, even if the stress never came."],["Name the four ways to shrink reactions.","Move on stress days, choose which fights exist, protect small good moments, and don't grade the day at breakfast."]],"pr":"This week: track the three moments.","it":"When I catch myself replaying a small hassle in the evening, I'll go for a short walk."}]},{"id":"steady-t05","ch":"steady","num":5,"t":"Feeling Deeply","ls":[{"id":"steady-t05-l1","n":1,"t":"Feeling everything deeply","dg":[["steady-T05-three-dials.webp","Three columns for threshold, intensity and return to baseline, each with what it feels like and what helps","Three dials of deep feeling"]],"ep":[["iJ9y7KSNXqk","Psychology of People Who Feel Everything Deeply","13:14"],["bqtrEOy8bVE","8 Signs You Have an Extremely Rare Personality","14:30"]],"st":[["Three times this week,","when a feeling lingers, write where it is, what it feels like, and when it started."],["Add one recovery window","after your most intense commitment."],["Move one hard conversation","to a time when you'll have room afterward."],["List your best rooms:","three people or places that leave you lighter. Give one more time this week."],["Notice one joy","at full volume and let yourself have it."]],"pf":"This week: name, design, choose.","pit":"When I catch myself asking 'what's wrong with me?', I'll switch to describing the feeling in three words.","big":"Feeling everything deeply isn't a flaw in your character; it's how your nervous system is built.","ex":"Leah, a nurse, replays small moments for days and has started to dread her own reactions.","tk":["**Sensory processing sensitivity** is a real temperament trait, not a flaw.","Three parts stack: a lower **threshold**, bigger **intensity**, and a slower **return to baseline**.","**Shame** about feeling is a second, removable layer.","Sensitive people **gain more from good environments** (vantage sensitivity).","**Name it, design the room, and spend your sensitivity on purpose.**"],"q":[["What is sensory processing sensitivity?","A temperament trait in roughly a quarter to a third of people: responding more strongly and deeply to what's around them."],["What are the three things that stack in deep feeling?","A lower threshold, greater intensity, and a slower return to baseline."],["What is vantage sensitivity?","Sensitive people gain more from good environments, not just suffer more from bad ones."],["Why is muffling your feelings costly?","It turns down joy at the same rate as pain, and people stop knowing to be gentle with you."],["What does \"design the room\" mean?","Shaping situations ahead of time, like recovery windows and timing, instead of suppressing feelings after they arrive."]],"pr":"This week: name, design, choose.","it":"When I catch myself asking 'what's wrong with me?', I'll switch to describing the feeling in three words."},{"id":"steady-t05-l2","n":2,"t":"Empath intelligence: feel for, not with","dg":[["steady-T05-with-vs-for.webp","Two columns comparing feeling with (empathy) and feeling for (compassion): what happens inside, the result, and the inner sentence","Feeling with versus feeling for"]],"ep":[["ZU9KHGqUio0","10 Signs You Have Empath Intelligence (The Most Underestimated Kind of Smart)","15:19"],["UhxZFzeo0bA","10 Signs of a Dark Empath (The Most Dangerous Personality Type)","13:47"]],"st":[["Choose your compassion sentence,","such as \"I hope you find your way through this.\""],["Use it","each time you notice yourself sinking into someone's feeling."],["Ask \"whose is this?\"","whenever your mood shifts suddenly, and write down the answer."],["Set one intake limit:","a time cap on one draining situation."],["Take real quiet","daily: 15 minutes with nothing new coming in."]],"pf":"This week: practice compassion instead of absorption.","pit":"When I feel someone's panic in my own chest, I'll say silently, 'I care about you, and I'm steady.'","big":"What people call being an \"empath\" is a real skill, reading what others feel, that charges every use to your own nervous system.","ex":"Marco is a school counselor who goes home every night carrying his students' problems.","tk":["**Empathic accuracy** is a measurable skill: reading what others feel.","**Emotional contagion** and shared pain circuitry are how others' feelings get inside you.","Some constant scanning is **fear**, not kindness.","**Empathy** training increased distress; **compassion** training reduced it.","**Feel for, not with; name the owner; ration the intake.**"],"q":[["What is empathic accuracy?","The ability to correctly infer what another person is thinking and feeling."],["How does emotional contagion work?","You automatically mimic others' expressions and posture, and your brain reads your own body as feeling that emotion."],["What did Klimecki and Singer find when they trained empathy versus compassion?","Empathy training increased negative emotion; compassion training reduced it and activated warmth and caregiving networks."],["What's the difference between feeling with and feeling for?","Feeling with means taking on their distress; feeling for means caring about it while staying steady enough to help."],["What question helps you name the owner of a feeling?","\"Whose is this?\""]],"pr":"This week: practice compassion instead of absorption.","it":"When I feel someone's panic in my own chest, I'll say silently, 'I care about you, and I'm steady.'"},{"id":"steady-t05-l3","n":3,"t":"Going quiet when hurt: the full mind","dg":[["steady-T05-four-silences.webp","Four rows pairing each reason for going quiet with the principle that answers it","Four silences and the way out"]],"ep":[["ycf60Zoq_tc","Why Smart People Go Quiet When They're Hurt (Psychology Explains)","12:42"],["N95Tb2sDWVs","Psychology of People Who Go Quiet When They’re Hurt","10:27"]],"st":[["Write your 70% sentence","in advance: \"I don't have the exact words yet, but something about that stung.\""],["When hurt,","say the smallest true thing within the same day: \"That hurt.\""],["Catch one pre-run conversation","and have the real one instead."],["Notice one silent audit","you're running. Decide whether to tell the person."],["If you need time,","give a timestamp."]],"pf":"This week: practice the two-word truth and the 70% sentence.","pit":"When I hear myself say 'I'm fine' and I'm not, I'll follow it with one true word.","big":"Smart people often go quiet when hurt not because their minds are empty but because they're too full.","ex":"At dinner, Dev's sister jokes that his new business is \"a midlife crisis with a logo.\" Everyone laughs.","tk":["The silence is **deep processing**, not emptiness.","**Verbal intelligence** predicts more rumination.","Four reasons: the **precision trap**, the **pre-run conversation**, **intellectualization**, and the **silent audit**.","**Suppression** slowly costs closeness.","**Name it, speak at 70%, send a signal with a timestamp.**"],"q":[["What did the 2015 Lakehead study find about verbal intelligence?","It predicted more worry and rumination."],["What is the precision trap?","Rejecting every imperfect sentence until only \"I'm fine\" is left."],["What is intellectualization?","Analyzing a painful feeling to avoid feeling it."],["What is the silent audit, and why is it costly?","Quietly reducing someone's access after a hurt without telling them, so they never get a chance to repair."],["What does \"send a signal, not a verdict\" look like?","Naming the hurt and giving a time you'll come back: \"I'm hurt. I'll come back to this tomorrow.\""]],"pr":"This week: practice the two-word truth and the 70% sentence.","it":"When I hear myself say 'I'm fine' and I'm not, I'll follow it with one true word."}]},{"id":"steady-t06","ch":"steady","num":6,"t":"Insecurity and Rejection","ls":[{"id":"steady-t06-l1","n":1,"t":"Insecurities: the cover-ups that keep them alive","dg":[["steady-T06-cover-ups.webp","A loop from insecurity to cover-up to \"it worked\" back to insecurity, with three cover-ups and the way out","The cover-up loop"]],"ep":[["FwwyZ6IMrHg","Psychology of Insecurities (And How To Drop Them For Good)","15:47"],["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"]],"st":[["Name your cover-up:","hide, check or overcorrect. Write down the specific behavior."],["Pick a low-stakes situation","to drop it once."],["Write a prediction","of what will happen, then what actually happened."],["Delay one reassurance check","by an hour, then decide whether you still need it."],["Confide in one trusted person","about something you've been hiding."]],"pf":"This week: drop one cover-up.","pit":"When I'm about to ask 'Was that okay?', I'll wait an hour first.","big":"An insecurity is kept alive less by the flaw itself than by the ways you cover it up.","ex":"Jordan, 34, is insecure about not having finished college.","tk":["Feeling inferior is **universal**; a **complex** grows when it's hidden and defended.","**Safety behaviors** keep fears alive by preventing you from learning they're wrong.","Three cover-ups: **hide, check, overcorrect**.","Dropping self-protection often makes people see you **more** positively.","**Confiding** a secret lightens it."],"q":[["What's the difference between feeling inferior and an inferiority complex?","Feeling inferior is universal and can drive growth; a complex is when that feeling hardens and takes over."],["How do safety behaviors keep a fear alive?","When the feared outcome doesn't happen, you credit the safety behavior and never learn it wouldn't have happened anyway."],["What is excessive reassurance seeking, and why does it backfire?","Repeatedly asking for reassurance; the relief fades quickly and the asking can push people away."],["What is symbolic self-completion?","Displaying more symbols of an identity when you feel insecure about it."],["What happened when socially anxious people dropped their self-protective behaviors?","Their conversation partners saw them more positively."]],"pr":"This week: drop one cover-up.","it":"When I'm about to ask 'Was that okay?', I'll wait an hour first."},{"id":"steady-t06-l2","n":2,"t":"Care-free: turning off the laugh track","dg":[["steady-T06-three-crowds.webp","Three cards for the echo, the majority nobody belongs to and the hanging judge, each paired with its fix","Three crowds that aren't there"]],"ep":[["xHu8zoLnz-4","Psychology of Living Care-Free: How to Stop Giving a F*ck What People Think","14:42"],["1dzUVXPj4yE","The Psychology of Not Giving A F*ck","15:44"]],"st":[["Catch three \"people will think\" moments","and finish each sentence out loud."],["Circle the word","you used, and ask whether you'd judge a friend that way."],["Be the first hand up","once: ask the question or voice the doubt."],["Rewrite one demand","as a preference."],["Do one small thing","you've been holding back because of the crowd."]],"pf":"This week: quiet one crowd.","pit":"When I hear 'people will think,' I'll ask, 'Which person, exactly?'","big":"\"Stop caring what people think\" fails because the crowd you're worried about usually isn't in the room; it's assembled from your own judgments.","ex":"Sam wants to share her paintings online but keeps deleting the post.","tk":["People who claim immunity to approval **still respond to it**.","\"People will think\" is usually **your own judgment** wearing others' faces.","Three imaginary crowds: **the echo, the majority nobody belongs to, and the hanging judge**.","Obeying an imaginary crowd **makes you part of it**.","**Find the author, go first, and prefer instead of demand.**"],"q":[["What did Leary's study find about people who claimed others' opinions didn't affect them?","Their self-feelings moved just as much as everyone else's after approval or rejection."],["Where do our guesses about how others see us mostly come from?","From how we already see ourselves."],["What is the false consensus effect?","Assuming most people think and choose as we do."],["What is pluralistic ignorance?","Privately disagreeing with a norm while wrongly believing most others accept it."],["What's the difference between a preference and a demand, in Ellis's terms?","A preference (\"I'd like\") stings when unmet; a demand (\"I must, or I'm worthless\") turns any letdown into a disaster."]],"pr":"This week: quiet one crowd.","it":"When I hear 'people will think,' I'll ask, 'Which person, exactly?'"},{"id":"steady-t06-l3","n":3,"t":"Never the first choice","dg":[["steady-T06-engine.webp","A cycle from steady giving to feeling guaranteed to less effort from others to shrinking needs and back to more giving","The engine loop"]],"ep":[["GgZeo939Qng","Psychology Of People Who Were Never Anyone’s First Choice","9:19"],["Cmdr-wclRSw","Psychology of People Who Stopped Chasing Love","14:00"]],"st":[["Map your relationships:","list ten people and mark who ever reaches out first."],["Pause one one-way effort","for two weeks and notice what happens, without resentment."],["Ask for one small thing","from someone who reaches back."],["Name one need","you've been calling \"low-maintenance.\""],["Give more of your best time","to the people who respond."]],"pf":"This month: map, ask, shift.","pit":"When I feel the urge to organize everything again, I'll ask whether anyone has offered to take a turn.","big":"Some people give steadily and are still nobody's first call, and it has nothing to do with their worth.","ex":"Ana is the friend who organizes every birthday, remembers every hard anniversary, and hosts every holiday.","tk":["Steady, **reliable presence** can make people stop working to keep you.","The **fawn response** shrinks your needs; **hypervigilance** keeps you scanning.","**\"Low-maintenance\"** is often learned, not chosen.","Being passed over reveals **others' capacity**, not your worth.","Notice **one-way relationships**, let a need be **visible**, and invest in people who **reach back**."],"q":[["Why can reliability lead to being taken for granted?","People stop feeling urgency to show up for connection that feels guaranteed."],["What is the fawn response?","Staying close to people by being accommodating and undemanding, shrinking your own needs."],["What is hypervigilance in relationships?","Constantly scanning for signs of being dropped or deprioritized."],["Where does the pattern often start?","At home, when attention went to the loudest need rather than the deepest."],["What does being passed over actually reveal?","The other person's capacity and willingness to give, not your worth."]],"pr":"This month: map, ask, shift.","it":"When I feel the urge to organize everything again, I'll ask whether anyone has offered to take a turn."}]},{"id":"steady-t07","ch":"steady","num":7,"t":"Quiet Emotions","ls":[{"id":"steady-t07-l1","n":1,"t":"Silent instead of arguing","dg":[["steady-T07-two-silences.webp","Two columns comparing the silent treatment and protective silence by aim, purpose and what helps","Two silences that look the same"]],"ep":[["9NYglmqzslQ","People Who Stay Silent Instead of Arguing (Psychology Explains)","8:01"],["N95Tb2sDWVs","Psychology of People Who Go Quiet When They’re Hurt","10:27"]],"st":[["Write a one-sentence explanation","of what your silence means, and share it with one close person in a calm moment."],["Write your pause script:","\"I need ___ minutes. I'll come back.\""],["After any tense moment,","write the conversation you had in your head."],["Choose one sentence","from it and say it within 24 hours."]],"pf":"This week: explain your silence and bring out one line.","pit":"When I notice my words disappearing in an argument, I'll say my pause script instead of going silent.","big":"People who go silent in conflict usually aren't punishing anyone; their nervous system learned early that silence was the safest response.","ex":"When her partner raises his voice about money, Leah freezes and says, \"It's fine.\"","tk":["Silence in conflict often has a **history** that started in childhood.","**Flooding** takes words offline; it isn't a choice.","**Protective silence** has no target; the **silent treatment** is aimed at someone.","Inside, the feeling is full; what comes out is a **fraction**.","**Explain your silence, ask for a pause, and bring one line out.**"],"q":[["Where does silence in conflict often come from?","A childhood where feelings were dismissed or ignored, so staying quiet kept things from getting worse."],["What is emotional flooding?","A state where stress overloads the brain so language and logic temporarily go offline."],["What's the difference between protective silence and the silent treatment?","The silent treatment is aimed at someone to punish or control; protective silence has no target and is self-regulation."],["What is the expression–experience gap?","The difference between the full feeling inside and the small fraction that gets said."],["Name three ways to close the gap.","Explain your silence in a calm moment, ask for a pause instead of disappearing, and share one line afterward."]],"pr":"This week: explain your silence and bring out one line.","it":"When I notice my words disappearing in an argument, I'll say my pause script instead of going silent."},{"id":"steady-t07-l2","n":2,"t":"Quiet anger: the shutdown and the thaw","dg":[["steady-T07-shutdown-thaw.webp","Three phases left to right (flooding, shutdown, thaw), each with what it feels like and what helps","Flooding, shutdown, thaw"]],"ep":[["A1GHAI4FHBg","Psychology of People Who Go Quiet When They're Angry","8:31"],["5FTyEGYntYw","How To Never Get Angry Or Bothered By Anyone","16:49"]],"st":[["Agree on a signal or phrase","with someone close that means \"I'm flooded, not ignoring you.\""],["Write a three-line thaw plan:","one thing to calm your body, one way to rest, one person to reconnect with."],["After any shutdown,","follow the plan before trying to talk."],["Repair with one sentence","about what was happening inside you."],["Replace one shame thought","with what you'd say to a friend."]],"pf":"This week: build your thaw plan.","pit":"When I notice I've gone silent and can't find words, I'll use our signal and step away for an hour.","big":"Some people go quiet when angry not because they're calm, but because their brain has crashed under the load.","ex":"During a heated family call, Marcus goes completely still. His sister accuses him of not caring.","tk":["Quiet anger is often **flooding**, not calm.","The shutdown is a **protective biological state**, not a decision.","It often started in a home where **speaking up made things worse**.","**Thawing** takes time and can bring tears, tremors and a vulnerability hangover.","**Name it, plan the thaw, repair afterward, and answer the shame kindly.**"],"q":[["What happens in the brain during emotional flooding?","Stress cuts off access to the thinking center responsible for language and sentences."],["What is the dorsal vagal response?","The body's oldest protective state, showing up as shutdown, stillness and withdrawal."],["What is the \"memory wipe\" during a shutdown?","Temporarily losing touch with the good things, like why you love the person or what the argument was about."],["What is thawing?","The slow return after a shutdown, which can take hours and bring tears, tremors and exhaustion."],["What's a vulnerability hangover?","The raw, exposed, ashamed feeling after coming back online emotionally."]],"pr":"This week: build your thaw plan.","it":"When I notice I've gone silent and can't find words, I'll use our signal and step away for an hour."},{"id":"steady-t07-l3","n":3,"t":"Crying easily: a sensitive alarm","dg":[["steady-T07-tears.webp","Two columns contrasting crying as release with crying as a signal to seek support","Release or signal?"]],"ep":[["X_T8TsdJ66k","Psychology of People Who Cry Easily (It's Not Weakness)","7:01"],["iJ9y7KSNXqk","Psychology of People Who Feel Everything Deeply","13:14"]],"st":[["Replace one apology","for tears with a name for the feeling: \"I'm moved,\" \"I'm frustrated,\" \"That hit me.\""],["Notice the after-effect:","do you feel calmer or worse after crying? Jot it down."],["Notice what moves you:","list three things that brought tears this week. What do they say you care about?"],["Check the signal:","if crying feels out of control or comes with low mood most days, book a conversation with a doctor or therapist."]],"pf":"This week: stop apologizing, start noticing.","pit":"When I tear up in front of someone, I'll name the feeling instead of saying sorry.","big":"Crying easily isn't weakness; it often reflects a more sensitive emotional system and a body that knows how to release stress.","ex":"Grace tears up at work when a colleague thanks her in a meeting, and later apologizes, mortified.","tk":["People who cry easily may have a **more sensitive emotional alarm**.","**Sensory processing sensitivity** is a real trait in roughly 15–20% of people.","Crying can **calm** the body; holding everything in has costs.","Not crying isn't the same as **not feeling**.","If crying feels **out of control** or comes with lasting low mood, get support."],"q":[["What does the \"sensitive smoke detector\" image describe?","An emotional alarm (the amygdala) that goes off sooner, not one that's broken."],["What is sensory processing sensitivity?","A trait, found in roughly 15–20% of people, of processing sensory and emotional information more deeply."],["What can crying do for the body?","Shift it into a calmer state: slower heart rate and breathing, less stress."],["What is emotional contagion?","Feelings spreading from person to person; open feelers often set a group's tone."],["When is crying worth getting help for?","When it feels uncontrollable or comes with lasting low mood, hopelessness or trouble functioning."]],"pr":"This week: stop apologizing, start noticing.","it":"When I tear up in front of someone, I'll name the feeling instead of saying sorry."},{"id":"steady-t07-l4","n":4,"t":"Feeling it later: delayed emotions and numbness","dg":[["steady-T07-queue.webp","A timeline from a big event through calm functioning to feelings arriving later, with what helps at each stage","Feelings in a queue"]],"ep":[["S_ckRU6Ezzo","People Who Don't Feel Emotions in the Moment (Psychology Explains)","9:38"],["A1GHAI4FHBg","Psychology of People Who Go Quiet When They're Angry","8:31"]],"st":[["Three times a day,","ask: \"What is my body doing right now?\""],["Write one word","for the body signal, then guess the feeling from a short list."],["After any big event,","schedule quiet time (a walk, a journal) for feelings to arrive."],["In one good moment a day,","slow down and name it before moving on."],["If numbness lasts","or follows something traumatic, contact a therapist."]],"pf":"This week: practice the body check-in.","pit":"When I notice I feel 'nothing' about something big, I'll check my body and write one word for what I find.","big":"People who feel nothing in big moments aren't cold or broken; their brain puts survival first and feelings later.","ex":"When Ben's father died, he handled everything: the arrangements, the calls, the eulogy. People said, \"You're so strong.\" He felt almost nothing, and felt guilty about it.","tk":["The brain can put **survival first** and feelings later.","**Delayed emotional processing** is common; feelings often surface at quiet moments.","The **freeze response** is protection, not indifference.","**Numbing** turns down joy along with pain.","**Alexithymia** means feeling in the body without words for it; build the words from body signals."],"q":[["Why might someone feel nothing in a big moment?","The brain prioritizes survival and functioning, and puts feelings in a queue for later."],["What does the car accident example show?","People can be calm during the crisis and flooded with feeling afterward, once it's safe."],["What is the freeze response?","An ancient protective stillness when input is too much, too fast."],["Why does numbing affect joy too?","Emotions don't have separate volume controls; turning down pain turns down everything."],["What is alexithymia?","Difficulty identifying and naming emotions, even though the body still reacts."]],"pr":"This week: practice the body check-in.","it":"When I notice I feel 'nothing' about something big, I'll check my body and write one word for what I find."}]},{"id":"steady-t08","ch":"steady","num":8,"t":"The Inner Voice","ls":[{"id":"steady-t08-l1","n":1,"t":"Fake scenarios: the simulator that never switches off","dg":[["steady-T08-five-jobs.webp","Five cards around a central simulator, each naming a job and a question to ask of it","Five jobs of the inner simulator"]],"ep":[["7VGq5hJwne0","Why Do We Imagine Fake Scenarios? (The Strange Psychology Behind It)","13:06"],["ecPEe1r8VLw","Psychology of People Who Think Too Much","8:37"]],"st":[["Label three scenes a day:","rehearsal, regret, social practice or comfort."],["For every regret scene,","write one rule for next time."],["Before one hard conversation,","rehearse it on purpose for 10 minutes, including one tough response."],["Watch the clock on comfort scenes:","if one takes over an hour you meant to use for something else, gently come back to the room."],["Notice your triggers:","showers, commutes and bedtime are common."]],"pf":"This week: label and point your scenes.","pit":"When I catch myself replaying a mistake, I'll ask, 'What's the rule?' and write it down.","big":"Imagining scenes that never happen isn't a waste of time; it's your brain's simulator, and it runs about half your waking life.","ex":"Jamal has a performance review on Friday and keeps drifting into scenes about it.","tk":["The **default mode network** switches on whenever you stop focusing on the outside world.","Minds wander about **half** of waking hours.","The simulator does five jobs: **rehearsal, regret, social practice, comfort and prediction**.","Turn \"if only\" replays into **one rule for next time**.","A scenario is a **rehearsal room, not a place to live**."],"q":[["What is the default mode network?","A set of brain regions that become active together when you stop focusing on a task and your mind drifts."],["About how much of waking life do minds wander?","Almost half."],["What is Schacter's \"prospective brain\" idea?","Memory and imagination use the same system, so we recombine the past to simulate the future."],["When does counterfactual (\"if only\") thinking fire hardest?","Right after something goes wrong."],["What is maladaptive daydreaming?","Losing hours to absorbing fantasy to the point of preferring it to real life."],["In the prediction-machine view, what is a daydream?","The brain's ordinary simulator running with the corrections from the senses turned off."]],"pr":"This week: label and point your scenes.","it":"When I catch myself replaying a mistake, I'll ask, 'What's the rule?' and write it down."},{"id":"steady-t08-l2","n":2,"t":"Imagined arguments: closing open files","dg":[["steady-T08-open-files.webp","A flow from noticing an imagined argument to naming it, then four closing options","Closing an open file"]],"ep":[["ucQhjc9LZkg","Psychology of People who Imagine FAKE Arguments","6:07"],["7VGq5hJwne0","Why Do We Imagine Fake Scenarios? (The Strange Psychology Behind It)","13:06"]],"st":[["Catch the argument:","each time you notice one, write the person's name and one line: \"This is really about ___.\""],["Look for repeats:","which person or wound shows up most?"],["Choose a closing move","for the biggest one: a real conversation, an unsent letter, one deliberate rehearsal, or telling a safe person."],["Do it","before the week ends."],["Track the replays:","do they shrink afterward?"]],"pf":"This week: name the file, then close it.","pit":"When I catch myself arguing in my head, I'll write 'This is really about ___' before doing anything else.","big":"The arguments you rehearse with people who aren't there are usually your mind trying to finish a conversation that never got resolved.","ex":"Priya keeps arguing in her head with her sister about a comment at Thanksgiving.","tk":["Your body reacts to a rehearsed argument **almost as if it were real**.","Rehearsing conflict can begin as a **childhood safety strategy**.","Imagined arguments usually **circle specific wounds**: the times you weren't heard.","Scripting a conversation brings a feeling of **control**.","**Notice what it's about**, then close the file: talk, write, rehearse once, or be heard."],"q":[["Why does an imagined argument feel so intense?","The brain processes a rehearsed confrontation almost as if it were happening."],["What is staircase wit?","The perfect reply that only comes to mind after the moment has passed."],["What does \"an open file\" mean in this lesson?","A conversation that ended without resolution, which the mind keeps trying to finish."],["Why do imagined arguments feel comforting even when they're stressful?","Scripting the conversation gives a sense of control and predictability."],["What's the first step the video recommends?","Notice what the argument is really about instead of forcing it to stop."]],"pr":"This week: name the file, then close it.","it":"When I catch myself arguing in my head, I'll write 'This is really about ___' before doing anything else."},{"id":"steady-t08-l3","n":3,"t":"Talking to yourself: from heckler to coach","dg":[["steady-T08-five-voices.webp","Five cards for the jobs of inner speech, each with a short example phrase","Five jobs of the inner voice"]],"ep":[["b1zpLDI8Luc","Why Do We Talk to Ourselves? (The Strange Psychology Behind It)","13:31"],["5FTyEGYntYw","How To Never Get Angry Or Bothered By Anyone","16:49"]],"st":[["Searchlight:","next time you lose something, say its name out loud while looking."],["Coach:","pick two short instructions for a task you do often (a workout, a presentation, a hard email)."],["Fire extinguisher:","when you're stressed, rewrite one anxious thought using your name and \"you.\""],["Catch the heckler:","write down one harsh thing your inner voice says, then write what you'd say to a friend instead."],["Rehearse once:","practice one upcoming conversation out loud."]],"pf":"This week: put the voice to work.","pit":"When my inner voice says 'I always mess this up,' I'll answer, '[My name], what's one thing you can do right now?'","big":"Talking to yourself isn't a sign of madness; it's one of your brain's most useful tools, and you can change what it says.","ex":"Before a job interview, Leah's inner voice is running a loop: \"I'm going to blank. I always ramble.\"","tk":["Inner speech is **childhood private speech** that went underground around age seven.","It's **compressed and dialogic**: fast fragments, often a conversation.","**Corollary discharge** tags your inner voice as your own.","Self-talk works as a **sticky note, searchlight, coach, fire extinguisher and rehearsal studio**.","Talk to yourself **by name**, the way you'd talk to a friend."],"q":[["What did Vygotsky say happens to children's out-loud narration?","It goes underground around age seven and becomes silent inner speech."],["What does \"compressed and dialogic\" mean?","Inner speech uses shorthand fragments and often takes the form of a conversation with yourself."],["What is corollary discharge?","The brain sending an advance copy of its own speech commands so it recognizes the voice as its own."],["What did the visual-search study find?","Saying an object's name out loud helped people find it faster."],["What is distanced self-talk, and what does it do?","Talking to yourself by name or \"you\"; it lowers stress and rumination."]],"pr":"This week: put the voice to work.","it":"When my inner voice says 'I always mess this up,' I'll answer, '[My name], what's one thing you can do right now?'"}]},{"id":"steady-t09","ch":"steady","num":9,"t":"Hurt, Tears and Numbness","ls":[{"id":"steady-t09-l1","n":1,"t":"Quiet when hurt: five strengths, used well","dg":[["steady-T09-quiet-strengths.webp","A table of five strengths, each paired with its shadow side","Five strengths of going quiet, and their shadows"]],"ep":[["3FFPKzrehn8","People Who Go Quiet When Hurt Share These 5 Hidden Strengths","8:30"],["N95Tb2sDWVs","Psychology of People Who Go Quiet When They’re Hurt","10:27"]],"st":[["Next time you go quiet,","answer three questions on paper: What happened? What do I want next? What's one sentence I need to say?"],["Announce the pause:","\"I need some time to think. I'll come back to this at ___.\""],["Check one read:","ask a gentle question to test something you sensed."],["Name one boundary","out loud instead of just leaving."],["Tell one trusted person","what your quiet usually means."]],"pf":"This week: use the quiet on purpose.","pit":"When I feel myself going quiet after a hurt, I'll tell the other person when I'll come back.","big":"Going quiet when hurt is often misread as coldness, but the habit can build real strengths: restraint, foresight, self-reliance, perception and boundaries.","ex":"When Mateo's business partner criticizes him in front of a client, Mateo goes quiet.","tk":["Going quiet when hurt is often **misread as coldness**.","It can build **restraint, foresight, self-reliance, perception and boundaries**.","Each strength has a **shadow side** if it's the only tool you use.","**Check your reads** with a gentle question before acting on them.","Quiet is a strength when it **leads somewhere**: a chosen word, a boundary, a return."],"q":[["What does the video call the skill of catching a hurtful reply before it leaves you?","Impulse interruption, a form of emotional restraint."],["What is mental simulation?","Running a situation forward in your head to see where each option leads before acting."],["What is post-traumatic growth?","Developing new strengths because of hard experiences, not just despite them."],["What's the shadow side of processing pain yourself?","It can turn into carrying everything alone and shutting people out."],["When is quiet a strength rather than a wall?","When it leads somewhere: a chosen word, a clear boundary, or a return to the conversation."]],"pr":"This week: use the quiet on purpose.","it":"When I feel myself going quiet after a hurt, I'll tell the other person when I'll come back."},{"id":"steady-t09-l2","n":2,"t":"Pushing people away when hurt","dg":[["steady-T09-push-away-loop.webp","A cycle of trigger, threat, walls and shame, with two branches that both confirm the fear and an exit labeled repair sentence","The push-away loop"]],"ep":[["1bEBOxkpEHI","Psychology of People Who Push Others Away When Hurt","9:24"],["Cmdr-wclRSw","Psychology of People Who Stopped Chasing Love","14:00"]],"st":[["Write your repair sentence","now, while you're calm."],["Write your heads-up","to one close person about what your withdrawal usually means."],["Track the pattern:","next time you go cold, note the trigger and how long it took to reach out."],["Send one line early,","even if you're not ready to talk: \"I need a few hours. I'm not going anywhere.\""],["Notice the cruel math:","whatever the other person does, ask whether your fear is reading it fairly."]],"pf":"This week: prepare your way back.","pit":"When I notice myself giving short answers after a hurt, I'll send one line saying I need time and when I'll be back.","big":"Pushing people away when you're hurt isn't a character flaw; it's a nervous system doing what it learned to do when reaching out didn't bring comfort.","ex":"After an argument, Hannah stops answering her boyfriend's texts for two days.","tk":["Pushing people away is a **trained nervous-system response**, not a flaw.","**Avoidant attachment** forms when reaching out didn't bring comfort; the longing remains.","The nervous system **doesn't check the date**.","Pulling back or pursuing both seem to **confirm the fear**.","Attachment patterns **can change**; prepare a **repair sentence** for coming back."],"q":[["What is avoidant attachment?","A pattern where someone learned early that reaching out didn't bring comfort, so they handle pain alone and keep distance."],["What does \"the nervous system doesn't check the date\" mean?","It fires old protective responses at safe people today as if they were the people who hurt you before."],["What blocks the return after someone pulls away?","Shame about how to explain the distance."],["Why do both pulling back and pursuing confirm the fear?","The loop is internal: pulling back reads as \"they didn't care,\" pursuing reads as \"too much.\""],["Can attachment patterns change?","Yes; they're learned, and people can develop more secure attachment later in life."]],"pr":"This week: prepare your way back.","it":"When I notice myself giving short answers after a hurt, I'll send one line saying I need time and when I'll be back."},{"id":"steady-t09-l3","n":3,"t":"Crying easily: the deep well","dg":[["steady-T09-deep-well.webp","A three-step flow: name the wave, let it pass, return to your point","Release and return"]],"ep":[["Zk9A4Wq-kfo","The Hidden Psychology of People Who Cry Easily","13:03"],["X_T8TsdJ66k","Psychology of People Who Cry Easily (It's Not Weakness)","7:01"]],"st":[["Write your replacement sentence","for \"sorry for crying\" and say it out loud twice."],["Write your pause sentence","and keep it on your phone."],["Use release and return","once, even in a small moment."],["List your rooms:","where are your tears met with care, and where aren't they?"],["Catch one shame spiral","and replace the apology."]],"pf":"This week: one sentence, one pause, one room.","pit":"When I feel my throat tighten mid-conversation, I'll say, 'Give me a moment, then I'll finish,' and keep going.","big":"Crying easily isn't weakness; it's the visible surface of an emotional system that runs faster and deeper.","ex":"Rosa tears up every time she disagrees with her manager, and then her point gets lost.","tk":["Emotional tears may have evolved as an **honest signal** that's hard to fake.","**Emotional tears** differ chemically from reflex tears.","A \"deep well\" can come from **emotional granularity** or from a childhood where **words weren't safe**.","Five signs: **angry tears, others' moments, the silent battle, tears before words, the shame spiral**.","**Retire the apology, release and return, and choose the rooms where your depth is safe.**"],"q":[["What is the honest-signaling theory of tears?","Emotional tears may have evolved because they're costly and hard to fake, which makes them trustworthy."],["What are the three kinds of tears?","Basal, reflex and emotional."],["What is emotional granularity?","Noticing and naming feelings in fine detail rather than just \"good\" or \"bad.\""],["Why do some people cry when they're angry?","Intense arousal of any kind can overflow into tears; the tears are pressure, not sadness."],["What does \"release and return\" mean?","Name the wave, pause briefly and let it pass, then continue your point."]],"pr":"This week: one sentence, one pause, one room.","it":"When I feel my throat tighten mid-conversation, I'll say, 'Give me a moment, then I'll finish,' and keep going."},{"id":"steady-t09-l4","n":4,"t":"Crying in private: stacked tears","dg":[["steady-T09-stacked-tears.webp","A stack of held-back moments with a small trigger on top, beside a lower stack with small releases","Stacked tears"]],"ep":[["FVpKSsmoQrc","Psychology of People Who Cry In Private","8:31"],["Zk9A4Wq-kfo","The Hidden Psychology of People Who Cry Easily","13:03"]],"st":[["Daily check-in:","name one feeling each evening, in writing or out loud."],["Say your words","to yourself the next time you cry alone."],["Choose one safe person","and tell them what you need (\"Just listen, no advice\")."],["Share something small","with them this week."],["Notice the stack:","what feelings have you been saving for \"later\"?"]],"pf":"This week: let a little out.","pit":"When I feel tears coming and want to hide, I'll say to myself, 'This is hard. You're allowed to feel this.'","big":"People who only cry alone usually aren't afraid of the tears; they're afraid of what comes after them.","ex":"Daniel is the steady one at work and at home. He cries only in his car.","tk":["People who cry alone usually **fear the response**, not the tears.","**Emotional invalidation** teaches that feelings in general aren't safe to show.","Holding back can become **automatic**.","Suppressed tears **stack up**, so a small trigger can release a lot.","Start with **words for yourself**, then **one safe person** and **small feelings**."],"q":[["What are people who cry only in private usually afraid of?","Not the tears, but the response afterward: advice, judgment, being called too sensitive."],["What is emotional invalidation?","Having your feelings repeatedly dismissed, minimized or punished, which teaches that feelings aren't safe to show."],["Why does holding back tears become automatic?","When expression is punished early, the body learns to suppress it before you consciously decide."],["Why can a small trigger lead to intense crying?","Suppressed feelings accumulate, so the tears are for everything that was held back."],["What's the first step the video suggests?","Saying to yourself what you always needed to hear: this is hard, you're allowed to feel this."]],"pr":"This week: let a little out.","it":"When I feel tears coming and want to hide, I'll say to myself, 'This is hard. You're allowed to feel this.'"},{"id":"steady-t09-l5","n":5,"t":"Not reacting: the expression gap and emotional blunting","dg":[["steady-T09-gap-or-blunting.webp","Two columns comparing a natural non-reactor with emotional blunting, ending in \"translate yourself\" and \"talk to a doctor\"","Expression gap or emotional blunting?"]],"ep":[["A5f3yL4t_wk","The Psychology of People Who Don't React (Emotional Blunting)","11:38"],["S_ckRU6Ezzo","People Who Don't Feel Emotions in the Moment (Psychology Explains)","9:38"]],"st":[["Pick two translation phrases","you'll actually say."],["Use one","the next time someone shares big news or bad news."],["Make space for delayed feelings:","after an emotional day, take 15 quiet minutes."],["Check yourself honestly:","do feelings arrive later, or not at all? If not at all for weeks, book an appointment with your doctor."],["Tell one close person","how to read your quiet."]],"pf":"This week: translate and check in.","pit":"When I notice my face staying still at someone's news, I'll say, 'That's big. I'm taking it in.'","big":"Some people feel deeply but don't show it in the moment, and get called cold; others genuinely can't feel, which is a different thing that deserves attention.","ex":"When Kim's best friend announces her engagement, Kim smiles and says, \"That's great.\" Her friend looks hurt.","tk":["**Feeling and showing** are different things.","Some people have an **expression gap**: emotions reach the face later.","A **non-reactor** feels deeply and shows it later or privately; **emotional blunting** is numbness across the board.","Persistent numbness, especially with **low mood or a medication change**, is a reason to see a doctor.","**Translate yourself**: \"I'm taking that in.\""],"q":[["What is the expression gap?","The delay between feeling an emotion and showing it on your face."],["What's the key difference between a natural non-reactor and emotional blunting?","A non-reactor feels deeply and can access feelings privately; blunting is numbness across the board."],["What can cause emotional blunting?","Depression, trauma, anxiety, or medication side effects."],["When should numbness be checked by a doctor?","When it lasts more than a couple of weeks, covers good and bad feelings, comes with low mood, or started with a medication change."],["What does \"translate yourself\" mean?","Giving people words for what's happening inside when your face stays still, like \"I'm taking that in.\""]],"pr":"This week: translate and check in.","it":"When I notice my face staying still at someone's news, I'll say, 'That's big. I'm taking it in.'"}]},{"id":"people-t01","ch":"people","num":1,"t":"Being Liked and Reading People","ls":[{"id":"people-t01-l1","n":1,"t":"Charisma: warmth, attention and showing up","dg":[["people-T01-six-laws.webp","Six laws grouped under understanding, validation, caring and presence","The six laws, sorted by what they give the other person"]],"ep":[["uw61C_qbgNg","Psychology of Charisma: How To Actually Make People Like You","15:21"],["qL-uEtXmnqE","Psychology of Confidence: Be So Confident It Makes People Nervous","13:43"]],"st":[["Pick two laws","to focus on, such as follow-up questions and good news."],["In every conversation,","ask at least one follow-up before sharing your own story."],["Catch good news:","when someone shares a win, ask for the story."],["Give one specific compliment","a day."],["After each conversation,","note one thing you learned about the other person (not how you came across)."]],"pf":"This week: practice two laws on purpose.","pit":"When someone tells me something about themselves, I'll ask one more question about it before I talk about me.","big":"Charisma isn't a signal you transmit; it's what people feel about themselves when they're with you.","ex":"Ben is the new sales lead at a regional networking event.","tk":["Charisma has two halves, **influence and affability**; most advice only trains the first.","People like you when they feel **understood, validated and cared for**.","**Warmth is judged first** and weighs more than competence.","You're probably **liked more than you think** (the liking gap).","Ask **follow-up questions**, celebrate people's **good news**, and keep **showing up**."],"q":[["What are the two halves of charisma?","Influence and affability."],["What three things make someone feel close to you?","Feeling understood, validated and cared for."],["What is the liking gap?","People underestimate how much others liked them after a conversation."],["Why does self-monitoring make you less likeable?","It takes attention away from the other person, and attention is what responsiveness is made of."],["What's the best way to respond to someone's good news?","With enthusiasm and engagement: slow down and ask for the story."],["What did the lecture-course study show?","Simply being present more often made students like someone more, even with no conversation."]],"pr":"This week: practice two laws on purpose.","it":"When someone tells me something about themselves, I'll ask one more question about it before I talk about me."},{"id":"people-t01-l2","n":2,"t":"Reading people: beyond the first glance","dg":[["people-T01-accuracy-chain.webp","A chain of four links (relevance, availability, detection, utilization) with the three misreads shown where they break it","Four links in an accurate read"]],"ep":[["YteFqslM4HE","Psychology of Social Intelligence: How to Read Anyone Instantly","15:19"],["UhxZFzeo0bA","10 Signs of a Dark Empath (The Most Dangerous Personality Type)","13:47"]],"st":[["Pick someone new","you met recently and write your instant read in one sentence."],["Mark it as a guess,","and list two things that would confirm or contradict it."],["Have one voice-only conversation","(a call) and ask about thoughts and feelings, not just activities."],["Notice one space:","their desk, car or messages. What's behavioral residue, and what's an identity claim?"],["Watch for an if-then:","see them in a second situation. Did your read hold?"]],"pf":"This week: demote one first impression.","pit":"When I catch myself forming a strong opinion of someone in the first minute, I'll write it down as a guess to test, not a fact.","big":"People who read others well don't decode faces faster; they treat the instant read as a guess and look for better evidence.","ex":"Carla is hiring a project coordinator and has two finalists.","tk":["An accurate read needs **relevant, visible behavior** that you notice and interpret correctly.","Snap judgments from faces are **fast, stable and often wrong**.","**Body-language rules** for spotting lies don't work.","We over-explain behavior by **character** and under-explain it by **situation**.","Better evidence: the **voice**, people's **spaces**, and how they act **across situations**."],"q":[["What are Funder's four links for an accurate read?","The behavior must be relevant, available, detected and used correctly."],["What happened when people guessed about strangers from their faces?","They would have been more accurate ignoring the faces."],["How accurately do people detect lies?","About 54%, only slightly better than chance."],["What is the correspondence bias?","Explaining behavior by someone's character while underweighting the situation."],["What's an if-then pattern?","A stable way someone acts in a particular kind of situation, like calm when teased but upset when corrected."],["Name the three better sources of evidence.","The voice, people's spaces, and how they act across different situations."]],"pr":"This week: demote one first impression.","it":"When I catch myself forming a strong opinion of someone in the first minute, I'll write it down as a guess to test, not a fact."},{"id":"people-t01-l3","n":3,"t":"Calibrating your reads","dg":[["people-T01-signal-story.webp","A three-step flow from line one (what happened) to line two (what it might mean) to checking the read","Signal, story, check"]],"ep":[["YXndOzI7nKo","The Danger of Seeing What Others Don't (Psychology Explains)","15:29"],["YteFqslM4HE","Psychology of Social Intelligence: How to Read Anyone Instantly","15:19"]],"st":[["Log three reads","this week: one sentence each with a date."],["Split each one","into line one (what happened) and line two (what it means)."],["Set a three-week reminder","and mark each read right, wrong, or never found out."],["Ask one small, open question","instead of acting on a guess."],["After a month,","look for your pattern: what kinds of reads do you get right, and which do you get wrong?"]],"pf":"This month: start a reads log.","pit":"When I feel certain someone is upset with me, I'll write line one and line two before I change how I act toward them.","big":"If you pick up on things other people miss, the real danger isn't that nobody believes you; it's that an accurate read and a confident mistake feel exactly the same, and life rarely tells you which one you had.","ex":"Lena senses her close friend Mara has gone cold: shorter texts, no invitations for a month.","tk":["An **accurate read and a confident mistake feel the same** from the inside.","People detect lies at about **54%**, and \"gifted\" readers barely differ from anyone else.","Intuition needs a **regular environment and fast feedback**; reading people usually has neither.","Watch for **ungraded reads, remembered hits, enforced predictions and invented reasons**.","**Separate signal from story, score your misses, and ask a small open question.**"],"q":[["How accurate are people at detecting lies, on average?","About 54%, barely better than a coin flip."],["What two conditions make intuition trustworthy, according to Kahneman and Klein?","A regular environment with real patterns, and long practice with fast, clear feedback."],["What does the metal detector image mean?","Your perception can genuinely detect that something is there, but it can't tell you what it is."],["What is the \"prediction you enforced\"?","Acting on a guess (like someone being cold) in a way that produces the very behavior you predicted."],["What are the two lines in \"separate the signal from the story\"?","What actually happened, and what you think it means."],["Why score your reads?","To build the feedback loop daily life doesn't provide, so your intuition becomes calibrated."]],"pr":"This month: start a reads log.","it":"When I feel certain someone is upset with me, I'll write line one and line two before I change how I act toward them."}]},{"id":"people-t02","ch":"people","num":2,"t":"Trust, Hurt and Seeing People Clearly","ls":[{"id":"people-t02-l1","n":1,"t":"Dark empaths: when understanding isn't kindness","dg":[],"ep":[["UhxZFzeo0bA","10 Signs of a Dark Empath (The Most Dangerous Personality Type)","13:47"],["YteFqslM4HE","Psychology of Social Intelligence: How to Read Anyone Instantly","15:19"]],"st":[["Think of one newer relationship","that grew close quickly."],["Write a short ledger:","three things they've done with what they know about you."],["Share one small, low-stakes thing","with someone you're unsure about, and watch what happens to it."],["Notice sign 9:","watch how two people you know treat someone who can't do anything for them."]],"pf":"This week: test trust the slow way.","pit":"When someone pushes for fast closeness, I'll stay friendly but hold back personal details for another month.","big":"Some people read you very well and use that understanding against you.","ex":"Tasha's new coworker, Drew, seems to understand her immediately.","tk":["**Reading people well isn't the same as caring** about them.","Dark empaths combine dark traits with high empathy, about **one in five** in one study.","**Test trust with small things** and watch what people do with them.","Trust grows from **predictability, then dependability, then faith**.","Keep a **ledger** of what happened, not just how people make you feel."],"q":[["What's the difference between cognitive and affective empathy?","Cognitive empathy is reading what someone feels; affective empathy is feeling it with them."],["What is a dark empath?","Someone high in both dark traits and empathy, so they understand people well and may use it against them."],["What does \"judge the hands, not the eyes\" mean?","Share something small and watch what the person does with it."],["What are the stages of trust?","Predictability, then dependability, then faith."],["Why keep a ledger?","Feelings can be steered by a skilled person; a record of what actually happened shows the pattern."]],"pr":"This week: test trust the slow way.","it":"When someone pushes for fast closeness, I'll stay friendly but hold back personal details for another month."},{"id":"people-t02-l2","n":2,"t":"Romanticizing people: loving the draft","dg":[["people-T02-portrait-cycle.webp","A four-stage cycle: gap, fill, audition, loyalty to the portrait","The portrait cycle"]],"ep":[["J9I2d9uRJGc","The Day You Stop Romanticizing People","13:50"],["YteFqslM4HE","Psychology of Social Intelligence: How to Read Anyone Instantly","15:19"]],"st":[["Pick one person","you admire or feel drawn to."],["List what you actually know","(things you've seen or heard directly) and what you've filled in."],["Apply the unimpressive test","to one behavior you've been reading generously."],["Ask one real question","to replace a filled-in assumption."],["For a close relationship,","write one specific weakness and one specific strength, and notice that you still love them."]],"pf":"This week: separate the draft from the person.","pit":"When I catch myself saying 'that's not who they really are,' I'll ask what I've actually seen them do.","big":"When someone \"turns out\" to be different from who you thought, often nothing switched; what collapsed was your draft of them.","ex":"Jess has been dating Owen for two months and thinks he's \"deep and mysterious.\"","tk":["Seeing a partner a little more positively than they see themselves **helps** relationships.","Romanticizing is filling in **missing information** with hope.","The **halo effect** spreads one strong impression to everything, without your noticing.","Explaining away **serious** problems makes things worse over time.","Aim for a **warm overall view plus accurate specifics**."],"q":[["What's the difference between healthy idealization and romanticizing?","Idealization is a generous reading of someone you know well; romanticizing fills in someone you barely know with hope."],["What is the halo effect?","One strong impression spreads to judgments of everything else about a person."],["What are the four stages of the cycle?","The gap, the fill, the audition and loyalty to the portrait."],["When does explaining away a partner's behavior backfire?","When the problems are serious rather than small."],["What's the healthiest pattern in marriages?","A warm overall view plus an accurate picture of specific strengths and weaknesses."]],"pr":"This week: separate the draft from the person.","it":"When I catch myself saying 'that's not who they really are,' I'll ask what I've actually seen them do."},{"id":"people-t02-l3","n":3,"t":"Going quiet when hurt","dg":[["people-T02-pause-vs-wall.webp","Two columns comparing stonewalling with an announced pause","An announced pause versus stonewalling"]],"ep":[["N95Tb2sDWVs","Psychology of People Who Go Quiet When They’re Hurt","10:27"],["5FTyEGYntYw","How To Never Get Angry Or Bothered By Anyone","16:49"]],"st":[["Write your script:","\"I'm too flooded to talk well. Can we talk at ___?\""],["Share it in a calm moment","with the person you're closest to, so they know what it means."],["Use it once","when you feel yourself going quiet."],["During the pause,","do something calming, not rehearsing."],["Come back on time","with one feeling in words."]],"pf":"This week: write and use your pause script.","pit":"When I notice my words drying up in an argument, I'll say my pause script and name a time.","big":"Many people go silent when hurt, not from coldness but because their nervous system is protecting them.","ex":"Whenever Mike and his wife argue, he goes silent, and she follows him around the house asking what's wrong.","tk":["Freezing under stress is a **real defensive response**.","**Early relationships** shape how we handle pain.","Talking while **flooded** goes badly; a pause can help.","**Pushing** a withdrawing person deepens the withdrawal.","The healthy version is an **announced pause that ends in words**."],"q":[["What is the freeze response?","A built-in defensive response to threat, alongside fight and flight, that can make words hard to reach."],["What is the window of tolerance?","The zone of arousal where real communication and thinking are possible."],["What is the demand–withdraw loop?","One partner pushes to talk, the other withdraws, which provokes more pushing."],["What's the difference between a healthy pause and stonewalling?","A healthy pause is announced and has a return time; stonewalling shuts the other person out with no return."],["What are the four steps of an announced pause?","Name it, give a time, calm (don't stew), and come back with one feeling in words."]],"pr":"This week: write and use your pause script.","it":"When I notice my words drying up in an argument, I'll say my pause script and name a time."},{"id":"people-t02-l4","n":4,"t":"Mixed people: warm and draining","dg":[["people-T02-six-mixed.webp","A grid of six cards, each naming a mixed-person type, its good side and the feeling it leaves","Six mixed people and the feeling each leaves"]],"ep":[["9OGL4-7SpLs","The 6 Dangerous People Psychology Says You Must Avoid","15:24"],["UhxZFzeo0bA","10 Signs of a Dark Empath (The Most Dangerous Personality Type)","13:47"]],"st":[["Pick three people","you see often."],["After each time you see them,","write one word for how you feel an hour later."],["Look for patterns:","is the same feeling showing up after the same person?"],["Map your sharing:","who gets your wins, your problems, your plans? Move one thing to a better-suited person."],["Name one pattern once,","kindly, if it keeps showing up."]],"pf":"Next two weeks: track the aftermath.","pit":"When I notice I've been rehashing a problem with someone for over 20 minutes, I'll ask, 'What's one thing I can actually do about this?'","big":"The people who cost you most are often not obviously toxic; they're warm and draining at the same time.","ex":"Nora's closest friend, Bea, is the first person she calls when anything goes wrong.","tk":["**Mixed relationships** (warm and draining) are linked to more strain than purely negative ones.","Each of the six types leaves a **recognizable feeling**; watch for it.","These are **situations**, not just types; you've probably been one too.","**Judge by the aftermath**, not the moment.","**Swim sideways:** bring each part of you to the right person, and name the pattern once."],"q":[["What is an ambivalent relationship?","One that is high in both support and strain at the same time."],["In the blood-pressure study, which relationships were linked to the highest readings?","The mixed ones, not the ones people disliked."],["What is co-rumination?","Two people going over the same problem again and again, which builds closeness but also anxiety."],["What is the Michelangelo phenomenon?","The people close to us help shape who we become, toward or away from our ideal self."],["What does \"swim sideways\" mean in this lesson?","Changing your angle to a relationship (what you share, when) instead of fighting it or cutting it off."],["How should you name a pattern?","Once, plainly and without accusation, then watch how the person responds."]],"pr":"Next two weeks: track the aftermath.","it":"When I notice I've been rehashing a problem with someone for over 20 minutes, I'll ask, 'What's one thing I can actually do about this?'"}]},{"id":"people-t03","ch":"people","num":3,"t":"Power and Leadership","ls":[{"id":"people-t03-l1","n":1,"t":"Power: who adjusts to whom","dg":[["people-T03-power-ratio.webp","Two cards for the power formula and four cards for the silent concessions, each with its fix","Power is a ratio"]],"ep":[["UtG137-qfTk","Psychology of Power: Outsmart Anyone Without Saying a Word","15:15"],["nG5YzT-ohTM","How to Deal with People Who Disrespect You (Without Confrontation)","15:27"]],"st":[["Pick one upcoming conversation","where you want something."],["Write your best alternative","before you go in."],["Practice the three-second pause","in every conversation this week."],["Notice your concessions:","which of the four shows up most?"],["Make one signal deliberate:","only smile when you mean it for a day."]],"pf":"This week: one alternative, one pause.","pit":"When someone goes silent after I've made a request, I'll count to three before I say anything.","big":"Power doesn't live in body language; it lives in dependence. Whoever needs the other less holds more of it, and it shows in who adjusts to whom.","ex":"Hana is asking her manager for a raise.","tk":["Most \"power poses\" are folklore; power shows in **who adjusts to whom**.","Power is **dependence**: how much you want something and how few alternatives you have.","The four silent concessions: the **pause**, the **eyes**, the **smile**, the **voice**.","Going cold costs the relationship; **equal involvement** works best.","Build an **alternative**, hold a **three-second pause**, and make your signals **mean something**."],"q":[["According to Emerson, where does power come from?","Dependence: how much you want something another person controls and how few alternatives you have."],["What is the principle of least interest?","The person less invested in a relationship tends to hold more control."],["Name the four silent concessions.","Rushing to fill the pause, eyes that keep checking, the smile you owe, and the voice that follows."],["What is a BATNA?","Your best alternative to a negotiated agreement."],["Why does a three-second pause help in negotiation?","It shifts you into more deliberate thinking, so you notice better options."]],"pr":"This week: one alternative, one pause.","it":"When someone goes silent after I've made a request, I'll count to three before I say anything."},{"id":"people-t03-l2","n":2,"t":"Leadership: the emergence gap","dg":[["people-T03-four-illusions.webp","Four rows pairing each illusion with the practice that reverses it","Four illusions and the practice that reverses each"]],"ep":[["_He6wlddiHs","Psychology of Leadership (And How To Be A Great Leader)","16:43"],["uw61C_qbgNg","Psychology of Charisma: How To Actually Make People Like You","15:21"]],"st":[["In every meeting,","ask your question and wait until at least two others have spoken."],["Say \"I don't know\" or \"I got that wrong\"","once this week where others can hear."],["Thank the next person","who brings you bad news before solving it."],["Check your mood","before team conversations; reset it if needed."],["Ask one person","what they've noticed but haven't said."]],"pf":"This week: practice two of the four.","pit":"When someone tells me something went wrong, I'll say 'thanks for telling me' before I ask anything else.","big":"The traits that get people chosen to lead barely predict whether they lead well.","ex":"Carlos was the top performer on his sales team and has just been promoted to manage it.","tk":["Being **chosen** and being **good** at leading are almost unrelated.","**Narcissism** predicts emergence, not effectiveness.","Four illusions: **volume, promotion, confidence, control**.","**Psychological safety** lets bad news travel up.","Practice: **speak last, admit mistakes, thank bad-news bearers, manage your mood**."],"q":[["What's the difference between leader emergence and leader effectiveness?","Emergence is who gets picked; effectiveness is whether the team actually performs and grows."],["What did the narcissism review find?","Narcissism predicted being chosen as a leader but not effectiveness."],["What is the volume illusion?","Mistaking the person who talks most for the leader; speaking time predicts emergence regardless of quality."],["Why did better hospital teams report more errors?","They felt safe enough to report them; weaker teams hid theirs."],["What should you do in the first seconds after someone brings you bad news?","Thank them, out loud, before you try to solve anything."]],"pr":"This week: practice two of the four.","it":"When someone tells me something went wrong, I'll say 'thanks for telling me' before I ask anything else."},{"id":"people-t03-l3","n":3,"t":"Machiavellianism: the wisdom without the malice","dg":[["people-T03-tit-for-tat.webp","A sequence of rounds showing cooperate, match a betrayal, then return to cooperation","Nice first, not nice always"]],"ep":[["G7MFsZL5hCA","Psychology of Machiavellianism: Stop Trying to Be a Good Person","16:15"],["UhxZFzeo0bA","10 Signs of a Dark Empath (The Most Dangerous Personality Type)","13:47"]],"st":[["Pick one upcoming request or negotiation","and write your number or boundary beforehand."],["In the conversation,","be warm but don't change what you wrote."],["Notice one place you give past the line,","and match the group's level instead."],["Before one \"kind\" choice,","ask who it actually helps."],["Practice tit for tat","in one relationship: generous first, then match."]],"pf":"This week: decide one thing cold.","pit":"When I feel myself softening in a negotiation, I'll look at what I wrote down before I say anything.","big":"The Machiavellian's real edge was never cruelty; it was not needing to be seen as good.","ex":"Jen runs a small design studio and is known as \"the nice one.\"","tk":["The Machiavellian edge is **emotional detachment and planning**, not intelligence.","Of three traits, **agency** pays off; **manipulation doesn't**.","Three traps: **going soft where it matters, giving past the line, and the audition**.","**Cynicism** costs more than it earns.","**Decide cold, deliver warm; be nice first, not always; grade the outcome**."],"q":[["What was the main difference between high and low Machiavellians in Christie and Geis's games?","Emotional investment: high scorers stayed detached (the cool syndrome); low scorers got involved (the soft touch)."],["Which of the three Machiavellian traits predicted career success?","Agency; antagonism (manipulation) didn't."],["What happened to the most unselfish group member in Parks and Stone's studies?","People wanted to expel them, partly because they set a standard others didn't want to be measured against."],["What is moral hypocrisy?","Wanting to look moral, even to yourself, while still coming out ahead."],["What is tit for tat?","Cooperate on the first move, then copy what the other side did last."]],"pr":"This week: decide one thing cold.","it":"When I feel myself softening in a negotiation, I'll look at what I wrote down before I say anything."}]},{"id":"people-t04","ch":"people","num":4,"t":"Conversation and Respect","ls":[{"id":"people-t04-l1","n":1,"t":"Conversation: climbing the pyramid","dg":[["people-T04-pyramid.webp","A three-level pyramid labeled small talk, tailored talk and deep talk, with example questions on each level","The topic pyramid"]],"ep":[["0vubhhu3dJU","Psychology of Conversations: How to Never Run Out of Things to Say","14:32"],["uw61C_qbgNg","Psychology of Charisma: How To Actually Make People Like You","15:21"]],"st":[["Before two social moments,","write three topics you're curious about."],["In each conversation,","catch one decision and ask what made them choose it."],["Catch yourself","before a boomerang: respond to their answer first."],["Ask one floor-up question","per conversation."],["Afterward,","write down three things you learned about the other person."]],"pf":"This week: two conversations, four moves.","pit":"When someone mentions a change in their life, I'll ask what made them decide it.","big":"You never run out of things to say; you run out of small talk, the one layer of conversation with a fixed supply.","ex":"At a neighborhood barbecue, Ethan meets Priya, who just moved in.","tk":["**Small talk** is the only layer of conversation that runs out.","**Self-focused attention** makes you miss the material you need.","**Boomerasking** leaves a worse impression than people expect.","People **overestimate** how awkward deep conversations will be.","**Prepare topics, take their exits, ask about decisions, climb a floor.**"],"q":[["What are the three floors of the topic pyramid?","Small talk, tailored talk and deep talk."],["Why do people go blank in conversations?","Their attention turns inward to monitoring themselves, so they miss what the other person is saying."],["What is boomerasking?","Asking a question only to answer it yourself."],["What did research find about deep conversations with strangers?","People overestimate how awkward they'll be and feel more connected afterward."],["Why ask about decisions rather than facts?","Facts have one answer; decisions come with a story full of new doors."]],"pr":"This week: two conversations, four moves.","it":"When someone mentions a change in their life, I'll ask what made them decide it."},{"id":"people-t04-l2","n":2,"t":"Disrespect: the third reply","dg":[["people-T04-third-reply.webp","A table with three rows (joke, skip, small liberty) and columns for fold, fight and the third reply","Fold, fight, or the third reply"]],"ep":[["nG5YzT-ohTM","How to Deal with People Who Disrespect You (Without Confrontation)","15:27"],["UtG137-qfTk","Psychology of Power: Outsmart Anyone Without Saying a Word","15:15"]],"st":[["Write your three scripts:","one warm literal reply for a joke, \"One second, I'm almost done\" for the skip, and \"Let me check and get back to you\" for a small liberty."],["Use one script","this week."],["Notice the pull","each time: fold or fight? Name it to yourself."],["Catch one \"no worries\"","you don't mean, and replace it with your terms."]],"pf":"This week: one script per disguise.","pit":"When someone asks a favor in a tone that assumes yes, I'll say, 'Let me check and get back to you.'","big":"Everyday disrespect is built to pull one of two replies, fighting or folding. The skill is a calm third reply it didn't plan for.","ex":"Three moments in Rosa's week.","tk":["**Incivility** is ambiguous by design, so strong replies look like overreactions.","Disrespect **pulls** for a cold, one-down reply.","In **dignity logic**, nothing was taken, so there's nothing to win back.","Three disguises: **the joke, the skip, the small liberty**.","**Answer the words, finish your sentence, slow your yes.** Get outside help for harassment or abuse."],"q":[["What makes incivility different from open aggression?","Its intent to harm is ambiguous, so any strong response can look like an overreaction."],["What is interpersonal complementarity?","Warmth pulls for warmth, while dominance pulls for the opposite, so a one-up move pulls a one-down reply."],["What's the difference between honor logic and dignity logic?","In honor logic, worth is granted by others and an insult must be won back; in dignity logic, worth belongs to you and can't be taken."],["How do you \"answer the words, not the wink\"?","Reply warmly and sincerely to the literal words of a jab, without laughing along or snapping."],["What does \"slow your yes\" mean?","Don't answer a small liberty instantly; say you'll check, then come back with your real terms."]],"pr":"This week: one script per disguise.","it":"When someone asks a favor in a tone that assumes yes, I'll say, 'Let me check and get back to you.'"},{"id":"people-t04-l3","n":3,"t":"Speaking so people stay","dg":[["people-T04-three-exits.webp","Three rows pairing the runway, the fog and the flat line with the move that closes each","Three exits and how to close them"]],"ep":[["gpjhYKEhMhQ","Psychology of Powerful Communication: Speak So Well People Feel Hypnotized","14:36"],["6wPcR6MrsIk","Psychology of Verbal Intelligence: How To Articulate Your Thoughts Intelligently","13:45"]],"st":[["Pick one upcoming update,","presentation or story."],["Rewrite the first sentence","so it raises a question the listeners want answered."],["Find one picture per point:","a person, a place, a moment."],["Mark your most important sentence","and practice saying it louder and slower, with a pause before the key word."],["Afterward,","note what people asked about or remembered."]],"pf":"This week: rebuild one talk or update.","pit":"When I catch myself starting with 'So, some background,' I'll stop and say what's at stake first.","big":"Nobody has ever been hypnotized by a speaker; what holds a listener is their own attention, once you stop giving it reasons to leave.","ex":"Jamal has five minutes at the monthly all-hands to explain why his team needs a new support tool.","tk":["There are no magic phrases; **attention lives in the listener**.","**Narrative transportation** happens when attention, imagination and feeling all point at one story.","Three exits lose a room: **the runway, the fog and the flat line**.","Each exit is a form of **self-protection** for the speaker.","**Open a gap, give a picture, let your voice follow the meaning**, w
