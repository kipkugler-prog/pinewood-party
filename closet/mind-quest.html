at makes a comfort show \"nostalgia you can control\"?","You can visit a past version of yourself on your own terms, without the bittersweet ache of unplanned nostalgia."],["What's the check-in question for repetition?","Am I using this to help me process something, or to avoid processing it?"]],"pr":"This week: use repeats on purpose.","it":"When I've played the same song three times in a row, I'll ask whether I'm processing or avoiding."},{"id":"life-t04-l4","n":4,"t":"Ghost profiles: choosing your audience","dg":[["life-T04-three-ghosts.webp","Three cards for the gatekeeper, the reader and the stranger in the frame, each with its cost and its fix","Three ghosts and the fix for each"]],"ep":[["7ICGcKz99_A","Psychology of Ghost Profiles (Why Some People Don't Post Their Photos Online)","15:44"],["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"]],"st":[["Take the test:","count who has a real photo of you from this year."],["Send one photo","of yourself to someone you love."],["Turn one silent scroll into a message:","two sentences to someone with good news."],["Say your photo rule once","to the people you're photographed with most."],["Get in one group picture","and keep it somewhere private."]],"pf":"This month: keep privacy a choice.","pit":"When I see good news from someone I care about, I'll send a private message instead of just scrolling past.","big":"People who keep their face off the internet usually aren't hiding; they're choosing who gets to look.","ex":"Owen has no profile photo anywhere and always volunteers to take the group picture.","tk":["Privacy is **selective access**, not withdrawal.","**Context collapse**, the **strictest viewer** and **co-ownership** keep many faces offline.","Three ghosts: **the gatekeeper, the reader, the stranger in the frame**.","Friends prefer the face that surprises you in photos.","**Share with names, say your rule once, and let the camera keep you.**"],"q":[["How did Altman define privacy?","The selective control of access to the self: more contact with some people, less with others."],["What is context collapse?","When social media folds all your different audiences into one, so a single post reaches all of them."],["What's the \"lowest common denominator\" in sharing?","Posting only what your strictest viewer would accept."],["Why does your face look strange in photos?","You're used to your mirror image; friends prefer the true photo."],["What's the zero-photos test?","Checking whether anyone has a real photo of you from this year; zero means privacy has become isolation."]],"pr":"This month: keep privacy a choice.","it":"When I see good news from someone I care about, I'll send a private message instead of just scrolling past."}]},{"id":"life-t05","ch":"life","num":5,"t":"Growing Up and Carrying On","ls":[{"id":"life-t05-l1","n":1,"t":"The man child: when love keeps someone frozen","dg":[["life-T05-dependency-trap.webp","A loop of anxiety, rescue and relief, with the four steps shown as ways out","The dependency trap"]],"ep":[["e_1_kdjudqw","The Depressing Psychology of the Man Child","13:05"],["TRd1kuUGazE","Psychology of Resilience: Build a Mind So Strong It Scares People","18:56"]],"st":[["List the rescues:","everything you do each week that the adult could do."],["Pick one","to stop, and tell them kindly, with \"I love you,\" what's changing."],["Expect a spike","of anger or anxiety, and plan how you'll stay steady."],["Line up outside support:","a family therapist, a relative, a structured program."],["Take back one task","someone does for you each week."],["Pick a first step","so small it feels almost silly, and do it before noon."],["Borrow one structure:","a class, a shift, or a weekly check-in with someone."]],"pf":"For parents or partners: change one rescue this month.","pit":"When I feel the urge to step in and fix it, I'll wait ten minutes and ask whether they can do it themselves.","big":"An adult who never launched usually isn't just lazy; he's caught in a system that runs on love.","ex":"Ruth and Dan's son Kyle is 29, lives at home, and hasn't worked in three years.","tk":["Adult dependence is a **two-person system**, not just one person's laziness.","**Accommodation** relieves everyone's anxiety now and blocks growth later.","The pattern moves from the **invisible 20s** to the **silence of the 40s**.","Families can change **even before the adult child wants to**.","**Stop the rescue not the love, shrink the step, borrow structure, let the discomfort finish.**"],"q":[["What is adult entitled dependence?","An able-bodied adult who doesn't work or study and lives at their parents' expense, often into their 40s or 50s."],["What is accommodation, and why does it stick?","Parents stepping in to remove the adult child's discomfort; both sides feel relief, so both learn to repeat it."],["Why does growth require friction?","Skills and confidence come from small collisions with reality, which rescuing removes."],["What is the \"8050 problem\"?","Parents in their 80s still supporting withdrawn children in their 50s, named in Japan."],["What does \"stop the rescue, not the love\" mean?","Keep expressing love while stopping doing things the adult can do for themselves."],["Why \"let the discomfort finish\"?","Families who changed could tolerate the rise in anxiety and anger long enough for new behavior to appear."]],"pr":"For parents or partners: change one rescue this month.","it":"When I feel the urge to step in and fix it, I'll wait ten minutes and ask whether they can do it themselves."},{"id":"life-t05-l2","n":2,"t":"Tired of existing: when the plug comes loose","dg":[["life-T05-small-moments.webp","A gentle path of four steps (tell one person, get support, rest, notice small moments) with a crisis-line note at the start","The way back is small"]],"ep":[["WQfKw-SHRz8","Psychology Of People Who Are Tired Of Existing","8:53"],["CwhUi9A8LeE","Psychology of Rest: Recover So Well It Makes You Dangerous","14:55"]],"st":[["Tell one trusted person","one honest sentence about how you've really been."],["Book a visit","with a doctor or therapist and mention how long you've felt this way."],["Keep a small-moments note:","each day, write one thing that still landed, however small."],["Let one obligation go","to make room for real rest."],["If you're the friend,","ask \"How are you, really?\" and wait for the answer."]],"pf":"Gentle steps for the next two weeks.","pit":"When someone asks how I'm doing and I'm about to say 'fine,' I'll give one honest sentence instead.","big":"Some tiredness isn't fixed by sleep: people can look completely fine while feeling disconnected from feeling alive.","ex":"Grace is the friend everyone calls in a crisis. She's organized, kind, and always \"fine.\"","tk":["Deep tiredness can hide behind a **very functional surface**.","**Anhedonia** affects meaning, not just pleasure.","It **builds slowly** from stress, grief and holding everything together; the nervous system has limits.","**Small moments** that still land are proof the connection isn't gone.","Recovery is a **return**, often through connection and support. If tiredness includes thoughts of not wanting to be alive, **reach out now (988 in the US)**."],"q":[["How can this kind of tiredness look from the outside?","Often completely functional: showing up, helping others, and seeming fine."],["What is anhedonia?","A reduced ability to feel pleasure and meaning from things that used to matter."],["Why do people in this state often care for everyone else?","Helping others is one of the few things that still produces a feeling, and their own needs go unchecked because they seem fine."],["How does this state usually build?","Slowly, from unresolved stress, unprocessed grief, or years of holding everything together without enough recovery."],["What should you do if tiredness includes thoughts of not wanting to be alive?","Reach out right away: call or text 988 in the US or a local crisis line, and tell someone you trust and a doctor or therapist."],["How do people describe finding their way back?","As a return, coming home to themselves, usually slowly and through small moments and connection."]],"pr":"Gentle steps for the next two weeks.","it":"When someone asks how I'm doing and I'm about to say 'fine,' I'll give one honest sentence instead."}]},{"id":"life-t06","ch":"life","num":6,"t":"A Quieter Life","ls":[{"id":"life-t06-l1","n":1,"t":"Home ground: the button, the home game and the crowd","dg":[["life-T06-home-ground.webp","Three cards for the gifts of home beside three cards for what crowded spaces take away","What home gives, and what crowds take"]],"ep":[["nQAytxnwfUE","Psychology of Homebodies: Why Some People Prefer Staying at Home","13:18"],["atlKdDqU27U","Psychology of People Who Hate Crowded Places","6:35"]],"st":[["Find the button","for your next outing: the exit, the timing, your transport."],["Plan crowded trips","for quieter times, with a recovery window after."],["Host once:","invite someone to your home ground."],["Test one forecast:","write your prediction, go for an hour, and rate it afterward."],["Fix one thing","at home that makes it feel unfinished or cluttered."]],"pf":"This month: use home ground well.","pit":"When I get an invitation, I'll ask where, who and how long before I decide.","big":"Homebodies aren't avoiding people; they've noticed how much a place decides who you get to be.","ex":"Leah is a nurse who dreads her team's monthly happy hour at a loud bar.","tk":["Choosing your surroundings (**situation selection**) is the earliest way to manage emotions.","Home gives **the button, the home game and the room that answers back**.","About one in five people process input more thoroughly, so **crowds** cost them more.","Everyone gets **tired a few hours after socializing**; some just notice it.","Test your **forecasts** about going out, and keep home restful."],"q":[["What is situation selection?","Managing emotions by choosing which people, places and things you walk toward, before the feeling starts."],["What did the noise-button experiments show?","Having control over unpredictable noise, even without using it, helped people perform better afterward."],["What is the home-game effect?","People perform better on their own ground; office \"residents\" negotiated better deals than visitors."],["What is sensory processing sensitivity?","A trait in about 20% of people whose brains process input more thoroughly."],["Why test forecasts about going out?","Introverts tend to underpredict how much they'll enjoy acting outgoing, and forecasts only improve when tested."],["When is staying in more than a preference?","When leaving home brings dread, a pounding heart, or days you can't go out; then talk to a professional."]],"pr":"This month: use home ground well.","it":"When I get an invitation, I'll ask where, who and how long before I decide."},{"id":"life-t06-l2","n":2,"t":"The self-sufficient introvert: a foundation, not a wall","dg":[["life-T06-foundation-wall.webp","Three cards for the strengths of self-sufficiency above three habits that keep it healthy","A foundation, not a wall"]],"ep":[["M_3qn3m8J6E","Psychology of the Self-Sufficient Introvert","7:11"],["ccu7c-3yQOk","Psychology of People Who Love Being Alone","9:39"]],"st":[["Name your pause:","in conversations, say \"Let me think about that\" instead of going silent."],["Write your own verdict","on one piece of work before showing anyone."],["Use one solitude block","on purpose: process the week and plan the next one."],["Share one thing","from your inner world with someone you trust."],["Ask for help once","on something you'd normally grind through alone."]],"pf":"This week: keep the compass, open one door.","pit":"If I've been stuck on something for more than a day, I'll ask one person for input.","big":"Self-sufficient introverts aren't cold or emotionally unavailable; they run on an inner compass instead of outside approval.","ex":"Sam, a software engineer, is told in his review that he's \"hard to read\" and \"doesn't ask for help.\"","tk":["Self-sufficient introverts run on an **inner compass** rather than outside approval.","A pause before answering can be **thinking**, not hesitation.","**Solitude** can be active processing and preparation.","Self-sufficiency is **emotional independence**, not unavailability.","Keep it a **foundation, not a wall**: let a few people in, and ask for help when it matters."],"q":[["What does \"the scenic route\" mean?","Pausing before answering because the brain is cross-referencing memory, planning and consequences."],["What question does an internal compass ask first?","\"Did I do this well? Does this meet my standard?\" rather than \"Who can I tell?\""],["How can solitude be work?","It's time to process the week, connect ideas and prepare for future problems."],["What's the difference between emotional independence and unavailability?","Independence means your stability doesn't depend on others; unavailability means shutting people out."],["What's the risk of self-sufficiency taken too far?","Not asking for help when a problem is bigger than one person."]],"pr":"This week: keep the compass, open one door.","it":"If I've been stuck on something for more than a day, I'll ask one person for input."},{"id":"life-t06-l3","n":3,"t":"Birthdays without the spotlight","dg":[["life-T06-birthday.webp","Four rows pairing each reason with a practical response","Four reasons a birthday feels different"]],"ep":[["TAtHHxTFvHI","Psychology of People Who Treat Their Birthday Like a Normal Day","7:03"],["Cj8g1RrJ_to","Psychology of Life (And How To Spend It Wisely)","16:05"]],"st":[["Write one sentence","describing a birthday you'd genuinely enjoy."],["Tell one person","who'd want to know."],["Plan a kind look back:","what went well this year, and one hope for next year."],["Reply properly","to the messages that felt chosen."],["On someone else's birthday,","send one specific, chosen message."]],"pf":"Before your next birthday: design a day that fits.","pit":"When someone asks what I want for my birthday, I'll give one real answer instead of 'nothing special.'","big":"Some people treat their birthday like a normal day, not because they're ungrateful, but because of how the day is built.","ex":"Every year, Nina's family throws her a surprise party, and every year she smiles through it and feels drained.","tk":["Being **put on stage** is different from being celebrated.","**Lowered expectations** can be a learned way of protecting your peace.","Milestones prompt **taking stock**; that reflection shows real standards.","**Chosen** contact means more than obligatory contact.","Early lessons about **asking for attention** can last; you can relearn wanting."],"q":[["Why can a birthday party feel like a test?","You're asked to produce joy on demand while everyone watches."],["What is defensive detachment, as the video uses the term?","Lowering expectations after repeated letdowns, to avoid disappointment."],["Why can a birthday feel like a mirror?","Milestones prompt people to take stock of whether life matches their hopes."],["Why do automatic birthday messages often feel hollow?","People sense when contact is obligatory rather than chosen, and it registers as noise."],["What might a low-key approach to birthdays reveal?","Early lessons that asking for attention was selfish, and a general preference for not performing."]],"pr":"Before your next birthday: design a day that fits.","it":"When someone asks what I want for my birthday, I'll give one real answer instead of 'nothing special.'"},{"id":"life-t06-l4","n":4,"t":"Your attention and the news","dg":[["life-T06-news-diet.webp","Two columns comparing an automatic and a deliberate information diet across five rows","Automatic or deliberate"]],"ep":[["ORXqOgMZuLc","Psychology of People Who Don’t Follow Politics","7:05"],["1dzUVXPj4yE","The Psychology of Not Giving A F*ck","15:44"]],"st":[["Choose a time","(or times) for news instead of all-day checking."],["Choose your sources","deliberately and turn off other alerts."],["Choose an amount","that fits your values, whether that's a lot or a little."],["Notice your body","when a headline hits: name the reaction."],["Put your care into one action","you can influence this week (a neighbor, your work, your community)."]],"pf":"This week: design your information diet.","pit":"When I feel the urge to refresh the news outside my chosen time, I'll note the urge and come back at the time I picked.","big":"What you pay attention to shapes your mood, your decisions and your sense of control.","ex":"Two neighbors, Grace and Tom, both feel worn out by news alerts during a tense week.","tk":["**Attention is limited**; what fills it shapes mood and decisions.","Alarming headlines can trigger the **fast threat response** before thinking catches up.","An **internal locus of control** is linked to resilience.","**Normative social influence** pulls everyone toward what those around them think.","Choose your **information diet** deliberately: time, source, amount, and where your care goes."],"q":[["What is cognitive load?","How much your mind is carrying at once; it's a limited capacity."],["What did LeDoux's research show about threat?","The brain's threat system can trigger a body response before conscious thought."],["What is locus of control?","Whether you feel your own choices (internal) or outside forces (external) drive your outcomes."],["What is normative social influence?","The pull to think what the people around you think."],["What is rational ignorance?","Downs's idea that people trade off the high cost of becoming fully informed against a small personal benefit."]],"pr":"This week: design your information diet.","it":"When I feel the urge to refresh the news outside my chosen time, I'll note the urge and come back at the time I picked."}]},{"id":"life-t07","ch":"life","num":7,"t":"Looking Back and Choosing","ls":[{"id":"life-t07-l1","n":1,"t":"Nostalgia: the warm ache","dg":[["life-T07-thermostat.webp","A loop from a drop in connection to nostalgia switching on to a warm memory to feeling restored, with a return arrow to the present","The nostalgia thermostat"]],"ep":[["hPg-CaZcc2g","Why Do We Feel Nostalgia? (The Strange Psychology Behind It)","13:24"],["Cj8g1RrJ_to","Psychology of Life (And How To Spend It Wisely)","16:05"]],"st":[["Notice when nostalgia hits","and what you were feeling just before (lonely, uncertain, flat?)."],["Let it play","for a few minutes without fighting it."],["Name its job:","connection, continuity, meaning, comfort or fuel."],["Take one small action","in the same spirit: call someone from that memory, try a new version of an old activity."],["Plan one \"first\"","this month: something worth remembering later."]],"pf":"This week: turn one nostalgic moment into fuel.","pit":"When an old song pulls me back, I'll ask what I'm missing right now, and do one small thing about it today.","big":"Nostalgia isn't a malfunction; it's one of the mind's emotional repair systems.","ex":"Marcus, 46, moved to a new city for work and keeps replaying his college years: the band he played in, late nights with roommates.","tk":["Nostalgia was once called a disease; it's actually an **emotional repair system**.","It works like a **thermostat**, switching on when connection, continuity or meaning drops.","**Memory and reward** networks fire together, so it feels warm and sad at once.","Most nostalgic memories come from the **reminiscence bump** (ages 10 to 30).","Use nostalgia as **fuel, not an address**: visit, warm up, come back."],"q":[["Who named nostalgia, and how was it first seen?","Johannes Hofer in 1688, as a disease in homesick Swiss soldiers."],["What does the thermostat model say?","Nostalgia switches on when your sense of connection, continuity or meaning drops, and restores it."],["Why does nostalgia feel warm and sad at once?","Memory and reward networks fire together: you get the reward and the sense of absence in the same moment."],["What is the reminiscence bump, and why does it happen?","Memories cluster between ages 10 and 30, because those years hold many firsts and are when identity forms."],["Name the five things nostalgia does.","Connection, continuity, meaning, comfort and fuel."],["When does nostalgia become a problem?","When it becomes a place you live, comparing the present to the past, instead of a place you visit."]],"pr":"This week: turn one nostalgic moment into fuel.","it":"When an old song pulls me back, I'll ask what I'm missing right now, and do one small thing about it today."},{"id":"life-t07-l2","n":2,"t":"Settling: marrying from fear","dg":[["life-T07-settling-loop.webp","A flow from four fears to the decision, then relief, performance, drift and the loop, with two exit paths","From fear to the loop, and the ways out"]],"ep":[["IZ02mhfxrW8","Psychology of People Who Marry Someone They Don’t Love","11:07"],["Cmdr-wclRSw","Psychology of People Who Stopped Chasing Love","14:00"]],"st":[["Name the loudest fear","behind a decision you're weighing."],["Ask:","what would I choose if that fear were quieter?"],["Write down what's real and good","in the situation as it is, and what's missing."],["Take one concrete step","instead of re-running the math: book a session with a therapist, or have one honest conversation."],["If safety is ever a concern,","put it first and reach out for help."]],"pf":"This week: replace the loop with one clear step.","pit":"When the 'stay or go' question comes back at night, I'll write it down for my next therapy session instead of answering it alone at 2 a.m.","big":"Marrying someone kind whom you don't love rarely starts as cold calculation; it usually starts as a reasonable decision made by a frightened person.","ex":"Claire, 38, has been married to Ben for nine years. He's kind and reliable; she feels like roommates and keeps asking herself whether to stay.","tk":["Settling usually starts as a **frightened, reasonable decision**, not a betrayal.","**Fear of being single** makes people more willing to settle.","Four fears: **the clock, guilt, sunk cost, and \"real love isn't for me.\"**","Life inside it often moves from **relief to performance to drift to the loop**.","Leaving and staying are both harder than the loop suggests; **neither means failure**. A therapist can help you choose."],"q":[["What did Spielmann's studies find?","People with a stronger fear of being single were more willing to settle for less responsive partners."],["Name the four fears behind settling.","The clock, guilt over leaving a good person, sunk cost, and the belief that real love isn't available to you."],["How does loss aversion keep people in the loop?","What you'd lose feels bigger than what you might gain, so leaving feels harder every year."],["What is the drift?","Conversations and affection gradually shrinking to logistics, so slowly that nobody notices when it happened."],["What is companionate love?","A deep, friendly, committed love that can grow over a long relationship, described in Gottman's research."],["What should come first if there's abuse or danger?","Safety: in the US, the National Domestic Violence Hotline is 1-800-799-7233."]],"pr":"This week: replace the loop with one clear step.","it":"When the 'stay or go' question comes back at night, I'll write it down for my next therapy session instead of answering it alone at 2 a.m."}]},{"id":"life-t08","ch":"life","num":8,"t":"Growing Up Too Fast","ls":[{"id":"life-t08-l1","n":1,"t":"Growing up too fast: the strengths and the bill","dg":[["life-T08-crown-or-cage.webp","Five traits, each shown as a crown version on the left and a cage version on the right","Crown or cage?"]],"ep":[["MtdSnaViufQ","If You Grew Up Too Fast, You Likely Have These 7 Rare Traits","14:57"],["5rs10OatKn0","Psychology of A Child Who Grew Up Too Fast","7:20"]],"st":[["List your traits:","which of the seven fit you? Write one place each one helps."],["Notice the radar:","once a day, when you're scanning a room, ask \"Is this room actually unsafe?\""],["Let one person in:","tell a trusted person about something hard before you've solved it."],["Schedule one hour of play:","something purely for fun, with no goal."],["If grief shows up,","name it (\"this is grief for what I missed\") instead of pushing it away."]],"pf":"This week: one way to be cared for, one way to play.","pit":"When someone asks how I'm doing, I'll give one honest sentence instead of 'fine.'","big":"Children who carried adult weight early often grow into unusually capable adults: perceptive, calm in a crisis, self-reliant. Those strengths are real, and so is their cost.","ex":"Leah, 31, was the one who managed her mother's moods and got her younger brothers to school.","tk":["**Parentification** is a child taking on adult roles; it can build real strengths.","Traits like the **radar**, **emotional fluency** and **calm in a crisis** started as survival.","The **strong one** is often the one nobody checks on.","**Grief for a missed childhood** often arrives once life feels safe.","Don't become softer; become **selective**, and make room for play."],"q":[["What is parentification?","A child taking on emotional or practical roles that belong to the adults in the family."],["What is emotional granularity?","The ability to identify and name emotions precisely."],["What did Tedeschi's research find about some people after hardship?","Many develop post-traumatic growth: deeper relationships, clearer priorities and more meaning."],["Why does grief for a lost childhood often arrive in adulthood?","You can only grieve once you're safe enough to feel it."],["What is \"the cage wearing the costume of a crown\"?","Using your strengths as a reason never to need anyone or heal."],["What does \"become selective\" mean here?","Finding a few people who can handle the full weight of you, instead of either walling off or opening to everyone."]],"pr":"This week: one way to be cared for, one way to play.","it":"When someone asks how I'm doing, I'll give one honest sentence instead of 'fine.'"},{"id":"life-t08-l2","n":2,"t":"Quiet habits from a childhood that went unnoticed","dg":[["life-T08-old-software.webp","Ten habits listed on the left with an arrow to a small update for each on the right","Old software, new update"]],"ep":[["C7Kpx7bciz0","10 \"Normal\" Habits That Are Actually Signs of Childhood Neglect","10:42"],["5rs10OatKn0","Psychology of A Child Who Grew Up Too Fast","7:20"]],"st":[["Pick the two habits","that fit you best."],["Write why each made sense","when you were a child."],["Choose one update","from the table and practice it daily."],["Ask the two evening questions:","what did I enjoy, and what didn't I like?"],["If it stirs up a lot,","talk with someone you trust or a therapist."]],"pf":"This week: update one habit.","pit":"When I start typing a long explanation for saying no, I'll delete it down to one sentence.","big":"Adults who grew up with their feelings and needs going unnoticed rarely look wounded; they look polite, independent and low-maintenance.","ex":"Sam, 36, is the colleague everyone calls dependable, and the friend who never asks for anything.","tk":["**Childhood emotional neglect** is about what you didn't get, and it often leaves quiet habits, not obvious scars.","Each habit **made sense** for a child who was paying attention.","Ask **\"Is this about me, or my old software?\"** before assuming you're the problem.","Rebuild feelings with **small daily questions**.","**Keep what serves you; retire what doesn't**, with a therapist's help if needed."],"q":[["What is childhood emotional neglect?","Growing up without enough attention to your feelings and needs; it's about what didn't happen."],["Why might compliments bounce off?","There's no familiar \"folder\" for that kind of information yet."],["What question helps when you assume you're the problem?","\"Is this about me, or my old software?\""],["How do you start rebuilding access to feelings?","Small daily questions, like \"What did I enjoy today?\" and \"What didn't I like?\""],["Why might feeling seen feel uncomfortable?","People who weren't paid attention to as kids often feel uneasy under close attention as adults."]],"pr":"This week: update one habit.","it":"When I start typing a long explanation for saying no, I'll delete it down to one sentence."}]},{"id":"life-t09","ch":"life","num":9,"t":"Alone by Choice","ls":[{"id":"life-t09-l1","n":1,"t":"The garden behind the wall","dg":[["life-T09-garden-gate.webp","A garden behind a wall listing ma, wabi, kodawari, yugen and seijaku, with a gate labeled ritual, outside and ichigo ichie","A garden with a gate"]],"ep":[["oBVnQFdQCvk","Psychology of People Who Enjoy Being Alone (Japanese Wisdom)","12:35"],["ccu7c-3yQOk","Psychology of People Who Love Being Alone","9:39"]],"st":[["Choose one daily ritual","of solitude at a set time."],["Take one solitude outside","each week: a park, trail or waterfront, no phone."],["Count your declines:","how many invitations have you turned down lately?"],["Open the gate once:","one plan with one person, fully present."],["Check the feeling:","is your solitude feeding you, or have you started hiding?"]],"pf":"This month: give your solitude a shape and a gate.","pit":"When I've turned down three invitations in a row, I'll say yes to the next small one, or suggest something one-on-one instead.","big":"For people who love being alone, solitude isn't empty; it's a place they tend.","ex":"Hiro, 44, an engineer, spends most evenings alone with his woodworking and reading, and loves it.","tk":["Winnicott: the **capacity to be alone** is a sign of maturity.","Solitude can be **full**: ma, wabi, kodawari, yugen, seijaku.","The paradox: peace looks like sadness, and declined invitations **stop coming**.","Keep solitude **chosen** with rituals, and **connected** by taking it outside.","**Ichigo ichie:** when you open the gate, open it all the way."],"q":[["What did Winnicott argue about being alone?","That the capacity to enjoy your own company is a sign of emotional maturity."],["What does \"ma\" mean, and how does it show up?","The space between things; letting pauses and empty time breathe instead of filling them."],["What is the paradox of loving solitude?","Peace looks like sadness from outside, and declining invitations can slowly turn chosen solitude into isolation."],["How does a ritual keep solitude healthy?","It makes alone time chosen and deliberate, walking toward quiet rather than running from people."],["What is ichigo ichie?","\"One time, one meeting\": treating each encounter as unique and being fully present for it."]],"pr":"This month: give your solitude a shape and a gate.","it":"When I've turned down three invitations in a row, I'll say yes to the next small one, or suggest something one-on-one instead."},{"id":"life-t09-l2","n":2,"t":"Choosing home: a social life on a budget","dg":[["life-T09-social-budget.webp","A budget with refill, neutral and drain columns, and a check comparing chosen home with numbness or avoidance","A social life on a budget"]],"ep":[["j8xeMz2sulM","Psychology of People Who Choose to Be Introverts","7:15"],["o9zyAYKKB7Y","If You Love Staying At Home, You Have These 5 Rare Traits","6:45"]],"st":[["List last month's social plans","and mark each refilled, neutral or drained."],["Keep the refillers","and protect their dates."],["Drop or shrink one drainer,","without a long explanation."],["Shape one thing at home","to suit your nervous system (light, noise, a corner)."],["Do the honest check weekly:","engaged or numb?"]],"pf":"This month: run your social budget.","pit":"When I'm invited to something, I'll ask 'will this refill me?' before I answer.","big":"Some people who love staying home aren't shy or broken; they can socialize well and have decided where their energy goes.","ex":"Priya, 35, a sales lead, is the life of every work event, and spends most weekends at home.","tk":["Two personality boxes miss people who **socialize well and still choose solitude**.","High **self-monitors** and **sensitive** people find socializing **expensive**, not difficult.","Five homebody traits: **busy inner world, tired of performing, environmental control, slow adaptation, internal validation**.","**Chosen** solitude goes with well-being; check honestly for **numbness** or **running**.","You **don't owe** anyone a diagnosis for how you spend your energy."],"q":[["What is self-directed personality change?","People deliberately reshaping their habits or traits when an old pattern stops working for them."],["What is self-monitoring, and why can it make socializing expensive?","Adjusting yourself to each room; skilled self-monitors do it constantly, which takes a lot of energy."],["Name three of the five homebody traits.","A busy inner world, tiredness with social performance, environmental control, slow hedonic adaptation, internal validation."],["How do you tell a chosen preference for home from something more?","Chosen home feels engaged and enjoyable; numbness, running from something, or vanished connection suggest otherwise."],["What did the Rochester research find about solitude?","Solitude people choose freely goes with higher well-being."]],"pr":"This month: run your social budget.","it":"When I'm invited to something, I'll ask 'will this refill me?' before I answer."},{"id":"life-t09-l3","n":3,"t":"Walking alone","dg":[["life-T09-walk.webp","A path showing stepping away, the default mode network, rhythm, soft fascination and walking alone leading to clarity and calm","What a solo walk does"]],"ep":[["jwiFNExkfTc","Going for Walks Alone Says A Lot About You","10:17"],["CwhUi9A8LeE","Psychology of Rest: Recover So Well It Makes You Dangerous","14:55"]],"st":[["Schedule three 20-minute walks","alone this week."],["Go somewhere green","at least once."],["No input","on at least one walk: no music, podcasts or calls."],["Take one stuck problem","on a walk without trying to solve it."],["Jot down","what's clearer when you get back."]],"pf":"This month: three solo walks a week.","pit":"When I notice I've reread the same email three times, I'll stand up and walk for 15 minutes before answering it.","big":"Slipping out for a walk alone when life gets heavy is one of the simplest ways to regulate yourself.","ex":"Sam, 41, runs a small accounting firm. Tax season has him snapping at his kids by Wednesday.","tk":["Stepping away lets the **default mode network** link ideas and tidy the day.","Walking boosted **creative thinking** about 60% in one study.","**Rhythm** and **green space** settle a crowded mind.","Walking **alone** frees the attention you'd spend managing a companion.","Solo walks reflect **self-regulation, self-awareness and self-trust**."],"q":[["What does the default mode network do on a walk?","It comes online when you stop focusing on a task, linking ideas and working through experiences."],["What did the Stanford study find?","Walking increased creative thinking by about 60% compared with sitting."],["What is soft fascination?","Gentle things in nature that hold attention lightly and restore it instead of draining it."],["Why does walking alone work differently from walking with someone?","No attention goes to managing the other person, so you notice what you actually think and feel."],["What's the difference between loneliness and solitude?","Loneliness is aching for missing connection; solitude is choosing your own company."]],"pr":"This month: three solo walks a week.","it":"When I notice I've reread the same email three times, I'll stand up and walk for 15 minutes before answering it."}]},{"id":"life-t10","ch":"life","num":10,"t":"Opting Out","ls":[{"id":"life-t10-l1","n":1,"t":"Not on the app: push versus pull","dg":[["life-T10-push-pull.webp","Two columns comparing push and pull media: how each works, examples, and how each feels","Push versus pull"]],"ep":[["VuB6MaKydzE","Psychology of People Who Don't Use Tiktok","6:50"],["1dzUVXPj4yE","The Psychology of Not Giving A F*ck","15:44"]],"st":[["List your daily information sources","and mark each push or pull."],["Move one habit from push to pull:","turn off autoplay, or replace a feed with a chosen newsletter or podcast."],["Practice the complete sentence","once: \"It's not for me.\""],["Ask one person","what they love about an app or trend you skip, and listen with curiosity."]],"pf":"This week: audit push versus pull.","pit":"When I open my phone without a purpose, I'll go to something I chose (a book, a saved article) instead of a feed.","big":"Skipping TikTok is usually neither superiority nor fear of missing out; it reflects how you build identity and who you want choosing your inputs.","ex":"Dana, 34, gets teased at work for not knowing any of the trending sounds.","tk":["TikTok runs on **cultural synchrony**: everyone on the same beat at once.","Some people build identity **inside-out**, others through shared moments; both are valid.","Wanting to choose your inputs reflects your **locus of control**.","**Push** media feeds you; **pull** media lets you choose.","\"It's not for me\" is a **complete sentence**."],"q":[["What is cultural synchrony?","The feeling of moving in step with millions of others at the same moment, as trends spread."],["What's the difference between inside-out and outside-in identity?","Inside-out builds identity from your own values and interests; outside-in feels most itself as part of shared group moments."],["What is locus of control?","Whether you feel your life is steered by you or by outside forces."],["What's the difference between push and pull media?","Push sends content to you whether you ask or not; pull lets you search and choose."],["Why can not using a popular app read as superiority?","People often can't tell not caring from feeling above something, and your absence suggests what they care about is optional."]],"pr":"This week: audit push versus pull.","it":"When I open my phone without a purpose, I'll go to something I chose (a book, a saved article) instead of a feed."},{"id":"life-t10-l2","n":2,"t":"Watching versus doing: celebrities and big games","dg":[["life-T10-watch-or-do.webp","Two columns comparing watching and doing paths for story, connection, excitement and meaning","Same needs, different paths"]],"ep":[["o9VCsfMLQyc","The Psychology of People Who Don't Obsess Over Celebrities","8:42"],["iEm5mfQF1ak","Psychology of People Who Don't Care About The Superbowl","6:36"]],"st":[["List three needs","(story, excitement, connection) and where you currently meet each."],["Check your bandwidth:","how much time last week went to people who don't know you exist, versus people who do?"],["Move one hour","toward someone or something on the \"knows me\" or \"doing\" side."],["Next shared event,","decide in advance: skip, join for the people, or watch with interest."]],"pf":"This week: map where your story and connection come from.","pit":"When I feel pressure to care about a big event, I'll decide whether I'm going for the event or for the people.","big":"Caring intensely about celebrities or big games draws on real, deep human instincts; some people simply spend that energy elsewhere.","ex":"Sam's whole office is planning a Super Bowl party, and he couldn't care less about football.","tk":["Celebrity interest draws on **social mapping**, **social comparison** and **parasocial bonds**.","Fans' bodies can respond to a game **as if they were playing**.","People meet the same needs for story and connection by **watching** or by **doing**.","Non-fans often prefer what they can **influence** (internal locus of control).","Opt out, or join for the people, **by choice**, and never sneer at fans."],"q":[["What is social mapping?","Tracking high-status people and their alliances, an old survival skill that celebrity interest still draws on."],["What is a parasocial relationship?","A one-sided bond with someone, like a celebrity, who doesn't know you exist."],["What happened to sports fans' testosterone in one study?","It rose after their team won and fell after it lost."],["What's the difference between finding meaning by watching and by doing?","Some people find it in observing excellence and drama; others only in building and experiencing things themselves."],["How can you opt out of a big event without rejecting the people?","Join for the company, set your own time limit, and enjoy others' enthusiasm without pretending to share it."]],"pr":"This week: map where your story and connection come from.","it":"When I feel pressure to care about a big event, I'll decide whether I'm going for the event or for the people."},{"id":"life-t10-l3","n":3,"t":"Fear of heights: an alarm you can retrain","dg":[["life-T10-height-alarm.webp","A flow from eyes and inner ear disagreeing to the alarm, with three tools beneath: graded steps, eyes on the horizon, slow exhale","Why heights trigger the alarm, and how to turn it down"]],"ep":[["-cusGqfwgEI","Psychology of People Who Hate Heights","8:33"],["wq8TrxPYN7A","Psychology of Composure: Be So Calm It Makes People Nervous","14:54"]],"st":[["Write a five-step ladder","from \"barely uncomfortable\" to your goal."],["Do step one","for a few minutes, with your eyes on a stable point and slow exhales."],["Repeat each step","until your fear drops noticeably before moving up."],["Notice catastrophic thoughts","and label them: \"That's my brain imagining, not the railing breaking.\""],["Get help","from a therapist if the fear is severe or you're stuck."]],"pf":"This month: build your height ladder (only if heights limit you).","pit":"When I feel the fear rise at a height, I'll find the horizon and take three slow breaths before deciding whether to move.","big":"Fear of heights is your brain taking safety seriously, and if it limits your life, it can be retrained.","ex":"Mia's family is planning a trip that includes a famous lookout tower, and she freezes on anything higher than a stepladder.","tk":["Heights create a **visual-vestibular mismatch**, and the brain assumes danger.","Some nervous systems are **more sensitive** to sensory conflict.","The urge near an edge is usually a **misread safety reflex**; thoughts of ending your life are different and deserve immediate help.","Fear grows with **lost control, catastrophic thinking and staring at the drop**.","Retrain with **gradual exposure, steady eyes and slow exhales**."],"q":[["What is visual-vestibular mismatch?","At a height, the eyes see a big drop while the inner ear senses stillness, and the brain resolves the conflict by sounding the alarm."],["What is the high place phenomenon?","A sudden urge or pull near an edge that many people feel; the video explains it as the brain misreading its own step-back safety reflex."],["Name three things that make fear of heights stronger.","Learned fear from childhood, feeling trapped or out of control, catastrophic thinking, and staring at the drop."],["How does gradual exposure work?","Small, controlled steps up in height build a library of safe experiences, so the alarm weakens over time."],["Where should you look at a height, and why?","At the horizon or a stable distant point, because attention on the drop feeds the fear."]],"pr":"This month: build your height ladder (only if heights limit you).","it":"When I feel the fear rise at a height, I'll find the horizon and take three slow breaths before deciding whether to move."}]},{"id":"life-t11","ch":"life","num":11,"t":"Generations and Circumstances","ls":[{"id":"life-t11-l1","n":1,"t":"How circumstances shape a generation","dg":[["life-T11-shaped-by-times.webp","A grid of seven generations, each with its formative circumstances and the adaptation it built","Shaped by the times"]],"ep":[["0XTBQeGgS1A","Psychology of Every Generation (1901–2026)","14:30"],["Cj8g1RrJ_to","Psychology of Life (And How To Spend It Wisely)","16:05"]],"st":[["Ask an older person","what the hardest year of their youth was and what it taught them."],["Ask a younger person","what feels hardest about their world right now."],["List two of your own habits","that might be adaptations to your formative years."],["For each,","decide: keep it as a strength, or loosen it because circumstances changed?"]],"pf":"This week: one conversation across generations.","pit":"When I catch myself judging someone's habit as 'typical of their generation,' I'll ask what experience might have taught it.","big":"Each generation adapts to the crises of its formative years, then passes those adaptations down without meaning to.","ex":"At a family dinner, Leo (31) rolls his eyes when his grandmother, Rose (88), saves twist ties and refuses to throw out a slightly stale loaf of bread.","tk":["The **impressionable years** leave an especially lasting mark.","Each generation built **adaptations** to the crises of its youth.","Old **survival habits** can outlast the circumstances that made them useful.","Generational descriptions are **tendencies, not types**.","Ask **what someone's formative years taught them** before judging their habits."],"q":[["What is the impressionable years idea?","That experiences in childhood and early adulthood shape attitudes more lastingly than experiences later in life."],["What adaptation does the video link to the Great Depression and World War II?","\"Compressed resilience\": the ability to keep functioning through loss, often by pushing feelings down."],["What does \"expectation mismatch\" mean for millennials in the video?","Being raised with high expectations, then entering an economy that couldn't meet them."],["Why are generational descriptions \"tendencies, not types\"?","They're averages; individuals within a generation vary far more than the differences between generations."],["What's the video's closing point about generational labels?","People aren't the problem; they're responses to the circumstances they lived through."]],"pr":"This week: one conversation across generations.","it":"When I catch myself judging someone's habit as 'typical of their generation,' I'll ask what experience might have taught it."},{"id":"life-t11-l2","n":2,"t":"In-between generations: the before and the after","dg":[["life-T11-before-after.webp","Two columns comparing what an analog childhood taught with what coming of age online taught","The before and the after"]],"ep":[["On1Sq7XydSs","The Psychology of Xennials (Built To Survive Anything)","9:52"],["kaE7Qe6FdMs","Psychology of the MySpace Generation (1984–1992)","7:28"]],"st":[["Spend one waiting period phone-free","and notice that you can."],["Use one digital tool","you've been avoiding."],["If you're sandwiched,","list every recurring care task and share or drop one."],["Check one old money fear","against your current facts."],["Answer \"How are you?\" honestly","once this week."]],"pf":"This week: use both languages and lighten the load.","pit":"When someone asks how I'm doing and I'm stretched thin, I'll name one real thing instead of saying 'fine.'","big":"People who grew up analog and came of age digital learned two operating systems while their identity was still forming.","ex":"Jen, 45, drives her father to dialysis three mornings a week, gets her two kids to school, and works late to catch up.","tk":["Cusp groups learned **analog and digital life** while identity was still forming.","Unsupervised childhoods often built **early self-reliance**.","Building an online self from scratch taught that **identity is constructed**.","Repeated shocks built **earned hope**: showing up without guarantees.","The **sandwich years** need sharing; composure can hide the load."],"q":[["Which years are usually given for Xennials and for the MySpace generation in these videos?","Xennials about 1977–1985; the MySpace generation about 1984–1992."],["What did unsupervised childhoods often teach?","Early self-reliance: handling problems because nobody else was there."],["Why might people who built profiles from scratch be alert to \"fake authenticity\"?","They learned firsthand that an online identity is constructed."],["What is \"earned hope\"?","Showing up and building without guarantees; neither optimism nor cynicism."],["What is the sandwich generation?","Adults caring for aging parents and children at the same time."]],"pr":"This week: use both languages and lighten the load.","it":"When someone asks how I'm doing and I'm stretched thin, I'll name one real thing instead of saying 'fine.'"},{"id":"life-t11-l3","n":3,"t":"Scarcity: the paycheck-to-paycheck mind","dg":[["life-T11-scarcity-tunnel.webp","A cycle from scarcity to tunneling to bandwidth tax to short-term choices, with ways to loosen it noted beneath","The scarcity loop, and where to break it"]],"ep":[["3jf2u8tVR5w","The Psychology of People Living Paycheck to Paycheck","8:34"],["0XTBQeGgS1A","Psychology of Every Generation (1901–2026)","14:30"]],"st":[["Pick one calm 15-minute slot","for a weekly money check-in, and keep it judgment-free."],["Automate or set a reminder","for one recurring bill."],["Start a tiny buffer,","any amount, in a separate place."],["When the alarm fires,","name it (\"I'm in the tunnel\") and postpone decisions to your check-in."],["Look up one free, nonprofit source of help","near you."]],"pf":"This week: lighten the background load.","pit":"When money panic hits during the day, I'll write the worry on my check-in list and deal with it at my Sunday slot.","big":"Living paycheck to paycheck changes how the mind works: scarcity narrows attention, taxes mental bandwidth and makes the future feel unreal.","ex":"Andre, 29, knows exactly how many days are left until payday, and his heart races every time his phone shows a bank notification.","tk":["Scarcity narrows attention onto threats (**tunneling**).","Money worry imposes a **bandwidth tax** on thinking.","Under scarcity, the **present outweighs the future**, and **shame blocks planning**.","Losses hurt more when they wipe out your **buffer**.","Protect bandwidth: **calm check-ins, automation, a tiny buffer, observation instead of shame, free help**."],"q":[["What is tunneling?","When scarcity narrows attention onto immediate threats so everything else fades."],["What is the bandwidth tax?","The mental capacity used up by constant background worry, which leaves less for thinking and focus."],["Why can a $300 repair feel catastrophic under scarcity?","Loss aversion is amplified: it wipes out the small buffer that made other things possible."],["Why don't budgeting videos help when you're ashamed?","Shame shuts down the calm, planning parts of thinking you need to use them."],["Name two ways to protect bandwidth.","Automate bills or set reminders, and make money decisions in scheduled calm moments."]],"pr":"This week: lighten the background load.","it":"When money panic hits during the day, I'll write the worry on my check-in list and deal with it at my Sunday slot."},{"id":"life-t11-l4","n":4,"t":"The capable single parent","dg":[["life-T11-capable-parent.webp","Two columns comparing what others see with what's running inside","What others see, and what's running inside"]],"ep":[["vCzFsK65eYk","Psychology of Capable Single Parents","7:34"],["TRd1kuUGazE","Psychology of Resilience: Build a Mind So Strong It Scares People","18:56"]],"st":[["Put 20 minutes of rest","on your calendar and treat it like an appointment."],["Set up one shared-moment habit:","a daily text, a weekly call or a group."],["Say yes to one offer of help","you'd usually turn down."],["Name one feeling","you've been carrying alone to someone you trust."]],"pf":"This week: one rest, one shared moment, one yes.","pit":"When someone offers to help and I start to say 'I've got it,' I'll say 'yes, thank you' instead.","big":"Capable single parents often look steady because their nervous systems learned that safety wasn't guaranteed, and that same vigilance makes rest and asking for help hard.","ex":"Ruth, 38, has raised her two sons alone for six years. Everyone says she \"has it all together.\"","tk":["Single-parent competence often grows from learning that **safety wasn't guaranteed**.","A vigilant brain makes **rest feel risky**.","Losing someone to share **ordinary moments** with (co-regulation) wears people down.","The more capable you seem, the **less people check on you**.","Rebuild **rest, shared moments and help** on purpose."],"q":[["Where does a capable single parent's competence often come from, according to the video?","From learning that safety wasn't guaranteed, so the brain became a planning and prediction machine."],["Why does rest feel risky?","A brain trained for vigilance links stillness with something being missed."],["What is co-regulation?","Calming and regulating emotions partly through other people: a shared look, a touch, someone beside you."],["What is the capability paradox?","The more capable you seem, the less people check on you, so the struggle becomes invisible."],["Name two practical supports.","Scheduling rest, a daily check-in with a friend, accepting help with one thing, naming grief, or using local resources like 211."]],"pr":"This week: one rest, one shared moment, one yes.","it":"When someone offers to help and I start to say 'I've got it,' I'll say 'yes, thank you' instead."}]}],"gl":[["Activation ritual","Using the same cues (place, time, music) for focused work until the cues themselves start to switch focus on.",["change-t05-l2"]],["Active-constructive responding","Responding to someone's good news with real interest and enthusiasm, asking questions so they can relive it. It predicts closer, more satisfying relationships than quiet or deflating responses.",["people-t01-l1"]],["Adult entitled dependence","An able-bodied adult who doesn't work or study and lives at their parents' expense, held in place by a family pattern rather than laziness alone.",["life-t05-l1"]],["Adverse Childhood Experiences (ACEs)","Difficult childhood experiences, such as abuse, neglect or household dysfunction, studied for their links to adult health.",["life-t08-l2"]],["Affect labeling","Putting a simple name on a feeling (\"hurt,\" \"angry\"), which calms the brain's alarm response.",["steady-t05-l1","steady-t05-l3"]],["Affective empathy","Feeling some of another person's emotion yourself. Compare cognitive empathy, which is understanding what they feel.",["people-t02-l1"]],["Affective reactivity","How much your mood moves in response to small daily stressors.",["steady-t04-l2"]],["Affective realism","Treating a feeling as proof of what's true instead of as one piece of information to check.",["people-t11-l3"]],["Alexithymia","Difficulty identifying and naming emotions, even though the body still reacts.",["steady-t07-l4"]],["Allostatic load","The wear on the body from being kept in a stress-ready state for too long without recovery.",["change-t02-l1"]],["Aloneliness","Distress from getting too little time alone; the opposite of loneliness.",["life-t01-l1"]],["Altruism born of suffering","The tendency of some people who have suffered to become more caring and more driven to help others.",["people-t08-l3"]],["Ambiguous loss","Grief for someone who is physically present but psychologically or relationally gone, or the reverse; it has no clear ending.",["people-t09-l3"]],["Ambivalent relationship","A relationship high in both support and strain at the same time.",["people-t02-l4"]],["Analogical reasoning","Recognizing that a problem shares structure with something from a different field.",["mind-t07-l5"]],["Anhedonia","A reduced ability to feel pleasure and meaning from things that used to matter. If it lasts more than a couple of weeks, it's worth talking to a doctor.",["life-t05-l2"]],["Apology audit","Logging every apology for a week and sorting them (preemptive, reflex, hedge, sympathy, real) to see which to replace.",["people-t10-l2"]],["Artificial urgency","A deadline set before the real one, with real consequences, to create pressure earlier.",["change-t05-l2"]],["Assortative mating","People's tendency to pair with partners similar to themselves, including in intelligence.",["mind-t07-l4"]],["Asynchronous development","When thinking matures faster than emotional and social development.",["mind-t07-l4"]],["Attachment anxiety","Fear that closeness will be followed by loss, which can lead people to pull back before others can leave.",["people-t07-l1"]],["Attachment theory","The idea that early relationships with caregivers shape how we seek closeness and handle emotional pain later in life.",["people-t02-l3"]],["Attention residue","Part of your attention staying on the task you just left, lowering performance on the next one.",["change-t03-l3"]],["Avoidant attachment","A pattern learned when reaching out didn't reliably bring comfort: handling pain alone and keeping distance, while the longing for closeness remains.",["steady-t09-l2"]],["Babble hypothesis","The finding that whoever talks most tends to emerge as leader, regardless of what they say.",["people-t03-l2"]],["Baker/baker paradox","People remember that someone is a baker far better than that his name is Baker, because names connect to nothing else you know.",["mind-t06-l4"]],["Bandwidth tax","The mental capacity used up by constant background worry, leaving less for focus and planning.",["life-t11-l3"]],["Barnum effect","The tendency to accept vague, flattering personality descriptions as uniquely accurate about yourself.",["life-t01-l2"]],["Base rate","How common something is in general; the starting point for judging a specific case.",["mind-t03-l1"]],["Batman effect","Children persisted longer at a boring task when they pretended to be a hardworking character like Batman.",["change-t06-l4"]],["BATNA","Best alternative to a negotiated agreement: what you'll do if this deal falls through.",["people-t03-l1"]],["Beautiful mess effect","We judge our own vulnerability as weakness but the same vulnerability in others as courage.",["people-t01-l1"]],["Bedtime procrastination","Going to bed later than intended without an outside reason, often to reclaim time for yourself.",["change-t07-l2"]],["Behavioral activation","Doing small, chosen activities to rebuild mood and a sense of control, rather than waiting to feel motivated first.",["steady-t01-l1"]],["Black sheep effect","Groups judge their own members who break the rules more harshly than outsiders who do the same.",["life-t02-l3"]],["Boomerasking","Asking someone a question only to answer it yourself.",["people-t04-l1"]],["Calibration","How well your confidence matches your accuracy. Intuition becomes calibrated only with practice and fast, clear feedback.",["people-t01-l3"]],["Capitalization","Sharing good news with others. How they respond shapes the relationship.",["people-t01-l1"]],["Childhood emotional neglect","A childhood wound made of absences: emotional needs that went unnoticed or unanswered, even when nothing obviously bad happened.",["people-t08-l2"]],["Choice closure","A small act that signals a decision is finished, such as closing the menu, which makes people more satisfied with what they chose.",["life-t04-l1"]],["Chunking","Grouping pieces of information into larger meaningful units, so the mind can hold and use more at once.",["mind-t01-l1"]],["Co-regulation","Calming and regulating emotions partly through other people: a shared look, a touch, someone beside you.",["life-t11-l4"]],["Co-rumination","Two people going over the same problem again and again; closeness grows, and so does anxiety.",["people-t02-l4"]],["Cognitive empathy","Accurately understanding what another person thinks and feels, without necessarily feeling it yourself.",["people-t02-l1"]],["Cognitive load","How much your mind is carrying at once; a limited capacity that what you take in competes for.",["life-t06-l4"]],["Cognitive reappraisal","Changing how you interpret a situation so the emotion changes, usually before it fully builds. Compare expressive suppression.",["steady-t01-l2"]],["Cognitive reflection","Pausing to check an answer that feels obvious before trusting it; measured by questions like the bat-and-ball problem.",["mind-t05-l2"]],["Cognitive restructuring","Separating the facts of a situation from the meanings you add, then checking those meanings.",["steady-t04-l1"]],["Coherence, purpose and significance","The three parts of meaning in life: whether life makes sense, whether it has direction, and whether your existence matters. Each can be missing on its own.",["life-t03-l1"]],["Commitment device","A rule or arrangement set up while calm that makes it hard for your later self to give in, like a blocker with someone else holding the password.",["change-t04-l2"]],["Communication privacy management","The idea that sharing private information makes the listener a co-owner of it, with rules about where it goes next.",["life-t04-l4"]],["Companionate love","A deep, friendly, committed love built over a long relationship, distinct from early passionate love.",["life-t07-l2"]],["Competence-without-effort paradox","Being good at things without trying means you never learn to link effort with reward, so effort later feels wrong.",["mind-t06-l1"]],["Complexity","Holding opposite traits at once, such as playfulness and discipline. Found in Csikszentmihalyi's interviews with creative people.",["life-t01-l2"]],["Conscientiousness","The personality trait of being organized, persistent and reliable about follow-through.",["mind-t06-l1"]],["Containment ritual","Writing down everything that's worrying you for a couple of minutes before focused work, so your brain knows it will be dealt with later.",["change-t06-l1"]],["Context collapse","When social media folds all your different audiences into one, so a single post reaches all of them at once.",["life-t04-l4"]],["Contingent self-worth","Self-worth that rises and falls with success or approval.",["people-t09-l1"]],["Corollary discharge","The brain sending an advance copy of its own commands, so it recognizes its own inner voice and movements as self-generated.",["steady-t08-l3"]],["Correspondence bias","Explaining someone's behavior by their character while underweighting the situation that shaped it.",["people-t01-l2"]],["Counterfactual thinking","Thinking about what might have been (\"if only I had…\"). It fires most strongly after something goes wrong, helping the mind find what to do differently next time.",["steady-t08-l1"]],["Crystallization of discontent","The moment scattered complaints connect into one clear pattern, often triggering a sudden decision to change.",["change-t01-l4"]],["Crystallized intelligence","The knowledge and methods you've built up; it keeps growing into later life.",["mind-t03-l1"]],["Cultural synchrony","The feeling of moving in step with millions of others at the same moment, as trends, sounds and phrases spread at once.",["life-t10-l1"]],["Curse of knowledge","Once you know something, finding it hard to imagine not knowing it, so explanations skip steps.",["mind-t03-l3"]],["Daily hassles","Small everyday irritations; they predict well-being better than major life events.",["steady-t04-l2"]],["Dark empath","A personality profile combining dark triad traits with above-average empathy. A research construct, not a diagnosis.",["people-t02-l1"]],["Dark factor of personality","The shared core of dark traits: maximizing your own benefit while accepting harm to others, plus beliefs that justify it.",["people-t06-l1"]],["Dark triad","Three overlapping traits: narcissism, Machiavellianism and psychopathy.",["people-t02-l1"]],["Deactivating strategies","Muting the need for closeness when reaching for it keeps failing.",["people-t05-l2"]],["Deactivation effect","The drop in high-energy feelings, positive and negative, after a short time alone.",["life-t01-l1"]],["Deceiver's distrust","After telling a lie, the liar sees the other person as less honest.",["people-t06-l2"]],["Default mode network","A set of brain regions active during quiet reflection, involved in memory, emotion, imagining social situations and the sense of self.",["life-t04-l2"]],["Defensive detachment","Lowering your expectations after repeated letdowns so you're not disappointed again.",["life-t06-l3"]],["Dehumanization","Seeing a person or group as less than fully human, often starting with labels, which makes cruelty toward them easier.",["people-t08-l1"]],["Deindividuation","Losing your sense of being an individual, for example through anonymity or a crowd, so your own standards stop guiding what you do.",["people-t08-l1"]],["Delayed emotional processing","Emotions being put \"in a queue\" during a crisis and surfacing hours, days or weeks later, often at quiet moments.",["steady-t07-l4"]],["Demand–withdraw pattern","A conflict loop where one partner pushes to talk and the other pulls away, which makes the first push harder. Linked to lower relationship satisfaction.",["people-t02-l3"]],["Dereflection","Deliberately moving attention off yourself and onto something or someone beyond you, so meaning can arrive on its own.",["life-t03-l1"]],["Desirable difficulties","Learning conditions that feel harder in the moment, such as testing and spacing, but produce longer-lasting learning.",["mind-t01-l1"]],["Detachment","Mentally switching off from work during time off; one of the four recovery experiences.",["change-t02-l1"]],["Disenfranchised grief","Real grief that others don't recognize, such as mourning a relationship you chose to end.",["people-t07-l3"]],["Distanced self-talk","Talking to yourself by name or as \"you\" to step back from strong emotion.",["steady-t01-l3","steady-t03-l2","steady-t04-l1"]],["Divided self","A self-concept that shifts a great deal from role to role; large shifts go with lower well-being.",["life-t02-l1"]],["Dopamine framing","Making a task's payoff vivid before you start: picture the moment it pays off, name the feeling, and connect today's task to it.",["change-t06-l2"]],["Dunning–Kruger effect","In areas where people lack skill, they also lack the skill to recognize it, so they tend to overestimate themselves (the \"double curse\").",["mind-t05-l2"]],["Dysrationalia","Thinking and acting irrationally despite high intelligence; intelligence and rational thinking are separate.",["mind-t05-l2"]],["Earned dogmatism","Feeling like an expert making a person more closed-minded.",["mind-t05-l2"]],["Earned hope","Showing up and building without guarantees; neither optimism that everything will work out nor cynicism.",["life-t11-l2"]],["Einstellung effect","A familiar, decent solution blocking you from seeing a better one.",["mind-t03-l2"]],["Elaborated intrusion theory","Desire has two stages: an automatic intrusion you can't prevent, and an elaboration, adding detail, that makes the wanting grow.",["change-t04-l2"]],["Elaborative encoding","Processing information deeply by connecting it to meaning, which makes it easier to remember.",["mind-t06-l2"]],["Emotion coaching","Responding to a child's feelings with curiosity, helping them name the feeling and work out what to do. The opposite, emotion dismissing, shuts feelings down.",["people-t11-l3"]],["Emotion-focused coping","Handling a situation by managing the feeling it causes, as in procrastinating to avoid discomfort, rather than by solving the problem itself.",["change-t05-l1"]],["Emotional blunting","A numbing of feelings across the board, both good and bad. It can be a symptom of depression, trauma or anxiety, or a medication side effect, and is worth discussing with a doctor.",["steady-t09-l5"]],["Emotional contagion","Catching others' emotions by automatically mimicking their expressions, posture and voice.",["steady-t05-l2"]],["Emotional cutoff","Managing unresolved family tension by withdrawing emotionally or physically, a pattern that can carry into adult relationships.",["steady-t07-l2"]],["Emotional flooding","A state where stress overloads the brain during conflict, so words, listening and problem-solving temporarily go offline.",["steady-t07-l1","steady-t07-l2"]],["Emotional granularity","The ability to identify and name emotions precisely rather than in broad terms like \"bad\" or \"upset.\"",["life-t08-l1"]],["Emotional immaturity","A pattern in which an adult is run by younger parts of themselves when life asks for patience, empathy or owning a mistake.",["people-t11-l3"]],["Emotional invalidation","Having your feelings repeatedly dismissed, minimized or punished, which teaches that feelings aren't safe to show.",["steady-t09-l4"]],["Emotional labor","The effortful, often invisible work of managing feelings, your own and others', to keep things running smoothly.",["steady-t05-l2"]],["Emotional numbing","Turning down feelings to avoid pain, which also turns down joy, because emotions don't have separate volume controls.",["steady-t07-l4"]],["Empathic accuracy","The ability to correctly infer what another person is thinking and feeling.",["steady-t05-l2"]],["Empathy versus compassion","Feeling someone's distress with them (empathy) increases your own distress; caring about it and wishing them well (compassion) builds warmth and resilience.",["steady-t05-l2"]],["End-of-history illusion","Believing you have changed a lot in the past but will change little in the future.",["change-t01-l4"]],["Endowed progress effect","A head start, even an artificial one, makes people more likely to finish a goal.",["change-t04-l1"]],["Essential moral self","The finding that people see moral traits like honesty, kindness and loyalty as the most essential part of who someone is, more than memory or personality.",["life-t02-l1"]],["Event centrality","How central a traumatic event becomes to a person's identity; greater centrality predicts more ongoing distress.",["people-t08-l3"]],["Excessive reassurance seeking","Repeatedly asking others for reassurance; relief fades quickly and the asking can strain relationships.",["steady-t06-l1"]],["Executive dysfunction","Difficulty starting, ordering steps and deciding, even when you know what needs doing.",["change-t07-l3"]],["Executive functions","Mental skills for planning, focusing, managing emotions and persisting through difficulty.",["people-t09-l4"]],["Experiencing and remembering selves","The self that lives each moment and the self that looks back and tells the story. The remembering self makes most judgments and choices.",["life-t01-l3"]],["Expression–experience gap","The difference between the full feeling inside and the small fraction that gets said, such as \"I'm fine.\"",["steady-t07-l1"]],["Expressive suppression","Hiding an emotion after it has started. Habitual use is linked to less closeness and can stress the people around you.",["steady-t01-l2","people-t02-l3"]],["Extinction","A behavior stopping once it's no longer rewarded. The original learning stays, with a new \"stop\" layer on top.",["people-t05-l2"]],["False consensus effect","Assuming most people think and choose the same way you do.",["steady-t06-l2"]],["Family accommodation","Family members stepping in to remove someone's discomfort; it brings relief to everyone now but blocks growth over time.",["life-t05-l1"]],["Family estrangement","Reduced or ended contact between family members, often after a long history of conflict or hurt.",["people-t09-l3"]],["Family homeostasis","A family system's pull to stay stable, even at the cost of truth or of one member's wellbeing.",["life-t02-l3"]],["Far transfer","Using a skill or idea in a very different area from where you learned it. Rare unless you deliberately look for connections.",["mind-t01-l2"]],["Fawn response","Staying close to people by becoming accommodating and undemanding, shrinking your own needs.",["steady-t06-l3"]],["Fear of being single","Anxiety about being without a partner, which makes people more willing to settle for less responsive relationships.",["life-t07-l2"]],["Fixed and growth mindsets","Believing ability is innate (fixed) versus believing it's built through effort and strategy (growth).",["people-t09-l4"]],["Fluid intelligence","Reasoning through new problems; it peaks early in adulthood.",["mind-t03-l1"]],["Flynn effect","The rise in average IQ scores of about three points per decade across the 20th century.",["mind-t03-l1"]],["Focusing illusion","Overestimating how much one thing matters to your happiness while you're thinking about it.",["steady-t02-l2"]],["FOMO and FOBO","Fear of missing out (that others are having better experiences without you) and fear of a better option (keeping every choice open in case something better comes along).",["life-t04-l1"]],["Freeze response","A defensive reaction to threat in which the body goes still and slows down, alongside fight and flight.",["people-t02-l3"]],["Fresh start effect","The extra motivation people feel at new beginnings, such as a new week, month or birthday.",["change-t01-l2"]],["Generalized other","The sense of the group's attitudes you carry everywhere; useful, but it has no actual faces.",["steady-t06-l2"]],["Gist and verbatim memory","Fuzzy-trace theory's two kinds of memory: verbatim stores exact words and labels; gist stores the meaning.",["mind-t07-l1"]],["Goal disengagement","Letting go of a goal that has become unattainable and putting the energy into a new one.",["change-t04-l3"]],["Good true self","The common belief that a person's \"true self\" is their good side, so positive changes are seen as the real person coming out.",["life-t02-l1"]],["Graded exposure","Facing a feared situation in small, controlled steps so each safe experience weakens the fear response.",["life-t10-l3"]],["Gray rock method","Becoming flat and uninteresting (short answers, no visible emotion) so a drama-seeking person loses their reward. Meant for people you can't avoid, not for living with abuse.",["people-t11-l2"]],["Half-splitting","Troubleshooting by testing the middle of a system first, so each test rules out about half of the possible causes.",["mind-t02-l2"]],["Halo effect","One strong impression, good or bad, coloring judgments of unrelated qualities, usually without our noticing.",["people-t02-l2"]],["Hardiness","A resilience pattern made up of commitment, control and challenge.",["steady-t01-l1"]],["Healthy adult mode","The part of the self that calms the vulnerable child, sets limits on angry and impulsive parts, and does adult work like keeping promises and owning mistakes.",["people-t11-l3"]],["Heart rate variability","Natural variation in the time between heartbeats. Higher resting HRV is linked to better emotional regulation.",["steady-t01-l2"]],["Heroic imagination","Preparing in advance to recognize harmful situations and act against them; heroes as ordinary people who see clearly and act early.",["people-t08-l1"]],["High place phenomenon","A sudden urge or pull near an edge that many people feel; usually a misread step-back safety reflex, not a wish to jump.",["life-t10-l3"]],["Home-field advantage in negotiation","People negotiate better on ground they've made their own; visitors do slightly worse.",["life-t06-l1"]],["Honest bid","A direct, small reach toward connection, like an invitation, instead of waiting to see who reaches out.",["people-t10-l3"]],["Honest signal","A signal that is costly or hard to fake, which makes it trustworthy. Emotional tears may have evolved as one.",["steady-t09-l3"]],["Honor and dignity logic","In honor logic, worth is granted by others, so an insult must be won back. In dignity logic, worth belongs to you and can't be taken.",["people-t04-l2"]],["Hostile attribution bias","Reading ambiguous actions as deliberately hostile.",["steady-t03-l1"]],["Hot-cold empathy gap","When calm, people underestimate how much a \"hot\" state like craving will change them; in the hot state, they can't see it changing them.",["change-t04-l2"]],["Hyper-intention","Trying so hard for an outcome, like sleep, happiness or meaning, that the trying becomes the obstacle.",["life-t03-l1"]],["Hypervigilance","Constantly scanning for signs of threat or rejection; in relationships, watching for signs of being dropped.",["steady-t06-l3"]],["Ichigo ichie","\"One time, one meeting\": the tea-ceremony idea that each encounter happens only once, so be fully present for it.",["life-t09-l1"]],["Identified patient","In family systems therapy, the member the family blames for its problems, who usually expresses the family's hidden strain rather than causing it.",["life-t02-l3"]],["Identity diffusion","A sense of having no solid identity, sometimes felt by people with many interests who don't fit a single job title.",["mind-t07-l5"]],["Identity-based habits","Habits built by collecting small actions as evidence of who you are becoming, rather than through willpower alone.",["change-t06-l3","change-t06-l4"]],["If-then signature","A person's stable pattern of behaving differently in different kinds of situations, such as calm when teased but angry when corrected.",["people-t01-l2","life-t01-l2"]],["Illusion of explanatory depth","Believing you understand how something works until you try to explain it step by step.",["mind-t03-l2"]],["Immune neglect","Forgetting that you'll cope, which makes people overestimate how long bad events will hurt.",["change-t03-l1"]],["Implementation intention","A plan in the form \"When X happens, I will do Y,\" which links an action to a specific trigger.",["change-t01-l2"]],["Impostor phenomenon","High achievers feeling like frauds despite their success.",["mind-t03-l3"]],["Impressionable years","The idea that experiences in childhood and early adulthood shape attitudes more lastingly than later experiences.",["life-t11-l1"]],["Incentive-sensitization theory","The theory that addiction sensitizes \"wanting\" (craving) far more than \"liking\" (pleasure), so craving can grow while enjoyment fades.",["change-t01-l3"]],["Incivility","Low-intensity rudeness with ambiguous intent to harm.",["people-t04-l2"]],["Incubation","Setting a problem aside after real effort so a solution can surface, ideally during an undemanding break.",["mind-t03-l2"]],["Inferiority complex","When the universal feeling of falling short hardens and takes over; often covered by a superiority complex.",["steady-t06-l1"]],["Inner speech","The silent voice in your head. Vygotsky argued it develops from children's out-loud \"private speech,\" which goes underground around age seven.",["steady-t08-l3"]],["Intellectual humility","Recognizing that your knowledge has limits and your beliefs might be wrong, and acting on it.",["mind-t05-l3","mind-t05-l2"]],["Intellectualization","Analyzing an emotion to avoid feeling it.",["mind-t03-l3"]],["Interleaving","Mixing different types of problems or skills in one practice session instead of practicing one type at a time.",["mind-t01-l1"]],["Internal compass","Judging your work and choices by your own standard first, rather than by outside approval.",["life-t06-l2"]],["Interpersonal complementarity","The pull in conversations: warmth tends to draw warmth, while dominance tends to draw its opposite.",["people-t04-l2"]],["Intrapsychic phase","The private first stage of a relationship ending, when one person weighs the relationship in their head before anything shows outwardly.",["people-t07-l2"]],["Job crafting","Reshaping the tasks, relationships and meaning of your work from the inside, without changing your job title.",["life-t03-l1"]],["JOMO","The joy of missing out: choosing what to skip on purpose and enjoying the choice you made.",["life-t04-l1"]],["Kodawari","A Japanese word for uncompromising devotion to a craft for its own sake.",["life-t09-l1"]],["Leader emergence and effectiveness","Two separate measures of leadership: who gets chosen to lead, and whether the team actually does well.",["people-t03-l2"]],["Learned helplessness","Giving up after repeated stress you can't control. Later research suggests passivity is the de
