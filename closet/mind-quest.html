<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e1">
<title>PsychToons Mind Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* VOICE  a pocket coach for one learner: playful and warm, never babyish; the questions stay calm and readable
   IDEA   a phone game in the hand: Today screen up top, five worlds to travel, each ending in a boss
   TYPE   Fredoka (display, rounded) + Nunito (text)
   COLOUR butter page and ink; one hue per world; play screens go quiet so the question is the loudest thing
   LAYOUT phone first: one column up to 640px, a sticky action dock at the bottom in the thumb zone
   ADHD   one thing per screen, instant feedback, short runs, visible progress, read-aloud, calm mode, break nudges */
:root{color-scheme:light dark;
  --sun:#ffcd3c;--sunink:#1d1a24;--coral:#ff5b4f;--blue:#2f5bff;--good:#12a36a;--bad:#e5383b;--purple:#9b4dff;--orange:#ff8a1f;
  --bg:light-dark(#fff8e1,#16141c);--card:light-dark(#ffffff,#221f2b);--card2:light-dark(#fffaea,#2a2635);
  --ink:light-dark(#1d1a24,#f4f1fa);--soft:light-dark(#5f5a6c,#b9b4c6);--line:light-dark(#efe3bf,#3a3546);
  --lift:0 1px 0 light-dark(rgba(29,26,36,.05),rgba(0,0,0,.35)),0 14px 30px -18px light-dark(rgba(60,40,0,.3),rgba(0,0,0,.7));
  --okbg:light-dark(#e3f7ee,#123527);--nobg:light-dark(#fde8e6,#3d1a1c)}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:500 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;letter-spacing:-.012em;line-height:1.12;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.mas{position:relative;display:inline-block;flex:none;width:96px;aspect-ratio:1}
.mas>*{position:absolute;inset:0;width:100%;height:100%}
.ico{display:block;flex:none}
.ico.off{opacity:.22;filter:grayscale(1)}
.muted{color:var(--soft)}.small{font-size:14px}
/* top bar (map screens) */
.hud{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.hrow{display:flex;align-items:center;gap:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:6px;border:0;background:none;padding:4px 6px 4px 0}
.brand .mas{width:36px}
.brand b{font:700 19px Fredoka,sans-serif;white-space:nowrap}
.pills{display:flex;gap:6px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 14px Fredoka,sans-serif;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;white-space:nowrap}
.pill .ico{width:20px;height:20px}
.pill.off{opacity:.55}
.gearbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.gearbtn svg{width:20px;height:20px}
main{padding-top:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body.inplay .hud{display:none}
body.inplay main{padding-top:0;padding-bottom:0}
/* common */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--lift)}
.btn{border:0;border-radius:16px;padding:12px 18px;min-height:54px;font:600 18px Fredoka,sans-serif;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.sun{background:var(--sun);color:var(--sunink)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--coral);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn small{display:block;font:700 13px Nunito,sans-serif;opacity:.8}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lnk{border:0;background:none;padding:6px 2px;font:700 15px Nunito,sans-serif;color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sect h2{font-size:22px}
.sect span{font-size:14px;color:var(--soft);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font:600 16px Fredoka,sans-serif;z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.inplay .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.cf{position:fixed;z-index:59;pointer-events:none;width:9px;height:14px;border-radius:2px;animation:cf 1.2s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{40%{transform:scale(1.08)}}
.shake{animation:sh .38s}@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
/* today */
.hello{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.hello .mas{width:104px}
.hello h1{font-size:28px}
.hello p{color:var(--soft);margin-top:4px}
.lvl{display:flex;align-items:center;gap:10px;margin-top:10px}
.lvl b{font:600 15px Fredoka,sans-serif;white-space:nowrap}
.meter{flex:1;height:12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sun),var(--orange));transition:width .6s}
.cont{margin-top:18px;position:relative;overflow:hidden;border:0;color:#fff;text-align:left;width:100%;background:linear-gradient(140deg,var(--w),color-mix(in srgb,var(--w) 60%,#1d1a24));padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.cont small{font:800 14px Nunito,sans-serif;opacity:.85}
.cont h2{font-size:25px;margin-top:2px}
.cont p{opacity:.9;margin-top:4px;font-size:15px}
.cont .ico{width:96px;height:96px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.cont .btn{grid-column:1/-1;margin-top:6px}
.daily .q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.daily .q:first-of-type{border-top:0}
.daily .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:#fff}
.daily .q.done .ck{background:var(--good);border-color:var(--good)}
.daily .q b{font-weight:800}
.daily .q .meter{height:8px;margin-top:5px}
.daily .q span.n{font:700 14px Fredoka,sans-serif;color:var(--soft)}
.chest{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border-radius:18px;background:var(--card2);border:1px dashed var(--line)}
.chest .ico{width:64px;height:64px}
.chest.ready{border:2px solid var(--sun);background:color-mix(in srgb,var(--sun) 22%,var(--card))}
.chest.ready .ico{animation:wob 1.4s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:14px;min-height:132px;box-shadow:var(--lift);position:relative}
.mode .ico{width:52px;height:52px}
.mode b{font:600 18px Fredoka,sans-serif;line-height:1.1}
.mode span{font-size:14px;color:var(--soft);line-height:1.3}
.mode .badge{position:absolute;top:12px;right:12px;background:var(--coral);color:#fff;border-radius:999px;font:700 13px Fredoka,sans-serif;padding:2px 9px}
.mode.lock{opacity:.6}
.worlds{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
.wcard{flex:none;width:min(250px,72vw);scroll-snap-align:start;border:0;border-radius:24px;padding:16px;text-align:left;color:#fff;background:linear-gradient(150deg,var(--w),color-mix(in srgb,var(--w) 55%,#1d1a24));box-shadow:var(--lift);display:flex;flex-direction:column;gap:8px;min-height:230px}
.wcard .ico{width:92px;height:92px;align-self:center;filter:drop-shadow(0 10px 16px rgba(0,0,0,.3))}
.wcard b{font:600 19px Fredoka,sans-serif;line-height:1.15}
.wcard span{font:700 14px Nunito,sans-serif;opacity:.9}
.wcard .meter{background:rgba(255,255,255,.25);border:0;height:8px;flex:none}
.wcard .meter i{background:#fff}
.links{display:grid;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:12px 14px;min-height:64px;box-shadow:var(--lift)}
.rowbtn .ico{width:44px;height:44px}
.rowbtn b{display:block;font:600 17px Fredoka,sans-serif}
.rowbtn span{font-size:14px;color:var(--soft)}
.rowbtn::after{content:"";margin-left:auto;width:10px;height:10px;border-right:3px solid var(--soft);border-top:3px solid var(--soft);transform:rotate(45deg);flex:none}
.stats{font-size:14px;color:var(--soft);margin-top:22px;text-align:center}
/* world */
.whead{border-radius:28px;padding:20px;color:#fff;background:linear-gradient(150deg,var(--w),color-mix(in srgb,var(--w) 50%,#1d1a24));display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;box-shadow:var(--lift)}
.whead .ico{width:96px;height:96px}
.whead h1{font-size:26px}
.whead p{opacity:.9;margin-top:4px;font-size:15px}
.whead .meter{background:rgba(255,255,255,.25);border:0;margin-top:10px}.whead .meter i{background:#fff}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font:700 16px Fredoka,sans-serif;color:var(--soft);padding:6px 0;margin-bottom:8px}
.back svg{width:18px;height:18px}
.path{position:relative;display:grid;gap:12px;margin-top:22px;padding:6px 0}
.path::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:3px;background:repeating-linear-gradient(var(--line) 0 14px,transparent 14px 24px)}
.node{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:min(86%,430px);text-align:left;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:12px;box-shadow:var(--lift)}
.node:nth-child(odd){justify-self:start}.node:nth-child(even){justify-self:end}
.node .num{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--w);color:#fff;font:700 20px Fredoka,sans-serif;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.node.done .num{background:var(--good)}
.node b{display:block;font:600 16px Fredoka,sans-serif;line-height:1.2}
.node .stars{display:flex;gap:2px;margin-top:4px}
.node .stars svg,.node .stars img{width:16px;height:16px}
.node .tier{width:40px;height:40px}
.node.next{border:2px solid var(--w);box-shadow:0 0 0 4px color-mix(in srgb,var(--w) 22%,transparent),var(--lift)}
.node.boss{width:min(92%,460px);justify-self:center;grid-template-columns:auto minmax(0,1fr);background:linear-gradient(150deg,#2b2052,#19122f);color:#fff;border:0}
.node.boss .ico{width:76px;height:76px}
.node.boss span{color:#cfc4f0;font-size:14px}
.node.boss.lock{filter:grayscale(.75);opacity:.75}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(15,10,25,.5);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:28px 28px 0 0;padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow:auto;box-shadow:0 -20px 50px -10px rgba(0,0,0,.4);animation:up .28s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:24px}
.shead{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.shead .ico{width:72px;height:72px}
.dress{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:start}
.dress>.mas{width:88px}
.sheet .ls{display:grid;gap:8px;margin:14px 0}
.sheet .ls div{border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--card2)}
.sheet .ls b{font:600 16px Fredoka,sans-serif}
.sheet .ls p{font-size:14px;color:var(--soft);margin-top:2px}
.set{margin-top:16px}
.set>b{display:block;font-weight:800;margin-bottom:6px}
.set>p{color:var(--soft);font-size:14px;margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 10px;font-weight:800;min-height:42px;color:var(--soft)}
.seg button.on{background:var(--ink);color:var(--bg)}
.gear{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.gear button{width:56px;height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card2);padding:3px;position:relative}
.gear button .mas{width:100%}
.gear button.on{border-color:var(--ink);background:color-mix(in srgb,var(--sun) 30%,var(--card2))}
.gear button:disabled{opacity:.35}
.gear button:disabled::after{content:attr(data-lv);position:absolute;right:2px;bottom:2px;font:700 11px Fredoka,sans-serif;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 5px}
/* play */
.pl{max-width:640px;margin:0 auto;min-height:calc(100dvh - 34px);display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.ptop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 0;background:var(--bg)}
.x{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--soft);flex:none}
.x svg{width:22px;height:22px}
.prog{flex:1;height:14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--good),#3fd08f);transition:width .4s}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
.hearts{display:flex;gap:2px;flex:none}.hearts .ico{width:24px;height:24px}.hearts .off{opacity:.25;filter:grayscale(1)}
.combo{display:inline-flex;align-items:center;gap:2px;font:700 15px Fredoka,sans-serif;color:var(--orange);flex:none}
.combo .ico{width:22px;height:22px}
.boss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:linear-gradient(150deg,#2b2052,#19122f);color:#fff;border-radius:20px;padding:10px 14px;margin-bottom:12px}
.boss .ico{width:64px;height:64px}
.boss b{font:600 17px Fredoka,sans-serif}
.boss .hp{height:12px;border-radius:999px;background:rgba(255,255,255,.18);margin-top:6px;overflow:hidden}
.boss .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5b4f,#ff8a1f);transition:width .4s}
.boss.hit .ico{animation:sh .4s}
.qbody{flex:1;padding-bottom:12px;animation:rise .3s cubic-bezier(.2,.8,.3,1)}
.kind{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kind .tag{font:600 14px Fredoka,sans-serif;color:#fff;background:var(--w);border-radius:999px;padding:3px 12px}
.kind .src{font-size:13px;color:var(--soft);font-weight:700}
.kind .spk{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.kind .spk svg{width:20px;height:20px}
.kind .spk.on{background:var(--ink);color:var(--bg)}
.stem{font:800 clamp(21px,5.6vw,27px)/1.3 Nunito,sans-serif;margin:14px 0 6px}
.ask{color:var(--soft);font-weight:800;margin:0 0 14px}
.qbody .dgm{max-height:40dvh;object-fit:contain}
.dgm{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:#faf6ee;margin:12px 0;cursor:zoom-in}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:18px;padding:12px 14px;min-height:60px;font-size:17px;line-height:1.32;font-weight:700;transition:transform .06s}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt kbd{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);font:700 15px Fredoka,sans-serif}
.opt.ok{border-color:var(--good);background:var(--okbg)}.opt.ok kbd{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--nobg)}.opt.no kbd{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
.betrow{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border-radius:16px;border:1px dashed var(--line)}
.betrow .ico{width:36px;height:36px}
.betrow p{flex:1;font-size:14px;color:var(--soft);line-height:1.3}
.betrow p b{color:var(--ink);font-size:15px}
.tgl{flex:none;width:56px;height:34px;border-radius:999px;border:0;background:var(--line);position:relative;transition:background .2s}
.tgl::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s}
.tgl.on{background:var(--purple)}.tgl.on::after{left:26px}
.betrow.on{border-style:solid;border-color:var(--purple);background:color-mix(in srgb,var(--purple) 10%,var(--card))}
.dock{position:sticky;bottom:0;z-index:6;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.dock.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--good) 40%,transparent);animation:up .25s cubic-bezier(.2,.8,.3,1)}
.dock.no{background:var(--nobg);border-color:color-mix(in srgb,var(--bad) 40%,transparent);animation:up .25s cubic-bezier(.2,.8,.3,1)}
.fb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;margin-bottom:12px}
.fb .mas{width:64px}
.fb h3{font-size:22px}
.dock.ok h3{color:light-dark(#0b7a4f,#4fe0a3)}.dock.no h3{color:light-dark(#c42b2e,#ff8a80)}
.fb p{font-size:15px;line-height:1.4;margin-top:4px}
.fb .from{font-size:13px;color:var(--soft);font-weight:700;margin-top:6px}
.fb .xp{display:inline-flex;align-items:center;gap:4px;font:700 15px Fredoka,sans-serif;color:var(--purple);margin-left:6px}
.seeit{font:700 14px Nunito,sans-serif;color:var(--ink);text-decoration:underline;background:none;border:0;padding:4px 0;margin-top:4px}
/* teach card */
.teach{flex:1;padding-bottom:12px;animation:rise .3s cubic-bezier(.2,.8,.3,1)}
.teach h2{font-size:clamp(24px,6.4vw,32px);margin-top:12px}
.teach .big{font-size:19px;line-height:1.42;font-weight:700;margin-top:10px}
.teach .steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.teach .steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:17px;line-height:1.38}
.teach .steps i{font:700 15px/28px Fredoka,sans-serif;font-style:normal;width:28px;height:28px;text-align:center;border-radius:9px;background:var(--w);color:#fff}
.teach .it{margin-top:14px;font:600 18px/1.35 Fredoka,sans-serif;background:var(--card2);border:1px solid var(--line);border-left:6px solid var(--sun);border-radius:16px;padding:12px 14px}
.teach .it small,.teach .cap small{display:block;font:800 13px Nunito,sans-serif;color:var(--soft);margin-bottom:2px}
.teach .cap{font-size:15px;color:var(--soft);line-height:1.4}
/* results */
.res{text-align:center;padding-top:22px}
.res .mas{width:130px}
.res h1{font-size:34px;margin-top:6px}
.res .sub{color:var(--soft);margin-top:4px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:16px 0 6px}
.bigstars .ico,.bigstars svg{width:70px;height:70px}
.bigstars .off{opacity:.2;filter:grayscale(1)}
.bigstars .on{animation:starin .55s cubic-bezier(.3,1.6,.5,1) both}
.bigstars .on:nth-child(2){animation-delay:.2s}.bigstars .on:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(0) rotate(-30deg)}}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.fig{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 8px}
.fig b{display:block;font:700 28px Fredoka,sans-serif;font-variant-numeric:tabular-nums}
.fig span{font-size:13px;color:var(--soft);font-weight:700}
.list{display:grid;gap:10px;margin-top:10px;text-align:left}
.item{border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--card)}
.item h3{font-size:18px}
.item p{margin-top:6px;color:var(--soft)}
.item .it{color:var(--ink);font-style:italic}
.item .btn{margin-top:10px;min-height:46px;font-size:16px}
.tierwin{display:flex;align-items:center;gap:12px;margin-top:14px;text-align:left;border-radius:20px;padding:12px 14px;background:color-mix(in srgb,var(--sun) 22%,var(--card));border:2px solid var(--sun)}
.tierwin .ico{width:64px;height:64px}
/* deck + review */
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.boxes div{border-radius:18px;padding:12px 6px;text-align:center;background:var(--card);border:1px solid var(--line)}
.boxes b{display:block;font:700 26px Fredoka,sans-serif}
.boxes span{font-size:13px;color:var(--soft);font-weight:800}
.flip{min-height:46dvh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 20px}
.flip .stem{margin:10px 0}
.flip .ans{margin-top:16px;padding-top:16px;border-top:2px dashed var(--line);font-size:19px;font-weight:700;animation:rise .3s}
.pips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}.pips i{width:24px;height:24px;border-radius:8px;background:var(--line)}.pips i.on{background:var(--good)}
/* lightning */
.lt{display:flex;align-items:center;gap:12px}
.ring{width:56px;height:56px;border-radius:50%;padding:5px;background:conic-gradient(var(--coral) calc(var(--p)*1%),var(--card2) 0);flex:none}
.ring b{width:100%;height:100%;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 19px Fredoka,sans-serif;font-variant-numeric:tabular-nums}
.score{font:700 22px Fredoka,sans-serif}
/* brief */
.pbx{border:1px solid var(--line);border-radius:22px;padding:16px;background:var(--card);box-shadow:var(--lift)}
.pbx h3{font-size:20px}
.pbx .big{margin-top:6px;color:var(--soft)}
.pbx .steps{margin:10px 0 0;padding-left:1.25em}.pbx .steps li{margin:4px 0;line-height:1.45}
.pbx .it{margin-top:10px;font-style:italic}
.ep{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;line-height:1.3;min-height:56px}
.ep svg{flex:none;width:30px;height:30px}
.ep small{display:block;font-weight:700;color:var(--soft);font-size:13px}
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,8,14,.92);overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start;padding:16px;cursor:zoom-out}
.lb img{flex:none;width:1100px;max-width:none;height:auto;margin:auto;border-radius:14px;background:#faf6ee}
.lb button{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;border:0;border-radius:12px;background:#fff;color:#1d1a24;font:700 16px Nunito,sans-serif;padding:10px 16px}
/* break */
.brk{text-align:center;padding:30px 0}
.brk .mas{width:150px}
.brk h1{font-size:30px;margin-top:8px}
.brk p{color:var(--soft);margin:8px auto 18px;max-width:28em}
.bigring{width:150px;height:150px;margin:0 auto 18px;border-radius:50%;padding:10px;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--card2) 0)}
.bigring b{width:100%;height:100%;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 44px Fredoka,sans-serif}
@media(min-width:900px){body{zoom:1.2}}
@media(min-width:1500px){body{zoom:1.4}}
@media(min-width:700px){.modes{grid-template-columns:repeat(4,minmax(0,1fr))}.sheet{left:50%;right:auto;width:600px;margin-left:-300px;border-radius:28px;bottom:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.calm *{animation:none!important}
body.calm .cf{display:none}

<script>
{
const D = {"ch":[["change","Discipline and Change"],["mind","How You Learn and Think"],["steady","Calm, Strength and Self-Worth"],["people","Reading and Relating to People"],["life","Your Own Path"]],"topics":[{"id":"change-t01","ch":"change","num":1,"t":"Discipline Without Willpower","ls":[{"id":"change-t01-l1","n":1,"t":"Discipline is a trained prediction, not a muscle","dg":[["change-T01-toll-signal.webp","Two columns comparing effort followed by criticism with effort followed by an immediate small reward","Effort as a toll, or effort as a signal"]],"ep":[["CkP_8bkjf1E","Psychology of Discipline (And How to Trick Your Brain Into Craving It)","14:44"],["BqJPKi2LJAo","Psychology Of Consistency (And Why You Always FAIL)","16:03"]],"st":[["Pick one task","you want to do most days (exercise, study, practice, writing)."],["Design the room tonight.","Put what you need where you'll see it; move the main distraction somewhere else for that hour."],["Shrink the entry","to a first step that takes under two minutes."],["Add one doorway reward","you only get during the task."],["End on a small win","every time, then mark it done right away."]],"pf":"This week: redesign one task you keep putting off.","pit":"When I get home and put my bag down, I'll pick up the guitar and play one song I know.","big":"Disciplined people aren't better at forcing themselves. They've trained their brains to expect something good from effort, and they set up their days so there's less to resist.","ex":"Sam wants to practice guitar for 20 minutes every evening, but keeps ending up on his phone.","tk":["Disciplined people tend to **face fewer temptations**, because they arrange their surroundings in advance.","Effort can start to feel rewarding when it's **reliably followed by something good**.","The flinch before a task is a **prediction** based on how past sessions felt.","Ending sessions with harsh self-criticism makes the **next start harder**.","**Designing the room** is the most reliable of the five fixes; temptation bundling helps you start."],"q":[["In the 2012 study, how did people high in self-control differ from others?","They reported fewer temptations and less inner conflict, not more resisting, and still reached their goals more often."],["What is learned industriousness?","The idea that when effort is reliably followed by reward, the feeling of effort itself becomes more rewarding."],["Why might opening a notebook make you flinch while picking up your phone pulls you in?","Your brain predicts what each cue leads to: the phone predicts pleasure, the notebook predicts strain and self-criticism from past sessions."],["What's the risk of ending a hard session with \"that was awful\"?","It pairs effort with punishment, so the next start feels worse."],["What is temptation bundling, and what's its limit?","Keeping a treat that only exists at the hard task. It helps you start, but its boost tends to fade, so pair it with a habit cue."],["Which of the five fixes reduces how many fights you have to win?","Designing the room: removing the temptation before the moment arrives."]],"pr":"This week: redesign one task you keep putting off.","it":""},{"id":"change-t01-l2","n":2,"t":"Consistency is how fast you come back","dg":[["change-T01-streak-vs-return.webp","A rising habit-strength curve with a small dip at a missed day, beside a dashed streak line that falls to zero","What a missed day actually does"]],"ep":[["BqJPKi2LJAo","Psychology Of Consistency (And Why You Always FAIL)","16:03"],["CkP_8bkjf1E","Psychology of Discipline (And How to Trick Your Brain Into Craving It)","14:44"],["opyoqoddtBc","Psychology of Addiction (And How to Beat It Without Willpower)","16:58"]],"st":[["Pick one habit","you've started and stopped before."],["Write an if-then plan","with a specific time, place and first action."],["Set your floor:","the version you could do while sick or exhausted."],["Decide your slip rule now:","\"If I miss a day, I do the floor version the next day, no matter what.\""],["Track returns:","mark every day you do it, and add a star every time you come back after a miss."]],"pf":"This week: make one habit bounce-proof.","pit":"If I miss a day, I'll do the floor version the next day, no matter what.","big":"Inconsistency isn't a willpower problem; it's a counting problem.","ex":"Priya wants to walk 30 minutes every morning before work.","tk":["One slip does little harm; the **drop in confidence** afterward is what snowballs.","Waiting for a fresh start after a slip **costs days or weeks**.","Write plans as **if-then sentences** with a time and a place.","Habits took a median of about **66 days**, with a wide range, and one missed day didn't matter.","Kindness to yourself after a slip **helps you return**."],"q":[["What is the \"what-the-hell\" effect?","After one slip, people treat the goal as already broken and give up for the day (or longer), like dieters who ate more after a milkshake."],["According to the 2023 setback research, what links one slip to the next?","Lower confidence that you can stick with the goal."],["What's the downside of the fresh start effect?","If you only restart on landmarks like Mondays, a midweek slip turns into several lost days."],["Write an if-then plan for drinking more water.","Example: \"When I sit down at my desk in the morning, I'll fill my water bottle first.\""],["In Lally's study, how long did habits take, and what did one missed day do?","A median of about 66 days (18 to 254); a single missed day didn't slow habit formation."],["What is a \"floor\" for a habit?","The smallest version you can do on your worst day, so the habit continues even when life gets hard."]],"pr":"This week: make one habit bounce-proof.","it":"If I miss a day, I'll do the floor version the next day, no matter what."},{"id":"change-t01-l3","n":3,"t":"Wanting and liking: how compulsive habits work","dg":[["change-T01-wanting-liking.webp","A rising wanting line and a flat or falling liking line, with the gap between them growing over repetitions","The two lines that separate"]],"ep":[["opyoqoddtBc","Psychology of Addiction (And How to Beat It Without Willpower)","16:58"],["CkP_8bkjf1E","Psychology of Discipline (And How to Trick Your Brain Into Craving It)","14:44"]],"st":[["Map the loop:","write the cue (where, when, what feeling), the action, and what you actually get from it."],["Add friction to the cue:","one change that adds 30 seconds or more between the cue and the habit."],["Practice urge surfing once a day:","when the urge comes, set a ten-minute timer and watch it."],["Do it mindfully once:","full attention, no second screen, then rate how much you actually enjoyed it."],["Add one real reward","to the time slot the habit used to fill."]],"pf":"This week: map and loosen one compulsive habit.","pit":"When I get into bed, I put my phone on the kitchen charger and pick up my book.","big":"The thing you can't stop is often the thing you've stopped enjoying.","ex":"Jordan scrolls social media for two hours most nights and feels worse afterward.","tk":["**Wanting and liking are separate**; repetition can grow the pull while the pleasure fades.","Cues and places carry much of a habit, so **changing your surroundings** often works better than resisting.","Urges rise and fall; **noticing one without acting** reduces use.","After cutting a habit, **add other real rewards**.","**Physical dependence on alcohol, benzodiazepines or opioids needs medical support.**"],"q":[["What's the difference between wanting and liking?","Wanting is the pull toward something; liking is the pleasure you actually get. They run on separate systems, and repetition can grow wanting while liking falls."],["What did the Vietnam veterans study show?","Most soldiers addicted in Vietnam didn't become readdicted at home, showing how much a habit depends on its setting and cues."],["What is urge surfing?","Noticing an urge rise, peak and fall without acting on it."],["Why is \"I'll stop when things calm down\" misleading?","Stress is a major trigger for craving, so waiting for calm keeps the loop going."],["Why rebuild liking after cutting a habit?","So life without the habit doesn't feel empty, which lowers the pull to return."],["Who should not try to quit on their own?","Anyone physically dependent on alcohol, benzodiazepines or opioids; they need medical help."]],"pr":"This week: map and loosen one compulsive habit.","it":"When I get into bed, I put my phone on the kitchen charger and pick up my book."},{"id":"change-t01-l4","n":4,"t":"Turning points: how sudden change happens","dg":[["change-T01-crystallization.webp","A five-step flow from scattered complaints to a trigger, a connected pattern, a first step within 24 hours, and follow-through","From scattered complaints to a decision"]],"ep":[["ZQskL6SstIk","Psychology of Self-Transformation: Change Your Life So Fast It Feels Illegal","15:12"],["BqJPKi2LJAo","Psychology Of Consistency (And Why You Always FAIL)","16:03"]],"st":[["Set aside 20 minutes","somewhere quiet."],["List every recurring complaint","from the past year, one line each, with no excuses."],["Read the page top to bottom","and write one sentence: \"What these have in common is ___.\""],["Choose one step within 24 hours","that someone else could see: a message, a booking, a cancellation."],["Plan the follow-through:","one small, finishable action per week for the next month."]],"pf":"This week: run the one-page exercise.","pit":"If I finish the page and see a pattern, then before bed I'll send one message that starts acting on it.","big":"Big changes are often kept gradually but started suddenly","ex":"Leah has felt \"off\" about her job for two years but never acted.","tk":["Change is often **started suddenly** and **kept gradually**.","Turning points usually come from **old complaints connecting**, not from new problems.","People expect to change **less in the future** than they actually will.","When clarity arrives, take **one real step within a day**.","**Finishing small challenges** is what turns a decision into lasting change."],"q":[["What is the crystallization of discontent?","Separate complaints suddenly linking into one pattern that can't be explained away, which triggers a decision to change."],["What is a sudden gain in therapy?","A large part of a person's improvement happening in one jump between sessions."],["What is the end-of-history illusion?","Believing you've changed a lot in the past but will change little in the future."],["Why can a calendar start date work against you?","It delays action until the force of the moment of clarity has faded."],["In the study of students trying to change their personalities, what predicted change?","Completing the challenges they took on; failing accepted challenges predicted change in the opposite direction."]],"pr":"This week: run the one-page exercise.","it":"If I finish the page and see a pattern, then before bed I'll send one message that starts acting on it."}]},{"id":"change-t02","ch":"change","num":2,"t":"Recovery: Rest and Sleep","ls":[{"id":"change-t02-l1","n":1,"t":"Rest is a skill with four parts","dg":[["change-T02-four-recovery.webp","Four cards for detachment, relaxation, mastery and control, each with the real version and its fake","The four parts of real rest, and their fake versions"]],"ep":[["CwhUi9A8LeE","Psychology of Rest: Recover So Well It Makes You Dangerous","14:55"],["CkP_8bkjf1E","Psychology of Discipline (And How to Trick Your Brain Into Craving It)","14:44"]],"st":[["Score your evenings:","rate detachment, relaxation, mastery and control from 1 to 5 for tonight."],["Build an ending ritual:","three lines for tomorrow, then a short walk or change of clothes."],["Pick one mastery activity","and schedule two sessions this week."],["Protect one window","of an hour with notifications off."],["Check your mornings:","rate your energy on waking each day."]],"pf":"This week: rebuild three weeknights.","pit":"When I close my laptop, I write tomorrow's three priorities and then take a ten-minute walk.","big":"The hours you spend not working barely predict whether you recover. What matters is whether those hours contain four experiences: switching off from work, actually relaxing, doing something mildly challenging, and choosing how you spend the time.","ex":"Marcus manages a small team and spends evenings \"relaxing\" on his phone, yet wakes up tired.","tk":["Recovery depends on four **experiences** (detachment, relaxation, mastery, control), not just hours off.","**Switching off from work in your head** is the most important of the four.","A mildly **challenging hobby** can restore you more than passive scrolling.","Vacation benefits **fade within weeks**, so build recovery into ordinary days.","Give the workday an **ending**: write tomorrow's priorities, then do something physical."],"q":[["Name the four recovery experiences.","Detachment, relaxation, mastery and control."],["Why doesn't scrolling usually count as rest?","It keeps your mind partly on work and your arousal high, so you don't detach or relax."],["What makes a good mastery activity?","It's slightly hard, unmeasured, has no audience and isn't your job."],["What is allostatic load?","The wear the body builds up from adapting to stress, especially when the stress response keeps running after the stressor ends."],["Why are ordinary evenings more important than vacations for recovery?","Vacation benefits fade within weeks, while recovery built into weeknights keeps going all year."],["What are the two parts of \"build an ending\"?","Write tomorrow's three priorities, then cross a physical line like a walk or a change of clothes."]],"pr":"This week: rebuild three weeknights.","it":"When I close my laptop, I write tomorrow's three priorities and then take a ten-minute walk."},{"id":"change-t02-l2","n":2,"t":"Sleep: less time in bed, deeper sleep","dg":[["change-T02-two-process.webp","A sawtooth sleep-pressure line rising across the day and falling at night, with a wavy circadian line, over two days","Two forces behind every night"]],"ep":[["vIH0GS_cXv0","Psychology of Sleep: How To Sleep Less Hours And Wake Up Fresh","15:09"],["CwhUi9A8LeE","Psychology of Rest: Recover So Well It Makes You Dangerous","14:55"]],"st":[["Keep a sleep log","for seven nights: time to bed, time you think you fell asleep, wake time, time out of bed."],["Work out your sleep efficiency:","hours asleep divided by hours in bed."],["Fix your wake time","for the whole week, weekends included, and get outdoor light within an hour."],["Use the get-up rule","whenever you're awake and frustrated."],["Move caffeine","to before midday."]],"pf":"This week: measure, then anchor.","pit":"If I've been awake in bed long enough to feel annoyed, then I get up and read on the couch until I'm sleepy.","big":"Your sleep need is close to fixed, but the time you spend awake in bed isn't. Cutting that wasted time makes the sleep you keep deeper.","ex":"Dana goes to bed at 10 p.m. to \"get plenty of sleep\" but lies awake until midnight and wakes groggy at 7.","tk":["Sleep need is close to fixed; **time awake in bed** is what you can cut.","**Sleep pressure** and the **body clock** together decide how deep your sleep is.","Same **wake time** every day, morning light, and bed only when sleepy are the core habits.","If you're lying awake frustrated, **get up** and come back when sleepy.","Six-hour nights impair you more than you notice. **See a doctor** for sleep disorders or daytime sleepiness."],"q":[["What is sleep efficiency, and what's a good number?","The share of time in bed you're actually asleep; about 85% or more."],["What are the two forces that regulate sleep?","Sleep pressure, which builds while you're awake, and the body clock, which opens a window for sleep."],["Why can going to bed early make sleep worse?","There isn't enough sleep pressure yet, so sleep spreads thin and lying awake teaches the bed to mean worry."],["What should you do if you've been lying awake and frustrated?","Get up, go somewhere dim and calm, and come back to bed when sleepy."],["Why can't you trust feeling fine on six hours?","People kept to six hours rated themselves only a little sleepy while their performance dropped sharply."],["What's the safe rule for when not to try sleep compression on your own?","If you have a sleep disorder, struggle to stay awake in the day, or average under six hours, see a doctor."]],"pr":"This week: measure, then anchor.","it":"If I've been awake in bed long enough to feel annoyed, then I get up and read on the couch until I'm sleepy."}]},{"id":"change-t03","ch":"change","num":3,"t":"Getting Out of Your Own Way","ls":[{"id":"change-t03-l1","n":1,"t":"Self-sabotage: protecting an old verdict","dg":[["change-T03-sabotage-loop.webp","A four-step cycle: success arrives, it clashes with the old verdict, a quick correction, the verdict is confirmed","The correction loop"]],"ep":[["O-Wu5Whk8eI","Psychology of Self-Sabotage (And How to Hack Your Brain to Stop It)","14:51"],["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"]],"st":[["Start an evidence file:","list five things you finished or delivered recently."],["Pick one upcoming test","that matters but won't ruin you."],["Set the deadline now","and tell one person."],["Remove handicaps:","plan sleep, preparation and arrival time."],["Write the worst case","and how much it will matter in a month."]],"pf":"This week: enter one thing clean.","pit":"If I catch myself staying up late before something important, I'll ask, 'Am I building an excuse?' and go to bed.","big":"Self-sabotage isn't a failure of wanting; it's a protective system defending a self-image that has never been tested.","ex":"Rachel is a strong candidate for a promotion, and the interview is Thursday.","tk":["**Self-handicapping** creates an excuse in advance so failure can't count against you.","People tend to seek confirmation of how they **already** see themselves, even negatively.","Self-handicapping goes with **lower achievement** over time.","Change your self-view with **evidence**, not slogans.","People **overestimate** how long failure will hurt."],"q":[["What is self-handicapping?","Creating an obstacle in advance so a failure can be blamed on it instead of on your ability."],["What does self-verification theory say?","People want to be seen as they see themselves, even when that view is negative."],["Why do people often quit in the last 10%?","As the goal gets closer, fear grows faster than the attraction."],["Why can affirmations backfire?","For people with low self-esteem, they clash with what they believe; evidence works better."],["What does \"price the failure honestly\" mean?","Write the specific worst case and how much it will matter in a month, since people overestimate how long bad events hurt."]],"pr":"This week: enter one thing clean.","it":"If I catch myself staying up late before something important, I'll ask, 'Am I building an excuse?' and go to bed."},{"id":"change-t03-l2","n":2,"t":"Positive delusion: how much self-belief helps","dg":[["change-T03-counterfeits.webp","Two columns pairing each counterfeit with the working alternative","Three counterfeits and the working version"]],"ep":[["axdQv2AopO8","Psychology of Positive Delusion: Achieve Anything By Being Delusional","16:11"],["qL-uEtXmnqE","Psychology of Confidence: Be So Confident It Makes People Nervous","13:43"]],"st":[["Pick one belief","about yourself you haven't tested."],["Do WOOP in writing:","wish, best outcome, main inner obstacle, if-then plan."],["Reword it to your ceiling:","\"I can learn to…\" rather than \"This will work.\""],["Take one real attempt","within seven days."],["Write what you learned","from the attempt."]],"pf":"This week: do one WOOP and spend it.","pit":"If I catch myself daydreaming about the finished result, I'll name the next obstacle and the first action.","big":"Self-belief works, but only a thin, specific version of it, and only if you spend it quickly.","ex":"Leo believes he could be a great freelance photographer, and has for five years.","tk":["A **slight** overestimate of yourself helps; a large one is risky.","Self-belief works by changing **what you attempt**.","**Vivid fantasies** of success tend to lower effort and energy.","The **most optimistic** founders tend to grow their businesses less.","Picture the goal, then **name the obstacle**, and spend the belief within a week."],"q":[["What is the optimal margin of illusion?","A slight to moderate overestimate of yourself helps; a large one is dangerous."],["How does self-belief improve results?","It changes what you're willing to attempt, which brings feedback and skill."],["What's the difference between expectations and fantasies?","Expectations judge that success is likely; fantasies vividly experience it as already happened, which lowers effort."],["What are the steps of WOOP?","Wish, Outcome, Obstacle, Plan."],["Why spend a belief within seven days?","Real attempts build mastery, the strongest source of self-belief, and keep the belief tied to reality."]],"pr":"This week: do one WOOP and spend it.","it":"If I catch myself daydreaming about the finished result, I'll name the next obstacle and the first action."},{"id":"change-t03-l3","n":3,"t":"Productivity: fixing the shape of the day","dg":[["change-T03-planning-fallacy.webp","Bar chart of predicted, worst-case and actual days to finish a thesis","The thesis study"]],"ep":[["f6HShztYHcQ","Psychology of Productivity: Be So Productive It Feels Illegal","15:46"],["CkP_8bkjf1E","Psychology of Discipline (And How to Trick Your Brain Into Craving It)","14:44"]],"st":[["Each evening,","write one if-then plan for tomorrow's most important task."],["Batch notifications:","close messages for your first focused block."],["Use the 90-second close","every time you stop a task."],["Check your record:","compare how long three recent tasks took with how long you expected."],["Limit your list","to two real pieces of work per day."]],"pf":"This week: redesign three workdays.","pit":"When I'm about to switch tasks, I'll write the next step on a sticky note first.","big":"Most people don't have an effort problem; they have a structure problem.","ex":"Kevin, a marketing manager, ends most days exhausted with his two big projects untouched.","tk":["Switching tasks leaves **attention residue**, worst when the task is unfinished.","Real workdays are highly **fragmented**.","People underestimate how long tasks take (the **planning fallacy**).","**If-then plans** reliably help people follow through.","Close each task with a **written next step**, and plan from your **record**."],"q":[["What is attention residue?","Part of your attention staying on the task you just left, lowering performance on the next one."],["When is attention residue worst?","When you leave a task unfinished without a clear stopping point."],["What is the planning fallacy?","Underestimating how long tasks will take, even when you know past tasks ran late."],["What is an implementation intention?","An if-then plan that sets when, where and how you'll act: \"At 9, when I sit down, I'll write section two.\""],["What should you do before stopping any task?","Write where you are and the very next step."]],"pr":"This week: redesign three workdays.","it":"When I'm about to switch tasks, I'll write the next step on a sticky note first."},{"id":"change-t03-l4","n":4,"t":"The \"dopamine hole\": a stretched reward scale","dg":[["change-T03-traps-exits.webp","Two columns pairing the top-up, the unbroken stream and the waiting room with their exits","Three traps, three exits"]],"ep":[["IAWxQAu2Pfw","Psychology of Dopamine (And How To Quickly Escape A Dopamine Hole)","14:49"],["opyoqoddtBc","Psychology of Addiction (And How to Beat It Without Willpower)","16:58"]],"st":[["Identify your most intense source","(one app, game or habit)."],["Pause only that one","for seven days."],["Add three breaks:","autoplay off, one screen-free meal a day, one walk without headphones."],["Do one chosen activity daily","before you feel like it: 10 pages, a call, a short project."],["Rate your evenings","from 1 to 5 each night."]],"pf":"This week: one-week reset.","pit":"When I feel bored and reach for my phone, I'll do two minutes of something I chose first.","big":"The gray, restless feeling after hours of scrolling isn't an empty dopamine tank; it's a reward scale stretched by recent intense rewards.","ex":"Sophie spends her evenings on short videos and feels flat and restless by 10 p.m. Reading, which she used to love, now feels boring.","tk":["Feeling flat after overstimulation is **reward contrast**, not an empty tank.","Each reward is judged **against the ones just before it**.","**Breaks** make pleasant experiences more enjoyable, though people predict the opposite.","**Action comes before motivation**, not after.","Long-lasting numbness that covers everything deserves medical attention."],"q":[["What is negative contrast?","Judging a reward as worse because it follows a bigger one."],["Why do ordinary things feel boring after hours of scrolling?","The reward scale is stretched by intense, novel content, so normal pleasures score low by comparison."],["What did the breaks studies find?","Breaks made pleasant experiences more enjoyable, even though people predicted the opposite."],["What does \"lower the ceiling\" mean?","Giving up only the single most intense source for a week so the scale can shrink back."],["What is behavioral activation?","Doing small chosen activities before motivation arrives, because action tends to bring motivation."]],"pr":"This week: one-week reset.","it":"When I feel bored and reach for my phone, I'll do two minutes of something I chose first."}]},{"id":"change-t04","ch":"change","num":4,"t":"Discipline That Lasts","ls":[{"id":"change-t04-l1","n":1,"t":"Discipline in the middle","dg":[["change-T04-u-shape.webp","A U-shaped curve of motivation across a goal, with the middle labeled and habits listed beneath","Stuck in the middle"]],"ep":[["ltFkUizYdR0","10 Boring Habits That Will Make You Scary Disciplined","16:17"],["BqJPKi2LJAo","Psychology Of Consistency (And Why You Always FAIL)","16:03"]],"st":[["Write the boring version","of week five."],["Count your head start","and record it as the first entries."],["Cut the goal into four-week blocks.",""],["Fix one setting:","same place, same time, same first move."],["Start a one-number log.",""]],"pf":"This week: set up the boring structure for one goal.","pit":"When I sit down at 7 a.m., I'll open the document before I check anything else.","big":"Discipline isn't decided at the start or the finish; it's decided in the middle, where motivation sags for almost everyone.","ex":"Omar has started a 12-week half-marathon plan three times and quit around week five each time.","tk":["Motivation follows a **U-shape**: it sags in the middle for almost everyone.","Standards slip in the middle because middle actions **don't feel like they count**.","**Shorten the middle** with four-week blocks, and **never start at zero**.","Tie habits to a **fixed place, time and first move**.","**Write the number down** and **stop while you know what's next**."],"q":[["What shape does motivation follow across a goal?","A U-shape: high at the start, high near the end, lowest in the middle."],["Why does progress feel invisible in the middle?","You're far from both the starting point and the finish, so each step looks small."],["What did the car-wash study show?","A head start, even a made-up one, helped more people finish."],["What question turns a single day back into a pattern?","\"If I made this choice every time for the next month, what would that month look like?\""],["Why shouldn't you reward yourself with the thing you're quitting?","Progress can act as a permission slip, and the reward pays the old habit to come back."],["Why stop while you still know what comes next?","It makes tomorrow's restart easier, because people feel a pull to finish what they started."]],"pr":"This week: set up the boring structure for one goal.","it":"When I sit down at 7 a.m., I'll open the document before I check anything else."},{"id":"change-t04-l2","n":2,"t":"Urges: winning before the moment","dg":[["change-T04-urge-timeline.webp","A timeline from calm hours to spark to elaboration to the hot moment, with the two winnable points highlighted","Where the fight is won"]],"ep":[["NhuCb-PirBo","Psychology of Lust (And How To Defeat It Overnight)","15:39"],["opyoqoddtBc","Psychology of Addiction (And How to Beat It Without Willpower)","16:58"]],"st":[["Notice the intrusion","each time, and name it: \"That's a spark.\""],["Pick a first-minute task:","an absorbing visual game or puzzle on a separate device."],["Set two mast rules this afternoon","for tonight, and make them physical."],["Close one test door:","delete or unfollow one thing you keep \"just to check.\""],["Tell one trusted person","what you're working on."]],"pf":"This week: move the fight to the right place.","pit":"When a spark lands, I'll start my three-minute puzzle before I do anything else.","big":"Unwanted desire never wins in the moment it appears; it gets built over minutes or hours, and the real decision is lost long before the moment of giving in.","ex":"Sam has promised himself many mornings to stop late-night scrolling of content he regrets, and keeps ending up there at 1 a.m.","tk":["Desire has two stages: an automatic **intrusion** and an **elaboration** you build.","The calm you can't predict the aroused you (the **hot-cold empathy gap**).","Three traps: **the replay, the white bear, the test**.","Fight in the **first minute** and in the **calm hours beforehand**.","If it's taking over your life, **professional help works**."],"q":[["What are the two stages of desire in elaborated intrusion theory?","The intrusion (an automatic thought) and the elaboration (adding detail), which is where desire grows."],["What is the hot-cold empathy gap?","When calm, people underestimate how much a hot state will change them; in the hot state, they can't see it changing them."],["Why does \"don't think about it\" backfire?","Fighting the thought keeps the body charged with it."],["What is the restraint bias?","Overestimating your self-control, which leads people into more temptation."],["What does \"tie yourself to the mast\" mean here?","Setting rules while calm and making them hard for your later self to undo."]],"pr":"This week: move the fight to the right place.","it":"When a spark lands, I'll start my three-minute puzzle before I do anything else."},{"id":"change-t04-l3","n":3,"t":"Quitting well","dg":[["change-T04-run-or-walk.webp","Two columns comparing avoidant and strategic quitting: what drives each, when it happens, how it feels and the right response","Running from or walking toward?"]],"ep":[["IRIXXZJtHVE","The Psychology of People Who Quit (The Hidden Trigger No One Talks About)","9:08"],["axdQv2AopO8","Psychology of Positive Delusion: Achieve Anything By Being Delusional","16:11"]],"st":[["Pick one commitment","you're unsure about."],["Write two columns:","what you'd be running from, and what you'd be walking toward."],["If running is longer,","choose one hard thing to do this week instead of leaving."],["If walking is longer,","draft your closure plan: who to tell, when, and how to finish well."],["Write the lesson","from the last thing you quit."]],"pf":"This week: run the test on one commitment.","pit":"When I feel the urge to quit, I'll write the two columns before I tell anyone.","big":"Quitting isn't always a failure of character; walking away from what isn't working can be a skill.","ex":"Leah is 18 months into a part-time master's program and dreads every class.","tk":["**Persistence** has value, but it isn't the same as **wisdom**.","The **sunk cost fallacy** keeps people investing because of what they've already spent.","**Restlessness** can be an early signal that effort no longer matches value.","**Avoidant** quitting runs from pain; **strategic** quitting walks toward something better.","Quit well: **conscious closure, extract the lesson, protect your narrative**."],"q":[["What is the sunk cost fallacy?","Continuing to invest in something because of what you've already spent rather than its future value."],["What are the two systems the video describes?","A goal-persistence system that locks onto targets, and an environmental-monitoring system that checks whether the effort is still worth it."],["What's the difference between avoidant and strategic quitting?","Avoidant quitting is driven by fear or difficulty; strategic quitting comes after weighing the evidence."],["What is the one-question test?","Am I running from pain, or walking toward something better?"],["What are the three principles for quitting well?","Conscious closure, extract the lesson, and protect your narrative."]],"pr":"This week: run the test on one commitment.","it":"When I feel the urge to quit, I'll write the two columns before I tell anyone."}]},{"id":"change-t05","ch":"change","num":5,"t":"From Wanting to Doing","ls":[{"id":"change-t05-l1","n":1,"t":"Ambitious but stuck: proof beats motivation","dg":[["change-T05-proof-loop.webp","Two columns comparing each step of the stuck loop with the proof loop","From the stuck loop to the proof loop"]],"ep":[["zZwQ6QarUco","Psychology of People Who Are Ambitious But Do Nothing","11:23"],["O-Wu5Whk8eI","Psychology of Self-Sabotage (And How to Hack Your Brain to Stop It)","14:51"]],"st":[["Pick the goal","you think about most and haven't started."],["Shrink the first step","until it takes 10 minutes or less and has a clear finish."],["Finish one step a day","for five days."],["Log each one","in a short \"proof list.\""],["When shame shows up,","ask what you'd say to a friend in the same spot."]],"pf":"This week: five pieces of proof.","pit":"When I catch myself waiting to feel ready, I'll do a 10-minute version and stop when the timer ends.","big":"People who are ambitious but do nothing aren't lazy; they're overwhelmed by the size of their vision and protecting the story that they could do it if they really tried.","ex":"Imani has wanted to start a podcast about local history for four years.","tk":["Ambitious inaction usually comes from **overwhelm**, not laziness.","**Potential mode** protects the story that you could do it if you tried.","Ambition and inaction **feed each other** through the gap.","Procrastination is **emotion-focused coping**, not a time-management problem.","Break the loop with **proof**: one small, finished thing, repeated."],"q":[["Why do big, important goals often freeze people?","The mind registers the whole distance at once, which causes overwhelm."],["What is potential mode?","Not fully trying, so the story \"I could do it if I really tried\" stays safe."],["What are the steps of the ambition–inaction cycle?","Inspiration, feeling the gap, being crushed by it, and promising to start tomorrow."],["Why doesn't \"just take small steps\" advice usually work on its own?","It's rational advice for an emotional problem; it doesn't reach the part that feels the enormity."],["What does the lesson say actually breaks the cycle?","Evidence: small, finished actions repeated until you believe you can follow through."]],"pr":"This week: five pieces of proof.","it":"When I catch myself waiting to feel ready, I'll do a 10-minute version and stop when the timer ends."},{"id":"change-t05-l2","n":2,"t":"Working under pressure: urgency on purpose","dg":[["change-T05-urgency.webp","Two columns comparing anxious and productive procrastinators: why they delay, how they do at the deadline, and what helps","Two kinds of procrastinator"]],"ep":[["o21TBiKhF2c","Why You Only Work Under Pressure (The Productive Procrastinator Type)","7:45"],["f6HShztYHcQ","Psychology of Productivity: Be So Productive It Feels Illegal","15:46"]],"st":[["Decide which type you are","for this task: anxious or productive."],["Set an artificial deadline","two days early and tell someone you respect."],["Choose your ritual:","one place, one time and one playlist for this project."],["Use the ritual","every time you work on it, even for 20 minutes."],["For unavoidable last-minute work,","block the final 48 hours now."]],"pf":"Next deadline: design your urgency.","pit":"When I sit down at my focus spot and start my playlist, I'll work for 25 minutes before checking anything.","big":"Some people can only work when a deadline is close, not because they're undisciplined but because their brains respond to urgency.","ex":"Leo, a grant writer, always writes proposals the night before they're due.","tk":["Distant deadlines can feel like **background noise** to some brains.","A close deadline triggers a surge of **focus** (hyperfocus).","**Anxious** and **productive** procrastinators need different fixes.","Constant **emergency mode** wears you down.","Use **artificial urgency**, an **activation ritual** and **strategic acceptance**."],"q":[["Why can distant deadlines fail to motivate some people?","Distant, abstract rewards don't create enough pull to get the brain's planning and focus going."],["What's the difference between an anxious and a productive procrastinator?","The anxious one delays out of fear and often struggles at the deadline; the productive one can't engage until pressure arrives, then performs well."],["What is artificial urgency?","Creating a real-consequence deadline before the actual one, like promising a draft to someone you respect."],["What is an activation ritual?","Using the same cues (place, time, playlist) for focused work so the cues themselves start to trigger focus."],["What does strategic acceptance mean?","Planning for the last-minute push on certain tasks by blocking and clearing the final days, without shame."]],"pr":"Next deadline: design your urgency.","it":"When I sit down at my focus spot and start my playlist, I'll work for 25 minutes before checking anything."},{"id":"change-t05-l3","n":3,"t":"Late bloomers: off the social clock","dg":[["change-T05-peaks.webp","Bar chart of the approximate peak ages of four abilities, from processing speed near 19 to vocabulary near 70","Different abilities, different peaks"]],"ep":[["7lZnKz3AJmA","Psychology of People Who Succeed Later In Life","15:54"],["7E9KD9PBUi0","Psychology of Intelligence: How To Become Smarter Than 99% Of People","15:58"]],"st":[["Catch the clock:","each time you feel behind, say \"That's the social clock\" and write down what triggered it."],["List your late-ripening strengths:","three things you're better at now than at 22."],["Check your soil:","where in your life do you feel most like yourself? Where do you feel stunted?"],["Rewrite one harsh thought","the way you'd say it to a friend."],["Count one small win","you would normally dismiss as \"too late to matter.\""]],"pf":"This week: get off the clock.","pit":"When I see someone my age achieve something and feel the sting, I'll name the social clock and write one thing that's growing in my own life.","big":"Many people find success, love or stability later in life, and the hardest part is the long stretch of feeling behind.","ex":"Marcus, 38, is a nurse who started nursing school at 33 after years in retail.","tk":["There's **one way to bloom early and many ways to bloom late**.","**Different abilities peak at different ages**; understanding keeps growing for decades.","The feeling of being **behind is learned**, often in childhood.","The **social clock** grades your life by the calendar and costs you the present.","**Name the clock, change your soil, talk to yourself kindly.**"],"q":[["What did Simonton find about early and late bloomers?","There's one main way to bloom early but many ways to bloom late, because complex gifts take longer to come together."],["Name two abilities that peak late.","Reading other people's emotions (40s–50s) and vocabulary/knowledge (near 70)."],["What is the social clock?","A culture's invisible timetable for when life events \"should\" happen."],["What are the three signs of a late bloomer?","An ache when peers arrive first, changing direction more than once, and a strength no test measured."],["What does \"change your soil\" mean?","Looking at whether your environment fits you before deciding you're the problem."]],"pr":"This week: get off the clock.","it":"When I see someone my age achieve something and feel the sting, I'll name the social clock and write one thing that's growing in my own life."},{"id":"change-t05-l4","n":4,"t":"Order and the open loop","dg":[["change-T05-open-loops.webp","Four cards: open loops, the under-60-seconds rule, a nightly reset, and a plan for bigger tasks","Open loops and how to close them"]],"ep":[["-7zr7p3MlPI","Psychology of People Who Love Cleaning Their Home","7:08"],["CwhUi9A8LeE","Psychology of Rest: Recover So Well It Makes You Dangerous","14:55"]],"st":[["Do every under-60-second task","immediately for a week."],["Pick one reset spot","(kitchen, desk, entry) and reset it each night in 10 minutes."],["Notice your regulation clean:","when you clean because you're stressed, also name the feeling in one sentence."],["Add one other outlet","for hard feelings: a walk, a call, a journal line."]],"pf":"This week: close small loops on purpose.","pit":"When I walk in the door, I'll put my keys, bag and coat in their places before I sit down.","big":"Some people can't rest until their space is reset, because their minds register disorder as unfinished business.","ex":"Hana works long days and comes home to a messy apartment she shares with a roommate.","tk":["Disorder can register as **unfinished business** (the Zeigarnik effect).","**Need for cognitive closure** drives both tidiness and thoroughness.","Cleaning can be **emotional regulation**: fixing something concrete restores a sense of control.","**Micro-habits** (under 60 seconds now, clean as you go) prevent big cleanups.","Use order as a **tool you choose**, alongside other ways of handling feelings."],"q":[["What is the Zeigarnik effect?","Unfinished tasks keep pulling at your attention until they're resolved."],["What is need for cognitive closure?","Discomfort with loose ends and a drive for resolution."],["Why can cleaning calm people down?","Fixing something concrete restores a felt sense of control when inner problems feel too abstract."],["What's the \"under 60 seconds\" habit?","If a tidy-up takes less than a minute, do it immediately."],["What's a sign that order has stopped being a tool?","You can't stop, or it crowds out rest and people, or it's your only way of handling hard feelings."]],"pr":"This week: close small loops on purpose.","it":"When I walk in the door, I'll put my keys, bag and coat in their places before I sit down."}]},{"id":"change-t06","ch":"change","num":6,"t":"Focus and Drive","ls":[{"id":"change-t06-l1","n":1,"t":"Focus: feeling safe enough to settle","dg":[["change-T06-safety-first.webp","A flow from background threats to scanning, then three safety signals leading to settled focus","Safety first, then focus"]],"ep":[["_axvRrhqToM","Why You Can't Focus (It's not dopamine)","9:15"],["wq8TrxPYN7A","Psychology of Composure: Be So Calm It Makes People Nervous","14:54"]],"st":[["Pick your anchor:","one place, playlist or pair of headphones only for focused work."],["Before each block,","do three rounds of in-four, hold-four, out-six breathing."],["Write a two-minute worry list,","adding a time to deal with each item if you can."],["When your mind wanders,","ask what your nervous system is watching, check your list, and return."],["Rate each block","from 1 to 5 for how settled you felt."]],"pf":"This week: a three-step start for every focus block.","pit":"When I sit down to focus, I'll breathe three slow rounds and write my worry list before I open the task.","big":"When you can't focus, your brain may not be broken or lazy; it may be treating focus as unsafe.","ex":"Owen has a report due Friday, but every time he opens it, he ends up checking email and reorganizing files.","tk":["Focus is a **suppression system**: your brain has to actively ignore everything else.","The **salience network** won't let you settle if it senses background threat.","Deep focus needs **calm alertness**, not low-level fight-or-flight.","Signal safety: **body first, contain the worries, anchor a focus place**.","Chronic anxiety or trauma may need **professional support**."],"q":[["How does the video describe focus, instead of a spotlight?","As a suppression system: the brain actively ignores everything else, which takes energy."],["What question does the salience network keep asking?","What matters right now, and is it safe to stop scanning?"],["Why doesn't a dopamine detox always fix focus?","Removing distractions doesn't calm a nervous system that still feels threatened."],["What is the containment ritual?","Writing down everything that's bothering you for two minutes, so your brain knows it will be dealt with later."],["What is environmental anchoring?","Using one place or cue only for focused work, so your brain learns to settle there."]],"pr":"This week: a three-step start for every focus block.","it":"When I sit down to focus, I'll breathe three slow rounds and write my worry list before I open the task."},{"id":"change-t06-l2","n":2,"t":"Framing the payoff","dg":[["change-T06-framing.webp","Two columns comparing a cost frame with a payoff frame, with the three framing steps beneath","From cost to payoff"]],"ep":[["MQQdGK_2Ng0","How To Force Your Brain To LOCK IN (The Dopamine Framing Method)","8:48"],["axdQv2AopO8","Psychology of Positive Delusion: Achieve Anything By Being Delusional","16:11"]],"st":[["Before each work session,","write one sentence: \"When I finish this, I'll have ___ and I'll feel ___.\""],["Add one line:","\"The thing most likely to stop me today is ___. My plan: ___.\""],["Put your phone in another room","for every session."],["Try one pre-commitment","with a friend this week."],["End each session","with 30 seconds of noticing what you did, before any screen."]],"pf":"This week: frame, remove, savor.","pit":"When I sit down to work, I'll write my payoff sentence and put my phone in another room before I open the task.","big":"Your brain weighs every task like an investor, and distant goals look like bad investments next to instant rewards.","ex":"Leah is studying for a nursing exam and keeps drifting to short videos.","tk":["Your brain weighs effort against reward like an **investor**.","Feeds and games are **slot machines** that win that comparison by default.","Dopamine follows **anticipation**: make the payoff vivid and specific.","**Visualize, name the emotion, connect today's task**, and name the obstacle too.","Put the **phone in another room** and end sessions by savoring the work, not the phone."],"q":[["Why do long-term goals lose to scrolling in your brain's comparison?","Their rewards are distant and uncertain, while feeds give instant, guaranteed rewards."],["When does dopamine rise most?","In anticipation of a reward, before you get it."],["What are the three steps of the Dopamine Framing Method?","Visualize the specific moment of payoff, name the emotion, and connect today's task to that moment."],["What is a pre-commitment contract?","Promising someone a penalty if you don't complete the work, so distraction has a cost."],["Why shouldn't you reward a work session with your phone?","It teaches your brain that the phone is the real reward and the work is just a toll."]],"pr":"This week: frame, remove, savor.","it":"When I sit down to work, I'll write my payoff sentence and put my phone in another room before I open the task."},{"id":"change-t06-l3","n":3,"t":"Making hard work rewarding","dg":[["change-T06-micro-wins.webp","A staircase of small steps leading up to a distant goal, each step labeled as a small win","A ladder of micro-wins"]],"ep":[["t8Gv6lnV3yA","How to Trick Your Brain Into Craving Hard Work","9:40"],["CkP_8bkjf1E","Psychology of Discipline (And How to Trick Your Brain Into Craving It)","14:44"]],"st":[["Pick one avoided goal","and write today's micro-win: one small, finishable step."],["Do it, then add a tally mark","on a visible note: \"Someone who ___.\""],["Add friction to one easy distraction","and remove friction from the hard task."],["Cut back one easy reward","for the week."],["Write one honest sentence:","\"If I tried fully, I'm afraid I'd find out ___.\""]],"pf":"This week: one ladder, one tally.","pit":"When I finish dinner, I'll do one micro-win on my goal before I turn on any screen.","big":"People who seem naturally disciplined have found ways to make their brains want hard work, and those ways can be learned.","ex":"Sam wants to learn to code but hasn't opened his course in a month.","tk":["Hard work loses because its **reward is too far away** to anticipate.","**Micro-wins** compress time so your brain can see the payoff.","**Protect your baseline** so small wins feel rewarding.","Identity changes through **evidence**, not affirmations.","**Design the environment** and **face the fear** underneath avoidance."],"q":[["Why does hard work lose the brain's comparison?","Its reward is too far away for the brain to anticipate."],["What is micro-wins architecture?","Breaking a big goal into tiny, visible, finishable steps so the brain gets and anticipates small wins."],["Why protect your reward baseline?","After lots of easy, intense rewards, small wins feel flat; cutting back lets them register."],["How do you change your identity, according to the video?","Through evidence: small repeated actions that prove you're someone who does hard things."],["What fear can sit underneath avoiding hard work?","That trying fully and failing would mean something about you, or that succeeding would remove your excuses."]],"pr":"This week: one ladder, one tally.","it":"When I finish dinner, I'll do one micro-win on my goal before I turn on any screen."},{"id":"change-t06-l4","n":4,"t":"The Batman effect: borrowing your future self","dg":[["change-T06-batman.webp","Two columns comparing strategic and toxic delusion across belief, action and evidence","Strategic versus toxic delusion"]],"ep":[["JLQi-itZM8o","DELUSION is the Only Productivity Hack You Need (The Batman Effect)","9:20"],["axdQv2AopO8","Psychology of Positive Delusion: Achieve Anything By Being Delusional","16:11"]],"st":[["Write a half-page description","of the future you in one area: how they act, decide and spend their time."],["Give them a name or title","if it helps."],["Before two hard moments a day,","ask: \"What would future me do right now?\""],["Log the evidence:","one line for each action that fits."],["Pair it with work:","pick one skill the future you has, and practice it this week."]],"pf":"This week: design and wear your future self.","pit":"When I feel myself shrinking before a hard task, I'll pause and ask what future me would do in the next 20 minutes.","big":"Acting from the identity of the person you're becoming can help you persist at hard things, as long as you also do the work.","ex":"Maya has just been promoted to team lead and freezes before every one-on-one.","tk":["Children pretending to be **Batman** persisted longer on a boring task.","An aspirational identity works through **mental rehearsal, a new filter and identity congruence**.","**Strategic** delusion does the work now; **toxic** delusion skips it.","Ask **\"What would future me do right now?\"** and **collect evidence**.","Wear the identity like a **performance suit**, not all day."],"q":[["What is the Batman effect?","Children who pretended to be a hardworking character like Batman persisted longer on a boring task."],["What is identity congruence?","The drive to make your actions match who you think you are."],["What's the difference between toxic and strategic delusion?","Toxic delusion believes you already are something without the work; strategic delusion believes in your future self enough to do the work now."],["What question does the protocol use at decision points?","\"What would future me do right now?\""],["How is strategic delusion different from impostor syndrome?","Impostor syndrome rejects evidence you already have; strategic delusion acts ahead of evidence you're building."]],"pr":"This week: design and wear your future self.","it":"When I feel myself shrinking before a hard task, I'll pause and ask what future me would do in the next 20 minutes."}]},{"id":"change-t07","ch":"change","num":7,"t":"Potential and Routines","ls":[{"id":"change-t07-l1","n":1,"t":"Potential: from protecting it to testing it","dg":[["change-T07-potential.webp","Two paths: one looping through waiting, preparing and daydreaming, the other moving from small public attempt to feedback to skill","Protected potential versus tested ability"]],"ep":[["8m-mvSTpH7c","The Psychology of Wasted Potential","8:08"],["O-Wu5Whk8eI","Psychology of Self-Sabotage (And How to Hack Your Brain to Stop It)","14:51"]],"st":[["Name the one thing","you'd most regret not attempting."],["Audit your motion:","list what you've done toward it this month. Which items were safe busywork?"],["Design a small public version","you can do within seven days."],["Tell one person","the date."],["Do it, then write what you learned,","not whether you were good."]],"pf":"This week: one public test.","pit":"When I catch myself 'preparing' for the same goal for the third week in a row, I'll do a rough version of the real thing instead.","big":"Wasted potential is rarely about talent; it's often the brain protecting you from the risk of really trying.","ex":"Marta, 38, has wanted to teach a pottery class for years.","tk":["The brain can treat success as a **threat** because it brings judgment.","**Motion isn't progress**; name the one thing that matters.","**Untested potenti
