al** is safe because it can't be disproven.","**Fantasies** and **highlight reels** give motivation without results.","Be willing to be **bad in public** before you're good."],"q":[["Why might the brain resist pursuing something big?","Success brings visibility and judgment, which the brain treats as a risk."],["What's the difference between motion and progress?","Motion is staying busy; progress is doing the specific thing that moves you toward your goal."],["Why is \"potential\" a safe identity?","It can't be disproven as long as you never fully try."],["What is an external locus of control?","Believing that outcomes happen to you rather than being shaped by your actions."],["What is the way out, according to the lesson?","Being willing to be bad at something and to try in public."]],"pr":"This week: one public test.","it":"When I catch myself 'preparing' for the same goal for the third week in a row, I'll do a rough version of the real thing instead."},{"id":"change-t07-l2","n":2,"t":"Staying up late: the reclaimed hour","dg":[["change-T07-three-layers.webp","Three rows pairing autonomy, quiet and the midnight self with an earlier, sleep-friendly alternative","Three layers behind late nights"]],"ep":[["9gW4_vPmu8s","Psychology of People Who Always Stay Up Late","8:26"],["vIH0GS_cXv0","Psychology of Sleep: How To Sleep Less Hours And Wake Up Fresh","15:09"]],"st":[["Name your layer:","autonomy, sensory relief, or the midnight self?"],["Block an \"own hour\"","in the early evening for five days."],["Add one low-input break","to each day."],["Schedule your creative time","in daylight once this week."],["Keep the same wake time","every day, including the weekend."]],"pf":"This week: move the hour earlier.","pit":"When it's 10:30 and I reach for my phone in bed, I'll remember I already had my own hour and put it on the charger across the room.","big":"Many people stay up late not from carelessness but to reclaim time, quiet and a part of themselves the day didn't allow.","ex":"Joe, a nurse and dad of two, routinely scrolls until 1:30 a.m. and drags through the next day.","tk":["**Bedtime procrastination** often reclaims autonomy the day took.","**Autonomy** is a basic psychological need.","Night offers **uninterrupted quiet**, especially for sensitive people.","The **midnight identity** is the self the day's roles squeeze out.","Meet these needs **earlier**, and keep **seven or more hours** of sleep."],"q":[["What is bedtime procrastination?","Going to bed later than intended without an outside reason, often to reclaim time for yourself."],["Why does autonomy matter for late nights?","It's a basic psychological need; when the day drains it, people reclaim it at night."],["Why does late-night quiet feel different for sensitive people?","It's the only quiet without the threat of interruption."],["What is the midnight identity?","The creative, curious self that surfaces once daytime roles go quiet."],["What's a way to meet these needs without losing sleep?","Protect an earlier hour of autonomy and give the creative self a daytime slot, while keeping a steady wake time."]],"pr":"This week: move the hour earlier.","it":"When it's 10:30 and I reach for my phone in bed, I'll remember I already had my own hour and put it on the charger across the room."},{"id":"change-t07-l3","n":3,"t":"Clutter: a season, not a verdict","dg":[["change-T07-clutter-sources.webp","Three cards for upbringing, task-starting and life season, each with a small first step","Where clutter comes from"]],"ep":[["Qxnr-GPDT_8","Psychology of People Who Live In Clutter","8:29"],["ecPEe1r8VLw","Psychology of People Who Think Too Much","8:37"]],"st":[["Name your cause:","upbringing, task-starting, or a heavy season (or a mix)."],["Do five minutes on one surface","each day, and stop when the timer ends."],["Create one simple system","for the thing that piles up most (a basket, a hook, a box)."],["Choose one space","that's allowed to stay creatively messy."]],"pf":"This week: five-minute starts.","pit":"When I walk past the pile and feel the guilt, I'll set a five-minute timer instead of promising myself 'soon.'","big":"Clutter is common, it has understandable causes, and shame makes it worse.","ex":"Dana, a teacher and mom, has a dining table covered in mail, school papers and laundry.","tk":["Clutter is **common**; shame adds nothing useful.","Causes include the **home you grew up in**, **task-starting difficulties** and a **heavy season of life**.","Clutter is a **snapshot of a season**, not a verdict on character.","Messy spaces can encourage **creative ideas**, though a calmer home can lower stress.","Start with **five minutes and one surface**, and get help if starting is hard everywhere."],"q":[["What is executive dysfunction?","Difficulty getting started, ordering steps and deciding, even when you know what to do."],["How can the home you grew up in shape clutter?","It sets what feels normal, and many people were never taught a system for order."],["What did Ferrari mean by clutter as a snapshot of a season?","It reflects what's happening in someone's life, not who they are."],["What did Vohs find about messy rooms?","People in messy rooms generated more creative ideas than people in tidy rooms."],["What's a shame-free way to start?","Five minutes on one surface, with a timer, then stop."]],"pr":"This week: five-minute starts.","it":"When I walk past the pile and feel the guilt, I'll set a five-minute timer instead of promising myself 'soon.'"}]},{"id":"mind-t01","ch":"mind","num":1,"t":"Learning Faster","ls":[{"id":"mind-t01-l1","n":1,"t":"Learning that lasts: retrieval, spacing and mixing","dg":[["mind-T01-retrieval.webp","Bar chart comparing about 80 percent recall for repeated testing with about 35 percent for repeated studying","Feels better, works worse"]],"ep":[["f1gkkzHZxNg","Psychology of Intelligence: Learn Anything So Fast It's Almost Unfair","15:03"],["6wPcR6MrsIk","Psychology of Verbal Intelligence: How To Articulate Your Thoughts Intelligently","13:45"]],"st":[["Choose one thing you're learning","(a course, a skill, a language, a work topic)."],["Swap rereading for recall:","after each session, close everything and write what you remember for five minutes, then check."],["Schedule two spaced returns:","two days later and one week later."],["Mix one session:","combine problems or examples from at least two topics."],["Explain one idea out loud","with the source closed, and write down where you got stuck."]],"pf":"This week: rebuild one study habit.","pit":"When I finish a chapter, I close the book and write everything I remember before I look at my notes.","big":"Fast learners don't have more talent or hours; they use study methods that feel harder in the moment and work far better later.","ex":"Ana is studying for a project-management certification and has been rereading the textbook and highlighting.","tk":["**Recall beats rereading.** Closing the book and producing what you know is the single best study swap.","**Space your sessions** so recall takes effort.","**Mix problem types** when they're easy to confuse.","**Explaining with the book closed** shows you exactly where understanding breaks.","How smooth material feels is a poor guide to how well you know it."],"q":[["What's the difference between storage strength and retrieval strength?","Storage strength is how deeply something is learned; retrieval strength is how easily you can bring it up right now. Only retrieval strength shows in the moment."],["Why does rereading feel effective?","It makes material feel familiar and smooth (the fluency illusion), which we mistake for learning."],["In the Swahili study, what did continued testing do compared with continued restudying?","About 80% recall a week later versus about a third."],["When should you come back to material when spacing it?","When it's slightly foggy; if recall is easy, you waited too little."],["What is interleaving, and when does it help most?","Mixing different problem types in one session; it helps most when the items are easy to confuse."],["What did the chess study show about experts?","Experts store meaningful patterns (chunks), not more individual facts."]],"pr":"This week: rebuild one study habit.","it":"When I finish a chapter, I close the book and write everything I remember before I look at my notes."},{"id":"mind-t01-l2","n":2,"t":"Breadth: the case for many interests","dg":[["mind-T01-breadth.webp","Comparison of a collector who starts many things with a polymath who finishes, connects and rotates","What turns many interests into an advantage"]],"ep":[["D0SGbomVuKc","Psychology of Polymaths: Why Having Multiple Interests Is an Unfair Advantage","13:37"],["f1gkkzHZxNg","Psychology of Intelligence: Learn Anything So Fast It's Almost Unfair","15:03"]],"st":[["List your interests","and pick one to be this season's focus."],["Define one finished outcome","for it you could reach in about three months."],["Put the others on maintenance:","a small, regular touch, not active projects."],["Write one bridge note:","take something you learned this week and ask where else it applies."],["Try that bridge","in one real situation."]],"pf":"This week: turn one interest into a finished thing, and build one bridge.","pit":"On Sunday evenings, I'll write one paragraph connecting something from this week's reading to my work.","big":"Having many interests can be a strength, if you finish things and connect them on purpose.","ex":"Theo is an accountant who also does woodworking, plays bass and reads about behavioral economics, and feels scattered.","tk":["Top performers often had **broad early experience** and progressed more slowly at first.","Deep expertise can make people **rigid**; breadth can keep you flexible.","Cross-field ideas come from **deliberately looking** for connections.","Breadth only pays if you **finish things** in each field.","**Rotate deep focus in seasons** rather than splitting every week."],"q":[["What did the 6,000-athlete analysis find about world-class athletes?","They usually played several sports as children, specialized later and progressed more slowly at first."],["What is cognitive entrenchment?","The rigidity that can come with deep expertise: the more stable your mental map, the harder it is to see beyond it."],["Why doesn't importing ideas from other fields happen automatically?","People usually don't notice that a solution from another area fits unless they actively look for the connection."],["What's the difference between a collector and a polymath?","A collector starts many things and finishes few; a polymath finishes work in each field and connects them."],["What does \"go deep in seasons\" mean?","Rotating your main focus over months instead of spreading thin across everything every week."]],"pr":"This week: turn one interest into a finished thing, and build one bridge.","it":"On Sunday evenings, I'll write one paragraph connecting something from this week's reading to my work."}]},{"id":"mind-t02","ch":"mind","num":2,"t":"Kinds of Smart","ls":[{"id":"mind-t02-l1","n":1,"t":"Saying what you mean: verbal clarity","dg":[["mind-T02-web-tree-string.webp","A tangled web of ideas, then a tree with one trunk and branches, then a single line of words","From web to tree to string"]],"ep":[["6wPcR6MrsIk","Psychology of Verbal Intelligence: How To Articulate Your Thoughts Intelligently","13:45"],["f1gkkzHZxNg","Psychology of Intelligence: Learn Anything So Fast It's Almost Unfair","15:03"]],"st":[["Every day, explain one thing out loud","to no one for two minutes: something from work, a book, the news."],["Before each meeting or call,","write the one sentence you most want to say."],["Use a number","at least once a day: \"There are two things…\""],["Let one pause sit","before an important word, instead of filling it."],["Notice the stuck moments:","where you can't finish a sentence, write the thought down later and finish it."]],"pf":"This week: practice the one-sentence answer.","pit":"When I get in the car after work, I'll explain one thing I learned today out loud before turning on music.","big":"People who speak clearly don't have bigger vocabularies; they organize their thoughts before speaking.","ex":"At a team meeting, Raj's manager asks why the project is behind.","tk":["**Plain words** make you seem more intelligent than fancy ones.","Tangled speech is usually an **ordering problem**: build the tree before you talk.","Listeners hold only a few points; **count them out** and cut to the ones that matter.","A **pause** before an important word is normal and reads as careful.","**Explaining out loud** finishes and strengthens your understanding."],"q":[["What did Oppenheimer find about complicated words?","Readers rated authors who used needlessly long words as less intelligent."],["What are Levelt's three stages of speaking?","Conceptualizer (deciding what you mean), formulator (choosing words) and articulator (speaking)."],["In Pinker's image, what turns the web into a string?","The tree: a main point with supporting points and details in order."],["Why does \"say the point first\" help?","It forces you to finish the thought and lets listeners know what everything else supports."],["What did Chi's study show about explaining to yourself?","Students who explained each line learned much more than students who read it twice."]],"pr":"This week: practice the one-sentence answer.","it":"When I get in the car after work, I'll explain one thing I learned today out loud before turning on music."},{"id":"mind-t02-l2","n":2,"t":"How fixers think: mental models and troubleshooting","dg":[["mind-T02-half-split.webp","A chain from power to switch to wire to motor to belt to drum, with a test at the middle that rules out half","Test the middle first"]],"ep":[["AACwyjlk8ko","Psychology of Mechanical Intelligence (Why Some People Can Fix Anything)","15:30"],["f1gkkzHZxNg","Psychology of Intelligence: Learn Anything So Fast It's Almost Unfair","15:03"]],"st":[["Pick something broken or puzzling","you're allowed to experiment with (a gadget, an app setting, a household item, unplugged)."],["Say the chain out loud,","from input to output, before touching it."],["Find the first step you can't explain","and look it up."],["Test the middle","of the chain, then halve again."],["Ask before helping:","once this week, ask someone \"fix or company?\" before offering solutions."]],"pf":"This week: troubleshoot one thing the fixer's way.","pit":"When something stops working, I'll describe how it should work, step by step, before I start poking at it.","big":"People who can fix anything aren't just good with their hands; they build a working model of the machine in their minds and run it.","ex":"Lena's bathroom fan stopped working.","tk":["Fixing is mostly **thinking**: building and running a mental model of how something works.","**Spatial ability** predicts later innovation and can be trained.","Describe parts by **what they are**, not what they're called.","**Follow the path** from where things work to where they fail, and **test the middle first**.","Before helping someone, ask whether they want a **fix or company**."],"q":[["What is a mental model in Craik's sense?","A small working model of how something works that you can run in your head."],["What is functional fixedness, and how do you escape it?","When a thing's name or usual use hides its other uses; describe its parts by what they're made of, not what they're for."],["What's the difference between symptomatic and topographic search?","Symptomatic matches a symptom to a known fault; topographic follows the path of a working system until the signal goes bad."],["Why test the middle first?","Each good test rules out half the remaining possibilities, so you find the fault in far fewer steps."],["What did the bar exam study show about support?","Support the stressed partner didn't notice often helped most, because obvious help can feel like being told you're struggling."]],"pr":"This week: troubleshoot one thing the fixer's way.","it":"When something stops working, I'll describe how it should work, step by step, before I start poking at it."},{"id":"mind-t02-l3","n":3,"t":"Survivor's intelligence: what hard childhoods can sharpen","dg":[["mind-T02-signal-echo.webp","A flowchart from an alarm firing to the question \"happening now?\", leading to act on it or name it as an echo","Signal or echo?"]],"ep":[["qIJ2943Bzko","10 Signs You Have Survivor's Intelligence (The Rarest Kind of Smart)","15:45"],["TRd1kuUGazE","Psychology of Resilience: Build a Mind So Strong It Scares People","18:56"]],"st":[["Name your strengths:","which of the ten signs fit you? Write one place each is useful."],["Schedule one calm hour","with nothing to fix. Notice the urges and let them pass."],["Practice signal or echo:","each time your alarm fires this week, ask the question and write down the answer."],["Find one chosen challenge:","a task with real stakes and an end point where your skills help."]],"pf":"This week: one calm practice and one signal check.","pit":"When I feel the urge to check or prepare during my calm hour, I'll take three slow breaths and stay where I am.","big":"People who grew up in harsh or unpredictable conditions often develop real abilities, like reading a room fast, switching tasks quickly and staying calm in a crisis.","ex":"Kim grew up in a home where moods changed without warning. She's now a nurse.","tk":["Hard, unpredictable childhoods can **sharpen some abilities** as well as harm others.","In one study, people from unpredictable childhoods were **better at switching tasks** under uncertainty.","The same tuning can bring **anxiety and hypervigilance**.","Calm can be **practiced** like any other skill.","Learn to tell a present **signal** from a past **echo**."],"q":[["What is the hidden talents idea?","That brains developing in harsh or unpredictable environments may get better at the problems those environments posed, not only worse."],["In the switching study, when did the advantage show up?","Mainly after people were made to feel uncertain."],["What can come with a nervous system tuned for threat?","Anxiety, hypervigilance and trouble trusting people."],["What does \"choose the emergency\" mean?","Using crisis skills on purpose in work with real stakes and an end point, instead of creating drama to feel competent."],["How do you tell a signal from an echo?","Ask whether the danger is happening now or only resembles something from the past."]],"pr":"This week: one calm practice and one signal check.","it":"When I feel the urge to check or prepare during my calm hour, I'll take three slow breaths and stay where I am."}]},{"id":"mind-t03","ch":"mind","num":3,"t":"Thinking Better","ls":[{"id":"mind-t03-l1","n":1,"t":"Getting smarter after school","dg":[["mind-T03-tools.webp","Grid of four graduate fields and which kinds of reasoning each improved","What changed people's everyday reasoning"]],"ep":[["7E9KD9PBUi0","Psychology of Intelligence: How To Become Smarter Than 99% Of People","15:58"],["f1gkkzHZxNg","Psychology of Intelligence: Learn Anything So Fast It's Almost Unfair","15:03"]],"st":[["Pick one thinking tool","from the table and write its definition on a card."],["Use it three times this week","on real situations, and write down each one."],["Pick one question","you're curious about and read one long source on it."],["Start one hard new thing:","a class, an instrument, a language, a craft."],["Drop one treadmill:","swap brain-game time for the new thing."]],"pf":"This month: one tool, one question, one hard thing.","pit":"When someone tells me a dramatic result, I'll ask myself whether it's a small sample or regression to the mean.","big":"One kind of intelligence keeps growing for most of your life, and most people simply stop feeding it after school.","ex":"Mia, 42, feels like she \"stopped learning\" after college.","tk":["**Fluid** intelligence peaks early; **crystallized** intelligence keeps growing into later life.","Education raises IQ by roughly **1 to 5 points per year**.","**Brain-training games** mostly improve the games.","Specific **thinking tools** practiced on real problems do transfer.","Sustained, **unfamiliar difficulty** keeps minds sharp."],"q":[["What's the difference between fluid and crystallized intelligence?","Fluid is reasoning through something new; crystallized is the knowledge and methods you've built up."],["When does vocabulary peak?","In the late 60s and early 70s."],["What did the brain-training study find?","People got better at the trained games but not at separate tests of the same abilities."],["What improved everyday reasoning in graduate students?","Specific reasoning tools used repeatedly (statistics in psychology and medicine, logic in law); difficulty alone didn't."],["What is regression to the mean?","Extreme results tend to be followed by more ordinary ones."],["What helped older adults' memory in the Synapse Project?","Learning demanding new skills, not easy familiar activities."]],"pr":"This month: one tool, one question, one hard thing.","it":"When someone tells me a dramatic result, I'll ask myself whether it's a small sample or regression to the mean."},{"id":"mind-t03-l2","n":2,"t":"Problem solving: state the problem first","dg":[["mind-T03-analogy.webp","Bar chart: about 10%, 30% and 75% solving the problem","The answer was already there"]],"ep":[["i_ad72y7HTQ","Psychology of Problem Solving: 10 Strategies To Live Your Life On Easy Mode","15:46"],["AACwyjlk8ko","Psychology of Mechanical Intelligence (Why Some People Can Fix Anything)","15:30"]],"st":[["Pick one stuck problem","at work or home."],["Rewrite it","as one sentence you could be wrong about."],["Explain it step by step","and mark where you stall."],["Generate three ideas","before judging any, then run a premortem on your favorite."],["Ask: who else has solved this shape of problem?",""],["Take a walk","after a solid hour on it."]],"pf":"This week: run one problem through all four moves.","pit":"When I have an answer in the first five minutes, I'll write two more before I commit.","big":"A problem's difficulty depends heavily on how it was stated before any solving began.","ex":"Nina runs a small bakery, and \"sales are down.\"","tk":["Time spent **defining** a problem pays off more than racing to an answer.","A decent first idea can **block** a better one without your noticing.","**Explaining step by step** exposes gaps in understanding.","**Distance** (third person, other fields, a break after effort) improves reasoning.","Past costs shouldn't decide future choices."],"q":[["What is the Einstellung effect?","A familiar decent solution blocking you from seeing a better one."],["How do you make a problem statement useful?","Write it as one specific sentence you could be wrong about."],["What is a premortem?","Imagining the project has already failed and writing down why."],["What happened when people were told an analogous story might help?","About 75% solved the problem, compared with about 10% cold."],["What is the sunk cost effect, and how do you counter it?","Letting past investment drive future choices; ask what you'd choose today with no history."],["When does incubation help most?","After genuine effort, with an undemanding break like a walk."]],"pr":"This week: run one problem through all four moves.","it":"When I have an answer in the first five minutes, I'll write two more before I commit."},{"id":"mind-t03-l3","n":3,"t":"The costs of a busy mind","dg":[["mind-T03-costs-sorted.webp","Ten costs on the left, each with an arrow to the strength it shadows on the right","One list, two lights"]],"ep":[["NtIArkeRfiA","10 Problems Only Highly Intelligent People Have","11:48"],["6wPcR6MrsIk","Psychology of Verbal Intelligence: How To Articulate Your Thoughts Intelligently","13:45"]],"st":[["Read the ten costs","and mark the two that fit you best."],["Choose one tool","from the table for each."],["Use each tool three times","this week."],["Write the strength","each cost shadows, and one place that strength helps you."]],"pf":"This week: pick your two costs and one tool each.","pit":"When I've been thinking about a worry for more than 15 minutes, I'll name the feeling in one word and switch to something physical.","big":"A mind that loves hard thinking brings real gifts, and a set of hidden costs.","ex":"Sam, a software architect, explains a new system to his team; they nod, then build it wrong.","tk":["A love of hard thinking (**need for cognition**) is like a racing engine: powerful, and restless in slow traffic.","Experts struggle to imagine not knowing (**the curse of knowledge**); have listeners explain it back.","**Impostor feelings** are common among high achievers.","Analysis can become **rumination**; naming a feeling and stopping helps.","Each cost is the **shadow of a strength**, and most are habits you can work on."],"q":[["What is need for cognition?","A lasting enjoyment of effortful thinking."],["What did the song-tapping study show?","Tappers predicted listeners would guess half the songs; listeners guessed about 1 in 40, because tappers couldn't imagine not hearing the tune."],["What is the impostor phenomenon?","High achievers feeling like frauds despite their success."],["What is intellectualizing?","Analyzing an emotion to avoid feeling it."],["What strengths do boredom, worry and doubt shadow?","Hunger for depth, imagination and honesty."]],"pr":"This week: pick your two costs and one tool each.","it":"When I've been thinking about a worry for more than 15 minutes, I'll name the feeling in one word and switch to something physical."}]},{"id":"mind-t04","ch":"mind","num":4,"t":"A Mind That Won't Switch Off","ls":[{"id":"mind-t04-l1","n":1,"t":"Overthinking: solving versus circling","dg":[["mind-T04-solve-or-circle.webp","A flowchart from a returning thought to the question \"anything new?\", leading to take one step or write it down and close the loop","Solving or circling?"]],"ep":[["ecPEe1r8VLw","Psychology of People Who Think Too Much","8:37"],["NtIArkeRfiA","10 Problems Only Highly Intelligent People Have","11:48"]],"st":[["Each time a loop starts,","ask: \"Has anything new appeared since last time?\" If not, write one next step and stop."],["For one replayed conversation,","ask whether anything needs repair, and act or close the file."],["Every night,","write open loops and next steps on paper before bed."],["Set a 15-minute worry time","and postpone earlier worries to it."],["Pick one category","of small decisions to satisfice."]],"pf":"This week: close three kinds of loops.","pit":"When I catch myself replaying a conversation, I'll ask, 'Does anything need repair?' and decide within a minute.","big":"People who think too much don't have a weak mind; they have a powerful engine with no guide.","ex":"Priya, a project manager, lies awake replaying a meeting where she corrected a colleague in front of the team.","tk":["Overthinking is often **circling**, not solving, and it feels like progress.","People who don't loop are **comfortable with loose ends**.","**Post-event processing** replays conversations; ask whether anything needs repair.","Thoughts wait for **bedtime**; write open loops down before you sleep.","**Satisfice** on small decisions and save maximizing for big ones."],"q":[["What is the illusion of mental progress?","The feeling that thinking about a problem again is solving it, when the thought is just circling."],["What is post-event processing?","Reviewing social interactions after they've ended, scanning for anything that went wrong."],["Why do loops get louder at bedtime?","The day's noise stops, and tiredness makes the brain more sensitive to threat."],["What's the difference between maximizers and satisficers?","Maximizers search for the best option; satisficers choose the first good-enough one."],["What do maximizers report, despite often getting better outcomes?","More regret, more anxiety and less satisfaction."]],"pr":"This week: close three kinds of loops.","it":"When I catch myself replaying a conversation, I'll ask, 'Does anything need repair?' and decide within a minute."},{"id":"mind-t04-l2","n":2,"t":"Aversions as signals","dg":[["mind-T04-six-aversions.webp","A grid of six cards, each naming an aversion, what it may signal, and one environmental change","Six aversions, six signals"]],"ep":[["G6OtB7VHy34","If You Hate Doing These 6 Things, Your Brain Works Differently","11:48"],["POqCOvbJFbE","Why Some People Are Meant to Walk Alone (Psychology Explains)","11:42"]],"st":[["Pick the two aversions","that fit you most."],["For each, change one thing in your environment,","not your personality."],["Practice the reactance check","once: \"Would this advice be good if I'd thought of it?\""],["Rewrite one label","you were given (\"difficult\") as a signal (\"I need quiet to do complex work\")."]],"pf":"This week: turn two aversions into design.","pit":"When someone tells me what to do and I feel myself bristle, I'll ask whether the advice is good before I answer.","big":"Six common aversions aren't character flaws; they're signs of how a particular brain is tuned.","ex":"Jonah, a software engineer, has been called \"not a team player\" in two reviews.","tk":["Brains differ in **filtering, attention, autonomy and stimulation**.","An audience **helps simple tasks and hurts complex ones**.","A **leaky sensory filter** lets in noise and connections alike.","**Reactance** can reject good advice; judge the advice, not the tone.","Use aversions to **shape your environment**, not to judge yourself."],"q":[["What is social facilitation?","An audience improves performance on simple tasks but hurts it on complex ones."],["What did Zabelina find about creative achievers?","Their brains showed leaky sensory gating, letting in more sound involuntarily."],["What is psychological reactance?","A motivational drive to reclaim a freedom that feels threatened."],["What's the downside of reactance?","It can't tell a controlling boss from good advice, so it can reject ideas that are right."],["Why can phone calls feel hard?","They remove the nonverbal channel (faces and timing) but still demand a real-time response."]],"pr":"This week: turn two aversions into design.","it":"When someone tells me what to do and I feel myself bristle, I'll ask whether the advice is good before I answer."},{"id":"mind-t04-l3","n":3,"t":"Isolation: refuge or fortress","dg":[["mind-T04-four-reasons.webp","A four-step chain from translation tax to disappointment archive to relief trap to identity fortress, with a way back in beneath","From wound to fortress"]],"ep":[["p2uVQ5gQeBw","The Dark Reason Highly Intelligent People Isolate","12:42"],["POqCOvbJFbE","Why Some People Are Meant to Walk Alone (Psychology Explains)","11:42"]],"st":[["After each declined invitation,","note: relief or real rest?"],["Send one uncompressed thought","to someone who seems to enjoy depth."],["Find one place","where people share a deep interest of yours, and go twice."],["List people who have met you at depth,","even once."],["If loneliness feels heavy,","talk with someone you trust or a professional."]],"pf":"This month: change the odds of connection.","pit":"When I feel the urge to send a quick excuse, I'll wait ten minutes and ask whether I'm choosing rest or avoiding.","big":"For many highly intelligent people, isolation didn't start as a preference; it started as a wound, and a flattering story grew on top of it.","ex":"Daniel, a research analyst, declines almost every invitation and says he \"just prefers his own company.\"","tk":["For many bright people, isolation begins as a **wound**, not a preference.","**Constant translation** makes social time feel like work.","**Relief** from avoidance reinforces avoidance and makes re-entry harder.","\"No one is on my level\" can be a **fortress** that keeps the question out.","Change the odds: **one uncompressed thought, one place where your language is spoken**."],"q":[["What did Hollingworth find in highly gifted children?","Deep loneliness, because the gap between their inner world and others' was too wide to cross casually."],["What is the translation tax?","The constant work of compressing and simplifying your thoughts to be understood."],["How does the relief trap work?","Declining brings relief, which rewards avoidance, while unused social skills make re-entry harder."],["What is the identity fortress?","Turning the wound (\"no one understood me\") into a trophy (\"no one is on my level\") so connection is never tested again."],["What's the difference between a refuge and a goal?","A refuge is somewhere you go to recover; a goal is somewhere you go to live."]],"pr":"This month: change the odds of connection.","it":"When I feel the urge to send a quick excuse, I'll wait ten minutes and ask whether I'm choosing rest or avoiding."}]},{"id":"mind-t05","ch":"mind","num":5,"t":"Luck, Judgment and Being Different","ls":[{"id":"mind-t05-l1","n":1,"t":"Luck: standing where it can find you","dg":[["mind-T05-lightning-rod.webp","Three rows pairing the tunnel, the small world and the one ticket with loosening your grip, feeding the edges and grounding the strike","Three traps, three principles"]],"ep":[["s_DrDXqY4zk","Psychology of Luck: How To Become The Luckiest Human Alive","16:17"],["f6HShztYHcQ","Psychology of Productivity: Be So Productive It Feels Illegal","15:46"]],"st":[["Keep a \"noticed\" note:","one unexpected thing each day."],["Message one weak tie a week","and name exactly what you're looking for."],["Break one big goal into small attempts","and commit to a number (for example, five) before judging."],["After any near miss,","make the next attempt within a week."],["Notice the tunnel:","when you feel desperate, list three other paths to what you want."]],"pf":"This month: become findable.","pit":"When I get a rejection, I'll send the next attempt before the weekend.","big":"Luck is real and random, but randomness has a shape: it lands on certain behaviors far more often than others.","ex":"Leah, a graphic designer, has been job hunting for four months.","tk":["**Luck is real**, but it lands far more often on certain behaviors.","Small differences in **how often chance reaches you** can outweigh differences in talent.","**Stress narrows attention**, so desperation makes you see less.","**Moderately weak ties** carry the most new opportunities.","**Keep trying after a near miss**; quitting is where most bad luck lives."],"q":[["What did the MusicLab experiment show?","The best songs rarely flopped and the worst rarely won, but everything in between was unpredictable, especially when people could see each other's choices."],["What is planned happenstance?","Taking actions that raise the odds of good accidents and being ready to use them when they come."],["Who tended to reach the top in the talent-versus-luck simulation?","People of fairly average talent who ran into more lucky events."],["Why do weak ties matter for luck?","They move in different circles and hear about opportunities you haven't."],["What did near losers of the Dutch grant do that widened the gap?","They applied for later grants less often."],["What does \"ground the strike\" mean?","Making attempts small and frequent so you can survive misses and keep going."]],"pr":"This month: become findable.","it":"When I get a rejection, I'll send the next attempt before the weekend."},{"id":"mind-t05-l2","n":2,"t":"Confidence versus calibration","dg":[["mind-T05-gauge.webp","Five signs of a stuck gauge on the left and three outside checks on the right","A broken gauge and the three outside checks"]],"ep":[["avFW7U7yP_E","Psychology of Low IQ People Who Think They're Smart","16:16"],["i_ad72y7HTQ","Psychology of Problem Solving: 10 Strategies To Live Your Life On Easy Mode","15:46"]],"st":[["Explanation test:","pick one topic you \"know\" and explain it step by step out loud. Note where you stall."],["Say \"I don't know\"","at least twice when it's true, and follow up with \"I'll find out.\""],["Write one opinion","and what evidence would change it."],["Notice your first answers:","pause two seconds before answering one hard question a day."],["Ask for one piece of feedback","and resist explaining it away."]],"pf":"This week: check your gauge three ways.","pit":"When I feel certain about an answer in a meeting, I'll take two seconds to ask myself how I'd check it.","big":"People who think they're smart but aren't usually don't lack intelligence; their inner gauge of how much they know is stuck on full.","ex":"Victor was promoted to team lead six months ago.","tk":["In areas where you lack skill, you also lack the tools to **notice** it.","Groups often reward **confidence as if it were competence**.","Familiarity isn't understanding; **explaining step by step** reveals the difference.","Feeling like an expert can make you **more closed-minded**.","Keep your gauge honest from outside: **explain it, say \"I don't know,\" and name what would change your mind**."],"q":[["What is the right answer to the bat-and-ball question, and what does the question really measure?","Five cents; it measures whether you check an answer that feels certain."],["What is the double curse?","The skills needed to do something well are the same ones needed to recognize doing it badly, so lacking them hides the lack."],["Why do groups often trust overconfident people?","They can't measure competence directly, so they use confidence as a shortcut."],["What is earned dogmatism?","Feeling like an expert making people more closed-minded."],["What does it mean if nothing could change your mind about an opinion?","It has become part of your identity rather than a belief you can update."]],"pr":"This week: check your gauge three ways.","it":"When I feel certain about an answer in a meeting, I'll take two seconds to ask myself how I'd check it."},{"id":"mind-t05-l3","n":3,"t":"A psychologically rich life","dg":[["mind-T05-three-lives.webp","Three columns comparing the happy, meaningful and psychologically rich life by what they're built from, what predicts them and what they cost","Three kinds of good life"]],"ep":[["V-v-jUc9Wgc","If You Do These 10 Things, You're Exceptionally Different","14:35"],["D0SGbomVuKc","Psychology of Polymaths: Why Having Multiple Interests Is an Unfair Advantage","13:37"]],"st":[["Change your mind out loud","once this week when you notice you were wrong."],["Check one source","for a claim you'd like to be true before you share it."],["Ask the second question","in three conversations."],["Use third-person self-talk","on one problem: \"What should [your name] do here?\""],["List your last three big changes","and what you brought back from each."]],"pf":"This week: one rich habit, one honest check.","pit":"When a claim confirms what I already think, I'll find the original source before I pass it on.","big":"People who seem restless or \"difficult\" are often chasing a third kind of good life, one built from varied, perspective-shifting experiences.","ex":"Dana, an engineer, has changed jobs three times in eight years and keeps hearing she \"can't commit.\"","tk":["A **psychologically rich life** is a third dimension of a good life, alongside happy and meaningful.","**Intellectual humility** shows up as changing your mind out loud and checking sources you agree with.","**Third-person self-talk** helps you reason wisely about your own problems.","Richness is **distinct from happiness**, and it has real costs.","Tell depth from a **life of exits** by what you bring back."],"q":[["What are the three dimensions of a good life in Oishi and Westgate's work?","Happy, meaningful and psychologically rich."],["What trait most strongly predicts a psychologically rich life?","Openness to experience."],["What is Solomon's paradox?","People reason more wisely about other people's problems than their own."],["What predicted enjoying solitude in Nguyen's research?","Autonomy, not introversion."],["How do you tell real richness from a life of exits?","By whether you come back from each change with something new: a perspective, a skill or an understanding."]],"pr":"This week: one rich habit, one honest check.","it":"When a claim confirms what I already think, I'll find the original source before I pass it on."}]},{"id":"mind-t06","ch":"mind","num":6,"t":"Bright Minds, Odd Habits","ls":[{"id":"mind-t06-l1","n":1,"t":"Smart but \"lazy\": effort as a skill","dg":[["mind-T06-multiplier.webp","Two columns comparing ability with no steady effort and ability with steady effort","Intelligence is a multiplier"]],"ep":[["FD-s_fnzww8","Psychology of People Who Are Smart But Lazy","8:54"],["NtIArkeRfiA","10 Problems Only Highly Intelligent People Have","11:48"]],"st":[["Pick one effort skill","that can't be hacked: an instrument, a sport, a language, a fitness routine."],["Do 20 minutes a day,","including the boring parts."],["Ship one thing","at \"good enough\" instead of starting something new."],["Catch \"pointless\":","each time you dismiss a task, ask if it's truly pointless or just already solved in your head."],["Find one problem","that's worth your full effort and say yes to it."]],"pf":"This month: train effort on purpose.","pit":"When I feel the urge to drop something because it's gotten boring, I'll do 10 more minutes before deciding.","big":"Smart people who seem lazy usually aren't lacking ability; they're running a constant cost-benefit check, engaging only with what feels worth it, and often never learned to tolerate struggle.","ex":"Sam, 29, breezed through school and now has a dozen half-finished side projects and a job he finds dull.","tk":["Smart \"lazy\" people run a constant **cost-benefit filter**.","**Selective engagement:** all in on fascinating work, nothing on dull work.","Never struggling early means **effort later feels wrong**; it's a skill to build.","**Perfectionism** can hide as apathy.","Intelligence is a **multiplier**: it needs something worth multiplying."],"q":[["What is the cost-benefit filter?","A quick check of whether a task's outcome is worth the energy; quick thinkers often see the ceiling early and pass."],["What is selective task engagement?","Putting huge effort into fascinating tasks and almost none into ones that feel pointless."],["What is the competence-without-effort paradox?","Being good at things without trying means you never learn to link effort with reward, so effort later feels wrong."],["How can perfectionism look like laziness?","Someone would rather do nothing than produce something mediocre, so they don't start."],["What does \"intelligence is a multiplier\" mean?","It amplifies whatever you apply it to; applied to nothing, it produces nothing."]],"pr":"This month: train effort on purpose.","it":"When I feel the urge to drop something because it's gotten boring, I'll do 10 more minutes before deciding."},{"id":"mind-t06-l2","n":2,"t":"Ten quiet habits of a curious mind","dg":[["mind-T06-ten-habits.webp","Three cards grouping the ten habits into taking in, making sense and connecting, with common misreadings","Ten quiet habits of a curious mind"]],"ep":[["lk7j7U5a4cM","Psychology of People With Extremely High IQ","5:54"],["i_ad72y7HTQ","Psychology of Problem Solving: 10 Strategies To Live Your Life On Easy Mode","15:46"]],"st":[["Reflect with a question","after two important conversations."],["Say your pause","at least once: \"Give me a second to think.\""],["Explain your why","when you ask one, so it reads as curiosity, not challenge."],["Write down one connection","between two unrelated things you learned this week."],["Protect 20 minutes","of unstructured time after hard work."]],"pf":"This week: use three habits deliberately.","pit":"When someone asks me something important, I'll say 'Let me think for a second' instead of rushing or going silent.","big":"Many signs of high intelligence are quiet and internal, and easy to misread as quirks.","ex":"Ava, a project analyst, is told in a review that she \"seems distracted in meetings\" and \"asks a lot of questions.\"","tk":["Many signs of intelligence are **quiet and internal**.","**Reflecting** on conversations and **connecting ideas** deepen learning.","**Getting lost in thought** is often the brain exploring.","These habits are easy to **misread** from outside.","Use them **on purpose**: reflect with a question, say your pause, share your connections."],"q":[["What is elaborative encoding?","Processing information more deeply by connecting it to meaning, such as reflecting on what a conversation meant."],["What is the default mode network linked to?","Creativity, self-reflection and complex problem solving when the mind appears to drift."],["Which personality trait is linked to broad curiosity?","Openness to experience."],["What is theory of mind?","Understanding that other people have different thoughts, experiences and reasoning."],["How can you keep reflection from turning into anxious replaying?","Reflect with a specific question, like \"What did I learn? What did they mean?\""]],"pr":"This week: use three habits deliberately.","it":"When someone asks me something important, I'll say 'Let me think for a second' instead of rushing or going silent."},{"id":"mind-t06-l3","n":3,"t":"The quiet, deep-processing mind","dg":[["mind-T06-energy.webp","A cycle from deep engagement to drained to quiet recovery to recharged","The deep processor's energy cycle"]],"ep":[["m_NbbDJJayc","Psychology of Introverts With Extremely High IQ","10:36"],["POqCOvbJFbE","Why Some People Are Meant to Walk Alone (Psychology Explains)","11:42"]],"st":[["Use one process line","in a meeting: \"Let me think and get back to you by…,\" then follow through."],["Schedule recovery","after your biggest social commitment this week."],["Ask one depth question","in a conversation that would normally stay small."],["Keep a night notebook","for late ideas."],["Notice overthinking:","if you replay the same moment three times, write it down and set it aside."]],"pf":"This week: be understood and recover well.","pit":"After any social event over two hours, I'll protect at least an hour of quiet before my next commitment.","big":"Introverts with high intelligence tend to process deeply and stay quiet, which makes them easy to underestimate and easy to drain.","ex":"Daniel, a software engineer, is told he's \"aloof\" and \"slow to contribute\" in meetings.","tk":["Quiet intelligence is easy to **underestimate**.","Deep processing makes people **observant**, but also prone to **overthinking**.","Pausing before speaking is a **filter**, not uncertainty.","Even good social time **drains** a deep processor; quiet is **recovery**.","**Name your process** and **plan recovery** so others can read you accurately."],"q":[["Why can quiet observation look like disinterest?","Deep processors watch and take things in before engaging, which looks passive from outside."],["What is response inhibition?","Delaying a response in order to give a more considered one."],["Why do even enjoyable social events drain deep processors?","Deep engagement uses a lot of energy, so they need quiet to recover."],["What is selective social investment?","Putting relational energy into a few deep relationships rather than many light ones."],["What's one way to help others read a thoughtful pause correctly?","Name your process: \"I like to think before I answer; I'll get back to you.\""]],"pr":"This week: be understood and recover well.","it":"After any social event over two hours, I'll protect at least an hour of quiet before my next commitment."},{"id":"mind-t06-l4","n":4,"t":"Faces, names and memory","dg":[["mind-T06-names.webp","Two columns comparing how faces and names are remembered, ending with the fix for names","Why names slip, and how to keep them"]],"ep":[["3rScSBZIN7Q","Psychology of People Who Forget Names But Remember Faces","6:38"],["f1gkkzHZxNg","Psychology of Intelligence: Learn Anything So Fast It's Almost Unfair","15:03"]],"st":[["At every introduction,","say the person's name back immediately."],["Use it once more","before the conversation ends."],["Make one silly image","linking the name to something about them."],["That evening,","picture the faces and try to recall the names."],["Track it:","how many new names did you keep this week?"]],"pf":"This week: learn five names on purpose.","pit":"When someone tells me their name, I'll repeat it in my very next sentence.","big":"Many people never forget a face but always lose the name, and it isn't a sign they don't care.","ex":"Laura, a new school principal, meets 40 parents at a back-to-school night.","tk":["**Faces and names** use different brain routes; faces are faster.","Names are hard because they **connect to nothing** (the Baker/baker paradox).","Introductions are the **worst moment** to learn: you're busy managing yourself.","Forgetting a name is a **preoccupation problem**, not proof you don't care.","**Say it back, use it, and give it a neighbor.**"],"q":[["Why are faces easier to remember than names?","Face recognition is fast and automatic, while name recall travels a slower route to language areas."],["What is the Baker/baker paradox?","People remember someone's job \"baker\" better than the name \"Baker,\" because the job connects to many things and the name to nothing."],["What is the next-in-line effect?","People remember less of what was said right before their turn because they're preparing what to say."],["Why does saying a name back help?","It forces your brain to actively process the name instead of letting it pass."],["What does \"give it a neighbor\" mean?","Linking the name to a vivid image or meaning so it has something to attach to."]],"pr":"This week: learn five names on purpose.","it":"When someone tells me their name, I'll repeat it in my very next sentence."}]},{"id":"mind-t07","ch":"mind","num":7,"t":"The Weight of a Sharp Mind","ls":[{"id":"mind-t07-l1","n":1,"t":"Names: giving the label a hook","dg":[["mind-T07-name-hook.webp","A flow from hearing a name, to attaching a hook, to saying it aloud, to remembering it","From surface to meaning"]],"ep":[["vb4vTOJcPMI","Why High-IQ People Forget Names Easily","12:39"],["3rScSBZIN7Q","Psychology of People Who Forget Names But Remember Faces","6:38"]],"st":[["At every introduction,","make a hook in your head within five seconds."],["Say the name aloud","within the first minute and once before you part."],["That evening,","write the names and hooks from the day."],["Use the repair line","at least once instead of avoiding someone."]],"pf":"This week: hook, retrieve, repair.","pit":"When someone tells me their name, I'll attach it to the first fact I learn about them.","big":"Forgetting names is often a side effect of processing people deeply, not a bad memory.","ex":"Felix starts a new job and meets eight people on day one.","tk":["Memory keeps **meaning** and drops **surface**, and names are mostly surface.","At introductions, **working memory** is full, so names never get recorded.","The **tip-of-the-tongue** feeling means the name is stored but hard to reach.","**Hook** each name to meaning and **use it** early.","Use a warm **repair line** instead of hiding."],"q":[["What does levels-of-processing theory say?","Information processed for meaning lasts; information processed only for its surface fades quickly."],["Why are names especially easy to forget?","A name is almost pure surface; it carries little meaning to attach to."],["What's the difference between verbatim and gist memory?","Verbatim memory stores exact words and labels; gist memory stores meaning."],["What does the tip-of-the-tongue state show?","The name is stored; the retrieval path is what's weak."],["What's a good repair line when you lose a name?","\"I was so focused on what you were saying that I lost your name. Tell me once more?\""]],"pr":"This week: hook, retrieve, repair.","it":"When someone tells me their name, I'll attach it to the first fact I learn about them."},{"id":"mind-t07-l2","n":2,"t":"Small talk: a handshake, not a test","dg":[["mind-T07-handshake.webp","Three steps from a short warm handshake to a steering question to choosing where to spend your presence","Handshake, steer, budget"]],"ep":[["C_hE5r8c60U","Why Smart People Can't Pretend to Like Sports or Celebrity Gossip","11:46"],["0vubhhu3dJU","Psychology of Conversations: How to Never Run Out of Things to Say","14:32"]],"st":[["In three small-talk moments,","give 90 seconds of genuine warmth without forcing interest in the topic."],["Steer once:","ask one \"why\" or \"how did you get into\" question about the person behind the topic."],["Notice the energy cost","after each social event; rate it 1 to 5."],["Decline one draining invitation","without a cover story."]],"pf":"This week: three handshakes, one steer.","pit":"When the conversation turns to something I can't care about, I'll ask what got the other person into it.","big":"Some people can't fake interest in sports or gossip, and it isn't arrogance; their minds go flat without depth, and faking costs them real energy.","ex":"Monday morning, the office is replaying last night's game, and Hana, an analyst, doesn't follow sports.","tk":["Some minds find **thinking rewarding** and repetitive talk empty (**need for cognition**).","Faking a feeling (**expressive suppression**) costs energy, raises stress and blurs memory.","**Low self-monitors** have one face; it's honesty, not coldness.","Treat small talk as a **90-second handshake**.","**Steer** from the topic to the person, and **budget** where you spend your presence."],"q":[["What is need for cognition?","How much someone enjoys the act of thinking itself."],["What did Gross find about suppressing or faking emotions?","It uses mental energy, raises stress and impairs memory of the conversation."],["What is a low self-monitor?","Someone whose expressions show what they actually feel rather than adjusting to the room."],["According to Dunbar, what is gossip really for?","Social grooming: building closeness, not exchanging information."],["How do you steer small talk without faking?","Ask a question about the person behind the topic, like how they became a fan."]],"pr":"This week: three handshakes, one steer.","it":"When the conversation turns to something I can't care about, I'll ask what got the other person into it."},{"id":"mind-t07-l3","n":3,"t":"Seeing too much: the cost of clarity","dg":[["mind-T07-microscope.webp","Three zoom levels labeled file it, glance at it and examine it, with examples of each","Selective resolution"]],"ep":[["o8Xh_Fc5Te0","The Curse Of Being A Highly Intelligent Person","11:06"],["-5F0IstQGG0","The Dark Psychology of People Who Are Too Aware","13:34"]],"st":[["Explain one idea step by step","and ask the listener to say it back."],["File, don't pull:","each day, consciously let one small inconsistency go."],["Pick your battle:","choose the one risk or truth worth raising this week, and raise it with the steps shown."],["Reach out to one person","who gets how you think."],["Write one sentence","about what you've chosen to care about."]],"pf":"This week: one explanation, one filed thread, one sentinel.","pit":"When I notice a small thing that doesn't add up, I'll ask, 'Does this matter this week?' before I chase it.","big":"A mind that sees patterns, problems and hidden rules pays a \"clarity tax\": it can feel lonely, frozen by consequences, or tired of meaning.","ex":"Sam is a project manager who keeps seeing problems before anyone else.","tk":["The **curse of knowledge** makes clear thinkers skip steps and sound impatient.","Groups resist people who see through **comfortable shared stories**.","Heightened awareness brings three shadows: **isolation, decision paralysis, meaning fatigue**.","Use **selective resolution**: choose which details deserve a closer look.","Find a few **people who don't flinch**, and **choose meaning** deliberately."],"q":[["What is the curse of knowledge?","Once you know something, you can't easily remember not knowing it, so you assume it's obvious to others."],["What did the friendship study find for the most intelligent people?","More time with friends went with lower life satisfaction, unlike for most people."],["What is metacognition?","Thinking about your own thinking."],["Name the three shadows of heightened awareness.","Existential isolation, decision paralysis and meaning fatigue."],["What is selective resolution?","Choosing which details to examine closely and which to accept at face value."]],"pr":"This week: one explanation, one filed thread, one sentinel.","it":"When I notice a small thing that doesn't add up, I'll ask, 'Does this matter this week?' before I chase it."},{"id":"mind-t07-l4","n":4,"t":"Love and a busy mind","dg":[["mind-T07-detective-historian.webp","Two columns comparing a detective mindset with a historian mindset in love","From detective to historian"]],"ep":[["gl3UxW3gN4o","6 Reasons Highly Intelligent People Struggle to Find Love","14:32"],["J9I2d9uRJGc","The Day You Stop Romanticizing People","13:50"]],"st":[["Keep a doubt notebook:","write doubts down, and don't decide anything about them for two weeks."],["Practice one plain sentence","about your feelings each week."],["When someone you love is upset,","comfort first: \"I'm here.\" Save solutions until they ask."],["Ask one question","about your partner or a close friend that you don't know the answer to."]],"pf":"This month: aim the analysis at curiosity.","pit":"When my partner shares something painful, I'll say 'I'm here' before I say anything else.","big":"The same mind that excels at almost everything can work against it in love.","ex":"Leah, an engineer, has ended three good relationships around the six-month mark.","tk":["**Asynchronous development:** thinking can mature faster than emotional closeness.","Six reasons: **smaller pool, maximizing, intellectualizing, depth hunger, the finished puzzle, IQ isn't EQ**.","Comfort first; **theories later, if at all**.","Use the mind as a **notebook, not a judge**.","Choose **depth and curiosity**, not a matching IQ."],"q":[["What is asynchronous development?","When thinking develops faster than emotional and social maturity."],["Why do maximizers often enjoy relationships less?","Part of their mind keeps scanning for a better option even after choosing."],["What does intellectualizing look like in a relationship?","Offering analysis or a theory when the other person needs comfort."],["What is relational boredom's risk for novelty-seeking minds?","Familiarity starts to feel boring right when the relationship becomes safe."],["What are the three shifts?","Notebook not judge, findable not impressive, and choosing depth over matching intelligence."]],"pr":"This month: aim the analysis at curiosity.","it":"When my partner shares something painful, I'll say 'I'm here' before I say anything else."},{"id":"mind-t07-l5","n":5,"t":"Many interests: building bridges","dg":[["mind-T07-bridges.webp","Three tall anchor towers connected by bridges, with labels for translator, context reader and knowledge system","Anchors and bridges"]],"ep":[["N2cZyIX6ogs","You Have Too Many Interests? Good, Your Future is Officially AI-Proof","9:28"],["D0SGbomVuKc","Psychology of Polymaths: Why Having Multiple Interests Is an Unfair Advantage","13:37"]],"st":[["Choose two or three anchor areas","to go deep in this year."],["Start one searchable notes file","and add a line whenever an idea from one interest connects to another."],["Find one translation gap","at work or in a community: two groups talking past each other."],["Offer one bridge:","a summary, a training, an explanation between them."]],"pf":"This month: anchor, capture, translate.","pit":"When something I'm learning reminds me of another field, I'll write one line linking them.","big":"Having many interests is an advantage when you connect them on purpose, especially in a world that keeps changing.","ex":"Omar works in IT support and is also into psychology, video editing and cooking.","tk":["Breadth powers **analogical reasoning**: seeing shared structure across fields.","Your identity can rest on **how you think**, not a job title.","Deep specialists can become **entrenched** when the rules change.","Be a **translator** and **context reader**, and keep a **knowledge system**.","Anchor breadth in **two or three areas of real depth**."],"q":[["What is analogical reasoning?","Recognizing that a problem in one field shares structure with something from another."],["What is identity diffusion, and how does the video reframe it?","Feeling you lack a solid identity; the reframe is that your identity is how you think, not what you do."],["What is cognitive entrenchment?","Deep expertise making someone route every problem through the same familiar paths."],["What does a translator do in an organization?","Converts ideas and frameworks between groups who speak different professional languages."],["Why go deep in two or three areas?","Depth gives breadth credibility and anchors."]],"pr":"This month: anchor, capture, translate.","it":"When something I'm learning reminds me of another field, I'll write one line linking them."}]},{"id":"steady-t01","ch":"steady","num":1,"t":"Staying Steady Under Pressure","ls":[{"id":"steady-t01-l1","n":1,"t":"Resilience: finding the switch after a hit","dg":[["steady-T01-control-switch.webp","A flow from a hard blow to automatic shutdown, then a small controllable action, evidence that actions matter, and the shutdown switching off","The breaker and the hand that resets it"]],"ep":[["TRd1kuUGazE","Psychology of Resilience: Build a Mind So Strong It Scares People","18:56"],["qIJ2943Bzko","10 Signs You Have Survivor's Intelligence (The Rarest Kind of Smart)","15:45"]],"st":[["Write your lever list:","five small actions that always respond to you (a walk, a tidy desk, one email, cooking a meal, a call)."],["Use one each morning,","even on good days, so it's ready for bad ones."],["Catch one fused thought","(\"I am a…\") and rewrite it as an event (\"This happened because…\")."],["Pick one chosen challenge","with a clear end point."],["Reach out to one person","and tell them honestly how you're doing."]],"pf":"This week: build your reset routine.","pit":"When I notice myself freezing after bad news, I'll do the first thing on my lever list within ten minutes.","big":"Shutting down after a hard blow is automatic in everyone. What you can learn is the sense of control that switches the shutdown back off.","ex":"Jordan's small business closed after three years.","tk":["Shutting down after a heavy blow is **automatic**; the learnable part is noticing control and acting on it.","After a hit, find **one small action that responds** to you.","Don't turn setbacks into **permanent verdicts** about who you are.","Resilience is the **most common** response to adversity, and **flexibility** helps more than rigid toughness.","**Lean on other people**; support is one of the strongest resilience factors."],"q":[["What did Maier and Seligman discover 50 years after learned helplessness?","Shutting down under prolonged stress is the default; what's learned is control, which switches the shutdown off."],["What is the \"smallest controllable lever\"?","A small action right in front of you that will respond if you push it, like making the bed or sending one email."],["What's the trap in \"fusing the hit to who you are\"?","Turning a setback into a permanent verdict about yourself, which is linked to depression."],["What are the three attitudes of hardiness?","Commitment, control and challenge."],["What predicts resilience better than emotional toughness?","Flexibility: feeling emotions when that helps and setting them down when that helps."],["When should a shutdown be checked by a professional?","When it lasts weeks with loss of interest, sleep or appetite changes and hopelessness."]],"pr":"This week: build your reset routine.","it":"When I notice myself freezing after bad news, I'll do the first thing on my lever list within ten minutes."},{"id":"steady-t01-l2","n":2,"t":"Composure: calm upstream, not held in","dg":[["steady-T01-reappraise-suppress.webp","Two columns comparing reappraisal and suppression from the trigger to the inside feeling, the face, the body and the effect on the other person","Same face, opposite insides"]],"ep":[["wq8TrxPYN7A","Psychology of Composure: Be So Calm It Makes People Nervous","14:54"],["5FTyEGYntYw","How To Never Get Angry Or Bothered By Anyone","16:49"]],"st":[["Breathe daily:","five minutes of in-4, out-6 to 8, at the same time each day."],["Use the reappraisal question","on three things that irritate you, writing two not-about-me explanations for each."],["Practice the one-breath delay","in every tense conversation."],["Watch for suppression:","notice when you're holding a feeling in with a tight jaw, and name it to yourself."]],"pf":"This week: train the brake and the question.","pit":"When I feel my face tighten in a meeting, I'll take one long exhale before I respond.","big":"Real composure is a trained skill of interpretation and breathing, not a poker face.","ex":"In a client meeting, a customer tells Priya her team \"clearly doesn't know what they're doing.\"","tk":["**Reappraise, don't suppress:** change what the event means rather than hiding what you feel.","Suppression costs **both people**: worse feelings for you, more stress for them.","**A long exhale** is a direct lever on your body's stress response.","A **one-breath pause** before answering under pressure buys your judgment time.","Calm and cold are different: **relaxed and responsive** versus locked down."],"q":[["What's the difference between reappraisal and suppression?","Reappraisal changes what an event means before the emotion builds; suppression lets the emotion build and hides it."],["What happened to the partner of someone told to suppress?","Their blood pressure rose and the conversation felt less connected."],["Why does a long exhale calm you?","Heart rate naturally slows on the out-breath, which engages the vagal brake."],["What is the reappraisal question?","Replace \"what does this mean about me?\" with \"what is this actually?\" and find two explanations not about you."],["How is the no-feedback stance different from stonewalling?","It's relaxed, brief and warm; stonewalling is suppression with a locked jaw."]],"pr":"This week: train the brake and the question.","it":"When I feel my face tighten in a meeting, I'll take one long exhale before I respond."},{"id":"steady-t01-l3","n":3,"t":"Anger: stop feeding the fire","dg":[["steady-T01-ember-bellows.webp","An ember in the center with four bellows labeled replaying, self-auditing, shelter and venting, and a path of breathing and waiting that lets it go out","The ember and the bellows"]],"ep":[["5FTyEGYntYw","How To Never Get Angry Or Bothered By Anyone","16:49"],["wq8TrxPYN7A","Psychology of Composure: Be So Calm It Makes People Nervous","14:54"]],"st":[["Notice the ember:","each time something annoys you, name it in one sentence."],["Body first:","two minutes of long-exhale breathing and stillness before doing anything else."],["Change the pronoun:","write or think about it once in the third person."],["Rate importance:","1 to 10, is this opinion load-bearing?"],["Track the burn time:","roughly how long until the irritation faded?"]],"pf":"This week: practice the three principles on small irritations.","pit":"When I catch myself rehearsing a comeback, I'll say my own name and ask what actually happened.","big":"Unbothered people feel the same flash of anger as everyone else; they just stop feeding it.","ex":"A neighbor posts in the community group that Sam's family \"never maintains their yard.\"","tk":["**Venting makes anger worse;** calming the body makes it better.","How long anger lasts depends mostly on **importance and rumination**, not how hard it hit.","In the first minutes, deal with the **body**: slow breathing and doing nothing beat running and hitting things.","Think about it in the **second or third person** to step back.","Ask whether the person's opinion is **load-bearing**; if it is, have a calm conversation later."],"q":[["What did the 154-study review find about venting and calming?","Activities that lower arousal reduce anger; activities that raise it (like hitting things) generally don't and can make it worse."],["What two things predict how long an emotion lasts?","How important the event feels and how much you ruminate on it."],["What does \"body first, meaning second\" mean?","Lower your physical arousal with slow breathing and stillness before you think about what the event means."],["What is distanced self-talk?","Thinking about the situation using your name or \"you\" instead of \"I\"."],["What's a \"load-bearing\" opinion, and what do you do when it is one?","An opinion that genuinely matters to your life; then you have a calm conversation once you've cooled down."]],"pr":"This week: practice the three principles on small irritations.","it":"When I catch myself rehearsing a comeback, I'll say my own name and ask what actually happened."}]},{"id":"steady-t02","ch":"steady","num":2,"t":"Where Your Worth Lives","ls":[{"id":"steady-t02-l1","n":1,"t":"Self-worth: where you've staked it","dg":[["steady-T02-worth-domains.webp","A spectrum from external domains (approval, appearance, output, comparison) to internal ones (honesty, kindness, craft, values)","Where is the deed held?"]],"ep":[["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"],["1dzUVXPj4yE","The Psychology of Not Giving A F*ck","15:44"]],"st":[["Find the deed:","write down three things that ruined a day for you in the last month. Which domain does each belong to?"],["Write your internal standards:","three standards you can meet privately."],["Do one hidden good thing","that satisfies a value and that nobody will know about."],["Practice reading, not ruling:","when the gauge fires, say \"that's a reading,\" out loud or in your head."],["Ask the self-compassion question","after one hard moment: \"What does this person need?\""]],"pf":"This week: find the deed and move one piece of it.","pit":"When criticism stings, I'll name it as a reading and check it against my own standards before deciding what it means.","big":"\"Low self-worth\" is usually the wrong diagnosis; the real question is where you keep your worth.","ex":"Elena, a graphic designer, feels great when a client praises her work and crushed for days when one asks for revisions.","tk":["Ask **where** your worth is staked, not just how much you have.","Self-esteem is a **gauge of acceptance**; you can't switch it off, but you can stop treating readings as verdicts.","Staking worth on performance tends to make performance **worse**, not better.","People **notice you far less** than you think.","**Self-compassion** gives steadier self-worth than chasing self-esteem."],"q":[["What are contingencies of self-worth?","The specific areas where your self-regard rises and falls with success and failure."],["What does sociometer theory say self-esteem is?","A gauge that tracks how accepted and valued you seem to be."],["What are the four external domains in the lesson?","Approval, appearance, competence and output, and comparison."],["What did the spotlight effect studies find?","People overestimated how many others noticed their embarrassing T-shirt, by about double."],["What's the difference between the questions self-esteem and self-compassion ask?","Self-esteem asks \"am I good?\"; self-compassion asks \"what does this person need?\""]],"pr":"This week: find the deed and move one piece of it.","it":"When criticism stings, I'll name it as a reading and check it against my own standards before deciding what it means."},{"id":"steady-t02-l2","n":2,"t":"Caring about fewer things, on purpose","dg":[["steady-T02-borrowed-care.webp","Three rows pairing borrowed fights, scoreboards and urgency with naming your few, the ten-year question and cutting off the sources","Three lenders and three ways to stop borrowing"]],"ep":[["1dzUVXPj4yE","The Psychology of Not Giving A F*ck","15:44"],["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"]],"st":[["Write your list","of five or fewer people and things you care about most."],["Track borrowed care for two days:","each time you feel a pull, note which lender it came from."],["Ask the ten-year question","of each pull."],["Cut off one lender:","mute, unfollow or switch off one source for the week."],["Give the freed time","to something on your list."]],"pf":"This week: name your few and mute one lender.","pit":"When I reach for my phone after dinner, I'll ask whether it's on my list before I unlock it.","big":"People who seem not to care usually care just as much; they've learned where to put it.","ex":"Marco ends most evenings tense and distracted.","tk":["You can't stop caring by deciding to; you **move your attention**, and caring follows.","Whatever you focus on **feels more important** than it is.","Care gets borrowed by **fights, scoreboards and urgency**.","**Name your few** and check every pull against the list.","**Cut off the sources** that lend you concerns."],"q":[["According to Frijda, where does every emotion come from?","A concern, something you care about, that an event touches."],["What is the focusing illusion?","Whatever you're thinking about feels more important than it really is."],["What are the three lenders of care?","Fights, scoreboards and urgency."],["What happened when people deactivated Facebook for four weeks?","They gained about an hour a day, spent more time with friends and family, and felt slightly happier."],["How is this lesson different from losing interest in everything?","This is about caring too widely; losing interest in everything can be a sign of depression and deserves professional help."]],"pr":"This week: name your few and mute one lender.","it":"When I reach for my phone after dinner, I'll ask whether it's on my list before I unlock it."},{"id":"steady-t02-l3","n":3,"t":"Confidence: lowering the entry fee","dg":[["steady-T02-entry-fee.webp","Four gates labeled approval, certainty, readiness and verdict, each paired with a smaller action that gets you through","The four entry fees"]],"ep":[["qL-uEtXmnqE","Psychology of Confidence: Be So Confident It Makes People Nervous","13:43"],["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"]],"st":[["Read your receipt:","pick one thing you've been putting off and finish \"I'll do it once ___\" out loud."],["Name the fee:","approval, certainty, readiness or verdict?"],["Take ten tiny actions","this week at about 70% ready: an email, a question, a first step."],["Log each one:","what you feared, and what actually happened."],["Ask the 20-minute question","once a day: what would someone doing this do next?"]],"pf":"This week: ten tiny underprepared actions.","pit":"When I catch myself waiting to feel ready, I'll do the smallest version of the task within the next 20 minutes.","big":"Confident people don't believe in themselves more; they require less from the world before they act.","ex":"Nadia has wanted to start a small bookkeeping side business for three years.","tk":["Raising self-esteem first doesn't reliably produce success; **success tends to come first**.","Confidence is a **low entry fee** for action, not a high opinion of yourself.","**Doing it** is the strongest source of belief that you can do it.","Reassurance-seeking and waiting for certainty **keep anxiety going**.","You learn who you are by **watching what you do**."],"q":[["What did the 2003 self-esteem review find?","High self-esteem mostly follows success rather than causing it."],["What are the four entry fees?","Approval, certainty, readiness and a verdict on who you are."],["What is the strongest source of self-efficacy?","Mastery experiences: having done the thing."],["What does \"read the receipt\" mean?","Saying \"I'll do it once ___\" out loud so you can see how unpayable the prerequisites are."],["How do you escape the verdict trap?","Stop asking who you are; do what someone doing this would do next, and learn from watching your actions."]],"pr":"This week: ten tiny underprepared actions.","it":"When I catch myself waiting to feel ready, I'll do the smallest version of the task within the next 20 minutes."}]},{"id":"steady-t03","ch":"steady","num":3,"t":"Ego and the Inner Critic","ls":[{"id":"steady-t03-l1","n":1,"t":"Offense: the alarm on a narrow self","dg":[["steady-T03-wall-or-land.webp","Two panels: a small walled plot hit by a comment, and a wide field where the comment lands far from any wall","A higher wall or wider land"]],"ep":[["tx5rBLoXIjA","Psychology of EGO: Why We Get Offended So Easily?","16:12"],["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"]],"st":[["List your pillars:","at least three areas of life that make up \"you.\""],["Prepare two true things","about yourself you can name when stung."],["Name your ruler-holders:","three or four people whose judgment you'll weigh."],["When stung,","write the comment down and wait 24 hours before judging it."],["Use the trusted-person test","before deciding it's an attack."]],"pf":"This week: widen the land.","pit":"When I feel the hot flash of offense, I'll name two true things about myself before I respond.","big":"Getting offended isn't oversensitivity; it's an alarm guarding whatever you've staked your identity on, and the smaller that territory, the louder the alarm.","ex":"At a family dinner, Dev's brother-in-law jokes that his small business \"seems more like a hobby.\"","tk":["Retaliation follows threats to an **inflated** self-view, not low self-esteem.","Self-esteem tracks how valued we seem to others (the **sociometer**).","Under threat, the self **narrows** to the criticized part.","**Self-affirmation** works by restoring a broader view of yourself.","Separate **\"does it hurt?\"** from **\"is it true?\"**"],"q":[["What predicted retaliation after an insult: low self-esteem or narcissism?","Narcissism; the trigger was a threat to an inflated self-view."],["What happens to your sense of self under threat?","It narrows, so the criticized part fills the frame."],["Why do comments sting most where you already agree?","They match a private doubt, so they feel more believable."],["What is self-affirmation and why does it work?","Naming true things about yourself the comment didn't touch; it restores a broader view of the self."],["What's the 24-hour test?","Ask whether you'd call the comment an attack if the person you trust most said it kindly."]],"pr":"This week: widen the land.","it":"When I feel the hot flash of offense, I'll name two true things about myself before I respond."},{"id":"steady-t03-l2","n":2,"t":"Kind to others, hard on yourself","dg":[["steady-T03-double-standard.webp","Two columns comparing words to a friend with words to yourself","Two sets of rules"]],"ep":[["ut6zfew6cnI","Psychology Of People Who Hate Themselves (But Kind To Others)","10:23"],["0nBvAYO-DGg","Psychology of Self-Worth (And How To Stop Seeking External Validation)","17:38"]],"st":[["Catch one self-criticism","each day and write it down word for word."],["Write the friend version:","what you'd say to a friend in the same spot."],["Read it aloud","with your own name."],["Accept one compliment","with just \"thank you.\""],["Ask for one small thing","from someone close."]],"pf":"This week: practice the friend test daily.","pit":"When I hear myself say 'I'm so stupid,' I'll ask, 'What would I tell a friend right now?'","big":"Many people comfort others easily but turn harsh on the
