fault and a sense of control must be learned.",["steady-t01-l1"]],["Learned industriousness","When effort is repeatedly rewarded, effort itself starts to feel less costly.",["change-t01-l1"]],["Levels of processing","Information processed for its meaning is remembered far better than information processed only for its surface, like sound or spelling.",["mind-t07-l1"]],["Liked versus known","Being liked means people enjoy your company; being known means someone has seen the real you, including bad days, and stayed.",["people-t10-l3"]],["Liking gap","People underestimate how much their conversation partners like them.",["people-t01-l1"]],["Liking versus wanting","Liking is an evaluation of someone; wanting is a motivation toward them. They can move in opposite directions.",["people-t05-l1"]],["Limited reparenting","A therapy technique of giving yourself (or a client) the steady, caring words that weren't given in childhood.",["people-t11-l3"]],["Locus of control","Whether you feel your own choices (internal) or outside forces (external) drive your outcomes.",["life-t06-l4"]],["Loss aversion","Feeling a loss about twice as strongly as an equal gain, which makes the safe or familiar option feel better than it is.",["people-t08-l2","life-t07-l2"]],["Lucifer effect","The idea that ordinary, decent people can be drawn into cruelty by the situation they are in, rather than by bad character.",["people-t08-l1"]],["Ma","A Japanese word for the meaningful space between things: the pause in music, the empty space in a painting, unhurried time.",["life-t09-l1"]],["Machiavellianism","A personality style made of antagonism, agency and planfulness; in one study only agency predicted career success.",["people-t03-l3"]],["Maladaptive daydreaming","Losing hours to absorbing fantasy to the point of preferring it to real life. Described in research but not yet an official diagnosis.",["steady-t08-l1"]],["Maladaptive overcontrol","A coping style of too much self-control, linked to rigidity, held-in emotion and distant relationships.",["life-t02-l2"]],["Mastery experience","Having actually done a task; the strongest source of self-efficacy.",["change-t03-l2","steady-t04-l1","steady-t02-l3"]],["Matthew effect","Early advantages compounding over time, so small early wins grow into large gaps.",["mind-t05-l1"]],["Maximizers and satisficers","Maximizers search for the best possible option; satisficers choose the first one that's good enough. Maximizers often do better but feel more regret.",["mind-t04-l1"]],["Mental contrasting","Picturing a desired outcome, then naming the main obstacle in the same sitting. Combined with an if-then plan, it becomes WOOP (Wish, Outcome, Obstacle, Plan).",["change-t03-l2"]],["Mental rehearsal","Practicing a skill in your imagination; it can improve real performance.",["change-t06-l4"]],["Mental simulation","Running a situation forward in your head to see where each option leads before acting.",["steady-t09-l1"]],["Mere exposure effect","Liking something or someone more simply because you've encountered it repeatedly.",["people-t01-l1"]],["Metacognition","Thinking about your own thinking.",["mind-t07-l3"]],["Michelangelo phenomenon","Close partners helping sculpt who we become, toward or away from our ideal self.",["people-t02-l4"]],["Micro-wins","Tiny, visible, finishable steps toward a distant goal, which give the brain wins it can see and anticipate.",["change-t06-l3"]],["Moral hypocrisy","Wanting to appear moral, even to yourself, while still coming out ahead.",["people-t03-l3"]],["Narrative transportation","Being absorbed in a story with attention, imagination and feeling all pointed at it.",["people-t04-l3"]],["Need for closure","The wish for a firm answer instead of uncertainty, which leads people to settle on judgments quickly and hold on to them.",["people-t02-l2"]],["Need for cognition","A lasting enjoyment of effortful thinking.",["mind-t03-l3"]],["Negative contrast","Judging a reward as worse because it follows /* ---------- progress: XP, levels, streak, tiers, daily quests ---------- */
const level = xp => Math.floor(Math.sqrt(xp / 40)) + 1;
const rank = lv => RANKS[Math.min(lv - 1, RANKS.length - 1)];
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el.t); el.t = setTimeout(() => el.classList.remove('on'), 2400); }
function addXP(n) {
  const before = level(S.xp); S.xp = Math.max(0, S.xp + n);
  const after = level(S.xp);
  if (after > before) {
    const g = GEAR.find(x => x[3] === after);
    V.levelUp = after; setTimeout(() => { toast(`Level ${after}! ${g ? 'New look unlocked: ' + g[2].toLowerCase() + '.' : rank(after) + '.'}`); SFX.fanfare(); }, 500);

}
const streakNow = () => S.streak.d === today() || S.streak.d === today(-1) ? S.streak.n : 0;
function touchStreak() { const t = today(); if (S.streak.d === t) return; S.streak.n = S.streak.d === today(-1) ? S.streak.n + 1 : 1; S.streak.d = t; }
function seeded(seed) { let x = 0; for (const c of seed) x = (x * 31 + c.charCodeAt(0)) >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; }

    const pick = []; while (pick.length < 3) { const q = pool[Math.floor(r() * pool.length)]; if (!pick.includes(q.id)) pick.push(q.id); }

}
const dailyDone = () => { const d = daily(); return d.q.every(id => (d.p[id] || 0) >= DQ.find(x => x.id === id).n); };
function tierOf(id) {

}
function worldStats(c) { const ts = T.filter(t => t.ch === c && topicOk(t)); const got = ts.reduce((s, t) => s + Math.min(3, S.stars[t.id] || 0), 0); return {ts, got, max: ts.length * 3, cleared: ts.filter(t => S.stars[t.id]).length}; }
const bossReady = c => { const w = worldStats(c); return w.ts.length && w.cleared >= Math.ceil(w.ts.length / 2); };

/* ---------- question makers ---------- */
function opts(correct, pool) {
  const seen = new Set([correct.toLowerCase()]), out = [];
  for (const p of shuffle(pool.slice())) { if (out.length === 3) break; const k = p.toLowerCase(); if (p && !seen.has(k)) { seen.add(k); out.push(p); } }
  const all = shuffle([correct, ...out]);
  return {opts: all, ans: all.indexOf(correct)};
}
const chLessons = ch => L.filter(l => l.ch === ch && ok(l));
function qQuiz(l, i) {
  const q = l.q[i]; let pool = l.top.ls.filter(ok).flatMap(x => x.q.filter(y => y !== q).map(y => y[1]));
  if (pool.length < 3) pool = pool.concat(chLessons(l.ch).flatMap(x => x.q.map(y => y[1])));
  return Object.assign(opts(q[1], pool), {kind: 'Recall', ask: 'Pick the best answer.', stem: q[0], l, card: 'q:' + l.id + ':' + i, ex: q[1]});
}
function qScene(l) {
  if (!l.ex) return null;
  const pool = chLessons(l.ch).filter(x => x !== l).map(x => x.t);
  return Object.assign(opts(l.t, pool), {kind: 'Real life', ask: 'Which principle has the tools for this?', stem: l.ex, l, noSrc: 1, ex: 'It’s “' + l.t + '.” ' + l.big});
}
function qBig(l) {
  const pool = chLessons(l.ch).filter(x => x !== l).map(x => x.t);
  return Object.assign(opts(l.t, pool), {kind: 'Big idea', ask: 'Which principle is this?', stem: l.big, l, noSrc: 1, ex: 'It’s “' + l.t + '” in ' + l.top.t + '.'});
}
const boldOf = s => { const m = s.match(/\*\*(.+?)\*\*/); return m && m[1].split(' ').length <= 9 ? m[1].replace(/[.:]$/, '') : null; };
function qBlank(l) {
  const c = l.tk.filter(boldOf); if (!c.length) return null;
  const tk = rnd(c), b = boldOf(tk);
  const stem = tk.replace(/\*\*(.+?)\*\*/, '_____').replace(/\*\*/g, '');
  const pool = chLessons(l.ch).flatMap(x => x.tk.map(boldOf).filter(Boolean)).filter(x => x !== b);
  return Object.assign(opts(b, pool), {kind: 'Fill the gap', ask: 'Which phrase completes it?', stem, l, ex: tk.replace(/\*\*/g, '')});
}
function qTerm(g) {
  const pool = G.filter(x => x !== g && x.ch === g.ch && gOk(x)).map(x => x[0]);
  return Object.assign(opts(g[0], pool.length >= 3 ? pool : G.filter(gOk).map(x => x[0])), {kind: 'Define it', ask: 'Which term matches?', stem: g[1], l: LBY[g[2][0]] || null, card: 'g:' + g.i, ex: g[0] + ': ' + g[1]});
}
function qPic(l) {
  if (!l.dg || !l.dg.length) return null; const d = rnd(l.dg);
  const pool = chLessons(l.ch).filter(x => x !== l).map(x => x.t);
  return Object.assign(opts(l.t, pool), {kind: 'Read the picture', ask: 'Which principle is this picture from?', stem: '', img: d, l, noSrc: 1, ex: 'It’s from “' + l.t + '.” ' + l.big});
}
function qStep(l) {
  if (!l.st || l.st.length < 2) return null;
  const st = rnd(l.st), lab = y => { const w = ((y[0] ? y[0] + ' ' : '') + y[1]).split(' '); return w.length > 14 ? w.slice(0, 14).join(' ').replace(/[,;:]$/, '') + '…' : w.join(' '); };
  const pool = L.filter(x => x.ch !== l.ch && ok(x) && x.st && x.st.length).map(x => lab(rnd(x.st)));
  return Object.assign(opts(lab(st), pool), {kind: 'Playbook', ask: 'Which one is a step in this principle?', stem: l.t, l, ex: 'Step: ' + (st[0] ? st[0] + ' ' : '') + st[1]});
}
const qAny = l => rnd([() => qQuiz(l, Math.random() * l.q.length | 0), () => qScene(l), () => qBlank(l), () => qPic(l), () => qStep(l), () => qBig(l)])() || qQuiz(l, Math.random() * l.q.length | 0);
function roundRobin(queues, n) { const out = []; queues = shuffle(queues.filter(q => q.length)); while (out.length < n && queues.some(q => q.length)) for (const q of queues) { if (q.length && out.length < n) out.push(q.shift()); } return out; }
function questRun(t, teach) {
  const ls = t.ls.filter(ok), n = S.opt.len;
  const per = ls.map(l => shuffle([qStep(l), qBlank(l), qQuiz(l, Math.random() * l.q.length | 0), qPic(l), qScene(l), qBig(l), l.q.length > 1 ? qQuiz(l, (Math.random() * l.q.length | 0)) : null].filter(Boolean)));
  const ids = new Set(ls.map(l => l.id));

function seeCard(id, right) { if (!id) return; const c = S.cards[id] || (S.cards[id] = {b: 0, due: today()}); if (!right) { c.b = 0; c.due = today(); } else if (!c.seen) c.due = today(1); c.seen = 1; }

because their brains respond to urgency.", "key": "change-t05", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "From Wanting to Doing"}, "b": {"text": "Late bloomers: off the social clock"}, "title": "From Wanting to Doing", "sub": "Late bloomers: off the social clock", "fact": "Many people find success, love or stability later in life, and the hardest part is the long stretch of feeling behind.", "key": "change-t05", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "From Wanting to Doing"}, "b": {"text": "Order and the open loop"}, "title": "From Wanting to Doing", "sub": "Order and the open loop", "fact": "Some people can't rest until their space is reset, because their minds register disorder as unfinished business.", "key": "change-t05", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "Focus and Drive"}, "b": {"text": "Focus: feeling safe enough to settle"}, "title": "Focus and Drive", "sub": "Focus: feeling safe enough to settle", "fact": "When you can't focus, your brain may not be broken or lazy; it may be treating focus as unsafe.", "key": "change-t06", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "Focus and Drive"}, "b": {"text": "Framing the payoff"}, "title": "Focus and Drive", "sub": "Framing the payoff", "fact": "Your brain weighs every task like an investor, and distant goals look like bad investments next to instant rewards.", "key": "change-t06", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "Focus and Drive"}, "b": {"text": "Making hard work rewarding"}, "title": "Focus and Drive", "sub": "Making hard work rewarding", "fact": "People who seem naturally disciplined have found ways to make their brains want hard work, and those ways can be learned.", "key": "change-t06", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "Focus and Drive"}, "b": {"text": "The Batman effect: borrowing your future self"}, "title": "Focus and Drive", "sub": "The Batman effect: borrowing your future self", "fact": "Acting from the identity of the person you're becoming can help you persist at hard things, as long as you also do the work.", "key": "change-t06", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "Potential and Routines"}, "b": {"text": "Potential: from protecting it to testing it"}, "title": "Potential and Routines", "sub": "Potential: from protecting it to testing it", "fact": "Wasted potential is rarely about talent; it's often the brain protecting you from the risk of really trying.", "key": "change-t07", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "Potential and Routines"}, "b": {"text": "Staying up late: the reclaimed hour"}, "title": "Potential and Routines", "sub": "Staying up late: the reclaimed hour", "fact": "Many people stay up late not from carelessness but to reclaim time, quiet and a part of themselves the day didn't allow.", "key": "change-t07", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🔁", "text": "Potential and Routines"}, "b": {"text": "Clutter: a season, not a verdict"}, "title": "Potential and Routines", "sub": "Clutter: a season, not a verdict", "fact": "Clutter is common, it has understandable causes, and shame makes it worse.", "key": "change-t07", "set": "change", "tag": "Discipline and Change"}, {"a": {"pic": "🧠", "text": "Learning Faster"}, "b": {"text": "Learning that lasts: retrieval, spacing and mixing"}, "title": "Learning Faster", "sub": "Learning that lasts: retrieval, spacing and mixing", "fact": "Fast learners don't have more talent or hours; they use study methods that feel harder in the moment and work far better later.", "key": "mind-t01", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Learning Faster"}, "b": {"text": "Breadth: the case for many interests"}, "title": "Learning Faster", "sub": "Breadth: the case for many interests", "fact": "Having many interests can be a strength, if you finish things and connect them on purpose.", "key": "mind-t01", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Kinds of Smart"}, "b": {"text": "Saying what you mean: verbal clarity"}, "title": "Kinds of Smart", "sub": "Saying what you mean: verbal clarity", "fact": "People who speak clearly don't have bigger vocabularies; they organize their thoughts before speaking.", "key": "mind-t02", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Kinds of Smart"}, "b": {"text": "How fixers think: mental models and troubleshooting"}, "title": "Kinds of Smart", "sub": "How fixers think: mental models and troubleshooting", "fact": "People who can fix anything aren't just good with their hands; they build a working model of the machine in their minds and run it.", "key": "mind-t02", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Kinds of Smart"}, "b": {"text": "Survivor's intelligence: what hard childhoods can sharpen"}, "title": "Kinds of Smart", "sub": "Survivor's intelligence: what hard childhoods can sharpen", "fact": "People who grew up in harsh or unpredictable conditions often develop real abilities, like reading a room fast, switching tasks quickly and staying calm in a crisis.", "key": "mind-t02", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Thinking Better"}, "b": {"text": "Getting smarter after school"}, "title": "Thinking Better", "sub": "Getting smarter after school", "fact": "One kind of intelligence keeps growing for most of your life, and most people simply stop feeding it after school.", "key": "mind-t03", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Thinking Better"}, "b": {"text": "Problem solving: state the problem first"}, "title": "Thinking Better", "sub": "Problem solving: state the problem first", "fact": "A problem's difficulty depends heavily on how it was stated before any solving began.", "key": "mind-t03", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Thinking Better"}, "b": {"text": "The costs of a busy mind"}, "title": "Thinking Better", "sub": "The costs of a busy mind", "fact": "A mind that loves hard thinking brings real gifts, and a set of hidden costs.", "key": "mind-t03", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "A Mind That Won't Switch Off"}, "b": {"text": "Overthinking: solving versus circling"}, "title": "A Mind That Won't Switch Off", "sub": "Overthinking: solving versus circling", "fact": "People who think too much don't have a weak mind; they have a powerful engine with no guide.", "key": "mind-t04", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "A Mind That Won't Switch Off"}, "b": {"text": "Aversions as signals"}, "title": "A Mind That Won't Switch Off", "sub": "Aversions as signals", "fact": "Six common aversions aren't character flaws; they're signs of how a particular brain is tuned.", "key": "mind-t04", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "A Mind That Won't Switch Off"}, "b": {"text": "Isolation: refuge or fortress"}, "title": "A Mind That Won't Switch Off", "sub": "Isolation: refuge or fortress", "fact": "For many highly intelligent people, isolation didn't start as a preference; it started as a wound, and a flattering story grew on top of it.", "key": "mind-t04", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Luck, Judgment and Being Different"}, "b": {"text": "Luck: standing where it can find you"}, "title": "Luck, Judgment and Being Different", "sub": "Luck: standing where it can find you", "fact": "Luck is real and random, but randomness has a shape: it lands on certain behaviors far more often than others.", "key": "mind-t05", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Luck, Judgment and Being Different"}, "b": {"text": "Confidence versus calibration"}, "title": "Luck, Judgment and Being Different", "sub": "Confidence versus calibration", "fact": "People who think they're smart but aren't usually don't lack intelligence; their inner gauge of how much they know is stuck on full.", "key": "mind-t05", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Luck, Judgment and Being Different"}, "b": {"text": "A psychologically rich life"}, "title": "Luck, Judgment and Being Different", "sub": "A psychologically rich life", "fact": "People who seem restless or \"difficult\" are often chasing a third kind of good life, one built from varied, perspective-shifting experiences.", "key": "mind-t05", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Bright Minds, Odd Habits"}, "b": {"text": "Smart but \"lazy\": effort as a skill"}, "title": "Bright Minds, Odd Habits", "sub": "Smart but \"lazy\": effort as a skill", "fact": "Smart people who seem lazy usually aren't lacking ability; they're running a constant cost-benefit check, engaging only with what feels worth it, and often never learned to tolerate struggle.", "key": "mind-t06", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Bright Minds, Odd Habits"}, "b": {"text": "Ten quiet habits of a curious mind"}, "title": "Bright Minds, Odd Habits", "sub": "Ten quiet habits of a curious mind", "fact": "Many signs of high intelligence are quiet and internal, and easy to misread as quirks.", "key": "mind-t06", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Bright Minds, Odd Habits"}, "b": {"text": "The quiet, deep-processing mind"}, "title": "Bright Minds, Odd Habits", "sub": "The quiet, deep-processing mind", "fact": "Introverts with high intelligence tend to process deeply and stay quiet, which makes them easy to underestimate and easy to drain.", "key": "mind-t06", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "Bright Minds, Odd Habits"}, "b": {"text": "Faces, names and memory"}, "title": "Bright Minds, Odd Habits", "sub": "Faces, names and memory", "fact": "Many people never forget a face but always lose the name, and it isn't a sign they don't care.", "key": "mind-t06", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "The Weight of a Sharp Mind"}, "b": {"text": "Names: giving the label a hook"}, "title": "The Weight of a Sharp Mind", "sub": "Names: giving the label a hook", "fact": "Forgetting names is often a side effect of processing people deeply, not a bad memory.", "key": "mind-t07", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "The Weight of a Sharp Mind"}, "b": {"text": "Small talk: a handshake, not a test"}, "title": "The Weight of a Sharp Mind", "sub": "Small talk: a handshake, not a test", "fact": "Some people can't fake interest in sports or gossip, and it isn't arrogance; their minds go flat without depth, and faking costs them real energy.", "key": "mind-t07", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "The Weight of a Sharp Mind"}, "b": {"text": "Seeing too much: the cost of clarity"}, "title": "The Weight of a Sharp Mind", "sub": "Seeing too much: the cost of clarity", "fact": "A mind that sees patterns, problems and hidden rules pays a \"clarity tax\": it can feel lonely, frozen by consequences, or tired of meaning.", "key": "mind-t07", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "The Weight of a Sharp Mind"}, "b": {"text": "Love and a busy mind"}, "title": "The Weight of a Sharp Mind", "sub": "Love and a busy mind", "fact": "The same mind that excels at almost everything can work against it in love.", "key": "mind-t07", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🧠", "text": "The Weight of a Sharp Mind"}, "b": {"text": "Many interests: building bridges"}, "title": "The Weight of a Sharp Mind", "sub": "Many interests: building bridges", "fact": "Having many interests is an advantage when you connect them on purpose, especially in a world that keeps changing.", "key": "mind-t07", "set": "mind", "tag": "How You Learn and Think"}, {"a": {"pic": "🌊", "text": "Staying Steady Under Pressure"}, "b": {"text": "Resilience: finding the switch after a hit"}, "title": "Staying Steady Under Pressure", "sub": "Resilience: finding the switch after a hit", "fact": "Shutting down after a hard blow is automatic in everyone. What you can learn is the sense of control that switches the shutdown back off.", "key": "steady-t01", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Staying Steady Under Pressure"}, "b": {"text": "Composure: calm upstream, not held in"}, "title": "Staying Steady Under Pressure", "sub": "Composure: calm upstream, not held in", "fact": "Real composure is a trained skill of interpretation and breathing, not a poker face.", "key": "steady-t01", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Staying Steady Under Pressure"}, "b": {"text": "Anger: stop feeding the fire"}, "title": "Staying Steady Under Pressure", "sub": "Anger: stop feeding the fire", "fact": "Unbothered people feel the same flash of anger as everyone else; they just stop feeding it.", "key": "steady-t01", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Where Your Worth Lives"}, "b": {"text": "Self-worth: where you've staked it"}, "title": "Where Your Worth Lives", "sub": "Self-worth: where you've staked it", "fact": "\"Low self-worth\" is usually the wrong diagnosis; the real question is where you keep your worth.", "key": "steady-t02", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Where Your Worth Lives"}, "b": {"text": "Caring about fewer things, on purpose"}, "title": "Where Your Worth Lives", "sub": "Caring about fewer things, on purpose", "fact": "People who seem not to care usually care just as much; they've learned where to put it.", "key": "steady-t02", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Where Your Worth Lives"}, "b": {"text": "Confidence: lowering the entry fee"}, "title": "Where Your Worth Lives", "sub": "Confidence: lowering the entry fee", "fact": "Confident people don't believe in themselves more; they require less from the world before they act.", "key": "steady-t02", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Ego and the Inner Critic"}, "b": {"text": "Offense: the alarm on a narrow self"}, "title": "Ego and the Inner Critic", "sub": "Offense: the alarm on a narrow self", "fact": "Getting offended isn't oversensitivity; it's an alarm guarding whatever you've staked your identity on, and the smaller that territory, the louder the alarm.", "key": "steady-t03", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Ego and the Inner Critic"}, "b": {"text": "Kind to others, hard on yourself"}, "title": "Ego and the Inner Critic", "sub": "Kind to others, hard on yourself", "fact": "Many people comfort others easily but turn harsh on themselves, and the split often began as a strategy for staying safe.", "key": "steady-t03", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Toughness for Ordinary Days"}, "b": {"text": "A sturdy mind: evidence over belief"}, "title": "Toughness for Ordinary Days", "sub": "A sturdy mind: evidence over belief", "fact": "Confidence under pressure is a verdict built from evidence, not a belief you can install.", "key": "steady-t04", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Toughness for Ordinary Days"}, "b": {"text": "Small stressors: the preview, the spike and the echo"}, "title": "Toughness for Ordinary Days", "sub": "Small stressors: the preview, the spike and the echo", "fact": "Mental strength is mostly decided on ordinary days, by how much small hassles move your mood.", "key": "steady-t04", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Feeling Deeply"}, "b": {"text": "Feeling everything deeply"}, "title": "Feeling Deeply", "sub": "Feeling everything deeply", "fact": "Feeling everything deeply isn't a flaw in your character; it's how your nervous system is built.", "key": "steady-t05", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Feeling Deeply"}, "b": {"text": "Empath intelligence: feel for, not with"}, "title": "Feeling Deeply", "sub": "Empath intelligence: feel for, not with", "fact": "What people call being an \"empath\" is a real skill, reading what others feel, that charges every use to your own nervous system.", "key": "steady-t05", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Feeling Deeply"}, "b": {"text": "Going quiet when hurt: the full mind"}, "title": "Feeling Deeply", "sub": "Going quiet when hurt: the full mind", "fact": "Smart people often go quiet when hurt not because their minds are empty but because they're too full.", "key": "steady-t05", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Insecurity and Rejection"}, "b": {"text": "Insecurities: the cover-ups that keep them alive"}, "title": "Insecurity and Rejection", "sub": "Insecurities: the cover-ups that keep them alive", "fact": "An insecurity is kept alive less by the flaw itself than by the ways you cover it up.", "key": "steady-t06", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Insecurity and Rejection"}, "b": {"text": "Care-free: turning off the laugh track"}, "title": "Insecurity and Rejection", "sub": "Care-free: turning off the laugh track", "fact": "\"Stop caring what people think\" fails because the crowd you're worried about usually isn't in the room; it's assembled from your own judgments.", "key": "steady-t06", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Insecurity and Rejection"}, "b": {"text": "Never the first choice"}, "title": "Insecurity and Rejection", "sub": "Never the first choice", "fact": "Some people give steadily and are still nobody's first call, and it has nothing to do with their worth.", "key": "steady-t06", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Quiet Emotions"}, "b": {"text": "Silent instead of arguing"}, "title": "Quiet Emotions", "sub": "Silent instead of arguing", "fact": "People who go silent in conflict usually aren't punishing anyone; their nervous system learned early that silence was the safest response.", "key": "steady-t07", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Quiet Emotions"}, "b": {"text": "Quiet anger: the shutdown and the thaw"}, "title": "Quiet Emotions", "sub": "Quiet anger: the shutdown and the thaw", "fact": "Some people go quiet when angry not because they're calm, but because their brain has crashed under the load.", "key": "steady-t07", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Quiet Emotions"}, "b": {"text": "Crying easily: a sensitive alarm"}, "title": "Quiet Emotions", "sub": "Crying easily: a sensitive alarm", "fact": "Crying easily isn't weakness; it often reflects a more sensitive emotional system and a body that knows how to release stress.", "key": "steady-t07", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Quiet Emotions"}, "b": {"text": "Feeling it later: delayed emotions and numbness"}, "title": "Quiet Emotions", "sub": "Feeling it later: delayed emotions and numbness", "fact": "People who feel nothing in big moments aren't cold or broken; their brain puts survival first and feelings later.", "key": "steady-t07", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "The Inner Voice"}, "b": {"text": "Fake scenarios: the simulator that never switches off"}, "title": "The Inner Voice", "sub": "Fake scenarios: the simulator that never switches off", "fact": "Imagining scenes that never happen isn't a waste of time; it's your brain's simulator, and it runs about half your waking life.", "key": "steady-t08", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "The Inner Voice"}, "b": {"text": "Imagined arguments: closing open files"}, "title": "The Inner Voice", "sub": "Imagined arguments: closing open files", "fact": "The arguments you rehearse with people who aren't there are usually your mind trying to finish a conversation that never got resolved.", "key": "steady-t08", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "The Inner Voice"}, "b": {"text": "Talking to yourself: from heckler to coach"}, "title": "The Inner Voice", "sub": "Talking to yourself: from heckler to coach", "fact": "Talking to yourself isn't a sign of madness; it's one of your brain's most useful tools, and you can change what it says.", "key": "steady-t08", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Hurt, Tears and Numbness"}, "b": {"text": "Quiet when hurt: five strengths, used well"}, "title": "Hurt, Tears and Numbness", "sub": "Quiet when hurt: five strengths, used well", "fact": "Going quiet when hurt is often misread as coldness, but the habit can build real strengths: restraint, foresight, self-reliance, perception and boundaries.", "key": "steady-t09", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Hurt, Tears and Numbness"}, "b": {"text": "Pushing people away when hurt"}, "title": "Hurt, Tears and Numbness", "sub": "Pushing people away when hurt", "fact": "Pushing people away when you're hurt isn't a character flaw; it's a nervous system doing what it learned to do when reaching out didn't bring comfort.", "key": "steady-t09", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Hurt, Tears and Numbness"}, "b": {"text": "Crying easily: the deep well"}, "title": "Hurt, Tears and Numbness", "sub": "Crying easily: the deep well", "fact": "Crying easily isn't weakness; it's the visible surface of an emotional system that runs faster and deeper.", "key": "steady-t09", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Hurt, Tears and Numbness"}, "b": {"text": "Crying in private: stacked tears"}, "title": "Hurt, Tears and Numbness", "sub": "Crying in private: stacked tears", "fact": "People who only cry alone usually aren't afraid of the tears; they're afraid of what comes after them.", "key": "steady-t09", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🌊", "text": "Hurt, Tears and Numbness"}, "b": {"text": "Not reacting: the expression gap and emotional blunting"}, "title": "Hurt, Tears and Numbness", "sub": "Not reacting: the expression gap and emotional blunting", "fact": "Some people feel deeply but don't show it in the moment, and get called cold; others genuinely can't feel, which is a different thing that deserves attention.", "key": "steady-t09", "set": "steady", "tag": "Calm, Strength and Self-Worth"}, {"a": {"pic": "🤝", "text": "Being Liked and Reading People"}, "b": {"text": "Charisma: warmth, attention and showing up"}, "title": "Being Liked and Reading People", "sub": "Charisma: warmth, attention and showing up", "fact": "Charisma isn't a signal you transmit; it's what people feel about themselves when they're with you.", "key": "people-t01", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Being Liked and Reading People"}, "b": {"text": "Reading people: beyond the first glance"}, "title": "Being Liked and Reading People", "sub": "Reading people: beyond the first glance", "fact": "People who read others well don't decode faces faster; they treat the instant read as a guess and look for better evidence.", "key": "people-t01", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Being Liked and Reading People"}, "b": {"text": "Calibrating your reads"}, "title": "Being Liked and Reading People", "sub": "Calibrating your reads", "fact": "If you pick up on things other people miss, the real danger isn't that nobody believes you; it's that an accurate read and a confident mistake feel exactly the same, and life rarely tells you which one you had.", "key": "people-t01", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Trust, Hurt and Seeing People Clearly"}, "b": {"text": "Dark empaths: when understanding isn't kindness"}, "title": "Trust, Hurt and Seeing People Clearly", "sub": "Dark empaths: when understanding isn't kindness", "fact": "Some people read you very well and use that understanding against you.", "key": "people-t02", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Trust, Hurt and Seeing People Clearly"}, "b": {"text": "Romanticizing people: loving the draft"}, "title": "Trust, Hurt and Seeing People Clearly", "sub": "Romanticizing people: loving the draft", "fact": "When someone \"turns out\" to be different from who you thought, often nothing switched; what collapsed was your draft of them.", "key": "people-t02", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Trust, Hurt and Seeing People Clearly"}, "b": {"text": "Going quiet when hurt"}, "title": "Trust, Hurt and Seeing People Clearly", "sub": "Going quiet when hurt", "fact": "Many people go silent when hurt, not from coldness but because their nervous system is protecting them.", "key": "people-t02", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Trust, Hurt and Seeing People Clearly"}, "b": {"text": "Mixed people: warm and draining"}, "title": "Trust, Hurt and Seeing People Clearly", "sub": "Mixed people: warm and draining", "fact": "The people who cost you most are often not obviously toxic; they're warm and draining at the same time.", "key": "people-t02", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Power and Leadership"}, "b": {"text": "Power: who adjusts to whom"}, "title": "Power and Leadership", "sub": "Power: who adjusts to whom", "fact": "Power doesn't live in body language; it lives in dependence. Whoever needs the other less holds more of it, and it shows in who adjusts to whom.", "key": "people-t03", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Power and Leadership"}, "b": {"text": "Leadership: the emergence gap"}, "title": "Power and Leadership", "sub": "Leadership: the emergence gap", "fact": "The traits that get people chosen to lead barely predict whether they lead well.", "key": "people-t03", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Power and Leadership"}, "b": {"text": "Machiavellianism: the wisdom without the malice"}, "title": "Power and Leadership", "sub": "Machiavellianism: the wisdom without the malice", "fact": "The Machiavellian's real edge was never cruelty; it was not needing to be seen as good.", "key": "people-t03", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Conversation and Respect"}, "b": {"text": "Conversation: climbing the pyramid"}, "title": "Conversation and Respect", "sub": "Conversation: climbing the pyramid", "fact": "You never run out of things to say; you run out of small talk, the one layer of conversation with a fixed supply.", "key": "people-t04", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Conversation and Respect"}, "b": {"text": "Disrespect: the third reply"}, "title": "Conversation and Respect", "sub": "Disrespect: the third reply", "fact": "Everyday disrespect is built to pull one of two replies, fighting or folding. The skill is a calm third reply it didn't plan for.", "key": "people-t04", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Conversation and Respect"}, "b": {"text": "Speaking so people stay"}, "title": "Conversation and Respect", "sub": "Speaking so people stay", "fact": "Nobody has ever been hypnotized by a speaker; what holds a listener is their own attention, once you stop giving it reasons to leave.", "key": "people-t04", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Attraction and Letting Go"}, "b": {"text": "Attraction: wanting versus approving"}, "title": "Attraction and Letting Go", "sub": "Attraction: wanting versus approving", "fact": "Being approved of and being wanted are two separate systems, and most \"be more desirable\" advice trains the wrong one.", "key": "people-t05", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Attraction and Letting Go"}, "b": {"text": "When the reaching goes quiet"}, "title": "Attraction and Letting Go", "sub": "When the reaching goes quiet", "fact": "People who \"stopped chasing love\" usually didn't stop wanting it; the reaching went quiet while the wanting stayed intact.", "key": "people-t05", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Dark Traits and Deception"}, "b": {"text": "The dark triad: a system, not a wound"}, "title": "Dark Traits and Deception", "sub": "The dark triad: a system, not a wound", "fact": "The dark triad isn't a malfunction; it's a system working as designed.", "key": "people-t06", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Dark Traits and Deception"}, "b": {"text": "Liars: check the story, not the face"}, "title": "Dark Traits and Deception", "sub": "Liars: check the story, not the face", "fact": "Lies are rarely caught in the body; they're caught when the story runs into the world.", "key": "people-t06", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Pulling Away from People"}, "b": {"text": "Keeping your distance: five reasons"}, "title": "Pulling Away from People", "sub": "Keeping your distance: five reasons", "fact": "People who keep others at a distance usually aren't incapable of closeness; their nervous system learned that closeness had a cost.", "key": "people-t07", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Pulling Away from People"}, "b": {"text": "The quiet cutoff: filter, not wall"}, "title": "Pulling Away from People", "sub": "The quiet cutoff: filter, not wall", "fact": "When someone \"suddenly\" cuts people off, the cutoff usually isn't sudden at all; it's the end of a long, private process.", "key": "people-t07", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Pulling Away from People"}, "b": {"text": "After cutting everyone off: the way back"}, "title": "Pulling Away from People", "sub": "After cutting everyone off: the way back", "fact": "Cutting everyone off is usually the last move of someone who cared too long, not too little.", "key": "people-t07", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "How Situations Shape Us"}, "b": {"text": "The Lucifer effect: how situations change people"}, "title": "How Situations Shape Us", "sub": "The Lucifer effect: how situations change people", "fact": "What separates a good person from someone who does something terrible is usually the situation, not their character.", "key": "people-t08", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "How Situations Shape Us"}, "b": {"text": "Quiet online: the cost of being seen"}, "title": "How Situations Shape Us", "sub": "Quiet online: the cost of being seen", "fact": "A quiet social-media account often traces back to a childhood lesson that being seen costs something.", "key": "people-t08", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "How Situations Shape Us"}, "b": {"text": "After too much: resilience and its costs"}, "title": "How Situations Shape Us", "sub": "After too much: resilience and its costs", "fact": "People who have lived through a great deal often become the steadiest person in the room, and that steadiness was built, not given.", "key": "people-t08", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Family Roles"}, "b": {"text": "The disappointing child: living a life that's yours"}, "title": "Family Roles", "sub": "The disappointing child: living a life that's yours", "fact": "The child who couldn't get excited about the life planned for them often wasn't failing; they couldn't fake wanting something that wasn't theirs.", "key": "people-t09", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Family Roles"}, "b": {"text": "The only child: an inner world and a single spotlight"}, "title": "Family Roles", "sub": "The only child: an inner world and a single spotlight", "fact": "Only children aren't more selfish or spoiled; they often grow up with a rich inner world, strong self-sufficiency, and the whole family's hopes resting on them.", "key": "people-t09", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Family Roles"}, "b": {"text": "Cutting off family: the film nobody saw"}, "title": "Family Roles", "sub": "Cutting off family: the film nobody saw", "fact": "When someone cuts off their family, others usually see only the last frame of a story that ran for decades.", "key": "people-t09", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Family Roles"}, "b": {"text": "The smart kid: when the label becomes a cage"}, "title": "Family Roles", "sub": "The smart kid: when the label becomes a cage", "fact": "Being labeled \"the smart kid\" can quietly teach you that effort means you're not smart, and that belief can stall you as an adult.", "key": "people-t09", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Saying No, Saying Sorry"}, "b": {"text": "Saying no: the yes that isn't kindness"}, "title": "Saying No, Saying Sorry", "sub": "Saying no: the yes that isn't kindness", "fact": "Chronic yes-saying often isn't kindness; it's your nervous system treating a request like a social threat.", "key": "people-t10", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Saying No, Saying Sorry"}, "b": {"text": "Saying sorry: the apology audit"}, "title": "Saying No, Saying Sorry", "sub": "Saying sorry: the apology audit", "fact": "Constant apologizing is a \"sorry tax\": you pay it out of your credibility and self-respect and get nothing back.", "key": "people-t10", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Saying No, Saying Sorry"}, "b": {"text": "Feeling unwanted, or just unknown"}, "title": "Saying No, Saying Sorry", "sub": "Feeling unwanted, or just unknown", "fact": "Feeling unwanted isn't proof that you are, and being liked isn't the same as being known.", "key": "people-t10", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Difficult People"}, "b": {"text": "Jealousy up close: when your win shrinks"}, "title": "Difficult People", "sub": "Jealousy up close: when your win shrinks", "fact": "When someone close can't be happy for you, it's usually not cruelty; it's someone trying to feel okay next to you.", "key": "people-t11", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Difficult People"}, "b": {"text": "Seven moves for toxic people"}, "title": "Difficult People", "sub": "Seven moves for toxic people", "fact": "Toxic people win because your reaction is the prize; the skill is to stop handing it over without becoming cold.", "key": "people-t11", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Difficult People"}, "b": {"text": "Emotional immaturity: the empty driver's seat"}, "title": "Difficult People", "sub": "Emotional immaturity: the empty driver's seat", "fact": "Some adults look fully grown but are run by a much younger part of themselves whenever life asks for patience or a mistake to be owned.", "key": "people-t11", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🤝", "text": "Difficult People"}, "b": {"text": "The friend zone: warmth that feels like a choice"}, "title": "Difficult People", "sub": "The friend zone: warmth that feels like a choice", "fact": "People who keep ending up \"just a friend\" usually aren't too nice; many learned early that love has to be earned, so they make themselves essential.", "key": "people-t11", "set": "people", "tag": "Reading and Relating to People"}, {"a": {"pic": "🧭", "text": "Your Own Path"}, "b": {"text": "Solitude by choice"}, "title": "Your Own Path", "sub": "Solitude by choice", "fact": "For some people, time alone isn't a wound; it's how they're built.", "key": "life-t01", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Your Own Path"}, "b": {"text": "Complexity: why no label fits"}, "title": "Your Own Path", "sub": "Complexity: why no label fits", "fact": "A rare personality usually isn't one exotic trait but a rare combination of ordinary ones, especially opposites held at full strength.", "key": "life-t01", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Your Own Path"}, "b": {"text": "Time, memory and spending life wisely"}, "title": "Your Own Path", "sub": "Time, memory and spending life wisely", "fact": "Your life isn't speeding up; your memory is keeping less of it.", "key": "life-t01", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Who You Really Are"}, "b": {"text": "Identity: the self you stand on"}, "title": "Who You Really Are", "sub": "Identity: the self you stand on", "fact": "Your true self isn't hidden underneath everything; it shows in what you stand for and what you do when it costs you.", "key": "life-t02", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Who You Really Are"}, "b": {"text": "The shadow: what you buried"}, "title": "Who You Really Are", "sub": "The shadow: what you buried", "fact": "Your \"shadow\" isn't the evil part of you; it's everything that didn't fit the self-image you built.", "key": "life-t02", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Who You Really Are"}, "b": {"text": "The black sheep: the assigned problem"}, "title": "Who You Really Are", "sub": "The black sheep: the assigned problem", "fact": "The \"black sheep\" of a family is usually not the problem but the assigned problem: the person a strained family bends so everyone else can stay straight.", "key": "life-t02", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Meaning and Pleasure"}, "b": {"text": "Meaning: build it, don't hunt it"}, "title": "Meaning and Pleasure", "sub": "Meaning: build it, don't hunt it", "fact": "Meaning isn't a hidden object you find by searching harder; it's built, and it tends to arrive while you're absorbed in something beyond yourself.", "key": "life-t03", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Meaning and Pleasure"}, "b": {"text": "Pleasure: get the supervisor out of the room"}, "title": "Meaning and Pleasure", "sub": "Pleasure: get the supervisor out of the room", "fact": "Chasing pleasure often drains it, not because you have too much pleasure but because part of you keeps grading every good moment.", "key": "life-t03", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Comfort, Solitude and Repeats"}, "b": {"text": "JOMO: missing out on purpose"}, "title": "Comfort, Solitude and Repeats", "sub": "JOMO: missing out on purpose", "fact": "You will always miss out on almost everything; the only thing you can change is how it feels.", "key": "life-t04", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Comfort, Solitude and Repeats"}, "b": {"text": "Loving solitude: a skill and a choice"}, "title": "Comfort, Solitude and Repeats", "sub": "Loving solitude: a skill and a choice", "fact": "Loving time alone isn't a flaw; it's a real need and a skill that often goes with deeper relationships.", "key": "life-t04", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Comfort, Solitude and Repeats"}, "b": {"text": "Repeats: the comfort of the familiar"}, "title": "Comfort, Solitude and Repeats", "sub": "Repeats: the comfort of the familiar", "fact": "Replaying the same song or rewatching the same show isn't boring or lazy; it's often a way of regulating your emotions and knowing what you need.", "key": "life-t04", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Comfort, Solitude and Repeats"}, "b": {"text": "Ghost profiles: choosing your audience"}, "title": "Comfort, Solitude and Repeats", "sub": "Ghost profiles: choosing your audience", "fact": "People who keep their face off the internet usually aren't hiding; they're choosing who gets to look.", "key": "life-t04", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Growing Up and Carrying On"}, "b": {"text": "The man child: when love keeps someone frozen"}, "title": "Growing Up and Carrying On", "sub": "The man child: when love keeps someone frozen", "fact": "An adult who never launched usually isn't just lazy; he's caught in a system that runs on love.", "key": "life-t05", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Growing Up and Carrying On"}, "b": {"text": "Tired of existing: when the plug comes loose"}, "title": "Growing Up and Carrying On", "sub": "Tired of existing: when the plug comes loose", "fact": "Some tiredness isn't fixed by sleep: people can look completely fine while feeling disconnected from feeling alive.", "key": "life-t05", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "A Quieter Life"}, "b": {"text": "Home ground: the button, the home game and the crowd"}, "title": "A Quieter Life", "sub": "Home ground: the button, the home game and the crowd", "fact": "Homebodies aren't avoiding people; they've noticed how much a place decides who you get to be.", "key": "life-t06", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "A Quieter Life"}, "b": {"text": "The self-sufficient introvert: a foundation, not a wall"}, "title": "A Quieter Life", "sub": "The self-sufficient introvert: a foundation, not a wall", "fact": "Self-sufficient introverts aren't cold or emotionally unavailable; they run on an inner compass instead of outside approval.", "key": "life-t06", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "A Quieter Life"}, "b": {"text": "Birthdays without the spotlight"}, "title": "A Quieter Life", "sub": "Birthdays without the spotlight", "fact": "Some people treat their birthday like a normal day, not because they're ungrateful, but because of how the day is built.", "key": "life-t06", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "A Quieter Life"}, "b": {"text": "Your attention and the news"}, "title": "A Quieter Life", "sub": "Your attention and the news", "fact": "What you pay attention to shapes your mood, your decisions and your sense of control.", "key": "life-t06", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Looking Back and Choosing"}, "b": {"text": "Nostalgia: the warm ache"}, "title": "Looking Back and Choosing", "sub": "Nostalgia: the warm ache", "fact": "Nostalgia isn't a malfunction; it's one of the mind's emotional repair systems.", "key": "life-t07", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Looking Back and Choosing"}, "b": {"text": "Settling: marrying from fear"}, "title": "Looking Back and Choosing", "sub": "Settling: marrying from fear", "fact": "Marrying someone kind whom you don't love rarely starts as cold calculation; it usually starts as a reasonable decision made by a frightened person.", "key": "life-t07", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Growing Up Too Fast"}, "b": {"text": "Growing up too fast: the strengths and the bill"}, "title": "Growing Up Too Fast", "sub": "Growing up too fast: the strengths and the bill", "fact": "Children who carried adult weight early often grow into unusually capable adults: perceptive, calm in a crisis, self-reliant. Those strengths are real, and so is their cost.", "key": "life-t08", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Growing Up Too Fast"}, "b": {"text": "Quiet habits from a childhood that went unnoticed"}, "title": "Growing Up Too Fast", "sub": "Quiet habits from a childhood that went unnoticed", "fact": "Adults who grew up with their feelings and needs going unnoticed rarely look wounded; they look polite, independent and low-maintenance.", "key": "life-t08", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Alone by Choice"}, "b": {"text": "The garden behind the wall"}, "title": "Alone by Choice", "sub": "The garden behind the wall", "fact": "For people who love being alone, solitude isn't empty; it's a place they tend.", "key": "life-t09", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Alone by Choice"}, "b": {"text": "Choosing home: a social life on a budget"}, "title": "Alone by Choice", "sub": "Choosing home: a social life on a budget", "fact": "Some people who love staying home aren't shy or broken; they can socialize well and have decided where their energy goes.", "key": "life-t09", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Alone by Choice"}, "b": {"text": "Walking alone"}, "title": "Alone by Choice", "sub": "Walking alone", "fact": "Slipping out for a walk alone when life gets heavy is one of the simplest ways to regulate yourself.", "key": "life-t09", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Opting Out"}, "b": {"text": "Not on the app: push versus pull"}, "title": "Opting Out", "sub": "Not on the app: push versus pull", "fact": "Skipping TikTok is usually neither superiority nor fear of missing out; it reflects how you build identity and who you want choosing your inputs.", "key": "life-t10", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Opting Out"}, "b": {"text": "Watching versus doing: celebrities and big games"}, "title": "Opting Out", "sub": "Watching versus doing: celebrities and big games", "fact": "Caring intensely about celebrities or big games draws on real, deep human instincts; some people simply spend that energy elsewhere.", "key": "life-t10", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Opting Out"}, "b": {"text": "Fear of heights: an alarm you can retrain"}, "title": "Opting Out", "sub": "Fear of heights: an alarm you can retrain", "fact": "Fear of heights is your brain taking safety seriously, and if it limits your life, it can be retrained.", "key": "life-t10", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Generations and Circumstances"}, "b": {"text": "How circumstances shape a generation"}, "title": "Generations and Circumstances", "sub": "How circumstances shape a generation", "fact": "Each generation adapts to the crises of its formative years, then passes those adaptations down without meaning to.", "key": "life-t11", "set": "life", "tag": "Your Own Path"}, {"a": {"pic": "🧭", "text": "Generations and Circumstances"}, "b": {"text": "In-between gen
