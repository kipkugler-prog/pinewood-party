<style>
/* VOICE: warm, playful, calm: a coach, never a test you can fail
   IDEA: a doodled sticker journal you fill one short round at a time
   PICTURE: Brezel the pretzel mascot, big picture cards, the game card itself
   COLOUR and TYPE: tinted paper, ink outlines, pretzel brown + sunny yellow; der blue, die red, das green; Lexend, OpenDyslexic or Atkinson
   LAYOUT: one centred column up to 780px; top bar, game card, feedback strip; same order on phone */
@font-face{font-family:"OpenDyslexic";src:url(opendyslexic-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url(opendyslexic-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{color-scheme:light;--bg:#fbf5e8;--card:#fffdf8;--ink:#1d2331;--soft:#566074;--line:#1d2331;--edge:#e6dcc6;--gold:#ffcd38;--gold2:#ffeaa6;--s1:#7a3fc0;
 --der:#2462d6;--die:#cf2d47;--das:#14804a;--good:#14804a;--bad:#c2410c;--rightbg:#d9f3e3;--wrongbg:#fde3d7;--shadow:#1d2331;
 --font:"Lexend",system-ui,sans-serif;--ls:.035em;--ws:.12em}
:root[data-tint=cream]{--bg:#fbf5e8}:root[data-tint=blue]{--bg:#e4eefb}:root[data-tint=green]{--bg:#e6f3e1}:root[data-tint=peach]{--bg:#fde6d9}:root[data-tint=grey]{--bg:#ececea}
:root[data-tint=night],:root[data-tint=auto][data-theme=dark]{color-scheme:dark;--bg:#151a26;--card:#20263a;--ink:#eef1f8;--soft:#aab3c7;--line:#0a0d15;--edge:#323a55;--gold2:#3f3518;--s1:#c7a0ff;--der:#7aa6ff;--die:#ff7d92;--das:#52d08c;--good:#52d08c;--bad:#ff9b6b;--rightbg:#173a28;--wrongbg:#46261a;--shadow:#05070c}
@media(prefers-color-scheme:dark){:root[data-tint=auto]:not([data-theme=light]){color-scheme:dark;--bg:#151a26;--card:#20263a;--ink:#eef1f8;--soft:#aab3c7;--line:#0a0d15;--edge:#323a55;--gold2:#3f3518;--s1:#c7a0ff;--der:#7aa6ff;--die:#ff7d92;--das:#52d08c;--good:#52d08c;--bad:#ff9b6b;--rightbg:#173a28;--wrongbg:#46261a;--shadow:#05070c}}
:root[data-font=dys]{--font:"OpenDyslexic",system-ui,sans-serif}:root[data-font=atk]{--font:"Atkinson Hyperlegible",system-ui,sans-serif}
:root[data-space=wide]{--ls:.11em;--ws:.28em}
html{font-size:18px}:root[data-size=l]{font-size:20.5px}:root[data-size=xl]{font-size:23px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.6;letter-spacing:var(--ls);word-spacing:var(--ws);overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{line-height:1.1;text-wrap:balance}
button{font:inherit;letter-spacing:inherit;word-spacing:inherit;color:var(--ink);background:var(--card);border:2.5px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow);padding:.55rem 1rem;min-height:48px;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--der);outline-offset:3px}
.primary{background:var(--gold);color:#1d2331;font-weight:700}
.wrap{max-width:780px;margin:0 auto;padding:16px max(4vw,14px) 48px}
.soft{color:var(--soft);font-weight:400}
.small{font-size:.85rem;color:var(--soft)}
.pic{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;letter-spacing:0;font-style:normal}
.num{font-family:var(--font);font-weight:700;color:var(--ink)}
.sw{display:inline-block;width:1em;height:1em;border-radius:50%;border:2.5px solid var(--line)}
.art{font-weight:700}.art.der{color:var(--der)}.art.die{color:var(--die)}.art.das{color:var(--das)}
.cs .s1{color:var(--s1)}:root[data-syl=off] .cs .s1{color:inherit}
/* home */
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.title{font-size:clamp(1.7rem,5vw,2.3rem);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);border-radius:999px;padding:.15rem .75rem;font-size:.85rem;background:var(--card);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.bar{display:inline-block;width:54px;height:9px;border-radius:9px;background:var(--edge);overflow:hidden}.bar b{display:block;height:100%;background:var(--gold)}
.hero{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:center;background:var(--gold2);border:2.5px solid var(--line);border-radius:28px;padding:clamp(16px,3vw,28px);box-shadow:0 5px 0 var(--shadow)}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:.7rem 1rem;margin:0 0 1rem;font-size:1.05rem}
.bubble:before{content:"";position:absolute;left:-12px;top:22px;width:18px;height:18px;background:var(--card);border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
.huge{font-size:1.35rem;padding:.8rem 1.4rem;width:100%;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.huge small{font-size:.8rem;font-weight:400;text-wrap:balance}
.h2{font-size:1.35rem;margin:28px 0 12px}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,9.2em),1fr));gap:14px}
.deck{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:.85rem .95rem;border-radius:22px;gap:1px}
.deck .pic{font-size:2.3rem;margin-bottom:.3rem}.deck b{font-size:1.15rem}.deck .en{color:var(--soft);font-size:.9rem}
.deck,.opt,.m,.wchip,.stat,.slot,.tile,.prompt,.word,.reveal{overflow-wrap:anywhere}
.meter{width:100%;height:10px;border-radius:9px;background:var(--edge);overflow:hidden;margin-top:.55rem}.meter b{display:block;height:100%;background:var(--good)}
.mtext{font-size:.8rem;color:var(--soft)}
.footrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.footrow button{flex:1 1 180px;font-weight:600}
.note{background:var(--wrongbg);border:2px solid var(--bad);border-radius:16px;padding:.6rem .9rem;font-size:.9rem;margin-top:18px}
/* mascot */
.brezel{display:block;width:100%;height:auto;overflow:visible}
.hero .brezel{max-width:200px;margin:auto}
.brezel.happy{animation:hop .5s ease-out}
@keyframes hop{40%{transform:translateY(-10px) rotate(-4deg)}}
/* game */
.gbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.menu{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;flex:none;padding:.35rem .9rem;min-height:48px;white-space:nowrap}.menu svg{width:1.25em;height:1.25em;flex:none}
.segs{flex:1;display:flex;gap:4px}.seg{flex:1;height:13px;border-radius:7px;background:var(--edge);border:2px solid transparent}.seg.done{background:var(--gold);border-color:var(--line)}.seg.cur{border-color:var(--line)}
.combo{white-space:nowrap;font-size:.85rem;min-width:5.6em;text-align:right;line-height:1.25;color:var(--soft)}.combo b{color:var(--ink)}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:28px;box-shadow:0 5px 0 var(--shadow);padding:clamp(16px,3.5vw,30px);text-align:center;position:relative}
.prompt{display:inline-flex;align-items:center;gap:.5rem;font-size:1.15rem;font-weight:600;margin:0 0 .8rem;background:none;border:0;box-shadow:none;padding:.2rem .5rem;min-height:44px;text-align:left;border-radius:12px}
.prompt svg{width:1.15em;height:1.15em;flex:none;color:var(--soft)}.prompt:active:not(:disabled){transform:none;box-shadow:none}
.soundtip{background:transparent;border:2px dashed var(--s1)}
.goal{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:.8rem;font-size:.92rem}
.goal button{min-height:40px;min-width:44px;padding:.1rem .6rem;box-shadow:0 3px 0 var(--shadow)}.goal button[aria-pressed=true]{background:var(--gold);color:#1d2331;font-weight:700}
.goaldone{font-weight:700;color:var(--good)}
.st.gold{border-color:#c99400;background:var(--gold2);box-shadow:0 3px 0 #c99400}
.heropic{width:clamp(130px,30vw,168px);aspect-ratio:1;border-radius:50%;background:var(--gold2);border:2.5px solid var(--line);display:grid;place-items:center;margin:0 auto .6rem}
.heropic .pic{font-size:clamp(4rem,12vw,5.3rem)}.heropic .sw{width:68%;height:68%}
.heropic.sm{width:clamp(104px,24vw,128px)}.heropic.sm .pic{font-size:clamp(3.2rem,9vw,4rem)}
.word{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;line-height:1.25;margin:.15rem 0 .1rem}
.blank{display:inline-block;width:2.4em;border-bottom:4px dashed var(--soft);height:.9em;vertical-align:-.05em}
.en{color:var(--soft);margin:0 0 .5rem}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:.5rem 0 .9rem}
.hear{display:inline-flex;align-items:center;gap:.45rem;font-weight:600}.hear svg{width:1.3em;height:1.3em;flex:none}
.bigplay{width:100px;height:100px;border-radius:50%;background:var(--gold);padding:0;display:grid;place-items:center}.bigplay svg{width:52px;height:52px;color:#1d2331}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px;margin:.4rem auto 0}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:.8rem .4rem;border-radius:22px;min-height:118px}
.opt .pic{font-size:3.1rem}.opt .lab{font-size:.9rem;color:var(--soft)}
.opt.right{background:var(--rightbg);border-color:var(--good)}.opt.wrong{background:var(--wrongbg);border-color:var(--bad)}.opt.dim{opacity:.4}
.k{position:absolute;top:6px;left:10px;font-size:.75rem;color:var(--soft);font-weight:600}
.pickrows{display:grid;gap:12px;max-width:540px;margin:.6rem auto 0}.pickrow{display:flex;gap:10px}
.pickrow .opt{flex:1;min-height:70px;flex-direction:row;font-size:1.5rem;font-weight:700}
.hear.mini{width:62px;padding:0;justify-content:center;flex:none}
.ddd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:540px;margin:1rem auto 0}
.artbtn{font-size:min(1.7rem,8.4vw);font-weight:700;color:#fff;min-height:84px;border-radius:22px;padding:.3rem .2rem;letter-spacing:.03em}
.artbtn.der{background:#2462d6}.artbtn.die{background:#cf2d47}.artbtn.das{background:#14804a}
.artbtn.dim{opacity:.3}.artbtn.right{outline:5px solid var(--gold);outline-offset:3px}.artbtn.wrong{opacity:.6;text-decoration:line-through}
.slots{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:.6rem 0 1rem}
.slotart{font-size:1.6rem;margin-right:4px}
.slot{min-width:88px;min-height:66px;border-style:dashed;box-shadow:none;font-size:1.55rem;font-weight:700;background:transparent;padding:.3rem .6rem}
.slot.full{border-style:solid;background:var(--card);box-shadow:0 4px 0 var(--shadow)}.slot.lock{background:var(--rightbg);border-color:var(--good)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{min-width:88px;min-height:66px;font-size:1.55rem;font-weight:700;background:var(--gold2);padding:.3rem .7rem}.tile.used{visibility:hidden}.tile:disabled{opacity:.3;box-shadow:none}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;max-width:580px;margin:auto}
.mcol{display:grid;gap:10px;align-content:start}
.m{min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:1.3rem;font-weight:700;padding:.4rem}
.m .pic{font-size:2.5rem}.m .lab{font-size:.8rem;font-weight:400;color:var(--soft)}
.m.sel{background:var(--gold2);outline:3px solid var(--der);outline-offset:2px}.m.bad{background:var(--wrongbg);border-color:var(--bad)}
.m.ok{background:var(--rightbg);border-color:var(--good);box-shadow:none;opacity:.55}
.reveal{margin-top:1rem;font-size:clamp(1.6rem,5vw,2.1rem);font-weight:700}
.tipbox{background:var(--gold2);border-radius:16px;padding:.55rem .9rem;margin:.9rem auto 0;max-width:520px;font-size:.95rem}
.go{margin-top:.6rem;font-size:1.2rem;min-width:220px}
.fb{min-height:92px;margin-top:16px;display:flex;align-items:center;gap:12px;border-radius:24px;padding:10px 14px;border:2.5px solid transparent}
.fb:empty{visibility:hidden}
.fb.ok{background:var(--rightbg);border-color:var(--good)}.fb.no{background:var(--wrongbg);border-color:var(--bad)}
.fb .brezel{width:72px;flex:none}.fb .msg{flex:1;text-align:left;line-height:1.35}.fb .primary{flex:none}
.gain{font-weight:700;color:var(--good);font-size:.9rem}
.keys{text-align:center;font-size:.8rem;color:var(--soft);margin-top:14px}
@media(hover:none){.keys,.k{display:none}}
.float{position:absolute;right:20px;top:14px;font-weight:700;color:var(--good);font-size:1.2rem;animation:up 1.1s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
.bit{position:absolute;left:50%;top:38%;width:10px;height:15px;border-radius:3px;pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.shake{animation:shake .3s 2}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* end, stickers, break */
.end .brezel{width:150px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,6.4em),1fr));gap:10px;margin:16px auto;max-width:520px}
.endtitle{font-size:min(2rem,9vw);margin:.4rem 0 0;overflow-wrap:anywhere}
.stat{border:2px solid var(--line);border-radius:18px;padding:.5rem;font-size:.85rem;color:var(--soft)}.stat b{display:block;font-size:1.6rem;color:var(--ink)}
.newst{margin:10px 0 6px}.newst .pic{font-size:5rem;display:inline-block;animation:spin .8s ease-out}
@keyframes spin{from{transform:scale(.2) rotate(-200deg)}}
.wchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 18px}
.wchip{display:inline-flex;gap:8px;align-items:center;font-weight:700;padding:.35rem .8rem;box-shadow:0 3px 0 var(--shadow)}.wchip .pic{font-size:1.4rem}.wchip .sw{width:1.2em;height:1.2em}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px}
.st{aspect-ratio:1;border:2.5px dashed var(--edge);border-radius:20px;display:grid;place-items:center;font-size:1.3rem;color:var(--soft)}
.st.have{border:2.5px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--shadow)}.st .pic{font-size:2.3rem}
.count{font-size:clamp(5rem,22vw,9rem);font-weight:700;line-height:1;color:var(--s1)}
.countword{font-size:2rem;font-weight:700;margin:.2rem 0}
#bbox .brezel{width:160px;margin:0 auto 12px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,10,18,.5);border:0;border-radius:0;box-shadow:none;padding:0;z-index:5}
.scrim:active{transform:none!important}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--card);border:2.5px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 18px 30px;z-index:6}
.sheet h2{margin:0 0 .3rem;font-size:1.5rem}
.modes{display:grid;gap:10px;margin-top:14px}
.mode{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px;padding:.65rem 1rem}
.mode b{display:block}.mode .d{color:var(--soft);font-size:.88rem}.mode.star{background:var(--gold)}.mode.star,.mode.star .d{color:#1d2331}
.set{margin:16px 0}.set h3{font-size:1rem;margin:0 0 8px}
.segg{display:flex;flex-wrap:wrap;gap:8px}.segg button{min-height:44px;padding:.3rem .85rem;box-shadow:0 3px 0 var(--shadow)}
.segg button[aria-pressed=true]{background:var(--gold);color:#1d2331;font-weight:700}
.segg .tint[aria-pressed=true]{outline:4px solid var(--gold);outline-offset:2px}
.wide{width:100%;margin-top:8px}
.danger{color:var(--bad);border-color:var(--bad)}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero .brezel{max-width:150px}.bubble:before{display:none}
 .fb{flex-wrap:wrap}.fb .brezel{width:58px}.fb .primary{width:100%}.opt{min-height:104px}.opt .pic{font-size:2.7rem}.artbtn{min-height:74px;font-size:1.45rem}
 .slot,.tile{min-width:72px;font-size:1.35rem}.stats b{font-size:1.3rem}}
:root[data-calm=on] *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function tip(w){if(!w.art)return'';const d=w.de;
 if(d==='Kuchen')return`Sneaky! Only <i>little</i> things ending in <b>-chen</b> are ${A('das')}. Kuchen isn’t little, so it’s ${A('der')}.`;
 if(VERBNOUN.includes(d))return`A verb used as a noun is always ${A('das')}: das ${d} means “${w.en}”.`;
 if(COMPOUND[d]){const [a,n]=COMPOUND[d].split(' ');return`In a long word, the <b>last part</b> decides: ${d} gets ${A(a)} from <b>${n}</b>.`}
 if(MALE.includes(d))return`Male people are usually ${A('der')}.`;
 if(FEMALE.includes(d))return`Female people are usually ${A('die')}.`;
 if(d==='Baby'||d==='Kind')return`Sneaky! Babies and kids are ${A('das')}: das Baby, das Kind.`;
 if(/(chen|lein)$/.test(d))return`Little things ending in <b>-chen</b> are always ${A('das')}.`;
 if(/ling$/.test(d))return`Words ending in <b>-ling</b> are always ${A('der')}.`;
 if(/ung$/.test(d))return`Words ending in <b>-ung</b> are always ${A('die')}.`;
 if(/ik$/.test(d))return`Words ending in <b>-ik</b> are ${A('die')}.`;
 if(/e$/.test(d))return w.art==='die'?`Most words ending in <b>-e</b> are ${A('die')}.`:`Sneaky! Most <b>-e</b> words are ${A('die')}, but this one is ${A(w.art)}.`;
 return''}

/* ---------- choosing words (simple spaced repetition) ---------- */
function pickTargets(pool,n,newMax,strict){const now=Date.now(),out=[];const add=list=>list.forEach(w=>{if(out.length<n&&!out.includes(w))out.push(w)});
 const seen=pool.filter(w=>!isNew(w)),fresh=pool.filter(isNew);
 const due=shuffle(seen.filter(w=>W(w.id).due<=now)).sort((a,b)=>W(a.id).b-W(b.id).b);
 const later=seen.filter(w=>W(w.id).due>now).sort((a,b)=>W(a.id).due-W(b.id).due);
 add(due);add(fresh.slice(0,newMax||4));add(later);if(!strict)add(fresh);return out}
function distractors(w,n){return shuffle(DECK[w.deck].words.filter(x=>x.id!==w.id&&x.pic!==w.pic&&x.en!==w.en)).slice(0,n)}
const uniqPics=l=>l.filter((w,i)=>l.findIndex(x=>x.pic===w.pic)===i);
const usable=(m,pool)=>m==='ddd'?pool.filter(w=>w.art).length>=3:m==='build'?pool.filter(canBuild).length>=3:m==='match'?uniqPics(pool).length>=4:true;
function buildRound(pool,mode){
 if(mode==='mix'){const targets=shuffle(pickTargets(pool,5,3,true)),steps=[],pending=[],used={};
  const test=w=>{const c=['listen','pick'];if(w.art)c.push('ddd');if(canBuild(w))c.push('build');c.sort((a,b)=>(used[a]||0)-(used[b]||0)||Math.random()-.5);used[c[0]]=(used[c[0]]||0)+1;return{t:c[0],w}};
  targets.forEach(w=>{if(isNew(w))steps.push({t:'meet',w});if(pending.length)steps.push(pending.shift());pending.push(test(w))});
  steps.push(...pending);
  targets.filter(isNew).forEach(w=>steps.push(test(w)));
  while(steps.length<6&&targets.length)steps.push(test(rand(targets)));
  let mp=uniqPics(targets);if(mp.length<4)mp=uniqPics([...mp,...shuffle(pool.filter(w=>!isNew(w)))]);
  if(mp.length>=4){mp=mp.slice(0,4);steps.push({t:'match',w:mp[0],pairs:mp})}
  return steps}
 if(mode==='meet')return[...pool.filter(isNew),...shuffle(pool.filter(w=>!isNew(w)))].slice(0,6).map(w=>({t:'meet',w}));
 if(mode==='match'){const t=uniqPics(pickTargets(pool,pool.length,6)),steps=[];for(let i=0;i+4<=t.length&&steps.length<3;i+=4)steps.push({t:'match',w:t[i],pairs:t.slice(i,i+4)});return steps}
 const ok=pool.filter(w=>mode==='ddd'?w.art:mode==='build'?canBuild(w):true);
 return pickTargets(ok,8,6).map(w=>({t:mode,w}))}

 return `<div class="goal"><span>Daily goal:</span>${[1,2,3].map(x=>`<button data-act="goal" data-v="${x}" aria-pressed="${g===x}" aria-label="${x} round${x>1?'s':''} a day">${x}</button>`).join('')}<span>${n>=g?'<span class="goaldone">Done for today!</span>':`${n} of ${g} rounds done`}</span></div>`}
function voiceInfo(){if(!synth)return'This browser can’t speak words out loud. Safari or Chrome will work.';if(deVoice)return`Using the voice “${esc(deVoice.name)}”. No sound? Check the volume and that the iPad isn’t on silent.`;return'No German voice found on this device yet. On an iPad: Settings → Accessibility → Spoken Content → Voices → German, then download a voice.'}
const gameShell=()=>`<div class="gbar">${MENU}<div class="segs" id="segs"></div><span class="combo" id="combo"></span></div><div class="card" id="step"></div><div class="fb" id="fb" aria-live="polite"></div><p class="keys">Keyboard: 1–4 to answer · Space to hear again · Enter for next</p>`;
const cur=()=>R&&R.steps[R.i];
function updateBar(){const s=$('#segs');if(!s)return;s.innerHTML=R.steps.map((x,i)=>`<i class="seg ${i<R.i||x.advanced?'done':''} ${i===R.i?'cur':''}"></i>`).join('');const n=R.steps.length-R.i;$('#combo').innerHTML=(R.combo>=2?`<b>Combo ×${R.combo}</b><br>`:'')+`${n} left`}
function paint(){const st=cur(),box=$('#step');if(st&&box)box.innerHTML=stepHTML(st)}
function renderStep(){const st=cur();paint();updateBar();const fb=$('#fb');fb.className='fb';fb.innerHTML='';
 if(!st.spoken){st.spoken=true;const t=st.t==='ddd'?st.w.de:(st.t==='pick'||st.t==='match')?'':sayText(st.w);if(t)setTimeout(()=>{if(cur()===st)say(t)},350)}}
function optCls(st,o){return !st.done?'':o.id===st.w.id?'right':o.id===st.picked?'wrong':'dim'}
function stepHTML(st){const w=st.w,enLine=hintOn(w)?`<p class="en">${esc(w.en)}</p>`:'';
 switch(st.t){
 case'meet':return `${P('New word! Listen, then say it out loud.')}${heroPic(w)}<div class="word cs">${wordHTML(w)}</div><p class="en">${esc(w.en)}</p><div class="row">${hearBtn(sayText(w))}${slowBtn(sayText(w))}</div>${soundTip(w)||tipBox(w)}<button class="primary go" data-act="said">I said it!</button>`;
 case'listen':if(!st.opts)st.opts=shuffle([w,...distractors(w,3)]);
  return `${P('Listen. Which one is it?')}<div class="row"><button class="bigplay" data-act="hear" data-say="${esc(sayText(w))}" aria-label="Play the word again">${SPK}</button>${slowBtn(sayText(w))}</div><div class="opts">${st.opts.map((o,i)=>`<button class="opt ${optCls(st,o)}" data-act="ans" data-id="${esc(o.id)}" ${st.done?'disabled':''}><span class="k">${i+1}</span>${picHTML(o)}${hintOn(o)&&!isNum(o)?`<span class="lab">${esc(o.en)}</span>`:''}</button>`).join('')}</div>${st.done?`<div class="reveal">${wordHTML(w)}</div>`:''}`;
 case'ddd':return `${P('der, die or das?','der, die oder das?')}${heroPic(w)}<div class="word">${st.done?artHTML(w):'<span class="blank"></span> '}${sylHTML(w)}</div>${enLine}<div class="row">${hearBtn(w.de)}</div><div class="ddd">${['der','die','das'].map(a=>`<button class="artbtn ${a} ${st.done?(a===w.art?'right':a===st.picked?'wrong':'dim'):''}" data-act="art" data-a="${a}" ${st.done?'disabled':''} lang="de">${a}</button>`).join('')}</div>${st.done?tipBox(w):''}`;

/* ---------- playing ---------- */
function startRound(pool,mode){const steps=buildRound(pool,mode);if(!steps.length)return;R={pool,mode,steps,i:0,xp:0,first:0,total:0,combo:0,best:0,requeues:0,practiced:new Set(),timer:null,sticker:null};view='game';render()}
function answer(id){const st=cur();if(!st||st.done)return;st.done=true;st.picked=id;paint();finish(id===st.w.id,id===st.w.id)}
function pickArt(a){const st=cur();if(!st||st.done)return;st.done=true;st.picked=a;paint();finish(a===st.w.art,a===st.w.art)}
function said(){const st=cur();if(!st||st.done)return;st.done=true;const x=W(st.w.id);x.met=1;R.practiced.add(st.w.id);addXP(5);sfx.pop();next()}
function tapTile(j){const st=cur();if(!st||st.done)return;const t=st.tiles[j];if(t.used)return;const i=st.filled.findIndex((f,k)=>f===null&&!st.locked[k]);if(i<0)return;st.filled[i]=j;t.used=true;sfx.pop();paint();if(st.filled.every(f=>f!==null))setTimeout(checkBuild,280)}
function unslot(i){const st=cur();if(!st||st.done||st.locked[i])return;const j=st.filled[i];if(j==null)return;st.tiles[j].used=false;st.filled[i]=null;paint()}
function checkBuild(){const st=cur();if(!st||st.done||st.t!=='build')return;const good=st.filled.map((j,i)=>j!=null&&st.tiles[j].s===st.w.syl[i]);
 if(good.every(Boolean)){st.done=true;st.locked=st.locked.map(()=>true);paint();finish(true,!st.missed);return}
 st.missed=true;sfx.bad();R.combo=0;good.forEach((g,i)=>{if(g)st.locked[i]=true;else{st.tiles[st.filled[i]].used=false;st.filled[i]=null}});st.shake=true;paint();st.shake=false;updateBar()}
function tapMatch(side,id){const st=cur();if(!st||st.done||st.matched.includes(id))return;st.sel[side]=id;st.bad=null;
 if(side==='r')say(sayText(BYID[id]));else sfx.pop();
 const{l,r}=st.sel;if(l&&r){if(l===r){st.matched.push(l);sfx.good();if(side==='l')say(sayText(BYID[l]))}else{st.miss.add(l);st.miss.add(r);st.bad={l,r};sfx.bad()}st.sel={l:null,r:null}}
 paint();if(st.matched.length===st.pairs.length){st.done=true;st.pairs.forEach(p=>grade(p.id,!st.miss.has(p.id)));finish(true,st.miss.size===0,true)}}
function finish(ok,first,isMatch){const st=cur();
 if(isMatch)st.pairs.forEach(p=>R.practiced.add(p.id));else{R.practiced.add(st.w.id);grade(st.w.id,ok&&first)}
 if(!st.retry){R.total++;if(ok&&first)R.first++}
 let gain=0;
 if(ok){R.combo=first?R.combo+1:0;R.best=Math.max(R.best,R.combo);gain=(first&&!st.retry?10:5)+(R.combo>=3?5:0);addXP(gain);sfx.good();burst();const go=()=>{if(cur()===st&&!st.advanced)next()};
  const auto=S.settings.autonext&&!(st.t==='ddd'&&tip(st.w));
  if(isMatch){if(auto)R.timer=setTimeout(go,1800)}
  else setTimeout(()=>{if(cur()!==st)return;say(sayText(st.w),false,auto?()=>{if(cur()===st&&!st.advanced){clearTimeout(R.timer);R.timer=setTimeout(go,900)}}:null)},150);
  if(auto&&!isMatch)R.timer=setTimeout(go,4200)}
 else{R.combo=0;sfx.bad();if(R.requeues<3){R.requeues++;R.steps.push({t:st.t,w:st.w,retry:true})}setTimeout(()=>say(sayText(st.w)),450)}
 const fb=$('#fb');
 if(ok){const[d,e]=rand(PRAISE);fb.className='fb ok';fb.innerHTML=`${mascot('happy')}<div class="msg"><b lang="de">${first?d:'Geschafft!'}</b> <span class="soft">(${first?e:'You did it!'})</span><br><span class="gain">+${gain} XP${R.combo>=3?' · combo bonus':''}</span></div><button class="primary" data-act="next" aria-label="Next">Weiter →</button>`}
 else{fb.className='fb no';fb.innerHTML=`${mascot('oops')}<div class="msg"><b lang="de">Fast!</b> <span class="soft">(Almost!)</span><br>Hear it again.</div><button class="primary" data-act="next">Got it →</button>`}
 updateBar()}
function addXP(n){S.xp+=n;if(R)R.xp+=n;save();const box=$('#step');if(box&&view==='game'&&!calm()){const f=document.createElement('span');f.className='float';f.textContent='+'+n;box.appendChild(f);setTimeout(()=>f.remove(),1200)}}
function burst(){if(calm())return;const box=$('#step');if(!box)return;const cols=['#ffcd38','#2462d6','#cf2d47','#14804a','#ff8fc0'];for(let i=0;i<16;i++){const b=document.createElement('i');b.className='bit';const a=Math.random()*Math.PI*2,d=70+Math.random()*90;b.style.cssText=`--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-30}px;--r:${Math.random()*540}deg;background:${cols[i%5]}`;box.appendChild(b);setTimeout(()=>b.remove(),950)}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;unlock();const d=b.dataset;
 switch(d.act){
 case'quick':startRound(quickPool(),'mix');break;
 case'deck':deckSheet(d.id);break;
 case'play':startRound(DECK[d.deck].words,d.mode);break;
 case'close':closeSheet();break;
 case'hear':say(d.say);break;
 case'slow':say(d.say,true);break;
 case'readEn':say(d.say,false,null,true);break;
 case'readDe':say(d.say);break;
 case'goal':S.settings.goal=+d.v;save();render();break;
 case'ans':answer(d.id);break;
 case'art':pickArt(d.a);break;
 case'tile':tapTile(+d.j);break;
 case'unslot':unslot(+d.i);break;
 case'm':tapMatch(d.side,d.id);break;
 case'said':said();break;
 case'next':next();break;
 case'home':if(synth)synth.cancel();view='home';render();break;

 case'stickers':view='stickers';render();break;
 case'break':view='break';render();break;
 case'bstart':startBreak();break;
 case'settings':settingsSheet();break;
 case'set':setOpt(d.k,d.v);break;
 case'voicetest':say('Hallo! Ich bin Brezel. Viel Spaß beim Deutschlernen!');break;
 case'reset':if(d.armed){S={xp:0,stickers:[],words:{},streak:0,last:'',day:{d:'',n:0},gold:0,settings:S.settings};save();view='home';render()}else{d.armed='1';b.textContent='Tap again to erase everything'}break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML){closeSheet();return}
 if(view!=='game'||$('#overlay').innerHTML||e.metaKey||e.ctrlKey||e.altKey)return;
 if(/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('#step .opt, #step .artbtn')[+e.key-1];if(b&&!b.disabled){unlock();b.click()}}
 else if(e.key===' '){const b=$('#step [data-act=hear]');if(b){e.preventDefault();b.click()}}
 else if(e.key==='Enter'){const b=$('#fb [data-act=next]')||$('#step [data-act=said]');if(b){e.preventDefault();b.click()}}});


/* ---------- Memory Match: German word + English meaning ---------- */
{const mmb=document.getElementById('mmBtn');if(mmb&&window.MemoryMatch){
  const pairs=[];for(const d of DECKS)for(const w of d.words){if(!w.pic||w.pic[0]==='#')continue;const de=(w.art?w.art+' ':'')+w.de;
    pairs.push({a:{pic:w.pic,text:de},b:{pic:w.pic,text:w.en},title:de,sub:w.en,fact:`${de} means “${w.en}.”`+(w.art?` It's a ${w.art==='der'?'der (masculine)':w.art==='die'?'die (feminine)':'das (neuter)'} word.`:''),set:d.id,tag:d.de})}
  const sets={all:'All words'};for(const d of DECKS)if(pairs.some(p=>p.set===d.id))sets[d.id]=d.de+' · '+d.en;
  mmb.addEventListener('click',()=>MemoryMatch.open({game:'Deutsch Doodles',key:'deutsch',pairs,sets,picsOption:true,hardLabel:'Word + meaning',factLabel:'Merk dir das!',
    rules:['Flip two cards. A <b>German word</b> matches its <b>English</b> meaning.'],backLabel:'Zurück (back)',
    theme:{bg:'#fbf5e8',ink:'#1d2331',card:'#fffdf8',back:'#2462d6',backEdge:'#163f8f',acc:'#ffcd38',accInk:'#1d2331',accEdge:'#c99a00',factbg:'#ffeaa6',font:'"Lexend",system-ui,sans-serif'}}))}}
applySettings();render();
setTimeout(()=>{voicesLoaded=voicesLoaded||!!synth;const n=$('#vnote');if(n&&synth)n.hidden=!!deVoice;const vi=$('#vinfo');if(vi)vi.textContent=voiceInfo()},2500);
