<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4d6127">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Two Sticks">
<title>Two Sticks Trivia: Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Phone companion to the Two Sticks TV screen: same olive ground, white cards and gold buttons as the TV. */
:root{color-scheme:light dark;--bg:light-dark(#4d6127,#1b230f);--card:light-dark(#fff,#242f17);--ink:light-dark(#1f2414,#eef2e4);--soft:light-dark(#5d6650,#aab59a);--line:light-dark(#e3e7da,#3a4a26);--tint:light-dark(#f2f4ec,#2c3a1c);--sun:#f2c14e;--sunInk:#2a1d00;--sunEdge:#b98a22;--good:light-dark(#2f8a3a,#6fd27b);--bad:light-dark(#c8323c,#ff7b82);--factbg:light-dark(#fbf2d6,#3a3420)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:#fff}
body{font:17px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font:800 22px/1.1 'Baloo 2',sans-serif}
.me{display:flex;align-items:center;gap:8px;font-weight:800}
.leave{min-height:36px;padding:4px 12px;border-radius:999px;border:0;background:rgba(255,255,255,.16);font-weight:800;font-size:14px}
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:20px 18px;box-shadow:0 18px 40px -20px rgba(0,0,0,.5);margin-bottom:14px}
h1,h2{font-family:'Baloo 2',sans-serif;font-weight:800;margin:0;line-height:1.1}
h1{font-size:34px}h2{font-size:28px}
.sub{margin:6px 0 14px;color:var(--soft);font-weight:700}
label,.lbl{display:block;margin:14px 0 6px;font-weight:800}
input{width:100%;min-height:54px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:800}
#jc{text-transform:uppercase;letter-spacing:.3em;font:800 30px 'Baloo 2',sans-serif;text-align:center}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:15px}
.seg button[aria-pressed=true]{background:var(--sun);color:var(--sunInk);border-color:var(--sun)}
.btn{width:100%;min-height:56px;padding:0 20px;margin-top:16px;border-radius:16px;border:0;font:800 22px 'Baloo 2',sans-serif;background:var(--sun);color:var(--sunInk);box-shadow:0 4px 0 var(--sunEdge)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sunEdge)}
.btn:disabled{opacity:.5;cursor:default}
.btn.alt{background:var(--tint);color:var(--ink);box-shadow:none}
.btn.huge{min-height:120px;font-size:38px;border-radius:24px}
.err{color:var(--bad);font-weight:800;margin:10px 0 0;min-height:1px}
.board{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pc{display:flex;align-items:center;gap:6px;min-height:32px;padding:2px 10px 2px 8px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:800;font-size:14px}
.pc.on{background:#fff;color:#1f2414}
.pc .d,.pl .d{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.big{font:800 clamp(28px,8vw,38px)/1.1 'Baloo 2',sans-serif;margin:4px 0 6px;text-wrap:balance}
.center{text-align:center}
.chipc{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:14px}
.worth{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:999px;background:var(--sun);color:var(--sunInk);font-weight:800;font-size:13px}
.qwho{display:block;margin-top:6px;color:var(--soft);font-weight:800;font-size:15px}
.qtext{font:700 clamp(22px,6vw,28px)/1.2 'Baloo 2',sans-serif;margin:10px 0 12px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;width:100%;padding:8px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:left;font-weight:800;font-size:18px;line-height:1.25}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tint);font:800 17px 'Baloo 2',sans-serif}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.opt.gone{opacity:.3}
.tools{display:flex;gap:8px;margin:0 0 12px}
.tool{flex:1;min-height:46px;border-radius:12px;border:0;background:var(--tint);font-weight:800;font-size:15px}
.tool:disabled{opacity:.45}
.hinttxt{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--factbg);font-weight:800}
.steal{margin:0 0 12px;padding:12px 14px;border-radius:14px;border:2px dashed var(--bad);font:800 20px/1.2 'Baloo 2',sans-serif}
.verdict{font:800 26px/1.15 'Baloo 2',sans-serif;margin:14px 0 8px}
.verdict.yes{color:var(--good)}.verdict.no{color:var(--bad)}
.fact{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:var(--factbg)}
.fact b{font-family:'Baloo 2',sans-serif;font-size:18px}
.ref{display:block;margin-top:4px;color:var(--soft);font-weight:800;font-size:14px}
.verse{margin:0 0 12px;padding:12px 14px;border-radius:14px;border:2px solid var(--line)}
.verse blockquote{margin:0 0 8px;padding-left:12px;border-left:4px solid var(--sun);font:500 16px/1.5 Georgia,serif}
.verse cite{display:block;margin-top:2px;font:800 13px Nunito,sans-serif;color:var(--soft);font-style:normal}
.talk{margin:0 0 6px;padding:12px 14px;border-radius:14px;background:var(--tint)}
.talk b{display:block;font-family:'Baloo 2',sans-serif;font-size:18px}
.chgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.chgrid button{min-height:58px;border:0;border-radius:14px;padding:8px;font-weight:800;font-size:15px;line-height:1.15;background:var(--c);color:var(--t,#fff)}
.list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--tint);font-weight:800}
.pl .tag{margin-left:auto;font-size:13px;color:var(--soft);white-space:nowrap}
.spinner{width:84px;height:84px;margin:10px auto;border-radius:50%;background:conic-gradient(#b8322a 0 12.5%,#7d3c98 0 25%,#a0522d 0 37.5%,#e1ad01 0 50%,#2e7bb8 0 62.5%,#13806c 0 75%,#56657a 0 87.5%,#d9701c 0);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.sent{margin:10px 0 0;text-align:center;font-weight:800;color:var(--soft)}
.toast{position:fixed;left:50%;top:14px;translate:-50% 0;z-index:9;padding:10px 18px;border-radius:999px;background:#fff;color:#1f2414;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><span class="brand">Two Sticks Trivia</span><span class="me" id="meBar" hidden><span id="meName"></span><button class="leave" id="leave">Leave</button></span></header>
  <div class="board" id="board"></div>
  <main id="main"><div class="card center"><h2>Loading…</h2></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="live.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=x=>Array.isArray(x)?x.filter(v=>v!==undefined&&v!==null):(x&&typeof x==='object'?Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]):[]);
const {BANK,VERSES,TALK,CATS,CROWN,LVL}=window.TS;
const catOf=id=>id==='crown'?CROWN:CATS.find(c=>c.id===id)||{name:id,color:'#56657a'};
const SAVE='two-sticks-join',PRAISE=['Yes!','You got it!','Nailed it!','Way to go!','Correct!'];
let net=null,code='',me='',S=null,level='I',busy=false,sentSig='',unsubs=[],revealT=null,lastTurnSig='';
const room=p=>`rooms/${code}${p?'/'+p:''}`;
const ST=(()=>{try{return new URLSearchParams(location.search).has('dev')?sessionStorage:localStorage}catch(e){return null}})();
const saved=()=>{try{return JSON.parse(ST.getItem(SAVE)||'null')||{}}catch(e){return{}}};
const store=o=>{try{ST.setItem(SAVE,JSON.stringify(o))}catch(e){}};
let toastT=0;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)};
const now=()=>net?net.now():Date.now();

/* ---------- joining ---------- */
function joinForm(msg,c){
  const s=saved();level=s.level||level;
  $('meBar').hidden=true;$('board').innerHTML='';
  $('main').innerHTML=`<div class="card"><h1>Join the game</h1><p class="sub">Type the code from the TV. No account or app needed.</p>
    <label for="jc">Room code</label><input id="jc" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(c||s.code||'')}">
    <label for="jn">Your name</label><input id="jn" maxlength="16" autocomplete="nickname" value="${esc(s.name||'')}">
    <p class="lbl">Your level</p><div class="seg" id="jl">${['B','I','X'].map(l=>`<button data-l="${l}" aria-pressed="${l===level}">${LVL[l]}</button>`).join('')}</div>
    <p class="err" id="jerr">${esc(msg||'')}</p><button class="btn" id="jgo"${busy?' disabled':''}>${busy?'Joining…':'Join'}</button></div>`;
  $('jl').onclick=e=>{const b=e.target.closest('button');if(!b)return;level=b.dataset.l;for(const x of $('jl').children)x.setAttribute('aria-pressed',x===b)};
  $('jgo').onclick=()=>join($('jc').value,$('jn').value,level);
  $('jn').onkeydown=e=>{if(e.key==='Enter')$('jgo').click()};
  if(!$('jc').value)$('jc').focus();else if(!$('jn').value)$('jn').focus();
}
async function join(c,name,lv){
  c=String(c||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);name=String(name||'').trim().slice(0,16);
  if(c.length!==4)return joinForm('Type the 4-letter code from the TV.',c);
  if(!name)return joinForm('Type your name so everyone knows who you are.',c);
  busy=true;joinForm('',c);
  try{if(!net)net=await TSNet.connect()}catch(e){busy=false;return joinForm("Couldn't connect. Check your internet, then try again.",c)}
  try{
    const meta=await net.get(`rooms/${c}/meta`);if(!meta){busy=false;return joinForm("We couldn't find that code. Check the TV and try again.",c)}
    const st=await net.get(`rooms/${c}/state`);if(!st||st.app!=='twosticks'){busy=false;return joinForm('That code is for a different game.',c)}
    code=c;me=net.uid;
    const ps=await net.get(room('players'))||{};
    await net.update(room('players/'+me),{name,level:lv,color:'#f2c14e',joined:(ps[me]&&ps[me].joined)||net.now(),online:true});
    net.onDisconnectUpdate(room('players/'+me),{online:false});
    net.onConnected(ok=>{if(ok&&code)net.update(room('players/'+me),{online:true})});
  }catch(e){busy=false;code='';return joinForm("Something went wrong joining. Try again.",c)}
  busy=false;store({code,name,level:lv});
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  unsubs.push(net.on(room('state'),v=>{S=v;render()}));
  $('meName').textContent=name;$('meBar').hidden=false;render();
}
$('leave').onclick=e=>{const b=e.currentTarget;
  if(b.dataset.arm){if(net&&code)net.update(room('players/'+me),{online:false}).catch(()=>{});unsubs.forEach(u=>{try{u()}catch(x){}});unsubs=[];const s=saved();store({name:s.name,level:s.level});code='';S=null;delete b.dataset.arm;b.textContent='Leave';joinForm()}
  else{b.dataset.arm='1';b.textContent='Tap again';setTimeout(()=>{delete b.dataset.arm;b.textContent='Leave'},3000)}};

/* ---------- sending ---------- */
const sig=g=>g?[g.id,g.turn,g.phase,g.spinN,g.pick,(g.steal&&g.steal.pick)??'',arr(g.q&&g.q.gone).length,g.q&&g.q.hint?1:0].join(':'):'';
function send(a,x){
  const g=S&&S.g;if(!g)return;const k=`${g.id}-${g.turn}`;
  sentSig=sig(g);render();
  net.set(room(`inputs/${k}/${me}`),{a,x:x===undefined?null:x,n:Date.now(),t:now()}).catch(()=>{sentSig='';render();toast("That didn't send. Try again.")});
  setTimeout(()=>{if(sentSig&&sig(S&&S.g)===sentSig){sentSig='';render()}},6000);
}

/* ---------- screens ---------- */
function board(g){
  const ps=arr(g.players),cur=g.turn%ps.length;
  $('board').innerHTML=ps.map((p,i)=>`<span class="pc${g.phase!=='over'&&i===cur?' on':''}"><i class="d" style="background:${p.col}"></i>${esc(p.name)}${p.uid===me?' (you)':''} ★ ${p.score||0}</span>`).join('');
}
function render(){
  if(!code)return;
  const g=S&&S.g,ps=g?arr(g.players):[],mi=ps.findIndex(p=>p.uid===me);
  if(!S||S.view==='setup'||!g){$('board').innerHTML='';return lobby()}
  board(g);
  if(sentSig&&sig(g)!==sentSig)sentSig='';
  const waiting=!!sentSig,cur=g.turn%ps.length,p=ps[cur],mine=mi===cur,q=g.q;
  const ts=g.id+':'+g.turn;if(mine&&g.phase==='spin'&&lastTurnSig!==ts){lastTurnSig=ts;try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
  if(g.phase==='over')return over(g,ps);
  if(mi<0&&g.phase==='spin')return card(`<h2>${esc(p.name)} is up</h2><p class="sub">You're watching this game. You'll be in the next one when the host adds you.</p>`);
  clearTimeout(revealT);
  if(g.phase!=='spin'&&g.revealAt&&now()<g.revealAt){revealT=setTimeout(render,g.revealAt-now()+30);return card(`<div class="spinner" aria-hidden="true"></div><h2 class="center">The wheel is spinning…</h2><p class="sub center">Watch the TV!</p>`)}
  if(g.phase==='spin'){
    if(mine)return card(`<p class="sub center">${g.final?'Final round! Every question is worth double.':`Question ${Math.min(g.turn+1,g.total)} of ${g.total}`}</p><h2 class="center">Your turn, ${esc(p.name)}!</h2><button class="btn huge" data-a="spin"${waiting?' disabled':''}>${waiting?'Spinning…':'Spin!'}</button>`);
    return card(`<h2 class="center">${esc(p.name)}'s turn</h2><p class="sub center">They're spinning the wheel. Watch the TV!</p>${mi>=0?`<p class="sub center">You have ★ ${ps[mi].score||0}.</p>`:''}`);
  }
  if(g.phase==='choose'){
    const w=g.final?4:2;
    if(mine)return card(`<h2 class="center">Crown! Pick any topic</h2><p class="sub center">This question is worth ${w} stars.</p><div class="chgrid">${arr(g.cats).map(id=>{const c=catOf(id);return`<button data-a="choose" data-x="${esc(id)}" style="--c:${c.color};--t:${c.t||'#fff'}"${waiting?' disabled':''}>${esc(c.name)}</button>`}).join('')}</div>`);
    return card(`<h2 class="center">${esc(p.name)} landed on the Crown!</h2><p class="sub center">They're picking a topic.</p>`);
  }
  if(!q)return card('<h2>Loading…</h2>');
  const item=BANK[q.lvl]&&BANK[q.lvl][q.cat]&&BANK[q.lvl][q.cat][q.i];if(!item)return card('<h2>Loading the question…</h2>');
  const c=catOf(q.cat),order=arr(q.order),gone=arr(q.gone),right=order.indexOf(0),st=g.steal||null,stealing=g.phase==='steal',done=g.phase==='answered';
  const iSteal=stealing&&st&&st.who===mi,canTap=!waiting&&((g.phase==='question'&&mine)||iSteal);
  let h=`<span class="chipc" style="background:${c.color};color:${c.t||'#fff'}">${q.crown?'♛ ':''}${esc(c.name)}</span>${(g.worth||1)>1?`<span class="worth">Worth ${g.worth} stars</span>`:''}
    <span class="qwho">${mine?'Your':esc(p.name)+"'s"} ${LVL[q.lvl]} question</span><p class="qtext">${esc(item[0])}</p>`;
  if(g.phase==='question'&&mine)h+=`<div class="tools"><button class="tool" data-a="fifty"${!ps[mi].fifty||gone.length||waiting?' disabled':''}>${ps[mi].fifty?'50/50 helper':'50/50 used'}</button>${String(item[6]||'').trim()?`<button class="tool" data-a="hint"${!ps[mi].hint||q.hint||waiting?' disabled':''}>${q.hint?'Hint shown':ps[mi].hint?'Scripture hint':'Hint used'}</button>`:''}</div>`;
  if(q.hint)h+=`<p class="hinttxt">Hint: look it up in ${esc(String(item[6]).replace(/^Church:\s*/,'Church source: '))}</p>`;
  if(stealing){const sp=ps[st.who];h+=`<p class="steal">${iSteal?`${esc(p.name)} missed it. Steal it for a star, or pass!`:`${esc(p.name)} missed it. ${esc(sp?sp.name:'The next player')} can steal it.`}</p>`}
  h+=`<div class="opts">${order.map((k,j)=>{let cl='opt';if(done&&j===right)cl+=' good';else if((done||stealing)&&(j===g.pick||(st&&j===st.pick)))cl+=' bad';else if(gone.includes(j))cl+=' gone';
    const dis=!canTap||gone.includes(j)||(stealing&&j===g.pick)||done;return`<button class="${cl}" data-a="ans" data-x="${j}"${dis?' disabled':''}><span class="k">${'ABCD'[j]}</span><span>${esc(item[1+k])}</span></button>`}).join('')}</div>`;
  if(iSteal)h+=`<button class="btn alt" data-a="pass"${waiting?' disabled':''}>Pass, show the answer</button>`;
  if(!done&&!canTap&&!waiting)h+=`<p class="sent">${stealing?`${esc(ps[st.who]?ps[st.who].name:'')} is deciding…`:`${esc(p.name)} is answering…`}</p>`;
  if(waiting)h+=`<p class="sent">Sent!</p>`;
  if(done){
    const sOk=st&&st.ok,sp=st?ps[st.who]:null,got=g.got||1;
    h+=`<p class="verdict ${g.ok||sOk?'yes':'no'}">${g.ok?`${PRAISE[g.turn%PRAISE.length]} +${got} star${got>1?'s':''} for ${esc(p.name)}${g.bonus?`. ${p.streak} in a row: bonus star!`:''}`:sOk?`${esc(sp.name)} stole it! +1 star.`:`The answer is: ${esc(item[1])}`}</p>`;
    h+=`<p class="fact"><b>Did you know?</b> ${esc(item[5])}<span class="ref">${esc(item[6])}</span></p>`;
    const vs=VERSES[item[6]];if(vs)h+=`<div class="verse">${vs.map(v=>`<blockquote>${esc(v[1])}<cite>${esc(v[0])}</cite></blockquote>`).join('')}</div>`;
    const tk=TALK[q.cat];if(tk)h+=`<p class="talk"><b>Talk about it</b>${esc(tk[(q.i+g.turn)%tk.length])}</p>`;
    if(mine||(st&&st.who===mi))h+=`<button class="btn" data-a="next"${waiting?' disabled':''}>${g.turn+1>=g.total?'See who won':'Next question'}</button>`;
  }
  card(h);
}
function card(h){$('main').innerHTML=`<div class="card">${h}</div>`}
function lobby(){
  const list=arr(S&&S.setup),inList=list.some(p=>p.uid===me);
  card(`<h2>You're in!</h2><p class="sub">${inList?'Waiting for the host to start the game. Watch the TV.':"You're connected. The host will see you in the player list."}</p>
    <ul class="list">${list.map(p=>`<li class="pl">${esc(p.name)}<span class="tag">${p.uid===me?'you':p.uid?'phone':''} ${LVL[p.level]||''}</span></li>`).join('')}</ul>
    <p class="lbl">Your level</p><div class="seg" id="lv">${['B','I','X'].map(l=>`<button data-a="lvl" data-x="${l}" aria-pressed="${l===(saved().level||level)}">${LVL[l]}</button>`).join('')}</div>`);
}
function over(g,ps){
  const r=ps.map((p,i)=>({p,i})).sort((a,b)=>(b.p.score||0)-(a.p.score||0)),top=r.length?r[0].p.score||0:0;
  const champs=r.filter(x=>(x.p.score||0)===top).map(x=>x.p.name);
  card(`<h2 class="center">${champs.length>1?"It's a tie!":esc(champs[0]||'')+' wins!'}</h2><p class="sub center">Thanks for playing. The host can start another game.</p><ol class="list">${r.map(x=>`<li class="pl"><i class="d" style="background:${x.p.col}"></i>${esc(x.p.name)}${x.p.uid===me?' (you)':''}<span class="tag">★ ${x.p.score||0}</span></li>`).join('')}</ol>`);
}
$('main').addEventListener('click',e=>{

  if(a==='lvl'){const s=saved();s.level=x;level=x;store(s);if(net&&code)net.update(room('players/'+me),{level:x});lobby();return}
  const g=S&&S.g;if(!g)return;

  else if(a==='choose')send('choose',x);
  else send(a);
});
